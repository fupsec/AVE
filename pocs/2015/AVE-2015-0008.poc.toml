[info]
id = "POC-AVE-2015-0008"
name = "WordPress Plugin WooFramework Tweaks 开放重定向漏洞 PoC"
author = "AVE"
severity = "medium"
tags = ["open-redirect", "wordpress", "cwe-601", "woocommerce"]
description = "检测 WordPress 插件 WooFramework Tweaks 1.0.1 及之前版本中存在的开放重定向漏洞（CVE-2015-10113），通过读取插件 readme 确认版本是否在受影响范围内。该漏洞位于 wooframework-tweaks.php 的 admin_screen_logic 函数中，url 参数未充分验证导致开放重定向，利用需管理员权限。"
vuln_id = ["CVE-2015-10113", "AVE-2015-0008"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/wp-content/plugins/wooframework-tweaks/readme.txt"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Stable tag: 1.0.1", "Stable tag: 1.0.0", "Stable tag: 1.0"]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["wooframework-tweaks"]
expect = true
