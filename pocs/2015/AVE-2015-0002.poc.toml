[info]
id = "POC-AVE-2015-0002"
name = "WordPress Plugin Simplr Registration Form Plus+ 跨站脚本漏洞 PoC"
author = "AVE"
severity = "medium"
tags = ["xss", "wordpress", "cwe-79"]
description = "检测 WordPress 插件 Simplr Registration Form Plus+ 是否存在 XSS 漏洞（CVE-2015-10107），通过读取插件 readme 判断版本是否为 2.3.4 及以下。"
vuln_id = ["CVE-2015-10107", "AVE-2015-0002"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/wp-content/plugins/simplr-registration-form/readme.txt"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Stable tag: 2.3.4"]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["simplr-reg"]
expect = true
