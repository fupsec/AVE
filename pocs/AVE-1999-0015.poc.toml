[info]
id = "POC-AVE-1999-0015"
name = "wwwcount 2.3 Count.cgi 缓冲区溢出检测 PoC"
author = "AVE"
severity = "high"
tags = ["buffer-overflow", "cve-1999-0021", "wwwcount", "cgi", "rce"]
description = "检测目标服务器是否存在 wwwcount 2.3 Count.cgi CGI 脚本。若脚本存在且可访问，则可能存在 QUERY_STRING 缓冲区溢出漏洞（CVE-1999-0021），攻击者可通过超长查询字符串实现远程命令执行。"
vuln_id = ["CVE-1999-0021", "AVE-1999-0015"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/Count.cgi"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["count", "wwwcount", "Counter"]
expect = true

[[poc.requests]]
method = "GET"
path = "/cgi-bin/Count.cgi?df=test.dat&dd=def"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["count", "wwwcount", "Counter"]
expect = true
