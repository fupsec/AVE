[info]
id = "POC-AVE-2026-0029"
name = "Xiuno BBS 系统重装漏洞 PoC"
author = "AVE"
severity = "high"
tags = ["improper-access-control", "xiuno", "bbs", "cnvd"]
description = "Xiuno BBS 系统在安装后未对安装目录进行保护，攻击者可访问 /install/ 页面进行系统重装。该 PoC 通过检测安装页面是否存在来判断漏洞是否存在。"
vuln_id = ["CNVD-2019-01348", "AVE-2026-0029"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/install/"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["/view/js/xiuno.js", "Choose Language (选择语言)"]
condition = "and"
expect = true
