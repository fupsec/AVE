[info]
id = "POC-AVE-2026-0029"
name = "Xiuno BBS 系统重装漏洞 PoC"
author = "AVE"
severity = "high"
tags = ["xiuno", "reinstall", "cwe-284", "bbs", "cnvd-2019-01348"]
description = "Xiuno BBS（修罗论坛）系统安装完成后未对 /install/ 目录进行有效防护，攻击者可直接访问 /install/ 页面重新安装系统，覆盖数据库配置并获取管理员权限。"
vuln_id = ["CNVD-2019-01348", "AVE-2026-0029"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/install/"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["/view/js/xiuno.js", "Choose Language (选择语言)"]
expect = true
