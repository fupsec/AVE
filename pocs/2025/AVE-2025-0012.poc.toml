[info]
id = "POC-AVE-2025-0012"
name = "Ivanti Connect Secure 栈缓冲区溢出检测 PoC"
author = "AVE"
severity = "critical"
tags = ["cve-2025-22457", "ivanti", "connect-secure", "rce", "buffer-overflow", "cwe-121", "cwe-787"]
description = "Ivanti Connect Secure / Policy Secure / ZTA Gateways 存在远程栈缓冲区溢出漏洞(CVE-2025-22457)，未经认证的攻击者可通过发送特制HTTPS请求触发溢出导致远程代码执行。该PoC通过访问Ivanti设备Web界面识别设备版本，判断是否为受影响版本。"
vuln_id = ["CVE-2025-22457", "AVE-2025-0012"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/dana-na/auth/url_default/welcome.cgi"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Ivanti", "Connect Secure", "Pulse Secure"]
expect = true

[[poc.requests]]
method = "GET"
path = "/"

[[poc.requests.matchers]]
type = "status"
status = [200, 302, 301]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Ivanti", "Connect Secure", "/dana-na/", "Pulse Secure"]
expect = true
