[info]
id = "POC-AVE-1999-0200"
name = "Cisco 7xx ClickStart HTTP 未授权访问检测 PoC"
author = "AVE"
severity = "high"
tags = ["cisco", "clickstart", "unauth", "configuration-change"]
description = "检测 Cisco 7xx 系列路由器 ClickStart HTTP 服务器是否启用且可未授权访问。该服务器默认开启，不进行身份验证，攻击者可修改路由器配置。"
vuln_id = ["CVE-1999-0415", "AVE-1999-0200"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/"
headers = { "User-Agent" = "Mozilla/5.0" }

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["ClickStart", "clickstart", "Router", "router"]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "header"
words = ["HTTP/1.0 200 OK", "text/html"]
expect = true
