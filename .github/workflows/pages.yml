name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Dashboard Metrics
        run: |
          VULNS=$(find vulns -name "*.toml" -type f 2>/dev/null | wc -l)
          POCS=$(find pocs -type f 2>/dev/null | wc -l)
          EXPS=$(find exploits -type f 2>/dev/null | wc -l)
          PUSH_TIME=$(date -u "+%Y-%m-%d %H:%M UTC")
          sed -i 's|<p id="m-vulns">.*</p>|<p id="m-vulns">'"$VULNS"'</p>|' index.html
          sed -i 's|<p id="m-pocs">.*</p>|<p id="m-pocs">'"$POCS"'</p>|' index.html
          sed -i 's|<p id="m-exps">.*</p>|<p id="m-exps">'"$EXPS"'</p>|' index.html
          sed -i 's|<p id="m-push">.*</p>|<p id="m-push">'"$PUSH_TIME"'</p>|' index.html
          echo "dashboard updated: vulns=${VULNS}, pocs=${POCS}, exps=${EXPS}, push=${PUSH_TIME}"

      - name: Update Year Breakdown
        run: |
          rm -f /tmp/year_stats.html
          echo '<table class="year-table"><thead><tr><th>年份</th><th class="num">漏洞</th><th class="num">PoC</th><th class="num">EXP</th></tr></thead><tbody>' > /tmp/year_stats.html
          TOTAL_V=0; TOTAL_P=0; TOTAL_E=0
          for y in $(ls vulns/ 2>/dev/null | sort); do
            [ -d "vulns/$y" ] || continue
            V=$(find "vulns/$y" -maxdepth 1 -name "*.toml" -type f 2>/dev/null | wc -l)
            P=$(find "pocs/$y" -maxdepth 1 -type f 2>/dev/null | wc -l)
            E=$(find "exploits/$y" -maxdepth 1 -type f 2>/dev/null | wc -l)
            TOTAL_V=$((TOTAL_V + V))
            TOTAL_P=$((TOTAL_P + P))
            TOTAL_E=$((TOTAL_E + E))
            echo "<tr><td>${y}</td><td class=\"num\">${V}</td><td class=\"num\">${P}</td><td class=\"num\">${E}</td></tr>" >> /tmp/year_stats.html
          done
          echo "<tr class=\"total-row\"><td>合计</td><td class=\"num\">${TOTAL_V}</td><td class=\"num\">${TOTAL_P}</td><td class=\"num\">${TOTAL_E}</td></tr></tbody></table>" >> /tmp/year_stats.html
          awk '!/<!--YEAR_STATS-->/{print} /<!--YEAR_STATS-->/{system("cat /tmp/year_stats.html")}' index.html > index_new.html && mv index_new.html index.html
          echo "year breakdown updated"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
