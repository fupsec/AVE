[basic]
title = "Nokogiri XML::Schema 默认信任输入导致 XXE 漏洞"
description = "Nokogiri 是一个提供 HTML、XML、SAX 和 Reader 解析器并支持 XPath 和 CSS 选择器的 Ruby gem。在 Nokogiri 1.11.0.rc4 之前版本中，Nokogiri::XML::Schema 默认信任输入的 XML Schema，允许通过网络访问外部资源，可能造成 XXE 或 SSRF 攻击。此行为与 Nokogiri 维护者的安全策略相反，该策略要求尽可能默认将所有输入视为不受信任。该漏洞已在 Nokogiri 1.11.0.rc4 中修复。"
severity = "LOW"
source = "nvd"
published = "2020-12-30"
updated = "2026-06-16"

