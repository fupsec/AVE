[remediation]
fix = "升级到 Nokogiri 1.11.0.rc4 或更高版本。详情参考官方安全公告。"
workaround = "该漏洞无已知缓解措施，建议尽快升级。"
steps = ["步骤1: 确认当前使用的 Nokogiri 版本", "步骤2: 升级到 Nokogiri 1.11.0.rc4 或更高版本", "步骤3: 如需在升级后重新启用外部资源访问，确保输入可信后传入 Nokogiri::XML::ParseOptions.new.nononet 作为第二个参数"]

