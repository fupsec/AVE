[remediation]
fix = "升级到 Nokogiri 1.11.0.rc4 或更高版本。"
workaround = "如无法升级，确保传递给 Nokogiri::XML::Schema 的 XML Schema 输入是可信的，不要对不可信输入启用外部资源访问。"
steps = ["步骤1: 检查当前 Nokogiri 版本", "步骤2: 升级到 Nokogiri >= 1.11.0.rc4", "步骤3: 如需恢复旧行为，显式传递 Nokogiri::XML::ParseOptions.new.nononet 参数"]

