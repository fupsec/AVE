[basic]
title = "Nokogiri XML::Schema 默认信任输入导致 XXE 漏洞"
description = "Nokogiri 是一个提供 HTML、XML、SAX 和 Reader 解析器的 Rubygem，支持 XPath 和 CSS 选择器。在 Nokogiri 1.11.0.rc4 之前版本中，存在 XML 外部实体（XXE）漏洞。Nokogiri::XML::Schema 解析的 XML Schema 默认被信任，允许通过网络访问外部资源，可能导致 XXE 或 SSRF 攻击。"
severity = "MEDIUM"
source = "nvd"
published = "2020-12-30"
updated = "2026-06-16"

