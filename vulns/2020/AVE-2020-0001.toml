[remediation]
fix = "升级到 Apache Thrift 0.14.0 或更高版本。"
workaround = "在 Thrift 服务端配置 frame size limit，限制单帧最大大小。"
steps = ["步骤1: 确认 Apache Thrift 版本", "步骤2: 升级到 Apache Thrift 0.14.0 或更高版本", "步骤3: 如无法升级，在服务端代码中设置 TConfiguration 的 setMaxFrameSize 限制帧大小"]

