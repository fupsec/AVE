[basic]
title = "Apache Thrift 拒绝服务漏洞"
description = "Apache Thrift 0.9.3 至 0.13.0 版本中存在安全漏洞。恶意 RPC 客户端可通过发送精心构造的短消息，触发服务端分配大量内存，进而导致拒绝服务。"
