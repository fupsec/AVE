[basic]
title = "Apache Thrift 短消息处理内存分配拒绝服务漏洞"
description = "Apache Thrift 0.9.3 至 0.13.0 版本中存在拒绝服务漏洞。攻击者可通过构造特制的短消息发送给 RPC 服务端，触发服务端进行过度的内存分配，导致系统资源耗尽和服务不可用。该漏洞无需身份验证即可远程利用，影响所有使用了受影响的 Thrift 库版本的应用系统。"
severity = "HIGH"
score = 7.5
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
cvss_v2 = "AV:N/AC:L/Au:N/C:N/I:N/A:P"
published = "2021-02-12"
updated = "2026-06-17"
remediation = "建议将 Apache Thrift 升级至 0.14.0 及以上版本。如无法立即升级，可限制对 Thrift RPC 服务的网络访问，仅允许受信客户端连接，并配置内存使用上限以降低影响。"
sources = ["msrc", "nvd"]

