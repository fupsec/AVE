[basic]
description = "畅捷通T+是一款新型互联网企业管理软件，广泛应用于中小型企业。其存在任意文件删除漏洞，攻击者可在未授权的情况下通过构造恶意HTTP请求删除服务器上的任意文件，可能导致系统配置文件丢失、应用崩溃或业务中断，严重影响系统正常运行。该漏洞无需认证即可远程利用，影响范围广泛。"
published = "2023-08-08"
remediation = "升级畅捷通T+至官方最新版本，及时安装厂商发布的安全补丁；配置Web应用防火墙（WAF）规则，拦截非法的文件删除操作请求；限制对敏感接口的访问权限，实施最小权限原则。"
score = 7.5
severity = "HIGH"
sources = ["hwpoc"]
title = "畅捷通T+ 任意文件删除漏洞"
updated = "2023-08-08"

