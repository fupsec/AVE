[basic]
title = "F5 BIG-IP TMUI 未认证远程代码执行漏洞"
description = "F5 BIG-IP 配置工具（TMUI）中存在 AJP 请求走私漏洞，未认证的攻击者可通过管理端口或 Self IP 地址访问 BIG-IP 系统，利用 Apache 前端与 AJP 后端之间对 Transfer-Encoding 头的处理缺陷，构造恶意 AJP 请求绕过身份验证，创建管理员用户并执行任意系统命令，最终实现设备完全控制。该漏洞与 CVE-2022-26377（Apache HTTP Server AJP 走私）密切相关。攻击者可利用该漏洞在无需任何凭据的情况下获取 root 权限 shell。"
severity = "CRITICAL"
score = 9.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
published = "2023-10-26"
updated = "2023-11-02"
sources = ["hwpoc", "nvd", "f5", "praetorian", "rapid7", "tenable", "nuclei", "github"]
remediation = "立即应用 F5 提供的安全热修复补丁。受影响版本包括 BIG-IP 17.1.0、16.1.0-16.1.4、15.1.0-15.1.10、14.1.0-14.1.5 和 13.1.0-13.1.5。如无法立即打补丁，请将 TMUI 访问限制为仅受信任的网络或设备。检查审计日志中是否存在异常的用户创建事件（client tmui, user admin），并排查可疑新增用户。"

