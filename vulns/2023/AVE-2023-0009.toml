aliases = ["HWPOC-2023-000f79a9", "GPC-16078"]

[basic]
title = "Palo Alto GlobalProtect Windows客户端本地权限提升漏洞"
description = "Palo Alto Networks GlobalProtect VPN客户端的Windows版本存在本地权限提升漏洞。该漏洞源于PanGPA（用户态进程）与PanGPS（SYSTEM服务）之间的IPC通信缺乏输入验证，攻击者可通过Frida等工具篡改XML格式的IPC数据中的<path>元素，将其重定向至恶意命名管道（Named Pipe）或远程SMB共享。对于具备SeImpersonate特权的用户，可利用命名管道令牌模拟获取SYSTEM权限；对于普通用户，可将路径指向远程SMB服务器以捕获NTLMv1/NTLMv2哈希，进而进行中继攻击（如Shadow Credentials）。该漏洞影响GlobalProtect App 5.2.13之前、6.0.5之前及6.1.1之前的Windows版本。"
severity = "HIGH"
score = 7.8
remediation = "立即将GlobalProtect App升级至5.2.13、6.0.5、6.1.1或更高版本。在无法立即升级的情况下，建议限制本地用户安装VPN客户端的权限，并监控PanGPA进程的异常IPC通信行为。企业环境应启用Windows Defender攻击面减少规则（ASR）阻止命名管道滥用。"
published = "2023-06-14"
updated = "2024-04-10"
sources = ["hwpoc", "nvd", "paloalto"]

