[remediation]
fix = "升级到以下修复版本：BIG-IP 17.1.0.3.0.75.4、17.1.1.0.2.6、16.1.4.1.0.50.5、15.1.10.2.0.44.2、14.1.5.6.0.10.6 或 13.1.5.1.0.20.2。参考F5官方安全公告 K000137353。"
workaround = "如无法升级，可限制对BIG-IP管理端口和自IP地址的访问，仅允许受信任的网络访问配置实用程序。"
steps = ["步骤1: 确认BIG-IP版本", "步骤2: 访问F5官方公告 K000137353 获取修复版本", "步骤3: 升级BIG-IP到修复版本", "步骤4: 如无法升级，限制管理端口和自IP地址的网络访问权限"]

