[basic]
title = "F5 BIG-IP 配置实用程序认证绕过漏洞"
description = "F5 BIG-IP 配置实用程序（TMUI）存在认证绕过漏洞，未经身份验证的远程攻击者可通过管理端口或自IP地址发送特制请求，绕过配置实用程序的身份验证，通过AJP协议走私（AJP Smuggling）执行任意系统命令。该漏洞已被CISA列入已知被利用漏洞目录（KEV），且已在野被积极利用。"
severity = "CRITICAL"
source = "nvd"
published = "2023-10-26"
updated = "2026-06-17"

