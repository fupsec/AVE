[basic]
title = "F5 BIG-IP 配置实用程序身份验证绕过漏洞"
description = "CVE-2023-46747 是 F5 BIG-IP 配置实用程序（TMUI）中的一个严重身份验证绕过漏洞。未经身份验证的攻击者可通过管理端口或自 IP 地址向 BIG-IP 系统发送特制请求，绕过配置实用程序的身份验证，利用 AJP 走私攻击实现远程代码执行（RCE）。该漏洞影响 BIG-IP 13.1.0 至 17.1.1 之间的多个版本，CVSS 评分为 9.8，已被 CISA 列入已知被利用漏洞目录。"
severity = "CRITICAL"
score = 9.8
sources = ["hwpoc"]
published = "2023-10-26"
updated = "2026-06-17"
remediation = "升级 BIG-IP 到修复版本：17.1.0.3、16.1.4.1、15.1.10.2、14.1.5.6 或 13.1.5.1 及以上版本，或通过 WAF 规则在 /tmui/ 路径上实施访问控制。"

