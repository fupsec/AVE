[basic]
title = "F5 BIG-IP 配置工具认证绕过漏洞"
description = "CVE-2023-46747 是 F5 BIG-IP 配置工具(TMUI)中存在的一个严重认证绕过漏洞。攻击者可以通过管理端口或自IP地址发送特制请求绕过身份验证，利用AJP走私攻击未授权访问配置程序，进而实现远程代码执行(RCE)。该漏洞CVSSv3评分为9.8，影响版本包括BIG-IP 17.1.0、16.1.0-16.1.4、15.1.0-15.1.10、14.1.0-14.1.5及13.1.0-13.1.5，无需用户交互或权限即可远程利用，已出现在CISA已知被利用漏洞目录中并被用于主动攻击链。"
severity = "CRITICAL"
score = 9.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
remediation = "建议立即升级至修复版本：BIG-IP 17.1.0升级至Hotfix-BIGIP-17.1.0.3.0.75.4-ENG.iso，16.1.x升级至16.1.4.1，15.1.x升级至15.1.10.2，14.1.x升级至14.1.5.6，13.1.x升级至13.1.5.1。如无法升级，建议使用WAF策略进行临时拦截防护。"
published = "2023-10-27"
updated = "2023-10-31"
sources = ["hwpoc", "nvd", "cisa-kev"]

