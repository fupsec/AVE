[basic]
title = "安恒明御网关远程代码执行漏洞"
description = "安恒明御网关存在远程代码执行漏洞，攻击者可利用该漏洞在未授权的情况下通过构造特制的HTTP请求包，在目标服务器上执行任意代码，从而获取服务器完全控制权限。该漏洞影响安恒明御网关的多个版本，攻击复杂度较低，无需用户认证，可被远程利用。"
severity = "CRITICAL"
score = 9.8
remediation = "建议升级安恒明御网关至厂商发布的最新安全版本，及时安装安全补丁。同时建议限制网关管理端口的网络访问权限，避免将管理界面直接暴露在公网环境中。"
