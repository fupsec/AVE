[basic]
title = "深信服 EDR 管理平台认证绕过与远程命令执行漏洞"
description = "深信服终端检测响应平台(EDR) 3.2.16、3.2.17、3.2.19 版本存在远程命令执行漏洞。攻击者无需认证即可向 EDR 管理平台的 /tool/log/c.php 接口发送恶意构造的 HTTP 请求，通过 strip_slashes 参数注入 passthru 或 system 函数，绕过身份认证并获取系统权限，实现任意命令执行。"
severity = "CRITICAL"
score = 9.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
