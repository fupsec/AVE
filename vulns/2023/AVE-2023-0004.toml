[basic]
title = "H3C ER3200G2 信息泄露漏洞"
description = "H3C ER系列G2路由器存在路径遍历漏洞，远程攻击者无需认证即可通过 /userLogin.asp 的 Config File Handler 组件下载路由器配置文件（如 ER3200G2.cfg），获取包含管理员密码在内的敏感信息。受影响型号包括 ER2100n、ER2200G2、ER3200G2、ER3260G2、ER5100G2、ER5200G2、ER6300G2 以及 GR-1100-P、GR-1108-P、GR-1200W、GR-1800AX、GR-2200、GR-3200、GR-5200、GR-8300。"
severity = "MEDIUM"
source = "nvd"
published = "2023-09-24"
updated = "2026-06-17"

