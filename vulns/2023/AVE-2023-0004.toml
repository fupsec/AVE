[remediation]
fix = "升级固件到 2023年9月8日 之后的版本。H3C 已发布修复固件，请通过官方渠道获取最新版本。"
workaround = "1. 限制管理接口访问来源 IP，仅允许信任 IP 访问\n2. 禁止将 Web 管理界面暴露在公网\n3. 修改默认管理员密码"
steps = [
  "步骤1: 登录路由器管理界面，确认当前固件版本",
  "步骤2: 如版本为 20230908 或更早，联系 H3C 获取修复固件并升级",
  "步骤3: 升级后重新登录，修改管理员密码",
  "步骤4: 配置防火墙规则，限制管理端口访问来源"
]

