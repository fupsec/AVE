[basic]
description = "Arris VAP2500 的 list_mac_address 接口存在未授权访问漏洞，远程攻击者无需任何认证即可向该接口发送特制请求，触发缓冲区溢出导致远程代码执行，可完全控制目标设备。该漏洞影响范围广泛，攻击复杂度低且无需用户交互，属于 nday 漏洞，危害严重。"
published = "2023-08-15"
remediation = "厂商已发布安全公告，建议立即升级到受影响版本对应的修复版本。如无法立即升级，应限制管理接口的网络访问权限，配置防火墙规则仅允许可信 IP 访问设备管理端口。"
score = 9.8
severity = "CRITICAL"
sources = ["hwpoc"]
title = "`Arris VAP2500 list_mac_address 未授权远程代码执行漏洞`"
updated = "2023-08-15"

