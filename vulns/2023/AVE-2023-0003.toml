[basic]
title = "Citrix NetScaler ADC和NetScaler Gateway会话令牌泄露漏洞（Citrix Bleed）"
description = "Citrix NetScaler ADC和NetScaler Gateway在配置为网关（VPN虚拟服务器、ICA代理、CVPN、RDP代理）或AAA虚拟服务器时存在缓冲区溢出漏洞，远程未经身份验证的攻击者可通过发送大量填充字符的特制HTTP请求触发内存读取，泄露包含会话令牌在内的敏感信息。该漏洞被称为Citrix Bleed，已被广泛在野利用，CISA已将其列入已知被利用漏洞目录（KEV）。"
severity = "HIGH"
score = 7.5
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
remediation = "升级NetScaler ADC和NetScaler Gateway至安全版本（14.1≥8.50、13.1≥49.15、13.0≥92.19），并立即终止所有活跃会话和持久会话以清除已泄露的认证令牌。"
sources = ["hwpoc", "nvd", "cisa-kev"]
published = "2023-10-10"
updated = "2023-10-18"

[affected]
vendor = "Citrix"
product = "NetScaler ADC / NetScaler Gateway"

