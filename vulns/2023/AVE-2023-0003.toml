[remediation]
fix = "升级到NetScaler ADC 14.1-8.50、13.1-49.15、13.0-92.19及以上版本，或NetScaler Gateway对应修复版本（14.1-8.50、13.1-49.15、13.0-92.19）。FIPS版本需升级到13.1-37.164，NDcPP版本需升级到12.1-55.300。参考Citrix官方安全公告CTX579459。"
workaround = "如无法升级，可参考CISA和Citrix建议，在应用补丁后终止所有活跃会话和持久会话，确保泄露的会话令牌无法被利用。通过防火墙限制对NetScaler管理接口的访问。"
steps = ["步骤1: 确认NetScaler ADC/Gateway版本", "步骤2: 升级到修复版本", "步骤3: 终止所有现有会话", "步骤4: 检查日志确认是否存在利用痕迹"]

