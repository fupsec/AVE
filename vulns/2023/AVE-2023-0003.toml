notes = "CISA KEV 已确认在野利用（2023-10-18），EPSS 评分 0.99999（百分位 99.993%），多个独立来源已验证。多家确认 LockBit 勒索软件组织利用该漏洞进行初始访问。"
poc_confidence = "high"

[basic]
description = "Citrix NetScaler ADC 和 NetScaler Gateway 在配置为网关（VPN 虚拟服务器、ICA 代理、CVPN、RDP 代理）或 AAA 虚拟服务器时存在敏感信息泄露漏洞。未授权的攻击者可通过发送包含超长 Host 头的特制 HTTP 请求，触发内存越界读取，从响应中泄露包含有效会话令牌（NSC_AAAC Cookie）的内存数据，从而劫持已认证的管理员会话，绕过身份验证并访问受保护的网关资源。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），在野被 LockBit 等勒索软件组织广泛利用。"
published = "2023-10-10"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "Citrix NetScaler ADC 和 NetScaler Gateway 信息泄露漏洞（Citrix Bleed）"
updated = "2026-06-17"

