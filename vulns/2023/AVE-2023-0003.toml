[basic]
title = "Citrix NetScaler ADC和NetScaler Gateway信息泄露漏洞（Citrix Bleed）"
description = "NetScaler ADC和NetScaler Gateway在以网关（VPN虚拟服务器、ICA Proxy、CVPN、RDP Proxy）或AAA虚拟服务器配置时存在敏感信息泄露漏洞。攻击者可通过发送特制请求触发缓冲区过度读取，泄露会话令牌等敏感信息，进而绕过身份认证接管用户会话。该漏洞已在CISA Known Exploited Vulnerabilities（KEV）目录中登记，且已被广泛利用。"
severity = "CRITICAL"
source = "nvd"
published = "2023-10-10"
