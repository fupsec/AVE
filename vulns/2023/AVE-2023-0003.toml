[remediation]
fix = "升级到修复版本：NetScaler ADC 和 NetScaler Gateway 14.1 升级到 14.1-8.50 及以上、13.1 升级到 13.1-49.15 及以上、13.0 升级到 13.0-92.19 及以上。13.1-FIPS 升级到 13.1-37.164 及以上、12.1-FIPS 和 12.1-NDcPP 升级到 55.300 及以上。参考 Citrix 安全公告 CTX579459。"
steps = [
    "步骤1: 确认使用的 NetScaler ADC/Gateway 版本",
    "步骤2: 升级到修复版本（14.1-8.50+ / 13.1-49.15+ / 13.0-92.19+）",
    "步骤3: 升级后使用 Citrix 提供的脚本检查日志中是否存在利用痕迹",
    "步骤4: 清除所有活跃和持久会话，轮换所有管理员凭据、API 密钥、证书",
]
workaround = "如无法升级，按照 Citrix 官方指导应用缓解措施。升级后必须清除所有活跃和持久会话，并轮换所有凭据和证书，因会话令牌可能已被泄露。"

