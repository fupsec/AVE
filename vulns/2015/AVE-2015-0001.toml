[basic]
title = "ppp RADIUS插件rc_mksid函数缓冲区溢出漏洞"
description = "Paul's PPP Package (ppp) 2.4.6及之前版本的plugins/radius/util.c文件中的rc_mksid函数存在缓冲区溢出漏洞。当pppd进程的PID大于65535时，远程攻击者可通过向RADIUS服务器发送特制的start accounting消息触发该漏洞，导致pppd崩溃，造成拒绝服务。"
severity = "MEDIUM"
score = 4.3
sources = ["msrc"]
published = "2015-04-24"
updated = "2026-06-17"
remediation = "升级ppp至修复版本：Ubuntu 14.10升级至2.4.5-5.1ubuntu3.2，Ubuntu 14.04 LTS升级至2.4.5-5.1ubuntu2.2，Ubuntu 12.04 LTS升级至2.4.5-5ubuntu1.2；Debian 7用户应用DSA-3228安全更新。"

