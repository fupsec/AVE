[basic]
  title = "ppp RADIUS插件rc_mksid函数缓冲区溢出漏洞"
  description = "Paul's PPP Package (ppp) 2.4.6及之前版本中plugins/radius/util.c的rc_mksid函数存在缓冲区溢出漏洞。当pppd的PID大于65535时，远程攻击者通过向RADIUS服务器发送特制的start accounting消息可触发缓冲区溢出，导致拒绝服务（崩溃）。"
  severity = "MEDIUM"
  source = "nvd"
  published = "2015-04-24"
  updated = "2026-06-16"

