[basic]
description = "Paul's PPP Package (ppp) 2.4.6 及之前版本的 plugins/radius/util.c 中 rc_mksid 函数存在缓冲区溢出漏洞。当 pppd 的 PID 大于 65535 时，远程攻击者可通过向 RADIUS 服务器发送 start accounting 消息导致拒绝服务（崩溃）。"
published = "2015-04-24"
remediation = "升级 ppp 至 2.4.7 及以上版本，或参考发行版安全公告安装补丁。"
score = 4.3
severity = "MEDIUM"
source = "nvd"
sources = ["msrc", "nvd"]
title = "ppp 2.4.6 及之前版本 RADIUS 插件 rc_mksid 函数缓冲区溢出漏洞"
