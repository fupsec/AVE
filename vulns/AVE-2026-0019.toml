[basic]
title = "SourceCodester Class and Exam Timetabling System edit_class.php SQL注入漏洞"
description = "SourceCodester Class and Exam Timetabling System是一套由SourceCodester开发的课程与考试排课管理系统，基于PHP构建，提供班级管理和考试时间表编排功能。\n受影响版本中，/edit_class.php文件对HTTP请求中的id参数未进行任何消毒处理，直接将该参数值拼接入SQL查询语句。攻击者可通过在id参数中注入SQL恶意片段，实现SQL注入攻击，从而绕过认证机制、读取数据库敏感信息或对数据进行增删改操作。"
