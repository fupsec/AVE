[basic]
title = "Cisco VPN 3000 Concentrator IKE Aggressive Mode 组名信息泄露漏洞"
description = "Cisco VPN 3000 Concentrator 4.1.7.F 之前版本存在信息泄露漏洞。远程攻击者通过向 IKE Aggressive Mode 数据包的 ID 字段发送组名，根据是否收到响应来判断 VPN 组名是否存在，从而获取有效组名信息用于后续暴力破解攻击。"
severity = "MEDIUM"
source = "nvd"
published = "2005-06-21"
updated = "2005-06-21"

