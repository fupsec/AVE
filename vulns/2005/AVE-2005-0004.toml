notes = "CVE 由 MITRE 官方发布，NVD 已分析并分配 CVSS v2 5.0 MEDIUM 评分。NVD 未分配具体 CWE，根据漏洞特征归入 CWE-200（信息泄露）和 CWE-203（可观测差异）。原始研究由 NTA Monitor 发布并开发了 ike-scan 工具，该工具可用于 IKE 服务发现和组名枚举。Tenable 已集成对应的 Nessus 检测插件。截至 2026 年，未发现独立的 PoC 脚本或 Metasploit 模块，利用需借助 ike-scan 等 IKE 扫描工具。该漏洞为 IKE 协议层漏洞（UDP 500），非 HTTP 协议，无法生成 HTTP PoC 脚本。经搜索 GitHub、Exploit-DB、PacketStorm、Sploitus 等渠道，均未发现针对该漏洞的独立 PoC/EXP。"

