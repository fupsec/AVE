[remediation]
fix = "升级 Cisco VPN 3000 Concentrator 到 4.1.7.F 及以上版本。参考 Cisco 安全公告及官方文档。"
workaround = "如无法升级，可在 VPN 集中器上禁用 IKE Aggressive Mode，仅使用 Main Mode 进行 IKE 协商。"
steps = ["步骤1: 确认 Cisco VPN 3000 Concentrator 当前版本", "步骤2: 下载并安装 Cisco 官方发布的安全更新 (4.1.7.F 或更高版本)", "步骤3: 如无法升级，禁用 IKE Aggressive Mode，使用 Main Mode 替代", "步骤4: 监控 VPN 设备日志，检查是否存在异常的 IKE 探测行为"]

