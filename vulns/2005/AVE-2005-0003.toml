[basic]
title = "Vipul Razor Agents 畸形消息远程拒绝服务漏洞"
description = "Vipul Razor Agents（razor-agents）是一款分布式协同垃圾邮件检测和过滤网络的客户端软件。在2.70版本之前，razor-agents存在远程拒绝服务漏洞。攻击者可以通过发送特殊构造的异常HTML消息或包含畸形Content-Type等报头的邮件，触发razor-agents在处理时发生崩溃，从而导致服务不可用。该漏洞无需身份认证即可远程利用，影响垃圾邮件检测服务的正常运行。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = 5.0
remediation = "升级 Vipul Razor Agents 至 2.70 或更高版本。对于 Gentoo 系统用户，请执行 emerge --sync && emerge --ask --oneshot --verbose \">=mail-filter/razor-2.74\" 命令完成升级。Debian 用户请参照 DSA-738 更新对应软件包。"
published = "2005-06-17"
updated = "2005-06-21"
sources = ["tenable", "nvd", "gentoo"]

