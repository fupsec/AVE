[basic]
title = "Sun Java System Web Proxy Server 缓冲区溢出漏洞"
description = "Sun Java System Web Proxy Server（原 Sun ONE Proxy Server）3.6 SP6 版本中存在缓冲区溢出漏洞。远程攻击者可利用该漏洞通过发送特制请求触发缓冲区溢出，成功利用可在目标系统上以服务进程权限执行任意代码，导致系统完全受控。受影响的版本为 3.6 SP6 及更早版本。"
severity = "HIGH"
