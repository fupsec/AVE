[basic]
title = "HP OpenView Network Node Manager 远程命令执行漏洞"
description = "HP OpenView Network Node Manager 6.2 至 7.50 版本中存在远程命令执行漏洞。由于 connectedNodes.ovpl、cdpView.ovpl、freeIPaddrs.ovpl 和 ecscmg.ovpl 脚本对 node 参数输入验证不充分，攻击者可通过插入 shell 元字符（管道符 |、分号 ;）注入任意系统命令，以 Web 服务器进程权限（bin 用户）执行任意命令。该漏洞无需认证即可远程利用，已被 CISA 列入已知被利用漏洞目录（KEV）。"
severity = "CRITICAL"
source = "nvd"
published = "2005-08-25"
updated = "2025-02-07"

