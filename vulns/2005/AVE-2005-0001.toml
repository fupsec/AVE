notes = "CVE 由 MITRE 官方发布，NVD 已完成分析并分配 CVSS v3.1 9.8 CRITICAL 评分，CWE-77 命令注入。CISA 于 2022-03-25 将该漏洞加入 KEV 目录。原始漏洞由 Portcullis Computer Security 的 James Fisher 发现并通过 Bugtraq 邮件列表公开，公开内容包含完整利用 URL 格式。该漏洞已知在野外被积极利用，但截至 2026 年未发现独立的公开 GitHub PoC 仓库或 Metasploit 模块，无 Nuclei 检测模板。PoC 已验证可基于原始披露的 URL 格式实现。该漏洞为 HTTP 协议漏洞，可生成 HTTP PoC 脚本。"

