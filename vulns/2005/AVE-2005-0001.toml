[basic]
title = "HP OpenView Network Node Manager 远程命令执行漏洞"
description = "HP OpenView Network Node Manager 6.2 至 7.50 版本中存在远程命令执行漏洞，远程攻击者可通过向 connectedNodes.ovpl、cdpView.ovpl、freeIPaddrs.ovpl 和 ecscmg.ovpl 脚本的 node 参数注入 shell 元字符来执行任意命令。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV）。"
severity = "CRITICAL"
source = "nvd"
published = "2005-08-25"
