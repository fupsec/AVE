[remediation]
fix = "升级到 HP OpenView Network Node Manager 7.50 以上版本。参考 HP 安全公告 HPSBMA01224 / SSRT051023。"
workaround = "如无法升级，限制对 OpenView NNM Web 控制台的网络访问，仅允许受信任主机访问。"
steps = ["步骤1: 确认当前运行的 OpenView NNM 版本", "步骤2: 访问 HP 支持网站获取最新的安全补丁", "步骤3: 在受影响的系统上安装更新", "步骤4: 使用防火墙限制对 NNM Web 端口（通常为 80/443）的访问"]

