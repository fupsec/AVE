[remediation]
fix = "升级 HP OpenView Network Node Manager 到 7.50 以上版本或应用厂商提供的最新安全补丁。参考 HP 安全公告。"
workaround = "如无法升级，可在 Web 服务器或反向代理层配置输入过滤规则，阻止包含 shell 元字符（|、;、`、$）的请求访问 OvCgi 脚本路径。限制 /OvCgi/ 路径的网络访问权限，仅允许可信 IP 访问。"
steps = ["步骤1: 确认 HP OpenView NNM 当前版本", "步骤2: 访问 HP 官方网站下载并安装最新的安全更新", "步骤3: 如无法升级，在 Web 服务器层配置 WAF 规则拦截命令注入攻击", "步骤4: 限制 /OvCgi/ 路径的网络访问范围，使用防火墙或访问控制列表限制来源 IP", "步骤5: 监控系统日志，检查是否存在可疑的命令执行行为"]

