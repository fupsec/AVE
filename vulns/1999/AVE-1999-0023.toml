[remediation]
fix = "升级到修复版本。参考Cisco安全公告，升级到不受影响的IOS版本。"
workaround = "如无法升级，可在Cisco路由器上使用 'no ip http server' 命令关闭HTTP服务，或使用访问控制列表限制对HTTP服务的访问。"
steps = [
    "登录到Cisco路由器",
    "进入全局配置模式",
    "执行命令: no ip http server 禁用HTTP服务",
    "或执行命令: no ip http secure-server 仅启用HTTPS",
    "执行命令: no ip http access-class 限制HTTP访问来源",
]

