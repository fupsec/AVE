[basic]
description = "Apache HTTP Server的Win32版本存在信息泄露漏洞。攻击者通过在请求URL末尾附加一个点号（.），可以绕过访问控制规则，读取本应受限的敏感文件。该漏洞影响运行于Microsoft Windows平台上的Apache HTTP Server。"
published = "1999-12-12"
remediation = "建议升级Apache HTTP Server至1.3.9及以上版本，该版本已修复点号附加请求路径导致的文件访问绕过问题。"
