[basic]
description = "Sendmail 8.10.0 之前版本存在拒绝服务漏洞。远程攻击者通过向 SMTP 服务器发送一系列 ETRN 命令后断开连接，导致 Sendmail 在连接终止后继续处理这些命令，从而消耗大量系统资源造成拒绝服务。"
published = "1999-12-22"
remediation = "升级 Sendmail 至 8.10.1 或更高版本以修复此漏洞。"
