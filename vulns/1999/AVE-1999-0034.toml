[basic]
description = "wwwcount 2.3 中的 Count.cgi CGI 程序存在缓冲区溢出漏洞，远程攻击者可通过向 Count.cgi 发送特制请求触发缓冲区溢出，从而在目标系统上以 Web 服务器进程权限执行任意命令，完全控制受影响系统。该漏洞影响广泛部署的网站访问统计计数器程序。"
published = "1997-11-05"
remediation = "建议升级到 wwwcount 的最新版本或迁移至其他受支持的网站统计计数器程序，同时限制对 Count.cgi 脚本的访问权限。若无法升级，应移除该 CGI 脚本或通过 Web 服务器配置禁止外部访问。"
score = 7.5
severity = "HIGH"
sources = [
    "exploitdb",
    "NVD",
]
title = "Muhammad A. Muquit wwwcount 2.3 Count.cgi 远程缓冲区溢出漏洞"
