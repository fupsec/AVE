workaround = "从 Web 服务器 CGI 目录中移除或重命名 aglimpse 可执行文件，或限制对其的访问。"
steps = ["步骤1: 检查 Web 服务器 CGI 目录中是否存在 aglimpse 脚本", "步骤2: 从 CGI 目录中移除 aglimpse 脚本或修改文件权限", "步骤3: 重启 Web 服务器使更改生效", "步骤4: 如需要 Glimpse 搜索功能，使用更安全的替代方案"]

