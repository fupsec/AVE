notes = "CVE-1999-0147 是 Glimpse 信息检索系统中 aglimpse CGI 脚本的远程命令执行漏洞。NVD CVSS v2.0 评分为 7.5。该漏洞发布于 1997 年，年代久远，缺乏公开可用的 PoC/EXP 代码，仅能从 Nessus 插件和 X-Force 条目确认漏洞存在。由于 aglimpse 是 HTTP CGI 程序，可通过构造特定 HTTP 请求进行命令注入验证。"

