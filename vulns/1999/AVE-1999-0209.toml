[basic]
title = "ToolTalk RPC 数据库服务器（rpc.ttdbserverd）缓冲区溢出漏洞"
description = "ToolTalk 数据库服务（rpc.ttdbserverd）是 CDE 桌面环境的 ONC RPC 组件，用于管理 ToolTalk 通信所需的对象。由于对用户输入缺少正确的边界检查，存在栈缓冲区溢出漏洞。远程攻击者可向目标系统的 ToolTalk 服务发送特制的 RPC 消息触发溢出，从而以 root 权限执行任意指令。受影响的系统包括 Sun Solaris 2.5.1、SGI IRIX 5.2-6.5.2、HP-UX、Xi Graphics Maximum CDE 1.2.3 以及 TriTeal TED CDE 4.3 等。服务通过 ONC RPC 程序号 100083 版本 1 注册，由 inetd 或 rpcbind 管理。"
severity = "CRITICAL"
source = "nvd"
published = "1998-04-01"
updated = "2026-06-16"

