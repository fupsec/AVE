[remediation]
fix = "参考厂商安全公告升级到修复版本。禁用不必要的 ToolTalk RPC 服务（rpc.ttdbserverd），或在防火墙上屏蔽 RPC 端口（端口映射 111 及动态 RPC 端口）。"
workaround = "如无法升级，可在 /etc/inetd.conf 中注释 rpc.ttdbserverd 相关行并重启 inetd 以禁用服务。对于 Solaris 系统，可删除 rpc.ttdbserverd 可执行文件或移除执行权限。"
steps = ["步骤1: 检查系统是否运行 rpc.ttdbserverd（rpcinfo -p | grep 100083）", "步骤2: 检查受影响系统（Solaris/IRIX/HP-UX）并应用厂商补丁", "步骤3: 如非必需，禁用 ToolTalk 服务", "步骤4: 在防火墙规则中限制 RPC 端口访问"]

