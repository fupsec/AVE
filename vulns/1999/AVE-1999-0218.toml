[basic]
title = "SGI IRIX webdist.cgi 命令执行漏洞"
description = "SGI IRIX 操作系统自带的 webdist.cgi 程序存在命令注入漏洞，远程攻击者可通过向 distloc 参数传递包含 shell 元字符（如分号、管道符）的恶意请求，在目标系统上以 httpd 守护进程权限执行任意命令。该漏洞无需认证即可远程利用，影响系统机密性、完整性和可用性。"
severity = "HIGH"
score = 7.5
cvss_v2 = 7.5
cvss_v3 = 7.3
remediation = "升级到 SGI IRIX 的修复版本或安装官方安全补丁。如无法升级，建议移除或禁用 webdist.cgi 脚本，并在 Web 服务器层面过滤特殊字符输入以缓解风险。"
published = "1997-05-06"
updated = "2026-06-16"
sources = ["exploitdb", "nvd", "cert"]

