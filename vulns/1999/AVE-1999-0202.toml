[authenticity]
cve_confidence = "high"
notes = "该漏洞为本地拒绝服务漏洞，非 HTTP 协议漏洞，不适用于基于 HTTP 的 PoC 模板。复现方法极其简单（执行 /usr/xpg4/bin/more /proc/self/psinfo），无需复杂 PoC 脚本。CVE、OSVDB、SecurityFocus BID、JVNDB 多源确认漏洞真实性。"
poc_confidence = "high"

[basic]
description = "Sun Solaris 7 的 64 位版本中，进程文件系统（procfs）存在本地拒绝服务漏洞。非特权用户可通过执行 `/usr/xpg4/bin/more /proc/self/psinfo` 命令导致系统崩溃（kernel panic），造成拒绝服务。该漏洞在 UE3000、U10、UE450 等 SPARC 平台上已确认可复现，Intel 版本不受影响。"
published = "1999-03-09"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 3.5
severity = "LOW"
source = "nvd"
sources = ["unknown"]
title = "Sun Solaris 7 procfs 本地拒绝服务漏洞"
