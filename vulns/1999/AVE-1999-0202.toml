[remediation]
fix = "升级 Solaris 7 至最新补丁集，或联系 Oracle/Sun 获取针对 Bug ID 4219071 的修复补丁。后续版本（Solaris 8 及以上）已修复此问题。"
steps = [
    "步骤1: 确认系统版本为 Solaris 7 64 位 SPARC 版本",
    "步骤2: 联系 Oracle/Sun 获取针对 Bug ID 4219071 的补丁",
    "步骤3: 应用补丁并重启系统",
]
workaround = "如无法立即升级，可通过以下方式缓解：1. 限制非特权用户对 /proc 文件系统的访问；2. 使用 chroot 或其他机制隔离用户环境；3. 监控系统日志中的 kernel panic 事件。"

