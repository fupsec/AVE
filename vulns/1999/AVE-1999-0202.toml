[basic]
description = "Linux内核2.0.36之前版本中存在安全漏洞。远程攻击者可以在TCP连接完全建立之前，通过伪造TCP连接向应用层传输数据，导致信息泄露或未经授权的数据注入。该漏洞影响Linux 2.0.30、2.0.35、2.0.36及2.0.37等版本。"
published = "1999-03-01"
remediation = "升级Linux内核到2.0.36或更高版本，该版本修复了TCP连接建立过程中的欺骗问题。"
