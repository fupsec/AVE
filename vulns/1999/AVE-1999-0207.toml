[basic]
  title = "ISC BIND 4.9 / 8 反向查询缓冲区溢出漏洞"
  description = "ISC BIND 4.9 和 BIND 8 版本在处理反向查询（Inverse Query）时存在缓冲区溢出漏洞。攻击者可以通过向 DNS 服务器发送特制的反向查询请求，触发缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响了大量运行 BIND 的 DNS 服务器，CVSS v2.0 评分为 10.0，危害极大。"
  severity = "CRITICAL"
  source = "nvd"
  published = "1998-04-08"
  updated = "2026-06-16"

