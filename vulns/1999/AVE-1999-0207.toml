notes = "CVE-1999-0009 是 BIND 历史上最著名的远程缓冲区溢出漏洞之一，CVSS v2.0 评分 10.0。Exploit-DB 上有公开利用代码（EDB-19112），包含完整的 shellcode，可在多种 Linux 发行版上执行远程代码。ISC、SGI、Sun、HP 等多家厂商发布了安全公告。漏洞 PoC/EXP 已在 Bugtraq 邮件列表公开传播，真实性确认。"

