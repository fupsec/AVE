[basic]
description = "Cisco 7xx系列路由器存在拒绝服务漏洞。远程攻击者无需身份认证，只需通过TCP连接向路由器的TELNET端口发送请求，即可触发路由器系统重载，导致设备无法正常提供网络服务。该漏洞影响Cisco 7xx系列所有型号路由器，攻击复杂度低。"
published = "1999-03-11"
remediation = "升级到不受影响的Cisco IOS版本，或使用访问控制列表(ACL)限制不受信任IP地址对TELNET端口的访问，禁用不必要的TELNET服务。"
score = 5.0
severity = "MEDIUM"
sources = [
    "cve",
    "nvd",
]
title = "Cisco 7xx系列路由器TELNET端口TCP连接导致系统重载漏洞"
