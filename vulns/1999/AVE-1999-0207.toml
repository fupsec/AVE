[remediation]
fix = "升级 ISC BIND 到修复版本（4.9.5-P1 以上或 8.1.1 以上）。参考 ISC 官方安全公告。"
workaround = "如无法升级，可在防火墙限制对 DNS 服务器的 TCP 端口 53 访问，仅允许受信任的来源发起 TCP DNS 查询。反向查询功能可通过编译选项禁用。"
steps = ["步骤1: 确认 BIND 版本（named -v）", "步骤2: 登录 ISC 官方网站下载最新修复版本", "步骤3: 备份现有 BIND 配置文件", "步骤4: 升级 BIND 到修复版本", "步骤5: 重启 named 服务使新版本生效"]

