[remediation]
fix = "升级操作系统或安装 TCP 序列号随机化补丁，确保 TCP ISN 使用加密强随机数生成器（如 RFC 6528 推荐的算法）。"
steps = ["步骤1: 确认操作系统版本", "步骤2: 安装厂商提供的 TCP/IP 协议栈安全更新", "步骤3: 启用并配置 IPsec 或 VPN", "步骤4: 在网络设备上配置防 IP 欺骗的 ACL", "步骤5: 将基于 IP 的信任认证改为基于加密证书的认证方式"]
workaround = "使用 IPsec 或 SSH 等加密协议保护传输层通信；在网络边界部署 ACL 限制源 IP 欺骗；禁用基于 IP 地址的信任认证机制。"

