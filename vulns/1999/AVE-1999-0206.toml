notes = "NVD 评分 CVSS v2 5.0，NVD 未评估 CVSS v3/v4。漏洞真实性无可争议（NVD、X-Force、Red Hat 三方确认）。此为 TCP 协议层设计/实现缺陷，影响所有主流操作系统。公开的 GitHub 项目提供了 TCP SN 预测方法和 Mitnick 攻击复现，但无针对此 CVE 的专用 EXP。"
