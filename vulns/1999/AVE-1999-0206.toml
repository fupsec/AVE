[id]
aliases = ["CVE-1999-0077"]
ave_id = "AVE-1999-0206"
cve_id = "CVE-1999-0077"

[basic]
title = "可预测的 TCP 序列号允许欺骗攻击"
description = "TCP 序列号可预测，允许攻击者伪造 TCP 数据包进行 IP 欺骗和会话劫持。此为 TCP/IP 协议栈的核心设计缺陷，攻击者通过预测 ISN（初始序列号）可伪造 TCP 连接，绕过基于 IP 地址的认证机制。该漏洞是 1994 年 Mitnick 攻击（圣诞日入侵）的核心利用技术，影响所有采用可预测 TCP ISN 生成算法的操作系统。"
severity = "HIGH"
score = 7.5
remediation = "升级操作系统或安装 TCP 序列号随机化补丁，确保 TCP ISN 使用加密强随机数生成器（如 RFC 6528 推荐的算法）。在网络边界设备上配置防 IP 欺骗的 ACL 规则，禁止源 IP 地址为非内部地址的外部流量进入。对于关键系统，应禁用基于 IP 地址的信任认证机制，改用加密证书或 SSH 密钥认证。"
published = "1995-01-01"
updated = "2026-06-16"
sources = ["redhat", "nvd"]

[affected]
vendor = "multiple"
product = "TCP/IP 协议栈"

[authenticity]
