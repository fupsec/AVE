[basic]
description = "Cisco IOS 12.0及之前版本中存在拒绝服务漏洞。攻击者可以向目标Cisco设备的syslog服务（UDP端口514）发送恶意UDP数据包，导致设备崩溃或挂起，需要重新启动才能恢复正常服务。该漏洞影响AGS/MGS/CGS/AGS+、IGS、RSM、8xx、25xx、26xx、36xx、38xx、40xx、45xx、47xx、AS52xx、AS53xx、AS58xx、64xx、70xx、72xx、75xx、12xxx系列路由器以及Catalyst 2900XL交换机等多种Cisco设备。"
published = "1999-01-11"
remediation = "升级Cisco IOS到最新版本，或在不需要syslog功能时关闭UDP 514端口，或配置访问控制列表（ACL）限制对syslog端口的访问。"
score = 5.0
severity = "MEDIUM"
sources = [
    "exploitdb",
    "nvd.nist.gov",
]
title = "Cisco IOS 12.0 syslog服务远程拒绝服务漏洞"
updated = "2026-06-16"

