fix = "升级至 NetManage 官方发布的修复版本，或禁用不必要的 SMTP 服务组件。由于该产品已停止维护，建议迁移至替代方案。"
steps = [
    "步骤1: 识别运行 NetManage Chameleon SMTPd 的服务器",
    "步骤2: 若产品仍在支持周期内，联系厂商获取安全补丁",
    "步骤3: 在网络边界防火墙限制对 SMTP 端口（25/TCP）的访问",
    "步骤4: 如无法升级，禁用 SMTP 服务或使用替代邮件服务器（如 Exchange、Postfix）",
]
workaround = "使用防火墙限制对 SMTP 端口（25/TCP）的访问，仅允许可信来源连接；禁用不必要的 Chameleon 网络服务组件。"

