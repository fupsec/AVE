poc_confidence = "medium"

[basic]
description = "NetManage Chameleon 套件中的 SMTPd 服务存在多个缓冲区溢出漏洞。远程攻击者通过向 SMTP 服务发送超长 HELO 主机名（超过 471 字符）或 HELP 主题（超过 514 字符）可触发缓冲区溢出，导致 Dr.Watson 访问冲突异常，服务进程崩溃，造成拒绝服务。该漏洞影响 Chameleon 4.5 及 UnixLink 97 版本，FTP 服务也存在类似溢出问题。"
published = "1999-03-01"
remediation = "升级至 NetManage 官方发布的修复版本，或禁用不必要的 SMTP 服务组件。在网络边界防火墙限制对 SMTP 端口（25/TCP）的访问，仅允许可信来源连接。"
score = 5.0
