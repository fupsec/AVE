[basic]
description = "Solaris 2.6（i386架构）中的cancel命令存在缓冲区溢出漏洞，本地攻击者可利用该漏洞通过精心构造的输入触发缓冲区溢出，从而获取系统root权限。该漏洞影响Sun Solaris 2.6操作系统，攻击者需要拥有本地访问权限。"
