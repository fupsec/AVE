[basic]
description = "ToolTalk 对象数据库服务器 rpc.ttdbserverd 存在栈缓冲区溢出漏洞，远程攻击者可通过发送特制的 RPC 消息触发溢出，覆盖栈上的激活记录从而控制程序执行流，最终以 root 权限执行任意代码。该服务是 CDE 桌面环境的标准组件，运行于多种 Unix 操作系统上。"
published = "1998-04-01"
remediation = "应用 SGI 安全公告 19981101-01 中提供的补丁，禁用不需要的 ToolTalk RPC 服务 rpc.ttdbserverd，或通过防火墙限制对 RPC 端口（100083）的访问。"
score = 10.0
severity = "CRITICAL"
