notes = "该漏洞年代久远，IIS 2.0/3.0 已停止支持。PoC 原理简单（在 URL 后追加点号），Exploit-DB 20481 已验证该漏洞存在。"
poc_confidence = "high"

[basic]
description = "IIS 2.0 和 3.0 允许远程攻击者通过在 URL 末尾附加一个点号（.）来读取 ASP 页面的源代码。攻击者通过浏览 http://target/aspfile.asp. 即可获取 ASP 脚本源码，泄露的信息可能包括数据库连接密码、目录结构等敏感信息。该漏洞也影响 .ht、.id、.pl 等脚本映射文件类型。"
published = "1997-02-20"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 5.5
severity = "MEDIUM"
source = "nvd"
sources = ["unknown"]
