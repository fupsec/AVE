fix = "升级到 Windows 2000 或更高版本操作系统附带的新版 IIS（IIS 5.0 及以上版本不受影响），或安装 Microsoft 提供的最新安全更新。"
steps = [
    "步骤1: 确认 IIS 版本是否为 2.0 或 3.0",
    "步骤2: 升级操作系统到 Windows 2000 或更高版本",
    "步骤3: 安装 IIS 安全工具 URLScan 以拦截恶意请求",
]
workaround = "限制对 ASP 文件的直接访问，或使用 URLScan 等 IIS 安全工具拦截包含异常字符的请求。"

