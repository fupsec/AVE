[basic]
description = "Linux系统中gnuplot 3.5版本存在缓冲区溢出漏洞。gnuplot是一个命令行驱动的交互式绘图工具，在处理特制输入文件时未正确验证缓冲区边界，导致缓冲区溢出。本地攻击者可利用该漏洞通过精心构造的数据触发溢出，从而获取系统root权限。攻击需要本地访问系统且无需认证。"
published = "1999-03-04"
remediation = "建议升级gnuplot到不受影响的版本，限制本地用户执行gnuplot的权限，避免以root权限运行gnuplot程序。"
score = 4.6
