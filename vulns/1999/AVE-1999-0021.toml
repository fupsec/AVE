notes = "该漏洞为配置类安全问题，非软件代码漏洞，没有公开的 PoC/EXP 脚本。ICMP 回显请求可用于网络侦察和信息收集，Red Hat 官方声明允许 ICMP 回显本身不存在已知漏洞，建议在网络边界过滤。"
