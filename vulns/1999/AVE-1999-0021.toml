[basic]
description = "ICMP echo (ping) is allowed from arbitrary hosts. 攻击者可通过发送 ICMP 回显请求探测目标主机是否存活，进而进行网络拓扑发现、主机枚举和信息收集，为后续攻击提供侦察支持。"
published = "1999-01-01"
