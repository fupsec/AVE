[remediation]
fix = "在网络边界防火墙或主机层面配置规则，阻止来自不可信网络的 ICMP 回显请求（Type 8, Code 0）。在 Linux 系统中可使用 iptables 规则：iptables -A INPUT -p icmp --icmp-type echo-request -j DROP。"
steps = [
    "步骤1: 评估网络中对 ICMP 回显的依赖程度",
    "步骤2: 在边界防火墙添加过滤规则：iptables -A INPUT -p icmp --icmp-type echo-request -j DROP",
    "步骤3: 对关键主机禁用 ICMP 回显响应",
    "步骤4: 使用扫描工具验证防护效果",
]
workaround = "如无法在边界防火墙过滤，可在各主机上配置内核参数禁用 ICMP 回显响应（sysctl -w net.ipv4.icmp_echo_ignore_all=1），但可能影响正常网络连通性测试。"

