[basic]
description = "Perl 4.x及5.x版本中的suidperl（又称sperl）辅助程序存在缓冲区溢出漏洞。当该程序以setuid root权限安装时，攻击者可通过精心构造的输入触发缓冲区溢出，成功利用此漏洞可导致本地权限提升，获取root用户权限。该漏洞影响BSD/OS 2.1/3.0、RedHat 4.0/4.1、SGI Freeware 1.0/2.0及Larry Wall Perl 5.0 03等多个操作系统和发行版本。"
published = "1997-05-29"
remediation = "建议升级Perl至不受影响的版本，或移除suidperl/sperl程序的setuid root权限位。若无法升级，可卸载suidperl组件并改用常规perl解释器以避免权限提升风险。"
score = 7.2
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
]
title = "Perl suidperl(sperl) 缓冲区溢出本地权限提升漏洞"
updated = "1997-06-01"

