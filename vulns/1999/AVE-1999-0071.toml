[basic]
description = "InterScan VirusWall for Solaris 在处理HTTP请求时存在安全缺陷。当单个HTTP请求中包含两个GET命令时，该软件无法对传输的文件进行病毒扫描。攻击者可以利用此漏洞，通过在单个HTTP请求中构造两个GET命令的方式，绕过病毒检测机制，向目标系统传输包含恶意代码的文件，从而可能导致系统被感染或数据泄露。"
published = "1999-02-22"
remediation = "升级Trend Micro InterScan VirusWall至厂商提供的最新安全补丁版本，或在Web服务器或代理层面配置规则，检测并拦截包含多个HTTP GET命令的畸形请求。"
score = 5.0
severity = "MEDIUM"
sources = [
    "nvd",
    "cve",
]
title = "Trend Micro InterScan VirusWall for Solaris 双GET请求绕过病毒扫描漏洞"
