[basic]
  title = "Sun Solaris rpc.statd 远程命令执行漏洞"
  description = "rpc.statd 允许远程攻击者通过 SM_MON 和 SM_NOTIFY 命令将 RPC 调用转发到本地操作系统，进而可用于远程利用其他漏洞（如 automountd）。"
