[basic]
title = "Sun Solaris rpc.statd 远程命令执行漏洞"
description = "Solaris 系统中的 rpc.statd 服务（NFS 状态监控器）存在安全漏洞，远程攻击者可通过 SM_MON 和 SM_NOTIFY 命令将恶意 RPC 调用转发到本地操作系统内核。由于 rpc.statd 未正确过滤传入的 RPC 请求，攻击者可利用该漏洞配合 automountd 等其他服务中的缺陷，实现远程代码执行，完全控制目标系统。该漏洞影响 Sun Solaris 2.3/2.4/2.5/2.5.1/2.6 及 SunOS 5.3/5.4/5.5/5.5.1/5.6 等多个版本。"
severity = "HIGH"
score = 7.5
remediation = "立即安装 Sun 安全公告 186 中提供的修补程序，在网络边界防火墙封禁对 rpc.statd 端口（111/TCP、111/UDP）的不必要访问，禁用无需使用的 NFS 相关 RPC 服务，限制可访问 rpc.statd 的源 IP 地址范围。"
published = "1999-06-07"
updated = "2026-07-10"
sources = ["nvd", "redhat"]

