[basic]
description = '''Windows NT IIS服务器存在路径遍历漏洞，远程攻击者通过发送包含特殊构造的'..\..'序列的HTTP请求，可导致服务器耗尽资源或崩溃，造成拒绝服务。该漏洞影响Microsoft Internet Information Server，攻击者无需认证即可通过网络远程触发。'''
published = "1999-05-12"
remediation = "建议升级到受支持的最新Windows版本或安装安全更新，限制对IIS服务器的未授权网络访问，并部署Web应用防火墙(WAF)进行防护。"
