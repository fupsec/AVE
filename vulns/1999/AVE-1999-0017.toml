[basic]
description = "Teardrop（泪滴）攻击是一种经典的拒绝服务漏洞，通过发送两个或多个特制的IP分片包，其中第二个分片的偏移量被设置为小于第一个分片载荷长度但大于零，导致目标系统在IP分片重组时发生内存错误。该漏洞影响多种操作系统，包括Linux内核、Windows 95、Windows NT 4.0及HP-UX 10.34等，攻击者无需认证即可远程触发，导致目标系统崩溃或重启。"
published = "1997-12-16"
remediation = "建议升级操作系统至不受影响的现代版本（如Linux内核2.1及以上、Windows 2000及以上），或在网络边界部署入侵检测系统拦截异常的IP分片包。"
score = 5.0
severity = "MEDIUM"
sources = [
    "nvd.nist.gov",
    "exploit-db",
]
title = "多个厂商TCP/IP协议栈IP分片重组拒绝服务漏洞（Teardrop）"
updated = "2026-06-16"

