[basic]
description = "Teardrop（泪滴）攻击是一种经典的IP分片拒绝服务漏洞，影响多个操作系统TCP/IP协议栈。攻击者发送两个或多个特制的IP分片数据包，其中第二个分片的偏移量小于第一个分片长度并重叠，导致目标系统在IP分片重组过程中分配异常大量的内存资源，最终因内存耗尽造成系统死机或重启。该漏洞影响Linux内核、Windows 95/NT 4.0、HP-UX 10.34等多个操作系统。"
published = "1997-12-16"
remediation = "安装操作系统厂商提供的安全补丁，禁用易受攻击系统上的IP分片功能，或升级到不受影响的操作系统版本。"
score = 5.0
severity = "MEDIUM"
sources = [
    "exploitdb",
    "nvd",
]
title = "Teardrop IP分片重组拒绝服务漏洞"
