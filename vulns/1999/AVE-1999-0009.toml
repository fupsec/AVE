[basic]
title = "Unix in.comsat 守护进程拒绝服务漏洞"
description = "Unix系统中的in.comsat守护进程（biff服务）存在拒绝服务漏洞。该守护进程监听UDP 512端口，用于接收邮件到达通知并将消息显示给用户终端。攻击者可以通过网络向目标主机发送精心构造的UDP数据包，in.comsat会处理这些伪造消息并持续向用户终端输出，大量伪造消息将耗尽系统资源或淹没用户终端，导致邮件通知服务不可用。该漏洞无需身份验证即可远程触发，影响范围涵盖多种Unix变种系统。"
severity = "MEDIUM"
score = 5.0
remediation = "升级系统至厂商已修复版本，或直接禁用in.comsat/biff服务，具体操作为注释/etc/inetd.conf中的comsat行并重启inetd进程，同时配置防火墙规则限制外部对UDP 512端口的访问。"
published = "1999-05-01"
updated = "2026-06-16"
sources = ["cve"]

