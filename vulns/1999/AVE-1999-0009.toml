[basic]
description = "基于BSD/Qualcomm的qpopper 2.4版本POP3服务器中存在缓冲区溢出漏洞。远程攻击者可通过向PASS命令发送超长字符串，触发缓冲区溢出，从而在目标系统上以root权限执行任意代码，完全控制受影响系统。"
published = "1998-07-14"
remediation = "升级qpopper至最新版本或应用厂商提供的安全补丁。SGI已发布安全公告19980801-01-I提供相关补丁。建议禁用不必要的POP3服务或使用防火墙限制访问。"
