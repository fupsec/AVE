[basic]
description = "Qualcomm qpopper 2.4及更早版本中存在缓冲区溢出漏洞。远程攻击者可通过向POP服务器发送超长PASS命令，触发缓冲区溢出，从而在目标系统上以root权限执行任意代码，完全控制受影响的邮件服务器。该漏洞影响基于BSD/Qualcomm qpopper的多款POP服务器实现。"
published = "1998-06-27"
remediation = "升级Qualcomm qpopper至2.5或更高版本。如无法立即升级，建议在网络边界限制对POP服务端口（110/TCP）的访问，仅允许可信IP连接。"
score = 9.8
severity = "CRITICAL"
sources = [
    "exploitdb",
    "NVD",
]
title = "Qualcomm qpopper 2.4 POP服务器缓冲区溢出漏洞"
