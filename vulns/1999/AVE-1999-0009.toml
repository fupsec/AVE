[basic]
description = "Qualcomm qpopper 2.4 及基于 BSD 的 POP 服务器存在缓冲区溢出漏洞。远程攻击者可通过向 PASS 命令发送超长字符串触发缓冲区溢出，从而获得服务器的 root 权限。该漏洞影响所有使用 qpopper 2.4 的邮件服务器。"
published = "1998-07-14"
remediation = "升级至 qpopper 2.5 或更高版本，该版本修复了 PASS 命令的缓冲区边界检查问题。同时应限制对 POP 服务的网络访问，仅允许受信任的客户端连接。"
score = 9.8
severity = "CRITICAL"
sources = ["nvd.nist.gov", "securityfocus.com", "sgi"]
title = "Qualcomm qpopper 2.4 POP 服务器 PASS 命令缓冲区溢出漏洞"
updated = "1999-08-19"

