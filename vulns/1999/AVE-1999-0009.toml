[remediation]
fix = "禁用 in.comsat (biff) 服务，或在防火墙上限制对 UDP 512 端口的访问。参考各 Unix 厂商安全公告。"
workaround = "如业务需要保留 biff 服务，建议限制可信来源 IP 对 UDP 512 端口的访问，或配置防火墙规则阻止外部访问。"
steps = ["步骤1: 确认系统是否运行 comsat/biff 服务: grep comsat /etc/inetd.conf", "步骤2: 临时禁用 biff 服务，在 inetd.conf 中注释掉 comsat 行并重启 inetd 进程", "步骤3: 在防火墙规则中限制对 UDP 512 端口的访问"]

