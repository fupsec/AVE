[basic]
  title = "in.comsat (biff/comsat 服务) 拒绝服务漏洞"
  description = "in.comsat (biff/comsat 服务) 存在拒绝服务漏洞，攻击者可通过向 UDP 512 端口发送伪造的邮件通知消息，导致服务崩溃，造成拒绝服务。该服务用于向用户发送新邮件到达通知，默认运行在类 Unix 系统的 inetd 超级守护进程下。"
