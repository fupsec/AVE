[basic]
title = "多款Unix系统rdist工具缓冲区溢出漏洞"
description = "rdist是一款用于在多台主机间维护文件副本一致性的工具。其lookup()函数存在缓冲区溢出漏洞，本地攻击者可利用此漏洞触发栈溢出，进而以root权限执行任意代码，完全控制系统。该漏洞影响BSDI BSD/OS 2.1、FreeBSD 2.1、IBM AIX 4.2、SGI IRIX 6.4、Sun SunOS 4.1.3等多个Unix操作系统。在部分环境中rdist被设置为setuid root，进一步增加了提权风险。"
severity = "HIGH"
score = 7.2
remediation = "建议用户联系厂商获取对应操作系统的安全补丁，升级rdist至修复版本。如无需使用rdist功能，可移除rdist的setuid权限或直接卸载rdist软件包以减少攻击面。"
published = "1996-07-24"
updated = "2026-06-16"
sources = ["nvd", "exploitdb"]

