[basic]
description = "Windows NT 4.0 信使服务在处理超长用户名时存在拒绝服务漏洞。远程攻击者可通过向目标系统发送包含超长用户名的消息，导致信使服务崩溃或系统资源耗尽，造成拒绝服务。受影响系统包括 Windows NT 4.0 及 Service Pack 1/2/3 版本。"
published = "1999-07-23"
remediation = "建议升级至 Windows 2000 或更高版本操作系统，或在 Windows NT 4.0 上安装最新的安全更新补丁，限制对信使服务的网络访问。"
