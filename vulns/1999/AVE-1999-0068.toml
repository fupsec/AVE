[basic]
description = "SGI IRIX 6.3系统中的pset命令存在缓冲区溢出漏洞。攻击者可通过向pset命令发送特制输入触发缓冲区溢出，从而在本地获取root权限。该漏洞利用无需认证，成功利用后可完全控制受影响系统，影响系统的机密性、完整性和可用性。"
published = "1997-07-16"
remediation = "建议升级到SGI IRIX修复版本或应用厂商官方补丁。SGI已停止支持这些旧版本，建议迁移到受支持的操作系统，或通过访问控制严格限制本地用户执行pset命令。"
