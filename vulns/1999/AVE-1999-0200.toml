[basic]
description = "X Window System的Xt库中存在缓冲区溢出漏洞。本地攻击者可通过向Xt库发送特制数据触发缓冲区溢出，成功利用此漏洞可在目标系统上以root权限执行任意代码。受影响的系统包括BSD/OS、Caldera UnixWare、FreeBSD、HP-UX、IBM AIX、SGI IRIX及SunOS等多个Unix操作系统。"
published = "1997-05-01"
remediation = "建议升级X Window System至包含补丁的最新版本，限制不可信用户对受影响系统的本地访问权限，并及时应用操作系统厂商提供的安全更新补丁。"
score = 7.2
