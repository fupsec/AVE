[basic]
title = "Cisco 7xx 系列路由器 ClickStart HTTP 服务器默认启用未授权配置修改漏洞"
description = "Cisco 7xx 系列路由器（IOS/700 3.2(5) 至 4.2(3) 版本）内置的 ClickStart HTTP 服务器默认启用。该 HTTP 服务器不进行任何身份验证，远程攻击者可通过该服务器修改路由器配置或获取配置信息，包括查看连接的交换机类型和 ISDN 电话号码等敏感信息。ClickStart 不会自动过滤来自已配置子网外部的连接尝试。"
severity = "HIGH"
source = "cve"
published = "1999-03-11"
updated = "2026-06-16"

