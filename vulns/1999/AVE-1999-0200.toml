[remediation]
fix = "升级 Cisco 76x/77x 路由器至 IOS/700 4.3(1) 或更高版本。对于 75x 路由器，在所有版本中使用命令 'set clickstart off' 禁用 ClickStart HTTP 服务器。"
workaround = "如无法立即升级，可使用以下命令禁用 ClickStart HTTP 服务器：Router> set clickstart off。同时使用 'set ip filter tcp' 命令过滤来自不可信主机的 TCP 连接。"
steps = ["步骤1: 确认路由器型号和当前 IOS/700 软件版本", "步骤2: 如为 76x/77x 路由器，升级至 IOS/700 4.3(1) 或更高版本", "步骤3: 如为 75x 路由器，执行 'set clickstart off' 命令禁用 HTTP 服务器", "步骤4: 配置 IP 过滤规则限制对路由器管理接口的访问"]

