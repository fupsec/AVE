[remediation]
fix = "升级 /bin/login 到修复版本，或在 /etc/inetd.conf 中注释掉 rlogin 服务行后重启 inetd 进程。"
workaround = "禁用 rlogin 服务：在 /etc/inetd.conf 中注释掉 rlogin 相关行，然后执行 refresh -s inetd 或重启 inetd 进程。"
steps = ["步骤1: 确认系统是否运行 rlogin 服务（检查 /etc/inetd.conf）", "步骤2: 如不需要 rlogin，在 /etc/inetd.conf 中注释掉 rlogin 行", "步骤3: 执行 refresh -s inetd 或重启 inetd 使配置生效", "步骤4: 升级 /bin/login 到厂商提供的修复版本"]

