[basic]
title = "rlogin login(1) -froot 远程权限提升漏洞"
description = "多个 Unix 系统实现中的 rlogin 和 login(1) 存在权限提升漏洞。当使用 -froot 参数调用 rlogin 时，系统会允许远程攻击者无需密码直接获得 root 权限。漏洞源于 login 在解析 rlogind 传递的参数时，将 -fuser 格式的参数误解析为强制登录选项而非用户名，从而绕过认证机制。"
severity = "CRITICAL"
source = "exploitdb"
published = "1994-05-23"
updated = "2024-08-01"

