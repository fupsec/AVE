[basic]
description = "Cisco IOS系统的Web服务器存在拒绝服务漏洞，攻击者无需身份认证即可通过网络向路由器发送特制的超长URL请求，该请求在处理时会导致路由器设备重新启动，从而造成拒绝服务。该漏洞影响了运行Cisco IOS的多种路由器型号，攻击成本低且无需特殊权限。"
published = "1999-03-01"
remediation = "建议升级Cisco IOS系统至不受影响的最新版本，或在路由器上配置访问控制列表（ACL）限制对Web服务的访问。具体修复版本请参考Cisco官方安全公告。"
score = 5.0
severity = "MEDIUM"
sources = [
    "nvd",
    "cve",
]
title = "Cisco IOS Web服务器长URL导致路由器重启的拒绝服务漏洞"
