[basic]
description = "ISC BIND（域名系统服务器软件）4.9及8版本在处理反向查询（Inverse Query）请求时存在缓冲区溢出漏洞。攻击者可通过向目标DNS服务器发送特制的反向查询数据包，触发缓冲区溢出，从而在服务器上执行任意代码，完全控制受影响的系统。该漏洞影响范围广泛，利用代码已公开，构成严重安全威胁。"
published = "1998-04-08"
remediation = "升级到ISC BIND 8.1.2或更高版本，或应用各操作系统厂商提供的安全补丁。SGI、Sun、HP等厂商均已发布相关安全公告及补丁。如无法立即升级，建议限制对DNS服务器的TCP查询访问。"
score = 10.0
severity = "CRITICAL"
sources = [
    "nvd.nist.gov",
    "exploit-db",
]
title = "ISC BIND 4.9/8 反向查询缓冲区溢出漏洞"
updated = "2024-11-20"

