[basic]
title = "SunOS/Solaris automountd 远程命令执行漏洞"
description = "Automount守护进程automountd存在shell元字符注入漏洞，远程或本地攻击者可通过构造恶意RPC请求执行任意命令，获取系统最高权限。"
severity = "CRITICAL"
source = "nvd"
published = "1997-11-26"
