[basic]
title = "SunOS/Solaris automountd 远程命令执行漏洞"
description = "Automount守护进程automountd在处理RPC请求时存在shell元字符注入漏洞。攻击者可通过向automountd发送包含shell特殊字符的恶意RPC请求，在目标系统上以root权限执行任意命令，完全控制受影响系统。该漏洞影响运行automountd的SunOS/Solaris及HP-UX系统，无需认证即可远程利用。"
severity = "CRITICAL"
score = 9.8
remediation = "升级操作系统至厂商已修复版本，或禁用automountd服务。在防火墙上限制对RPC端口（111/2049）的访问，仅允许受信网络段连接。建议实施最小权限原则，关闭不必要的RPC服务。"
sources = ["nvd", "redhat"]
published = "1997-11-26"
updated = "2026-06-16"

[affected]
vendor = "Sun Microsystems"
product = "Solaris automountd"

