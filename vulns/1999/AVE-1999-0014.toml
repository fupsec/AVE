[remediation]
fix = "升级到受影响版本以上。参考Sun官方安全公告。"
workaround = "禁用automountd服务或限制对RPC端口（111）的访问。如无法升级，可通过防火墙限制对portmap/rpcbind的访问。"
steps = ["步骤1: 确认系统是否运行automountd服务", "步骤2: 禁用automountd或应用厂商补丁", "步骤3: 限制RPC端口（111/2049）的网络访问"]

