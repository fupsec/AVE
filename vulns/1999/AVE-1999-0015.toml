[basic]
description = "CDE（Common Desktop Environment）中的 dtappgather 实用程序存在不安全符号链接处理漏洞。由于未正确检查文件所有权，dtappgather 使用 0777 权限目录创建临时文件，且不检查目标文件是否存在即打开写入。攻击者可通过创建符号链接将任意文件权限更改为 0666，或通过设置 DTUSERSESSION 环境变量结合路径穿越修改系统关键文件权限，导致特权提升。受影响系统包括 HP-UX 10.20/11.0、IBM AIX 4.3、SCO Unixware 7.0 及 Sun Solaris 2.6。"
published = "1998-01-21"
remediation = "建议联系厂商获取对应操作系统的安全补丁。HP-UX 用户可从 HP 安全公告 HPSBUX9801-075 获取修复，Solaris 用户可参考 Sun 安全公告 00185。临时缓解措施可限制 dtappgather 的 setuid 权限并避免在不可信环境中使用 CDE。"
score = 7.2
severity = "HIGH"
sources = [
    "exploitdb",
    "nvd",
]
title = "CDE dtappgather 文件权限更改漏洞"
updated = "1999-11-03"

