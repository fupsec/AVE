[basic]
description = "CDE（通用桌面环境）中的 dtappgather 工具在创建临时目录时未正确检查文件所有权，允许本地攻击者通过符号链接攻击或 DTUSERSESSION 环境变量覆盖系统上任意文件。攻击者可将 /etc/shadow 等关键文件的权限修改为 0666，从而实现权限提升。受影响的系统包括 HP-UX 10.20/11.0、IBM AIX 4.3、SCO Unixware 7.0 和 Sun Solaris 2.6。"
published = "1998-01-21"
remediation = "建议升级到厂商修复版本或安装相关的安全补丁。HP-UX 用户应参考 HPSBUX9801-075 公告，Sun Solaris 用户应参考 Sun 安全公告 00185。"
score = 7.2
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
    "securityfocus",
]
title = "CDE dtappgather 任意文件权限修改漏洞"
updated = "2026-06-16"

