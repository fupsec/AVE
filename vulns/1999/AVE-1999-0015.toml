notes = "CVE-1999-0021是wwwcount 2.3 Count.cgi的远程缓冲区溢出漏洞，存在公开的PoC代码（EDB-19105），CVSS v3评分9.8（CRITICAL），远程未授权攻击者可利用该漏洞执行任意命令。"
poc_confidence = "high"

[basic]
description = "wwwcount（Count.cgi）是一个广泛使用的CGI网站访问计数器程序。该程序在处理QUERY_STRING环境变量时存在缓冲区溢出漏洞。远程攻击者可以向Count.cgi发送超长的恶意查询字符串，触发缓冲区溢出，从而覆盖返回地址并执行任意命令。攻击成功后，攻击者可以获取Web服务器的控制权限，执行任意系统命令，完全接管目标服务器。该漏洞影响wwwcount 2.3及更早版本，无需身份验证即可远程利用。"
published = "1997-11-05"
remediation = "升级到wwwcount 2.4或更高版本以修复缓冲区溢出问题。如无法升级，建议从Web服务器上移除Count.cgi脚本，或限制对该CGI脚本的访问权限。"
score = 9.8
severity = "CRITICAL"
source = "nvd"
sources = ["exploitdb"]
