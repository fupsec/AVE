[basic]
title = "Cisco IOS Web服务器超长URL拒绝服务漏洞"
description = "Cisco IOS的Web服务器在处理超长URL时存在拒绝服务漏洞，攻击者可通过向路由器HTTP服务发送超长URL请求导致IOS进程崩溃并引发路由器重启。"
severity = "MEDIUM"
