notes = "CVE-1999-0223 是 1999 年发现的 Solaris syslogd 拒绝服务漏洞。NVD 提供 CVSS v2 2.1 评分，CVSS v3/v4 无评分。该漏洞影响 SunOS 5.4，通过向 syslogd 发送来自无反向DNS记录主机的消息触发崩溃。Sun 官方补丁 103291 已修复。由于年代久远且属于非 HTTP 协议漏洞，未找到任何公开 PoC 或 EXP 脚本。"

