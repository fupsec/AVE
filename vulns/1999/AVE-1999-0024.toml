[remediation]
fix = "升级到不受影响的 Perl 版本，或移除 suidperl/sperl 的 setuid root 权限。"
workaround = "如无法升级，移除 suidperl/sperl 的 setuid 位：chmod u-s /usr/bin/suidperl"
steps = ["步骤1: 确认 suidperl 文件位置和权限：ls -la $(which suidperl 2>/dev/null || which sperl 2>/dev/null)", "步骤2: 移除 setuid root 权限：chmod u-s /path/to/suidperl", "步骤3: 升级到包含修复的最新 Perl 版本"]

