[basic]
description = "CVE-1999-0018 是运行 statd 服务的多种 Unix 系统中的缓冲区溢出漏洞。攻击者可利用远程网络请求触发 statd 中的缓冲区溢出，从而获取 root 权限。受影响系统包括 IBM AIX 3.2/4.1、SCO Unixware 7.1.1、SGI IRIX 5.3 和 Sun Solaris 2.5.1，攻击者无需身份认证即可远程利用。"
published = "1997-12-05"
remediation = "建议升级到不受影响的版本或应用厂商发布的安全补丁。对于已停止维护的系统，应迁移到受支持平台并限制网络访问 statd 端口。"
score = 10.0
severity = "CRITICAL"
sources = [
    "nvd",
    "exploitdb",
]
title = "IBM AIX/SCO Unixware/SGI IRIX/Sun Solaris statd 缓冲区溢出远程权限提升漏洞"
