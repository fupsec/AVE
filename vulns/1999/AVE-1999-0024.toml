[basic]
title = "Solaris syslogd 反向DNS查询拒绝服务漏洞"
description = "Solaris syslogd crashes when receiving a message from a host that doesn't have an inverse DNS entry."
severity = "LOW"
source = "cve"
published = "1999-03-01"
updated = "2026-06-16"

