[basic]
title = "suidperl (sperl) 缓冲区溢出漏洞"
description = "Perl 辅助程序 suidperl（也称 sperl）存在缓冲区溢出漏洞。当该程序以 setuid root 权限安装时，攻击者可利用该溢出漏洞实现本地权限提升，获取 root 权限。该漏洞影响 Perl 4.x 和 5.x 版本，涉及 BSD/OS 2.1/3.0、RedHat 4.0/4.1、SGI Freeware 1.0/2.0 等多个平台。"
