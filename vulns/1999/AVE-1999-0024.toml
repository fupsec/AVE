[affected]
product = "Squid Proxy (cachemgr.cgi)"
vendor = "Squid"

[authenticity]
cve_confidence = "high"
notes = "CVE-1999-0710 是 1999 年发现的 Squid 代理缓存管理 CGI 接口暴露漏洞。NVD 提供 CVSS v2 7.5 评分，CVSS v3/v4 无评分。Red Hat 官方安全公告已确认该漏洞。由于年代久远，公开可用的 PoC 脚本极少，未找到 GitHub 仓库或 Nuclei 模板。PoC 可通过直接访问 cachemgr.cgi 验证。"
poc_confidence = "low"

[basic]
description = "Red Hat Linux 5.2 和 6.0 及其他发行版中的 Squid 软件包将 cachemgr.cgi 安装在公共 Web 目录中，允许远程攻击者将其作为中介连接到其他系统，造成代理滥用和信息泄露风险。"
published = "1999-07-25"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "Squid cachemgr.cgi 公共目录暴露代理滥用漏洞"
