nuclei_templates = []

[remediation]
fix = "安装 Sun Patch 103291 修复版本。参考 Sun 安全公告。"
workaround = "在 syslog 服务器上确保所有连接的主机具有正确的反向DNS（PTR）记录。如无法打补丁，可通过防火墙限制对 syslog UDP 514 端口的访问。"
steps = ["步骤1: 确认 Solaris 版本: uname -a", "步骤2: 安装 Sun Patch 103291", "步骤3: 确保所有受信任主机具有有效的反向DNS记录", "步骤4: 重启 syslogd 服务: /etc/init.d/syslog restart"]

