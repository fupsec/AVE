[remediation]
fix = "升级到 Squid 修复版本，或将 cachemgr.cgi 移出公共 Web 目录。参考 Red Hat 安全公告 RHSA-1999-025。"
steps = [
    "步骤1: 确认 Squid 版本和 cachemgr.cgi 文件位置",
    "步骤2: 将 cachemgr.cgi 移出公共 Web 目录或限制访问权限",
    "步骤3: 在 Apache/Nginx 中添加访问控制规则限制对 cachemgr.cgi 的访问",
    "步骤4: 升级到包含漏洞修复的最新 Squid 版本",
]
workaround = "如无法升级，移除 cachemgr.cgi 文件或限制对 CGI 目录的访问权限。在 Web 服务器配置中添加访问控制规则，仅允许管理 IP 访问 cachemgr.cgi。"

