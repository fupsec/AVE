[basic]
description = "SLMail 3.1及3.2版本在启用了远程管理服务(RAS)时存在安全漏洞，本地用户可通过将用户的Finger文件设置为指向目标文件，然后对该用户执行finger命令，从而访问NTFS文件系统中的任意文件。此漏洞允许低权限用户读取、修改或删除系统中本无权访问的敏感文件。"
published = "1999-02-25"
remediation = "建议升级SLMail至3.2以上已修复版本，或在不必要时禁用远程管理服务(RAS)，限制本地用户对finger配置文件的修改权限。"
score = 4.6
severity = "MEDIUM"
sources = [
    "nvd",
    "cve",
]
title = "SLMail 远程管理服务文件访问漏洞"
updated = "1999-02-25"

