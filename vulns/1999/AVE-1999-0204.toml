[basic]
title = "BSD 衍生系统 TCP/IP 协议栈 ip_input.c 远程拒绝服务漏洞"
description = "BSD 衍生系统（BSD/OS、FreeBSD、OpenBSD）的 TCP/IP 协议栈实现中，ip_input.c 文件存在输入验证缺陷（CWE-20）。远程攻击者无需认证即可通过网络发送特制的 TCP 数据包，触发系统内核中的 TCP 解码模块异常，导致目标系统崩溃或完全挂起，造成拒绝服务。该漏洞影响 BSD/OS 3.1、FreeBSD 1.0 至 3.0、OpenBSD 2.3 至 2.4 等多个版本。"
severity = "MEDIUM"
score = 5.0
remediation = "升级操作系统到已修复版本。OpenBSD 用户应应用 2.3 errata 002 补丁或升级到 2.4 及以上版本；FreeBSD 用户应升级到 3.0 及以上版本；BSDI 用户应联系厂商获取修复补丁。在网络边界部署防火墙规则，过滤可疑 TCP 数据包可作为临时缓解措施。"
published = "1999-12-30"
updated = "2026-06-16"
sources = ["cve", "nvd"]

