notes = "CVE-1999-0001 是历史上第一个 CVE 编号，对应经典 Teardrop IP 分片攻击。该漏洞在 BSD 衍生系统 IP 碎片重组代码中存在输入验证缺陷。Exploit-DB 19078 提供完整的 teardrop.c 拒绝服务利用代码。该漏洞为非 HTTP 协议漏洞，无法生成 HTTP PoC 脚本。"
