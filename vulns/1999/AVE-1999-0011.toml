[basic]
title = "GNU C Library (glibc) 2.2 之前版本 tdelete() 函数返回值未文档化漏洞"
description = "GNU C Library（又名 glibc）2.2 之前的版本中，manual/search.texi 缺少关于删除树根节点时 tdelete 返回值为未指定的说明，这可能导致开发者在不知情的情况下访问悬垂指针，从而可能被攻击者利用。"
