[basic]
title = "GNU C Library (glibc) tdelete 返回值文档缺陷导致悬垂指针风险"
description = "GNU C Library (glibc) 2.2 之前版本的 manual/search.texi 文件中缺少对删除树根节点时 tdelete 返回值未定义的说明。开发者若未注意到 1999 年的文档更新，可能访问悬垂指针，导致信息泄露、完整性破坏或系统不可用。"
severity = "CRITICAL"
source = "cve"
published = "1999-11-09"
updated = "2026-06-16"

