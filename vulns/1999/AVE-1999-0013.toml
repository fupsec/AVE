[basic]
title = "Lucent Ascend路由器远程管理端口拒绝服务漏洞"
description = "Lucent Ascend路由器在端口150（远程管理端口）存在拒绝服务漏洞。攻击者无需认证即可通过网络向该端口发送恶意数据包，导致路由器服务不可用，影响网络通信。"
severity = "MEDIUM"
score = 5.0
remediation = "升级Ascend路由器固件至厂商提供的最新版本，或在防火墙上限制端口150的远程管理访问，仅允许受信IP地址连接。"
