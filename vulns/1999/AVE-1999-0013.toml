[basic]
  title = "Ascend 路由器远程管理端口拒绝服务漏洞"
  description = "Ascend 路由器（Lucent）的远程管理端口（TCP 150）存在拒绝服务漏洞。远程攻击者无需认证即可通过网络发送特制数据包，导致路由器远程管理服务崩溃或停止响应，从而中断网络管理功能。"
  severity = "MEDIUM"
