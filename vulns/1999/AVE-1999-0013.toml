[remediation]
fix = "联系 Lucent（现隶属于 Nokia/阿尔卡特朗讯）获取官方修复方案。由于该产品已停止支持，建议升级到受支持的路由器设备。"
workaround = "在网络边界防火墙处限制对 TCP 端口 150 的入站访问，仅允许已知可信管理 IP 地址连接。"
steps = ["步骤1: 在防火墙上限制对 TCP 端口 150（Ascend 远程管理）的入站访问", "步骤2: 如不需要远程管理功能，在路由器配置中禁用它", "步骤3: 将路由器固件升级到最新版本（如厂商仍提供支持）"]

