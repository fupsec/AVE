[basic]
description = "Lucent Ascend路由器通过150端口（远程管理服务）存在拒绝服务漏洞。远程攻击者无需认证即可通过网络向该端口发送恶意数据包，导致路由器服务崩溃或无法响应正常请求，造成网络中断。该漏洞影响Ascend系列路由器的远程管理功能。"
published = "1999-03-01"
remediation = "升级Ascend路由器固件至最新版本以修复该漏洞；若无法升级，建议在防火墙上限制对端口150的访问，仅允许可信管理IP连接。"
score = 5.0
severity = "MEDIUM"
