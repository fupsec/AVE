notes = "漏洞由 MITRE/NVD 收录并确认。CVSS v2 5.0 MEDIUM。未发现任何公开 PoC 或利用代码。由于该漏洞年代久远（1999 年）且涉及非 HTTP 协议（Telnet/远程管理），无法生成自动化 HTTP PoC 验证脚本。Ascend 已被 Lucent 收购，产品早已停产，建议用户迁移到受支持的替代方案。"

