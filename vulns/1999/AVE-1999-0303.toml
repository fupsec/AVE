[basic]
description = "Netscape Communicator 4.5 中的 talkback 功能存在安全漏洞，当目标用户的 Netscape 浏览器崩溃时，本地攻击者可利用 talkback 功能终止其他用户的任意进程，导致拒绝服务或进程异常终止。该漏洞影响系统的可用性和完整性，攻击复杂度较低。"
published = "1999-03-18"
remediation = "建议升级 Netscape Communicator 至最新安全版本，或禁用 talkback 功能以防止本地用户利用该漏洞终止其他进程。"
