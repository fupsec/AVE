[basic]
title = "SGI IRIX /bin/login 本地缓冲区溢出漏洞"
description = "SGI IRIX 操作系统的 /bin/login 程序在处理 LOCKOUT 参数时存在缓冲区溢出漏洞。本地攻击者可利用此漏洞通过精心构造的登录请求触发缓冲区溢出，导致任意代码执行或以 root 权限破坏系统文件。攻击者需要具有本地系统访问权限，成功利用后可完全控制受影响的系统。"
severity = "HIGH"
score = 8.4
published = "1997-05-26"
