[basic]
description = "Sendmail 5.58版本中存在严重安全漏洞，其debug命令默认启用且无需身份验证。远程攻击者可通过SMTP协议向目标服务器发送特制邮件请求，利用debug模式以root权限执行任意系统命令，从而完全控制受影响主机。该漏洞是早期互联网邮件服务器基础设施中的重大安全隐患。"
published = "1988-10-01"
remediation = "升级至不受影响的Sendmail版本以修复debug命令漏洞；或禁用Sendmail的debug调试功能；同时限制Sendmail服务的网络访问范围，部署防火墙规则阻止未授权SMTP连接。"
score = 10.0
severity = "CRITICAL"
sources = [
    "NVD",
    "exploitdb",
]
title = "Eric Allman Sendmail 5.58 debug命令远程代码执行漏洞"
