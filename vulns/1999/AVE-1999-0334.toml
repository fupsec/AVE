[basic]
description = "Solaris 操作系统中 ufsrestore 工具存在缓冲区溢出漏洞，本地攻击者可利用该漏洞通过精心构造的参数触发缓冲区溢出，从而获取系统最高权限（root）。该漏洞影响 SunOS 5.5 及 5.5.1 版本（即 Solaris 2.5 和 2.5.1）。"
