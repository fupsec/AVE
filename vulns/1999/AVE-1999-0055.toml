cve_id = "CVE-1999-0317"
aliases = ["CVE-1999-0317", "CVE-1999-0845"]

[basic]
title = "Linux su 命令缓冲区溢出本地提权漏洞"
description = "Linux su 命令存在缓冲区溢出漏洞，根源在于 libc 中 vsyslog()/openlog() 函数对 ident 字符串的处理不当。su 命令使用 argv[0] 作为 openlog() 的 ident 参数，当攻击者通过环境变量 LANGUAGE 设置恶意 locale 文件路径（包含 /tmp 等目录遍历），并结合 libc.po/lc.mo 格式化字符串漏洞，可覆盖 /bin/su 的 .dtors 段或返回地址。本地攻击者通过向 su 传递超长用户名（argv[1]），触发缓冲区溢出，覆盖栈上的返回地址或 GOT 表项，最终以 root 权限执行任意代码。该漏洞影响 libc 5.4.23 及更早版本，在 libc 5.4.38 中已修复。"
severity = "HIGH"
score = 7.2
cvss_v2_score = 7.2
cvss_v2_vector = "AV:L/AC:L/Au:N/C:C/I:C/A:C"
published = "1999-11-25"
updated = "2026-06-16"
remediation = "升级 libc 至 5.4.38 或更高版本；如无法立即升级，可使用非可执行栈补丁（http://www.false.com/security/linux-stack/）；对 su 命令去除 SUID 位（chmod u-s /bin/su）作为临时缓解措施；限制本地用户对 su 命令的直接访问权限，通过 PAM 或 sudo 替代方案管理特权提升。"
sources = ["cve", "nvd"]

[affected]
vendor = "glibc"
product = "glibc"

