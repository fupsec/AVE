[basic]
title = "cpio 创建归档文件时使用 umask 0 致权限设置不当漏洞"
description = "cpio 在 FreeBSD 2.1.0、Debian GNU/Linux 3.0 等操作系统中，使用 -O（归档）或 -F 选项创建文件时采用了 umask 0，导致生成的文件权限为 0666（全局可读写）。本地攻击者可利用此漏洞读取或覆盖归档文件中的敏感数据，造成信息泄露或文件篡改。"
severity = "LOW"
score = 2.1
remediation = "升级 cpio 至已修复版本（如 rev 1.3 或更高），或在执行 cpio -O/-F 前手动设置 umask 为安全值（如 077）。"
published = "1996-07-16"
updated = "2026-06-16"
sources = ["redhat", "nvd"]

