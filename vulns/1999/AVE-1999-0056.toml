[basic]
description = "BSDI BSD/OS 2.1、FreeBSD 2.1、IBM AIX 4.2、SGI IRIX 6.4、Sun SunOS 4.1.3等多款Unix操作系统中的rdist工具存在缓冲区溢出漏洞。rdist的lookup()函数在处理特制请求时未正确验证边界，本地攻击者可利用此漏洞触发缓冲区溢出，从而获取系统root权限。"
published = "1996-07-24"
remediation = "升级到各厂商已修复版本：BSDI升级到BSD/OS 3.0及以上，FreeBSD升级到2.2及以上，IBM安装AIX相应安全补丁，SGI安装IRIX安全更新，Sun升级到Solaris对应修复版本。"
score = 7.2
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
]
title = "多款Unix系统rdist工具缓冲区溢出漏洞"
updated = "1996-07-24"

