[basic]
description = "Rdist 是一款用于在多台主机间维护文件副本一致性的程序。CVE-1999-0023 是 rdist 中 lookup() 函数存在缓冲区溢出漏洞，本地攻击者可利用精心构造的数据触发栈溢出，进而以 root 权限执行任意代码，实现权限提升。受影响的系统包括 BSDI BSD/OS 2.1、FreeBSD 2.1、IBM AIX 4.2、SGI IRIX 6.4、Sun SunOS 4.1.3 等。若 rdist 被设置为 setuid root，攻击者通过该漏洞可直接获取 root shell。"
published = "1996-07-24"
remediation = "建议升级 rdist 到已修复版本或从系统中移除 rdist 的 setuid root 权限。对于不再受支持的系统（如 BSD/OS 2.1、FreeBSD 2.1、AIX 4.2、IRIX 6.4、SunOS 4.1.3），建议升级到已修复该漏洞的更新版本或迁移至受支持的操作系统。"
score = 7.2
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
    "ibm-xforce",
]
title = "BSDI BSD/OS、FreeBSD、IBM AIX、SGI IRIX、Sun SunOS 等多款系统 rdist lookup() 函数缓冲区溢出本地提权漏洞"
updated = "2024-05-13"

