[remediation]
fix = "升级 qpopper 到 2.5 或更高版本。参考官方安全公告和 SGI 安全通告 19980801-01-I。"
workaround = "使用防火墙限制对 POP3 端口（110/tcp）的访问，仅允许可信网络连接；禁用 qpopper 中不必要的功能。"
steps = ["步骤1: 使用 telnet 检查 POP3 服务器版本标识（telnet <host> 110）", "步骤2: 如版本低于 2.5（含 2.5 beta），立即升级", "步骤3: 应用 SGI 安全补丁（如适用）", "步骤4: 配置防火墙限制 POP3 端口访问"]

