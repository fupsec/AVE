[basic]
description = "Windows Internet命名服务(WINS)存在安全漏洞，远程攻击者可通过发送恶意的1Ch注册请求，导致WINS将域控制器记录指向恶意服务器，从而造成网络连接丢失(拒绝服务)或窃取用户凭据。该漏洞影响Windows 95/98/2000系统，当主域控制器不可用时风险更高。"
published = "2009-01-14"
remediation = "升级到受支持的Windows Server版本(如Windows Server 2003及以上)，在防火墙上限制对WINS服务的访问，并对WINS服务器实施身份验证和访问控制机制。"
score = 7.6
severity = "HIGH"
sources = ["nvd"]
title = "Microsoft Windows Internet命名服务(WINS)1Ch注册导致域控制器劫持漏洞"
updated = "2009-01-15"

