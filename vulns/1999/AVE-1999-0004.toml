[basic]
title = "Qualcomm qpopper 2.4 POP3服务器缓冲区溢出漏洞"
description = "Qualcomm qpopper 2.4及之前版本中存在栈缓冲区溢出漏洞。远程攻击者无需身份验证即可通过向POP3服务(端口110)发送特制的PASS命令，触发缓冲区溢出，从而在目标系统上以root权限执行任意代码。该漏洞影响FreeBSD、BSDI、Linux等多款Unix系统。"
severity = "CRITICAL"
score = 9.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
cvss_v2 = "(AV:N/AC:L/Au:N/C:C/I:C/A:C)"
published = "1998-07-14"
updated = "2026-06-16"
remediation = "升级Qualcomm qpopper至2.5或更高版本。如无法立即升级，应限制POP3服务(端口110)的访问权限，仅允许受信任IP地址连接，并部署入侵检测系统监控异常PASS命令。"
sources = [
    "exploitdb",
    "nvd"
]

