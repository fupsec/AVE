[basic]
title = "Qualcomm qpopper 2.4 - POP Server 缓冲区溢出漏洞"
description = "基于 BSD/Qualcomm 的 qpopper POP3 服务器在处理 PASS 命令时存在缓冲区溢出漏洞，远程攻击者通过发送超长的 PASS 命令可触发缓冲区溢出，实现以 root 权限执行任意代码。受影响版本为 qpopper 2.4 及更早版本，覆盖 FreeBSD、BSDI BSD/OS、SGI IRIX 等多个平台。"
severity = "CRITICAL"
source = "exploitdb"
published = "1998-07-14"
updated = "2026-06-16"

