[basic]
title = "Microsoft Windows 95/98 凭据缓存泄露明文网络密码漏洞"
description = "Windows 95和Windows 98系统中存在一个遗留凭据缓存机制漏洞（CWE-255）。该系统在认证过程中会将网络密码以明文形式缓存在本地，攻击者通过本地访问系统即可从凭据缓存文件中直接读取明文网络密码，导致敏感凭据信息泄露。该漏洞影响所有Windows 95和Windows 98版本，无需额外权限即可利用。"
severity = "HIGH"
score = 7.8
sources = ["cve", "nvd"]
published = "1999-11-29"
updated = "2026-06-16"
remediation = "微软已发布安全公告MS99-052，建议安装KB168115更新。限制对Windows 95/98系统的物理访问，并考虑升级至更高版本操作系统以消除该遗留机制。"

