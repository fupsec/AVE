[basic]
title = "Sendmail ETRN命令处理拒绝服务漏洞"
description = "Sendmail 8.10.0之前版本中的SMTP服务存在拒绝服务漏洞。远程攻击者无需认证即可与目标服务器建立连接，发送一系列特制的ETRN命令后立即断开连接，而Sendmail服务器会持续处理这些已断开连接的命令请求，导致系统资源被大量消耗，最终造成邮件服务不可用。"
severity = "MEDIUM"
score = 5.0
sources = ["tenable"]
published = "1999-12-22"
updated = "2026-06-16"
remediation = "升级Sendmail至8.10.1或更高版本，该版本已修复ETRN命令处理异常导致的资源泄露问题。"

