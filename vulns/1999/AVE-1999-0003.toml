[basic]
description = "University of Washington imapd 以及 Netscape Messaging Server 中的 IMAP 服务在处理 AUTHENTICATE 命令时存在缓冲区溢出漏洞。mechanism 参数被复制到仅 1024 字节的栈缓冲区中，但最大输入可达 8192 字符，导致栈溢出。远程攻击者可利用此漏洞以 root 权限执行任意代码。"
published = "1998-07-20"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nvd"
sources = ["unknown"]
title = "Netscape Messaging Server 3.55 & University of Washington imapd 10.234 IMAP AUTHENTICATE 命令缓冲区溢出漏洞"
