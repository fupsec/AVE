[basic]
description = "Debian GNU/Linux 系统中的 cfengine 软件包存在符号链接（symlink）安全漏洞。cfengine 是一款自动化配置管理工具，在运行过程中会以可预测的方式创建临时文件。本地攻击者可以利用此漏洞，通过创建恶意的符号链接指向系统中其他敏感文件，从而在 cfengine 以特权身份运行时触发文件覆盖或信息泄露。该漏洞影响 Debian GNU/Linux 2.0 版本，攻击者需要本地访问权限，利用复杂度较低，可能导致部分机密信息被未授权读取。"
published = "1999-02-16"
remediation = "升级 cfengine 软件包至包含安全修复的最新版本，避免使用可预测的临时文件名，确保临时文件创建在受限目录中。"
score = 2.1
severity = "LOW"
sources = [
    "nvd",
    "cve",
]
title = "Debian GNU/Linux cfengine 软件包符号链接攻击漏洞"
updated = "2026-06-16"

