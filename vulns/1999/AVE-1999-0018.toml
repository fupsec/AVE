[basic]
description = "CVE-1999-0016又名LAND攻击，是存在于多种TCP/IP协议栈实现中的拒绝服务漏洞。攻击者通过向目标发送源地址和目标地址相同的特制TCP SYN数据包（源端口等于目的端口），触发目标系统内核TCP/IP协议栈进入无限循环处理状态，导致系统完全挂起或蓝屏崩溃。受影响的系统包括Windows 95/NT 4.0/XP SP2/Server 2003、HP-UX 9/10/11、FreeBSD 2.x、NetBSD 1、Linux Kernel 2.0.3、多个Cisco IOS设备及Catalyst交换机等。此漏洞在Windows Server 2003和XP SP2上需要TCP和IP校验和正确才能触发。"
published = "1997-12-01"
remediation = "各厂商已发布对应补丁或升级版本修复此漏洞。Windows用户应安装最新安全更新；HP-UX用户升级至11.11及以上版本；Linux用户升级内核至2.0.4或更高版本；Cisco设备用户升级IOS至修复版本。建议在网络边界部署防火墙过滤源地址与目标地址相同的异常数据包。"
score = 5.0
severity = "MEDIUM"
sources = [
    "exploitdb",
    "nvd",
]
title = "TCP LAND攻击导致多操作系统拒绝服务漏洞"
updated = "2026-06-16"

