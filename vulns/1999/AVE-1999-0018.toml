[basic]
description = "Netmanager Chameleon SMTPd 组件存在多个缓冲区溢出漏洞，攻击者可通过向 SMTP 服务发送特制请求触发缓冲区溢出，导致服务进程崩溃，造成拒绝服务。该漏洞影响 Netmanager Chameleon 系列产品，远程攻击者无需认证即可利用该漏洞，具有低攻击复杂度。"
published = "1999-03-01"
remediation = "建议升级 Netmanager Chameleon 至最新版本，或在网络层面限制对 SMTP 服务的访问，仅允许可信 IP 连接以降低被利用风险。"
score = 5.0
