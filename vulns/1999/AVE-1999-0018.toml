[basic]
title = "SGI IRIX df命令缓冲区溢出漏洞导致本地权限提升"
description = "SGI IRIX 5.x和6.x系统中的df命令存在缓冲区溢出漏洞。攻击者通过向df命令的-f选项提供超长参数触发缓冲区溢出，精心构造的包含MIPS机器代码的缓冲区可导致任意代码执行，从而获取root权限。该漏洞允许本地用户利用df程序中的内存破坏缺陷，以root权限执行任意命令。"
severity = "HIGH"
score = 7.2
remediation = "升级SGI IRIX系统至厂商修复版本，安装最新的安全补丁。限制本地用户对df命令的访问权限，遵循最小权限原则降低风险。"
published = "1997-07-16"
updated = "2026-06-16"
sources = ["nvd", "exploitdb"]

