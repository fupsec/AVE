[basic]
description = "Land攻击是一种经典的拒绝服务攻击方式，攻击者向目标系统发送精心构造的TCP SYN数据包，其中源IP地址和端口与目标IP地址和端口完全相同。目标系统收到该数据包后会尝试与自己建立连接，导致系统崩溃、重启或停止响应。该漏洞影响FreeBSD 2.x、HP-UX 9/10/11、Linux Kernel 2.0.3、Windows NT 4.0/Server 2003、NetBSD 1等多款操作系统。"
published = "1997-12-01"
remediation = "升级操作系统至已修复该漏洞的版本，或安装厂商提供的安全补丁；对于无法升级的系统，可在网络边界部署入侵检测系统过滤源IP与目标IP相同的TCP SYN数据包。"
score = 5.0
severity = "MEDIUM"
sources = [
    "nvd",
    "exploitdb",
]
title = "Land IP拒绝服务攻击（Land Attack）影响多款操作系统"
updated = "2004-01-01"

