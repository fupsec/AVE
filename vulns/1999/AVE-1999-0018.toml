[basic]
title = "SGI IRIX df命令缓冲区溢出本地提权漏洞"
description = "SGI IRIX操作系统的df命令存在缓冲区溢出漏洞，影响IRIX 5.x和6.x版本。攻击者通过向df命令的-f选项传入超长字符串参数，可触发缓冲区溢出导致程序崩溃。经过精心构造包含可执行机器码的缓冲区，攻击者可在目标系统上以root权限执行任意命令，实现本地权限提升。该漏洞无需认证，仅需本地访问权限即可利用，成功利用后将获得完整的系统控制权。"
published = "1997-07-16"
updated = "2024-08-01"
remediation = "SGI已发布安全补丁修复此漏洞，请联系SGI获取并安装相应的安全补丁。在无法立即打补丁的情况下，建议对df命令设置wrapper程序限制命令行参数长度（MAXARGLEN设为32），并限制本地用户对df命令的访问权限。同时可使用host-based入侵检测系统监控异常行为。对于不再维护的IRIX系统，建议迁移到现代受支持的操作平台。"
score = 7.2
