[basic]
title = "SGI IRIX df命令缓冲区溢出本地提权漏洞"
description = "SGI IRIX系统中的df命令存在缓冲区溢出漏洞。由于df程序默认以setuid root权限安装，且对用户输入参数（特别是-f选项）缺乏边界检查，本地攻击者可通过构造超长参数覆盖程序栈空间，注入并执行任意shellcode，从而获取root权限。该漏洞影响IRIX 5.0至6.4等多个版本。"
severity = "HIGH"
score = 7.2
cvss_v2 = "AV:L/AC:L/Au:N/C:C/I:C/A:C"
published = "1997-07-16"
updated = "2026-04-16"
remediation = "立即移除df程序的setuid权限：执行 chmod 500 /sbin/df。如需非root用户使用df功能，可部署AUSCERT提供的溢出包装器（overflow_wrapper），该包装器会检查命令行参数长度并阻止超长参数执行。等待厂商发布正式补丁后及时升级。"
sources = ["nvd", "exploitdb", "bugtraq", "auscert"]

