[basic]
title = "Sun Solaris及其他UNIX系统 ToolTalk RPC服务缓冲区溢出漏洞"
description = "ToolTalk数据库服务器（rpc.ttdbserverd）在处理RPC请求时存在缓冲区溢出漏洞，远程攻击者无需认证即可通过特制RPC数据包触发溢出，实现以root权限执行任意命令。该漏洞影响Sun Solaris 2.5.1、SGI IRIX、Xi Graphics Maximum CDE 1.2.3及TriTeal TED CDE 4.3等多种UNIX操作系统，是早期互联网上最常被利用的远程溢出漏洞之一。"
severity = "CRITICAL"
score = 10.0
remediation = "及时安装操作系统厂商提供的安全补丁，禁用不必要的ToolTalk RPC服务或通过防火墙限制对rpc.ttdbserverd端口的访问。"
published = "1998-04-01"
updated = "2026-06-16"
sources = ["exploitdb"]

