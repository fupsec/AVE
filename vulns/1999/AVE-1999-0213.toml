[basic]
title = "Apache HTTP Server Win32 目录遍历漏洞"
description = "Apache HTTP Server 的 Windows (Win32) 版本存在路径遍历漏洞。攻击者通过在请求的 URL 末尾追加一个点号（.）即可绕过访问控制，读取服务器上的受限文件。该漏洞利用了 Windows 文件系统忽略文件名末尾点号的特性，使得原本被访问限制保护的文件（如 .htaccess 配置、CGI 脚本源码等）可以被未授权访问。攻击者无需认证即可远程利用此漏洞，获取敏感配置信息或源代码，为后续攻击提供便利条件。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = "AV:N/AC:L/Au:N/C:P/I:N/A:N"
published = "1999-09-29"
updated = "2024-08-01"
sources = ["cve", "nvd", "ghsa"]
remediation = "升级 Apache HTTP Server 至 1.3.10 或更高版本，该版本修复了 Windows 平台的路径遍历问题。若暂时无法升级，可通过 Apache 配置文件中的 AllowOverride 指令限制目录访问权限，或使用 RewriteRule 过滤包含末尾点号的 URL 请求。建议在 Windows 服务器前部署反向代理或 Web 应用防火墙，对异常 URL 进行过滤和拦截。"

