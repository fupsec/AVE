[basic]
title = "NFS mountd 缓冲区溢出漏洞"
description = "NFS mountd（rpc.mountd）的日志记录代码存在缓冲区溢出，远程攻击者可通过发送特制的 RPC 请求触发溢出，从而获取 root 权限。主要影响 Linux 系统（如 Red Hat Linux 5.1、Caldera OpenLinux Standard 1.2）以及 SGI IRIX 等运行 NFS 服务器的系统。"
severity = "CRITICAL"
source = "nvd"
published = "1998-10-12"
updated = "2026-06-16"

