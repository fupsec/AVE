[remediation]
fix = "升级 NFS 服务器软件包到修复版本。参考各厂商安全公告。"
workaround = "如无法升级，可在防火墙上限制对 RPC 服务（端口 111/TCP/UDP 和 2049/TCP/UDP）的访问，或禁用 NFS 服务。"

