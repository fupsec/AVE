[basic]
description = "Windows NT操作系统中，核心系统DLL被保存在虚拟内存中并由运行中的程序共享。操作系统通过KnownDLLs列表确定DLL在虚拟内存中的位置。默认情况下所有用户均可读写KnownDLLs列表，本地用户可通过将恶意DLL加载到内存并修改KnownDLLs列表指向该恶意副本，从而在具有足够权限的程序调用系统DLL时执行任意操作，包括将用户添加到管理员组。该漏洞影响Windows NT Workstation 4.0、Server 4.0及Terminal Server Edition。"
published = "1999-02-20"
remediation = '安装微软MS99-006安全公告提供的热修复补丁，该补丁将KnownDLLs列表的默认权限修改为只读。也可通过注册表修改启用更强的系统基对象保护：将HKLM\System\CurrentControlSet\Control\Session Manager下ProtectionMode设为REG_DWORD值1。建议优先使用热修复补丁方案。'
score = 4.6
severity = "MEDIUM"
sources = [
    "cve",
    "nvd",
    "microsoft",
]
title = "Microsoft Windows NT KnownDLLs列表漏洞导致本地权限提升"
updated = "1999-02-20"

