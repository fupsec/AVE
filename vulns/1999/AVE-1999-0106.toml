[basic]
description = "Windows 95 和 Windows 98 系统中遗留的凭据缓存机制存在安全漏洞，攻击者可以通过该漏洞读取明文形式的网络密码。该漏洞影响所有未打补丁的 Windows 95 和 Windows 98 系统，攻击者无需身份验证即可通过网络远程获取用户的网络凭据，导致敏感信息泄露。"
published = "1999-11-29"
remediation = "微软已发布安全公告 MS99-052 提供修复补丁，建议用户升级到 Windows 更高版本或应用相应的安全更新来修复此漏洞。"
