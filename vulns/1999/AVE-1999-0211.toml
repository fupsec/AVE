[basic]
description = "Microsoft SMTP 服务在处理邮件投递时，当目标服务器返回 4xx 临时错误码后，会快速且重复地尝试重新投递该邮件，导致大量系统资源被消耗，从而造成拒绝服务。攻击者可利用此漏洞通过远程发送触发 4xx 响应的邮件，使邮件服务不可用。"
published = "1999-03-01"
remediation = "建议升级至受支持的最新版本，或配置 SMTP 服务限制同一邮件的重试次数和重试间隔时间，避免因连续重试导致资源耗尽。"
score = 5.0
severity = "MEDIUM"
sources = [
    "nvd",
    "cve",
]
title = "Microsoft SMTP 服务拒绝服务漏洞"
updated = "2026-06-16"

