[basic]
description = "IBM AIX 4.2.1 操作系统中 /usr/bin/portmir 命令存在多种安全漏洞，包括本地缓冲区溢出和不安全的临时文件创建。本地攻击者可以利用这些漏洞执行任意代码，获取 root 权限，完全控制受影响的系统，造成机密性、完整性和可用性的完全丧失。"
published = "1997-10-29"
remediation = "建议升级到 IBM AIX 的修复版本，或安装 IBM 提供的安全补丁。由于此漏洞较旧，建议升级到受支持的 AIX 版本并应用最新的安全更新。"
score = 7.2
severity = "HIGH"
sources = [
    "nvd.nist.gov",
    "exploit-db",
]
title = "IBM AIX 4.2.1 portmir 命令本地缓冲区溢出与权限提升漏洞"
