[basic]
description = "PHP/FI（PHP/FI 1.0、2.0及2.0 b10版本）中的mylog和mlog示例脚本存在任意文件读取漏洞。由于脚本未对文件路径参数进行有效过滤，远程攻击者可通过向mylog.html或mlog.html脚本传递精心构造的文件路径参数，读取服务器上任意文件，导致敏感信息泄露。"
published = "1997-10-19"
remediation = "升级到PHP/FI 3.0或更高版本，或删除mylog.html和mlog.html脚本文件。建议停止使用生命周期已终结的PHP/FI系列版本，迁移至现代受支持的PHP版本。"
score = 7.5
severity = "HIGH"
