[basic]
description = "SGI IRIX 操作系统的 /bin/login 程序中存在本地缓冲区溢出漏洞。当 LOCKOUT 参数设置为非零值时，攻击者可通过特制的参数调用 execle 触发栈溢出，从而获取 root 权限或破坏系统文件。该漏洞影响 IRIX 5.0 至 6.4 版本，攻击者需要本地访问权限，无需身份认证即可利用。"
published = "1997-05-26"
remediation = "建议访问 SGI 安全公告 ftp://patches.sgi.com/support/free/security/advisories/19970508-02-PX 下载并安装官方补丁。对于已停止支持的 IRIX 版本，建议迁移至受支持的操作系统。"
score = 8.4
severity = "HIGH"
sources = [
    "exploitdb",
    "nvd",
]
title = "SGI IRIX /bin/login 本地缓冲区溢出漏洞"
