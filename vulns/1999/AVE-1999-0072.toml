[basic]
description = "SGI IRIX 操作系统的 /bin/login 程序在处理非零 LOCKOUT 参数时存在本地缓冲区溢出漏洞。攻击者通过向 /bin/login 传入特制的 -h 参数，可以触发栈缓冲区溢出并覆盖返回地址，从而以 root 权限执行任意代码，导致系统完全受控。受影响版本包括 IRIX 5.0 至 6.4。"
published = "1997-05-26"
remediation = "需安装 SGI 安全公告 19970508-02-PX 提供的补丁程序，或升级到修复该漏洞的 IRIX 版本。由于 SGI IRIX 已停止支持，建议迁移至其他操作系统。"
score = 8.4
severity = "HIGH"
sources = [
    "nvd.nist.gov",
    "exploit-db",
]
title = "SGI IRIX /bin/login 本地缓冲区溢出漏洞"
