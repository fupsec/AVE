[basic]
description = "Netscape Messaging Server 3.55 与 University of Washington imapd 10.234 的 IMAP 服务中存在缓冲区溢出漏洞。远程攻击者可通过向 IMAP 认证（authenticate）命令发送特制的超长请求，触发缓冲区溢出，从而在目标系统上以邮件服务器进程权限执行任意命令。该漏洞可被远程利用，无需身份认证，影响范围广泛。"
published = "1998-07-20"
remediation = "厂商已发布 Sun Security Bulletin 177 修复该漏洞。建议用户升级 Netscape Messaging Server 至最新版本，或应用 Sun 提供的补丁程序。对于 UW imapd，建议升级至 10.235 及以上版本。"
score = 10.0
severity = "CRITICAL"
sources = [
    "nvd",
    "exploitdb",
]
title = "Netscape Messaging Server 3.55 及 UW imapd 10.234 IMAP 认证命令缓冲区溢出漏洞"
