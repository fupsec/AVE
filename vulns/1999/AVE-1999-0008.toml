[basic]
  title = "CDE dtappgather 程序符号链接漏洞导致本地权限提升"
  description = "由于不当的权限检查，CDE 桌面环境中的 dtappgather 程序允许本地攻击者通过符号链接攻击或设置 DTUSERSESSION 环境变量覆盖任意文件权限，从而获取提升的权限。受影响系统包括 HP HP-UX 10.20/11.0、IBM AIX 4.3、SCO Unixware 7.0 和 Sun Solaris 2.6。"
  severity = "HIGH"
  source = "nvd"
