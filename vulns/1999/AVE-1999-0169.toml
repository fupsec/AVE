[basic]
description = "Perl 4.x及5.x版本中的suidperl（sperl）组件存在缓冲区溢出漏洞。本地攻击者可利用此漏洞通过精心构造的输入触发缓冲区溢出，从而获取受影响系统的root权限。该漏洞影响BSD/OS 2.1/3.0、RedHat 4.0/4.1、SGI Freeware 1.0/2.0及Larry Wall Perl 5.003等多个平台和发行版本。"
published = "1997-05-29"
remediation = "升级至Perl 5.004或更高版本，该版本修复了suidperl组件中的缓冲区溢出问题。如无法升级，建议移除suidperl的setuid权限或禁用suidperl功能。"
score = 7.2
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
]
title = "Perl suidperl (sperl) 本地缓冲区溢出漏洞"
