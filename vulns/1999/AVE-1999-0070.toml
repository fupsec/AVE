[basic]
description = "Unix系统中存在进程表攻击漏洞，远程攻击者可通过向网络服务发起大量连接，耗尽目标机器的进程表资源，导致系统无法处理新的服务请求，从而引发拒绝服务（DoS）状况。该攻击利用Unix系统进程表容量有限的特点，通过发送大量连接请求填满进程表空间。"
published = "1999-02-22"
remediation = "建议限制单个IP的并发连接数，配置防火墙规则过滤异常流量，及时应用操作系统厂商发布的安全补丁，并监控系统进程表使用情况以发现异常。"
score = 5.0
severity = "MEDIUM"
