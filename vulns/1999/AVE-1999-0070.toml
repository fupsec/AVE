[basic]
description = "SGI IRIX 5.3 至 6.2 版本系统中 ordist 命令存在缓冲区溢出漏洞，攻击者可通过向 ordist 的 -d 选项传递特制参数，触发缓冲区溢出，覆盖返回地址并执行任意代码，从而获取系统的 root 权限。攻击需要本地访问系统。"
published = "1997-07-16"
