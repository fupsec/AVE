notes = "1996年的古老漏洞，rpc.statd 基于 ONC RPC/SunRPC 协议（非 HTTP），不具备 HTTP PoC 生成条件。未在 GitHub、Exploit-DB、PacketStorm 等渠道找到单独标为 CVE-1999-0019 的 PoC/EXP 仓库或条目。该漏洞曾被 Ramen 蠕虫用于传播。"
poc_confidence = "low"

[basic]
description = "Solaris 系统中 rpc.statd（NFS 状态监控守护进程）存在输入验证缺陷，远程攻击者可通过发送特制 RPC 请求创建或删除任意系统文件，导致系统完整性受损。该漏洞曾被 Ramen 蠕虫利用。"
published = "1996-04-24"
remediation = "Refer to vendor advisory and upgrade to fixed version."
