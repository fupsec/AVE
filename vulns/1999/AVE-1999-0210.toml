[basic]
  title = "Sun Solaris rpc.statd 文件创建/删除漏洞"
  description = "Solaris 系统中 rpc.statd 服务存在输入验证缺陷，远程攻击者可通过发送特制 RPC 请求创建或删除系统文件，导致系统完整性受损。"
