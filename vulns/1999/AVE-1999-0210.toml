[remediation]
fix = "升级到 Sun 安全公告中指定的修复版本。参考 http://sunsolve.sun.com/pub-cgi/retrieve.pl?doctype=coll&doc=secbull/135"
workaround = "禁用 rpc.statd 服务或限制对 RPC 端口（111）的访问，使用防火墙过滤来自不可信网络的 RPC 流量。"
steps = ["步骤1: 确认系统运行 Solaris 且 rpc.statd 服务已启用", "步骤2: 应用 Sun 提供的安全补丁", "步骤3: 如无法升级，在防火墙上限制对 RPC 端口的访问"]

