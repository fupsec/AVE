poc_confidence = "low"
notes = "1996年的古老漏洞，rpc.statd 基于 ONC RPC/SunRPC 协议（非 HTTP），不具备 HTTP PoC 生成条件。未在 GitHub、Exploit-DB、PacketStorm 等渠道找到单独标为 CVE-1999-0019 的 PoC/EXP 仓库或条目。该漏洞曾被 Ramen 蠕虫用于传播。"

