[basic]
title = "Teardrop IP分片重组拒绝服务漏洞"
description = "Teardrop是一种经典的IP分片拒绝服务攻击，通过向目标系统发送两个特制的IP分片数据包实现。第一个分片偏移量为0且MF标志位置位，第二个分片偏移量为正值但小于第一个分片的数据长度，导致TCP/IP协议栈在重组时产生重叠。目标系统会分配异常大的内存资源用于分片重组，最终因内存耗尽而冻结或重启。该漏洞影响包括Linux内核、Microsoft Windows 95/NT 4.0/NT 3.5.1以及HP HP-UX 10.34在内的多种操作系统。攻击者无需认证即可通过网络远程触发，造成目标系统不可用。"
severity = "MEDIUM"
score = 5.0
remediation = "建议升级操作系统至修复版本以解决IP分片处理缺陷。Windows NT 4.0用户应安装Service Pack 4及以上版本，Windows 95用户安装Winsock 2更新，Linux用户升级内核至修复版本，HP-UX用户安装最新补丁集。在网络层面可部署入侵检测系统拦截异常IP分片包。"
published = "1997-12-16"
updated = "2026-06-16"
sources = ["exploitdb", "nvd"]

