[basic]
title = "Teardrop IP 分片拒绝服务漏洞"
description = "Teardrop IP 拒绝服务漏洞。通过发送两个或更多特制的 IP 分片数据包，利用多个厂商 TCP/IP 协议栈在分片重组时的缺陷，导致目标系统因内存不足而冻结或重启。影响 HP-UX 10.34、Microsoft Windows 95、Windows NT 3.5.1、Windows NT 4.0 等多个操作系统。"
severity = "MEDIUM"
source = "nvd"
published = "1997-12-16"
updated = "2026-06-16"

