[remediation]
fix = "升级到受影响操作系统的最新版本，应用厂商安全补丁。Microsoft 已发布安全公告，HP 已发布 HP-UX 补丁。"
workaround = "在防火墙或网络边界设备上阻止 IP 分片数据包，或部署入侵检测系统（IDS）检测 Teardrop 攻击特征（重叠 IP 分片偏移）。"
steps = ["步骤1: 确认操作系统版本", "步骤2: 安装厂商提供的安全更新补丁", "步骤3: 在网络边界配置防火墙规则，限制或监控 IP 分片流量"]

