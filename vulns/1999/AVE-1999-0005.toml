[basic]
title = "Windows NT RAS/PPTP 远程拒绝服务漏洞"
description = "Windows NT 系统中的远程访问服务（RAS）和 PPTP 协议实现存在拒绝服务漏洞。远程攻击者无需认证即可通过网络发送特制数据包，导致 RAS/PPTP 服务崩溃或停止响应，从而中断 VPN 和远程访问连接服务。该漏洞影响 Windows NT 4.0 及此前版本。"
severity = "MEDIUM"
source = "nvd"
published = "1999-06-30"
updated = "2024-11-20"

