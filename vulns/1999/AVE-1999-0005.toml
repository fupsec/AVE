[basic]
description = "该漏洞存在于 RedHat Linux 5.1 及 Caldera OpenLinux Standard 1.2 的 mountd 服务中。攻击者可以通过向 mountd 端口发送精心构造的恶意请求，触发缓冲区溢出漏洞，从而在目标系统上执行任意代码，导致远程代码执行或系统崩溃。"
published = "1999-01-01"
remediation = "建议管理员及时更新受影响的 RedHat Linux 及 Caldera OpenLinux 系统至官方修复版本，或通过防火墙限制对 mountd 端口的外部访问。"
score = 9.8
severity = "CRITICAL"
sources = ["exploitdb"]
title = "RedHat Linux Mountd 远程溢出漏洞"
