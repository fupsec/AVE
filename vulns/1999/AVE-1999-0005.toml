[remediation]
fix = "微软已发布安全补丁修复此问题。由于 Windows NT 已停止支持，建议升级到受支持的 Windows 版本（如 Windows Server 2016/2019/2022 或 Windows 10/11）。"
workaround = "在网络边界防火墙处限制对 PPTP 端口（TCP 1723）和 RAS 相关端口的访问，仅允许已知可信 IP 地址连接。"
steps = ["步骤1: 在网络防火墙上限制 TCP 端口 1723（PPTP）的入站访问", "步骤2: 如不需要远程访问服务，在服务管理器中禁用 RAS 服务", "步骤3: 升级到受支持的 Windows 版本以获取持续安全更新"]

