[basic]
title = "Microsoft Windows NT RAS/PPTP 远程拒绝服务漏洞"
description = "Windows NT 系统的远程访问服务（RAS）和点对点隧道协议（PPTP）存在安全漏洞，远程攻击者无需认证即可通过网络发送特制数据包，导致目标系统 RAS/PPTP 服务崩溃或无法响应正常请求，造成拒绝服务。该漏洞影响 Windows NT 操作系统，攻击条件低，无需用户交互。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = 5.0
remediation = "建议升级至微软官方修复版本或安装安全补丁，如果无法升级则应在防火墙中限制对 RAS/PPTP 端口的访问以降低风险。"
published = "1999-06-30"
