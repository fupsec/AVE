[basic]
title = "ISC BIND 逆查询远程缓冲区溢出漏洞"
description = "ISC BIND（域名系统服务软件）在处理逆查询（IQUERY）请求时存在缓冲区溢出漏洞。攻击者可通过向目标DNS服务器发送特制的逆查询数据包，触发内存拷贝过程中的边界检查缺陷，造成缓冲区溢出，从而在目标系统上执行任意代码。该漏洞影响BIND 4.9和BIND 8系列版本，是影响极为广泛的经典远程代码执行漏洞，多个操作系统平台均受波及。"
severity = "CRITICAL"
score = 10.0
sources = ["exploitdb"]
published = "1998-04-08"
updated = "2026-06-16"
remediation = "升级至BIND 8.2.1及以上版本，或从ISC官方网站下载修复后的版本；同时建议在网络边界限制对DNS服务器的外部访问以减少攻击面。"

