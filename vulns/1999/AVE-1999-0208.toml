[remediation]
fix = "安装 Sun 补丁 ID 103291 或升级到修复版本。参考 Sun 安全公告。"
workaround = "限制 syslog 服务的网络访问，仅允许受信任的主机发送 syslog 消息；或在防火墙上过滤 UDP 514 端口的入站流量。"
steps = ["步骤1: 确认 Solaris 系统版本", "步骤2: 从 SunSolve 下载并安装补丁 103291", "步骤3: 重启 syslogd 服务使补丁生效"]

