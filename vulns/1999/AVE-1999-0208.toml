notes = "CVE-1999-0223 是 Solaris 2.4/SunOS 5.4 syslogd 的拒绝服务漏洞，年代久远（1999年）。无公开 PoC/EXP 可用。属于非 HTTP 协议漏洞（syslog UDP 协议），无法生成 HTTP PoC 脚本。"
poc_confidence = "none"

[basic]
description = "Solaris syslogd 在处理来自没有反向 DNS 记录的主机的消息时会崩溃，导致拒绝服务。攻击者可通过发送构造的 syslog 消息到目标主机的 syslogd 服务，由于 syslogd 在反向 DNS 查询失败时未正确处理空指针，导致进程崩溃。"
published = "1999-03-01"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 3.5
severity = "LOW"
source = "cve"
sources = ["unknown"]
title = "Solaris syslogd 反向 DNS 查询拒绝服务漏洞"
