title = "Linux 2.2.x 内核 ICMP 报文拒绝服务漏洞"
description = "Linux 2.2.x 内核存在拒绝服务漏洞，远程攻击者可通过发送包含异常类型、代码和 IP 头长度的畸形 ICMP 报文，导致目标系统内核崩溃或服务不可用，影响系统的正常运行。攻击者无需认证即可远程触发该漏洞。"
severity = "MEDIUM"
