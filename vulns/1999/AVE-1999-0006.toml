[affected]
product = "Multiple Unix Systems (IBM AIX 3.2/4.1, SCO Unixware 7.1.1, SGI IRIX 5.3, Sun Solaris 2.4/2.5/2.5.1)"
vendor = "Multiple"

[authenticity]
cve_confidence = "high"
notes = "Exploit-DB 19104 提供了完整的可编译 C 语言利用程序源代码，针对 Solaris 2.5.1 x86 平台。该漏洞影响多种 Unix 操作系统。statd 采用 RPC 协议非 HTTP 协议，无法生成符合 poc.md 规范的 HTTP 类型 PoC 脚本。"
poc_confidence = "high"

[basic]
description = "Buffer overflow in statd allows root privileges。statd 是 RPC NFS 状态守护进程，用于与其他服务或主机通信状态信息。多个 Unix 实现中随附的 statd 版本在处理 'SM_MON' RPC 请求时存在缓冲区溢出漏洞，攻击者可通过发送特制的 RPC 请求触发溢出，从而获得目标主机的 root 权限。"
published = "1997-12-05"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nvd"
title = "statd RPC NFS 状态守护进程缓冲区溢出漏洞"
updated = "2026-06-16"

