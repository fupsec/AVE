[basic]
title = "statd RPC 状态守护进程缓冲区溢出漏洞"
description = "IBM AIX 3.2/4.1、SCO Unixware 7.1.1、SGI IRIX 5.3、Sun Solaris 2.5.1 等多种 Unix 系统中的 statd（RPC NFS 状态守护进程）存在缓冲区溢出漏洞。远程攻击者通过向 SM_MON RPC 请求发送特制数据，可触发缓冲区溢出，从而在目标系统上以 root 权限执行任意命令。"
severity = "CRITICAL"
source = "nvd"
