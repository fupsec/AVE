[remediation]
fix = "升级到受影响操作系统厂商提供的修复版本。参考各厂商安全公告。"
workaround = "在无法升级的环境中，可通过防火墙限制对 RPC portmap（111/TCP,UDP）和 statd 端口的访问，仅允许可信主机连接。"
steps = ["步骤1: 确认受影响的 Unix 系统版本", "步骤2: 联系厂商获取安全补丁并升级 statd 服务", "步骤3: 在防火墙层面限制对 RPC 服务的访问"]

