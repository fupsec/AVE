[basic]
description = "NFS mountd 守护进程（rpc.mountd）在处理 mount 请求时存在缓冲区溢出漏洞。远程攻击者可以向目标系统发送特制的畸形 mount RPC 请求，导致 mountd 的日志记录代码发生缓冲区溢出，从而以 root 权限在受影响的 Linux 系统上执行任意代码。该漏洞主要影响 RedHat Linux 5.1 和 Caldera OpenLinux Standard 1.2 等运行 nfs-server-2.2beta29 的系统，即使 NFS 服务器未共享任何文件系统也可被利用。"
published = "1998-10-12"
remediation = "升级 NFS 服务程序至修补后的版本。RedHat 和 Caldera 官方已发布补丁，建议从 ftp://ftp.redhat.com 获取并更新 nfs-server 软件包。对于无法立即升级的系统，建议禁用 NFS 服务或使用防火墙限制对 mountd（端口 635 和 111）的访问。"
score = 10.0
severity = "CRITICAL"
sources = [
    "NVD",
    "exploitdb",
    "SecurityFocus",
]
title = "NFS mountd 缓冲区溢出漏洞（RedHat Linux 5.1 / Caldera OpenLinux 1.2）"
updated = "1998-10-12"

