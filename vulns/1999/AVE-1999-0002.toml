[basic]
title = "Sendmail decode 别名远程文件覆盖漏洞"
description = "Sendmail decode 别名功能存在安全漏洞，远程攻击者可通过向 decode 别名发送邮件，将邮件内容传递给程序执行，从而覆盖系统敏感文件。"
severity = "MEDIUM"
source = "nvd"
published = "1996-12-10"
