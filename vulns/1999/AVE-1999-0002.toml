[basic]
title = "Sendmail decode 别名远程覆盖敏感文件漏洞"
description = "Sendmail 的 decode 别名功能存在安全漏洞，远程攻击者可通过向该别名发送邮件，将邮件内容通过管道传递给程序，从而覆盖系统上的敏感文件，导致系统完整性受损。该漏洞影响默认配置的 Sendmail 邮件服务器。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = 5.0
remediation = "将 /etc/aliases 中的 decode 条目删除或注释掉，然后运行 newaliases 命令重建别名数据库，防止邮件通过管道传递给非法程序。"
published = "1996-12-10"
updated = "2026-06-16"
sources = ["tenable", "nvd"]

