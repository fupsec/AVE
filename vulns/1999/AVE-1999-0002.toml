[remediation]
fix = "移除 /etc/aliases 中的 decode 条目，并重启 Sendmail 服务。"
workaround = "如无法立即升级，可临时禁用 decode 别名，移除 /etc/aliases 中 decode 条目后执行 newaliases 命令。"
steps = ["步骤1: 编辑 /etc/aliases 文件", "步骤2: 移除或注释包含 decode 的行", "步骤3: 执行 newaliases 命令使配置生效", "步骤4: 重启 Sendmail 服务"]

