[basic]
title = "Sendmail decode 别名远程命令执行漏洞"
description = "Sendmail 中的 decode 别名存在安全缺陷。远程攻击者可通过向目标服务器的 decode 别名发送邮件，将包含 uuencode 编码附件的邮件通过管道传递给程序处理，从而覆盖系统敏感文件（如 /etc/passwd），可能导致完全系统入侵。该漏洞影响所有启用 decode 别名的 Sendmail 版本。"
severity = "MEDIUM"
source = "tenable"
published = "1996-12-10"
updated = "2026-06-16"

