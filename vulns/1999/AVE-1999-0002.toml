[basic]
description = "Windows Internet 命名服务(WINS)存在安全漏洞，远程攻击者可通过发送恶意的1Ch注册请求，导致WINS将域控制器指向恶意服务器，从而造成网络连接丢失或窃取用户凭据。该问题在使用Windows 95/98客户端或主域控制器不可用的情况下可能受到限制。"
published = "2009-01-14"
remediation = "建议升级到受支持的Windows Server版本，并安装最新的安全更新。如果不需要WINS服务，建议禁用以减少攻击面。对于仍在使用Windows 95/98/2000的环境，应尽快迁移到受支持的操作系统版本。"
score = 7.6
severity = "HIGH"
sources = ["nvd"]
title = "Microsoft Windows Internet 命名服务(WINS)拒绝服务漏洞"
updated = "2009-01-15"

