[remediation]
fix = "删除 /etc/aliases 或 /etc/mail/aliases 中的 decode 别名条目，然后运行 newaliases 命令重建别名数据库。升级到 Sendmail 8.9 及以上版本（默认禁用 decode 别名）。"
workaround = "如无法升级，在网络边界防火墙处限制对 SMTP 端口（TCP 25）的访问，仅允许已知可信邮件服务器连接。限制系统关键文件的写入权限。"
steps = ["步骤1: 编辑 /etc/aliases 文件，删除或注释 decode 别名行", "步骤2: 运行 newaliases 命令重建别名数据库", "步骤3: 重启 sendmail 服务使更改生效", "步骤4: 升级到 Sendmail 8.9 及以上版本"]

