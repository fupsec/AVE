[basic]
title = "Microsoft Windows NT 屏幕保护程序权限提升漏洞"
description = "Windows NT 的屏幕保护程序在锁定系统后未能正确验证其安全上下文是否已更改，攻击者可以利用此漏洞在系统上以提升的权限运行程序。该漏洞影响 Windows NT 3.5.1 及 4.0 多个版本，本地攻击者可通过特定操作绕过屏幕保护限制，获取系统最高权限执行任意代码。"
severity = "HIGH"
score = 7.2
sources = ["cve"]
published = "1999-03-12"
updated = "2026-06-16"
remediation = "升级到 Windows NT 最新版本并安装 Microsoft 安全公告 MS99-008 提供的安全补丁，同时限制本地用户对系统的物理访问权限。"

