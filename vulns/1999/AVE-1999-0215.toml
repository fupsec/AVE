[basic]
description = "Linux syslogd 在处理大量网络连接时存在拒绝服务漏洞。远程攻击者可向 syslogd 服务发送大量连接请求，导致服务资源耗尽而崩溃，无法正常记录系统日志。受影响的系统包括 Caldera OpenLinux 和 Red Hat Linux 等发行版。"
published = "1999-11-18T00:00:00Z"
remediation = "升级 Caldera OpenLinux 或 Red Hat Linux 到包含 syslogd 补丁的最新版本。限制对 syslogd 服务端口（514/UDP）的网络访问，通过防火墙规则仅允许可信来源的连接请求，避免暴露服务到不可信网络。"
score = 5.0
severity = "MEDIUM"
sources = ["redhat"]
title = "Linux syslogd 远程拒绝服务漏洞"
updated = "2026-06-16T00:00:00Z"

