[basic]
description = "SGI IRIX 5.3/6.2 系统中 ordist 命令存在缓冲区溢出漏洞，攻击者可通过向 -d 选项提供特制的超长参数触发溢出，从而获取 root 权限。该漏洞影响所有 SGI IRIX 5.x 和 6.x 系列系统，本地用户可利用此漏洞实现权限提升。"
published = "1997-07-16"
remediation = "升级 SGI IRIX 系统至最新安全补丁版本，或限制 ordist 命令的本地用户访问权限。"
