[remediation]
fix = "移除 bugfiler 二进制文件的 SUID 位，或限制本地用户直接执行 bugfiler。建议参考 IBM 官方安全公告。"
steps = [
    "步骤1: 检查系统是否存在 /lib/bugfiler 文件",
    "步骤2: 移除 SUID 权限: chmod u-s /lib/bugfiler",
    "步骤3: 评估是否需要保留 bugfiler 功能，如不需要则直接删除",
]
workaround = "如无法立即修复，可通过以下方式缓解：1. 移除 /lib/bugfiler 的 SUID 权限（chmod u-s /lib/bugfiler）；2. 限制本地用户对 bugfiler 的访问；3. 监控是否有来自 bugfiler 的异常邮件（邮件来源为 <bugs@...>）。"

