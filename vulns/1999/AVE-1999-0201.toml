[basic]
description = "Cray UNICOS 9.0/9.2及MAX 1.3/mk 1.5、AIX 4.2及更早版本、Linux libc 5.2.18及更早版本、RedHat 4.0、IRIX 6.2、Slackware 3.1等多款UNIX操作系统中的Natural Language Service（NLS）组件存在缓冲区溢出漏洞。NLS用于自定义系统的自然语言格式，包括语言、货币符号、数字分隔符和时间格式等。攻击者可通过向使用NLSPATH或PATH_LOCALE环境变量的setuid/setgid程序提供精心构造的参数触发栈缓冲区溢出，从而获取未授权的访问权限并可能提升至root权限。该漏洞由Solar Designer发现并发布了公开利用代码。"
published = "1997-02-13"
remediation = "建议用户升级操作系统至厂商已修复的版本（如升级AIX至4.2以上版本、Linux libc至5.2.18以上版本），或限制setuid/setgid程序对NLSPATH和PATH_LOCALE环境变量的使用。"
score = 7.5
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
]
title = "多款UNIX系统Natural Language Service（NLS）缓冲区溢出漏洞"
updated = "1997-02-13"

