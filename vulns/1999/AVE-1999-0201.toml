[remediation]
fix = "升级 Cisco 7xx 路由器 IOS/700 软件至 4.3(1) 或更高版本。75x 系列路由器因内存限制不支持 4.3 版本，应使用 IP 过滤作为缓解措施。"
workaround = "使用 set ip filter tcp 命令限制 TELNET 端口的访问来源，仅允许受信任的管理主机连接。示例：set ip filter tcp source = not trusted-host destination = router block。"
steps = ["步骤1: 确认当前路由器型号和 IOS/700 软件版本", "步骤2: 76x/77x 路由器升级至 4.3(1) 或更高版本", "步骤3: 75x 路由器配置 IP 过滤限制 TELNET 访问", "步骤4: 验证过滤规则是否生效"]

