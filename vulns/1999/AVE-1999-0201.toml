[basic]
title = "Cisco 7xx 系列路由器 Telnet 拒绝服务漏洞"
description = "Cisco 7xx 系列路由器存在拒绝服务漏洞。远程攻击者可以通过向路由器的 TELNET 端口（23）发起大量 TCP 连接（约98个），导致路由器自动重启，造成拒绝服务。该漏洞影响所有运行 4.2(3) 及更早版本软件的 Cisco 7xx 路由器。"
severity = "MEDIUM"
source = "nvd"
