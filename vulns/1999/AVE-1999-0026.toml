[basic]
title = "Microsoft Windows NT IIS 服务器 ..\\.. 路径遍历拒绝服务漏洞"
description = "Microsoft Windows NT IIS 服务器在处理包含特殊路径序列（如 ..\\..）的 HTTP 请求时存在拒绝服务漏洞。远程攻击者无需身份验证即可向目标 IIS 服务器发送特制的包含父目录遍历序列的 HTTP 请求，导致 IIS 服务进程崩溃或停止响应，造成服务器暂时无法提供正常的 Web 服务。该漏洞影响 Microsoft Internet Information Server 4.0 及早期版本。"
severity = "MEDIUM"
score = 5.0
published = "1999-05-12"
updated = "2026-06-16"
remediation = "安装 Windows NT 4.0 Service Pack 5 或更高版本，配置 URLScan 工具拦截包含 ..\\ 的恶意请求，限制对 IIS 服务的网络访问。"
sources = ["cve", "nvd", "tenable"]

