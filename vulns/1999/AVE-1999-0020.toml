[affected]
product = "IRIX"
vendor = "SGI"

[basic]
cvss_v2 = 4.6
description = "SGI IRIX 5.x/6.x 至 6.3 版本中自带的 pset 工具存在缓冲区溢出漏洞。pset 用于配置和管理多处理器系统中的处理器组。攻击者通过向 pset 命令提供特制的长参数作为参数，可覆盖栈上的返回地址，从而以 root 权限执行任意代码，实现本地权限提升。任何拥有系统本地账号的用户均可利用此漏洞获取 root 权限。"
published = "1997-07-16"
remediation = "升级到 SGI IRIX 6.4 及以上版本，或应用 SGI 提供的安全补丁。在无法升级的情况下，可通过移除 pset 的 setuid 权限或限制可执行 pset 的用户组来降低风险。"
score = 4.6
severity = "MEDIUM"
sources = [
    "exploitdb",
    "nvd",
]
title = "SGI IRIX 6.3 pset 命令缓冲区溢出本地权限提升漏洞"
