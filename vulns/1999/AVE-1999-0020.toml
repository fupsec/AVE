[basic]
title = "SGI IRIX pset命令缓冲区溢出提权漏洞"
description = "SGI IRIX系统的pset命令存在缓冲区溢出漏洞，本地攻击者可通过向pset命令传递超长参数触发内存破坏，从而绕过权限控制获取root权限。该漏洞源于pset命令未对用户输入进行充分的边界检查，当处理特定格式的命令行参数时会发生栈缓冲区溢出，攻击者可精心构造输入数据覆盖返回地址执行任意代码。该漏洞无需认证即可被本地利用，成功利用后将完全控制受影响的IRIX系统。"
severity = "MEDIUM"
score = 4.6
cvss_v2 = "AV:L/AC:L/Au:N/C:P/I:P/A:P"
cvss_v3 = "CVSS:3.0/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
published = "1997-07-16"
updated = "2026-04-16"
remediation = "立即升级SGI IRIX系统至已修复版本，或使用厂商提供的安全补丁。若无法升级，建议限制pset命令的执行权限，仅允许授权用户运行，或通过文件系统权限移除pset的setuid位。对受影响系统进行全面安全审计，检查是否已被利用。"
sources = ["nvd", "exploitdb", "github"]

