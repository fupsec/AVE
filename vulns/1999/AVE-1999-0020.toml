[basic]
title = "SGI IRIX pset命令缓冲区溢出导致本地权限提升"
description = "SGI IRIX 5.x至6.3系统中的pset命令存在缓冲区溢出漏洞，该命令用于多处理器系统中的处理器组配置和管理。攻击者可利用该漏洞通过向pset命令提供精心构造的超长参数触发缓冲区溢出，覆盖栈上返回地址，从而执行任意代码并以root权限控制系统。该漏洞为本地攻击，无需特殊权限即可利用，严重影响系统安全性。"
severity = "MEDIUM"
score = 4.6
remediation = "升级SGI IRIX系统至最新版本或安装厂商提供的安全补丁，同时限制普通用户对pset命令的访问权限，删除不必要的setuid程序。"
published = "1997-07-16"
updated = "2026-06-16"
sources = ["nvd", "exploitdb"]

