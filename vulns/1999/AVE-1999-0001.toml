[remediation]
fix = "升级到NFS服务器修复版本。参照各Linux发行版官方安全公告（如Red Hat、Caldera）安装补丁。"
workaround = "禁用NFS服务（rpc.mountd），或使用防火墙限制对RPC端口（111/TCP、111/UDP及mountd动态端口）的访问。"
steps = ["确认运行的服务: ps aux | grep mountd", "升级nfs-utils/mountd软件包到修复版本", "重启NFS服务: service nfs restart"]

