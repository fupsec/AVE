[basic]
title = "NFS mountd 缓冲区溢出漏洞"
description = "NFS mountd (rpc.mountd) 存在缓冲区溢出漏洞，远程攻击者可通过发送特制的RPC MOUNTPROC_MNT请求触发mountd日志记录代码中的缓冲区溢出，从而获取root权限。该漏洞主要影响Linux系统，包括Red Hat Linux 5.1、Caldera OpenLinux Standard 1.2等，在NFS服务器未共享任何文件系统时也可被利用。"
severity = "CRITICAL"
source = "nvd"
