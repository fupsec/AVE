[basic]
title = "super 3.11.6 syslog 缓冲区溢出漏洞"
description = "super 3.11.6 及部分其他版本中的 syslog 工具存在缓冲区溢出漏洞。本地攻击者可通过向 syslog 传入特制输入触发缓冲区溢出，覆盖内存数据，从而获取 root 权限，实现完全的机密性、完整性和可用性破坏。攻击无需用户交互，利用复杂度低。"
severity = "HIGH"
score = 7.2
sources = ["cve"]
published = "1999-02-26"
updated = "1999-02-26"
remediation = "升级 super 至 3.11.6 以上版本，修补 syslog 组件中的缓冲区溢出问题。同时建议限制非信任本地用户对 syslog 工具的访问权限。"

