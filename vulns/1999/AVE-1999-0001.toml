notes = "存在完整利用脚本（EDB-19096），可远程 root 权限执行任意代码。因采用 RPC 协议非 HTTP 协议，无法生成符合 poc.md 规范的 HTTP 类型 PoC 脚本。"
poc_confidence = "high"

[basic]
description = "NFS mountd 守护进程存在缓冲区溢出漏洞，远程攻击者通过发送特制的 RPC 请求可触发缓冲区溢出，实现以 root 权限执行任意代码。该漏洞影响 Red Hat Linux（2.0-5.1）、Caldera OpenLinux Standard 1.2、BSDI BSD/OS 1.1 及 SGI IRIX 等系统。"
published = "1998-10-12"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
