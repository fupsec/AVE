[basic]
title = "Glimpse HTTP aglimpse CGI 远程命令执行漏洞"
description = "Glimpse HTTP 服务器中的 aglimpse CGI 程序存在远程命令执行漏洞。攻击者可以通过向 aglimpse 发送特制请求，在无需认证的情况下远程执行任意系统命令，获取服务器完全控制权。该漏洞影响所有运行 aglimpse CGI 的 Glimpse HTTP 服务器版本，危害严重。"
severity = "HIGH"
score = 7.5
sources = ["nvd", "tenable"]
published = "1997-07-01"
updated = "2026-06-16"
remediation = "由于 Glimpse HTTP 已停止维护，建议立即从 Web 服务器上删除或禁用 aglimpse CGI 脚本，并迁移至其他受支持的 HTTP 服务器软件。若必须使用，应限制 CGI 目录的访问权限并部署 WAF 规则进行防护。"

