[basic]
title = "RedHat Linux 5.1 / Caldera OpenLinux Standard 1.2 - mountd 远程缓冲区溢出漏洞"
description = "NFS mountd 守护进程存在缓冲区溢出漏洞，远程攻击者通过发送特制的 RPC 请求可触发缓冲区溢出，实现以 root 权限执行任意代码。该漏洞影响 Red Hat Linux（2.0-5.1）、Caldera OpenLinux Standard 1.2、BSDI BSD/OS 1.1 及 SGI IRIX 等系统。"
severity = "CRITICAL"
source = "exploitdb"
published = "1998-10-12"
updated = "2024-11-20"

