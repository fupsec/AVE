[basic]
title = "Red Hat Linux NFS mountd 缓冲区溢出漏洞"
description = "NFS服务器的mountd守护进程存在缓冲区溢出漏洞。远程攻击者可通过向目标系统的mountd服务发送特制请求，触发mountd日志记录代码中的缓冲区溢出，从而获取目标系统的root权限。该漏洞主要影响Linux系统，即使NFS服务器未共享任何文件系统，攻击也可成功执行。Red Hat Linux 5.1及Caldera OpenLinux Standard 1.2等多个版本均受影响。"
severity = "CRITICAL"
score = 10.0
cvss_v2 = 10.0
cvss_v2_vector = "AV:N/AC:L/Au:N/C:C/I:C/A:C"
published = "1998-10-12"
updated = "1998-10-12"
sources = ["nvd", "exploitdb", "redhat"]
remediation = "升级Linux内核及NFS服务器软件包至修复版本，限制外部网络对mountd服务（端口111）的访问，或使用防火墙规则阻止未授权的RPC连接。"

[affected]
vendor = "Linux"
product = "NFS mountd"

