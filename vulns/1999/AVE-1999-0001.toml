[basic]
title = "SLMail 远程管理服务本地文件访问漏洞"
description = "SLMail 3.1及3.2版本的远程管理服务(RAS)存在安全漏洞。本地用户可通过将用户的Finger文件设置为指向目标文件，然后对该用户执行finger命令，从而访问NTFS文件系统中的任意文件。此漏洞可能导致敏感信息泄露或系统被进一步利用。"
severity = "MEDIUM"
score = 4.6
sources = ["cve"]
published = "1999-02-25"
updated = "2026-06-16"
remediation = "升级SLMail至不受影响的版本，或禁用远程管理服务(RAS)。如必须使用，应限制本地用户对Finger文件配置的修改权限。"

