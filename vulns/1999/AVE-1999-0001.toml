[basic]
description = "GNU C 库 (glibc) 2.2 之前版本中，manual/search.texi 文件在删除树根节点时未明确声明 tdelete 函数的返回值。开发者若未注意到 1999 年发布的文档更新，可能误用该函数导致访问悬空指针，进而引发信息泄露、数据篡改或服务拒绝等安全问题。攻击者可利用此漏洞远程执行恶意操作，影响系统机密性、完整性和可用性。"
published = "2020-10-06"
remediation = "升级 GNU C 库 (glibc) 至 2.2 或更高版本，该版本已明确 tdelete 函数的返回值行为，避免悬空指针访问问题。"
score = 9.8
severity = "CRITICAL"
sources = [
    "cve",
    "nvd",
]
title = "GNU C 库 glibc tdelete 函数返回值未定义导致悬空指针漏洞"
updated = "2020-10-06"

