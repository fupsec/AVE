[basic]
title = "NFS mountd 缓冲区溢出漏洞"
description = "NFS mountd 存在缓冲区溢出漏洞，远程攻击者可通过向 mountd 发送特制的 RPC 请求触发缓冲区溢出，从而获取 root 权限。主要影响 Linux 系统（如 Red Hat Linux 5.1、Caldera OpenLinux Standard 1.2），未导出任何文件系统的 NFS 服务器同样受此漏洞影响。"
severity = "CRITICAL"
score = 10.0
sources = ["nvd", "exploitdb", "redhat"]
published = "1998-10-12"
updated = "2026-06-16"
remediation = "升级到受影响版本以上的 Linux 发行版或安装厂商提供的补丁。参考 Red Hat 安全公告和 SGI 安全公告。"

