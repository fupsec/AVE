[remediation]
fix = "升级 nfs-utils 到修复版本，或应用操作系统厂商提供的安全补丁。Red Hat Linux 及 Caldera OpenLinux 均已发布修复版本。"
workaround = "使用防火墙限制对 RPC portmap（端口 111）和 mountd 端口的访问，仅允许可信网络；使用 tcp_wrappers（hosts.allow/hosts.deny）限制 mountd 访问来源。"
steps = ["步骤1: 确认系统是否运行 mountd 服务", "步骤2: 应用厂商安全补丁或升级 nfs-utils", "步骤3: 配置防火墙限制 RPC 服务访问", "步骤4: 重启 NFS 服务"]

