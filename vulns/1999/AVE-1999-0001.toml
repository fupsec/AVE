[basic]
description = "GNU C库（glibc）2.2之前版本中的manual/search.texi文档未说明删除树根节点时tdelete函数返回值为未定义，攻击者可利用此漏洞在开发者不知情的情况下，通过悬垂指针访问应用程序内存，导致敏感信息泄露或系统被控制。"
published = "2020-10-06"
remediation = "升级glibc至2.2或更高版本，避免在应用程序中直接使用tdelete函数的未检查返回值。"
score = 9.8
severity = "CRITICAL"
sources = ["nvd"]
title = "GNU glibc tdelete 函数未检查返回值导致悬垂指针漏洞"
updated = "2026-06-16"

