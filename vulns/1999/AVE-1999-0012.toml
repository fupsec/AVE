[basic]
title = "Land IP拒绝服务漏洞（多厂商TCP/IP协议栈）"
description = "Land.c是一种经典的拒绝服务攻击利用程序，通过向目标发送源地址和端口与目标地址和端口完全相同的特制TCP SYN数据包，导致存在缺陷的TCP/IP协议栈进入无限循环，最终系统崩溃或挂起。该漏洞影响Windows 95/NT 4.0/XP SP2/Server 2003、HP-UX 9/10/11、FreeBSD 2.x、NetBSD 1、Linux Kernel 2.0.3、Cisco IOS设备及Catalyst交换机等大量操作系统和网络设备。攻击者可远程发起攻击，无需任何认证，利用门槛极低。"
severity = "HIGH"
score = 7.5
remediation = "升级操作系统至厂商修复版本，如Windows安装最新安全补丁、HP-UX更新至11.11以上版本、Linux升级内核至2.0.4以上；在网络边界部署ACL规则过滤源地址等于目标地址的异常IP数据包；在防火墙上启用TCP SYN flood防护功能。"
published = "1997-12-01"
updated = "2026-06-16"
sources = ["exploitdb"]

