[basic]
title = "Land IP 拒绝服务漏洞"
description = "Land IP denial of service. 通过发送源地址和目标地址相同的 TCP SYN 数据包，导致受影响系统进入无限循环并崩溃。该漏洞影响多种操作系统和网络设备，包括 HP-UX 9/10/11、Windows NT 4.0/95、Windows Server 2003、Cisco IOS、NetBSD 1.0/1.1、SunOS 4.1.3/4.1.4 等。"
