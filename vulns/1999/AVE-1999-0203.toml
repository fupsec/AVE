[basic]
title = "IBM AIX infod 本地权限提升漏洞"
description = "IBM AIX 系统自带的 Info Explorer 守护进程（infod）存在本地权限提升漏洞。该守护进程以 root 权限运行，但未对通过本地 Unix 域 socket 传递的用户凭证进行验证。本地攻击者可伪造 UID/GID 为 0（root），向 infod 发送恶意环境变量，诱使其以 root 权限在攻击者的 X 显示器上启动连接。随后攻击者可通过默认选项菜单将打印机命令修改为 /bin/sh 等任意二进制文件，从而获取 root 权限。"
severity = "HIGH"
source = "nvd"
published = "1998-11-01"
updated = "2026-04-15"

