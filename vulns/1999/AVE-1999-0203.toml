[remediation]
fix = "升级到修复版本。IBM 已发布补丁：AIX 4.1.x 升级 IX84640，AIX 4.2.x 升级 IX84641，AIX 4.3.x 升级 IX84642。AIX 3.2.x 建议升级到 AIX 4。"
workaround = "如暂时无法升级，可禁用 infod 守护进程：运行 stopsrc -s infod 停止服务，rmitab infod 移除启动项，chown root.system /usr/lpp/info/bin/infod 及 chmod 0 /usr/lpp/info/bin/infod 锁定二进制文件。"
steps = ["确认系统 AIX 版本", "下载并安装对应补丁（IX84640/IX84641/IX84642）", "若无法立即打补丁，执行 stopsrc -s infod、rmitab infod、chmod 0 /usr/lpp/info/bin/infod 禁用守护进程"]

