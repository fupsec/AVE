[basic]
title = "SGI IRIX 6.2 eject 命令本地权限提升漏洞"
description = "SGI IRIX 6.2 的 eject 程序存在缓冲区溢出漏洞。eject 用于弹出可移动介质，被设置为 setuid root 以允许控制台用户执行弹出操作。通过向 eject 程序提供超长参数，可以覆盖栈上的返回地址，以 root 权限执行任意代码。"
severity = "HIGH"
source = "nvd"
published = "1997-05-25"
