[remediation]
fix = "配置防火墙或系统内核参数以禁止 ICMP 时间戳和地址掩码请求。对于 Linux 系统，设置 net.ipv4.conf.all.accept_redirects = 0 等参数。"
workaround = "在网络边界防火墙配置规则，阻止 ICMP 类型 13（Timestamp Request）和类型 17（Address Mask Request）入站数据包。"
steps = ["步骤1: 确认系统是否响应 ICMP 时间戳请求（使用 hping3 --icmp --icmptype 13 target）", "步骤2: 配置系统防火墙（iptables/nftables）阻止入站 ICMP 时间戳请求", "步骤3: 对于 Linux，配置 sysctl -w net.ipv4.icmp_echo_ignore_all=1 等参数", "步骤4: 在网络边界设备配置 ACL 过滤 ICMP 类型 13 和 17 报文"]

