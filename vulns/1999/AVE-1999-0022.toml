[remediation]
fix = "升级到 IRIX 6.3 或更高版本，该版本不受 eject 缓冲区溢出漏洞影响。"
workaround = "如无法升级，可移除 eject 的 setuid root 权限位：chmod u-s /usr/sbin/eject。注意此操作将限制 eject 只能由 root 用户执行。"
steps = ["步骤1: 确认 IRIX 系统版本", "步骤2: 升级到 IRIX 6.3 或更高版本", "步骤3: 如无法升级，执行 chmod u-s /usr/sbin/eject 移除 setuid 权限"]

