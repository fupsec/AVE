[basic]
title = "ICMP 时间戳和地址掩码请求信息泄露漏洞"
description = "ICMP 协议允许来自任意主机的网络掩码（类型 17）和/或时间戳（类型 13）信息请求。攻击者可利用此漏洞获取系统运行时间及网络拓扑信息，有助于绕过防火墙规则或进行进一步攻击。"
