[remediation]
fix = "配置防火墙规则，阻止来自不可信主机的 ICMP 时间戳（类型 13）和地址掩码（类型 17）请求。参考操作系统及网络安全设备官方文档配置 ICMP 过滤规则。"
workaround = "如无法升级或修改配置，可在网络边界防火墙处过滤 ICMP 类型 13（Timestamp）和类型 17（Address Mask Request）数据包。"
steps = [
  "步骤1: 识别需要防护的目标系统上启用的 ICMP 响应类型",
  "步骤2: 在网络边界防火墙配置 ACL 规则，阻止入站 ICMP 类型 13 和类型 17",
  "步骤3: 在主机层面配置系统防火墙（如 iptables、pf、Windows 防火墙）拦截相应 ICMP 类型",
  "步骤4: 测试规则生效情况，确保不影响正常业务通信"
]

