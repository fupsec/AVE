[remediation]
fix = "在防火墙或系统层面配置规则，阻止入站的 ICMP 时间戳请求（Type 13）和地址掩码请求（Type 17），或禁用 ICMP 时间戳响应。"
workaround = "在网络边界防火墙添加 ACL 规则，丢弃 ICMP Type 13（Timestamp Request）和 Type 17（Address Mask Request）数据包。"
steps = ["步骤1: 确认系统是否响应 ICMP 时间戳请求（使用 hping3/nping 发送 ICMP Type 13 请求）", "步骤2: 在系统或网络层配置策略，禁用 ICMP 时间戳响应", "步骤3: 在网络边界防火墙添加 ACL 规则过滤 ICMP Type 13 和 Type 17"]

