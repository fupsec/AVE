[basic]
title = "ICMP 时间戳和网络掩码信息泄露漏洞"
description = "允许任意主机获取 ICMP 时间戳和网络掩码信息。远程攻击者可通过发送 ICMP Timestamp 请求或 ICMP Address Mask 请求获取目标系统的时间和网络配置信息，为后续攻击提供情报支持。"
severity = "LOW"
source = "nvd"
published = "1997-08-01"
updated = "2026-06-16"

