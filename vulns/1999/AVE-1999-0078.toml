[basic]
description = "SGI IRIX 6.3 操作系统中自带的 webdist.cgi CGI 程序存在命令注入漏洞。远程攻击者可通过向 distloc 参数中注入 shell 元字符，在受影响服务器上以 httpd 进程权限执行任意命令，导致服务器被完全控制。该漏洞影响范围广泛，无需认证即可远程利用。"
published = "1997-05-06"
remediation = "建议升级操作系统至不受影响的版本，或移除或禁用 cgi-bin/webdist.cgi 脚本，同时对 CGI 程序的用户输入进行严格过滤和转义，防止 shell 元字符注入。"
score = 7.3
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
]
title = "SGI IRIX 6.3 webdist.cgi 命令执行漏洞"
