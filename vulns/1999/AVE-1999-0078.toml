[basic]
description = "SGI IRIX 操作系统中的 webdist.cgi CGI 程序存在命令注入漏洞，远程攻击者可通过向 distloc 参数传递包含 shell 元字符的恶意数据，在目标服务器上执行任意命令，导致信息泄露、权限提升或系统完全受控。该漏洞影响 IRIX 6.3 版本，攻击无需身份认证，利用难度低。"
published = "1997-05-06"
remediation = "升级 SGI IRIX 至安全版本或应用 SGI 安全公告 19970501-02-PX 提供的补丁，限制对 webdist.cgi 的访问权限，并过滤 distloc 参数中的 shell 元字符。"
score = 7.3
severity = "HIGH"
sources = [
    "nvd",
    "exploitdb",
    "cert",
]
title = "SGI IRIX webdist.cgi 命令注入漏洞"
