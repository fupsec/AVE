[basic]
title = "libxml2 xmlSnprintfElementContent 栈缓冲区溢出漏洞"
description = "libxml2 2.9.4版本中的valid.c文件的xmlSnprintfElementContent函数存在栈缓冲区溢出漏洞。当对不可信文档或不可信DTD进行DTD验证时，攻击者可通过构造特制的XML文件触发堆栈缓冲区溢出，导致使用libxml2的应用程序（如PHP）崩溃，造成拒绝服务。"
severity = "HIGH"
score = 7.5
sources = ["nvd", "msrc"]
published = "2017-05-18"
updated = "2026-06-16"
remediation = "升级到修复版本的libxml2。Debian系统参考DSA-3952，Gentoo参考GLSA 201711-01。也可参考补丁：https://bugzilla.gnome.org/show_bug.cgi?id=781333"

