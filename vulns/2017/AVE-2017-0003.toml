[basic]
title = "Perl Storable 模块 retrieve_hook 函数栈溢出漏洞"
description = "Storable versions before 3.05 for Perl 存在栈溢出漏洞。retrieve_hook 函数将类名长度存储为有符号整数，但在读取操作中将该长度作为无符号整数处理。攻击者可构造特制数据触发栈溢出，导致拒绝服务或远程代码执行。"
severity = "CRITICAL"
source = "nvd"
published = "2017-01-24"
updated = "2026-06-16"

[score]
cvss_v3 = 10.0
cvss_v3_vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"

[affected]
vendor = "NWCLARK"
product = "Storable"

[exploit]
poc = []
exp = []
nuclei_templates = []

[remediation]
fix = "升级 Storable 到 3.05 或更高版本。参考 CPAN 发布说明：https://metacpan.org/release/RURBAN/Storable-3.05/changes"
workaround = "避免对不可信数据使用 Storable::retrieve 或 Storable::thaw。如果必须使用，在反序列化前对数据进行完整性校验。"
steps = [
  "确认当前 Storable 版本：perl -MStorable -e 'print $Storable::VERSION'",
  "升级 Storable 到 3.05 或更高版本：cpan -i Storable",
  "升级 Perl 至包含修复的版本"
]

