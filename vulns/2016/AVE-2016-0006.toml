[basic]
title = "LibTIFF 4.0.6 tif_predict 堆缓冲区溢出漏洞"
description = "tif_predict.h 和 tif_predict.c 文件中的 libtiff 4.0.6 版本存在断言问题，在处理异常图块大小（如 YCbCr 子采样）时，调试模式下可导致断言失败，发布模式下可导致缓冲区溢出。该漏洞被报告为 MSVR 35105，又名 Predictor heap-buffer-overflow。"
severity = "CRITICAL"
source = "nvd"
published = "2016-11-22"
updated = "2026-06-16"

