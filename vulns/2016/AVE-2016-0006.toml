[basic]
title = "LibTIFF 堆缓冲区溢出漏洞"
description = "LibTIFF 4.0.6 版本中的 tif_predict.h 和 tif_predict.c 文件存在堆缓冲区溢出漏洞。当处理具有异常 Tile 尺寸（如 YCbCr 采样）的 TIFF 图像时，调试模式下会触发断言失败，发布模式下则导致堆缓冲区溢出。攻击者可利用特制图像文件触发此漏洞，实现远程代码执行，可能导致系统被完全控制。"
severity = "CRITICAL"
score = 9.8
published = "2016-11-22"
updated = "2026-06-16"
remediation = "升级 LibTIFF 至 4.0.7 或更高版本，或应用官方补丁 commit 3ca657a 和 6a984bf。相关 Linux 发行版（如 Red Hat、Debian）已发布安全更新，请及时安装对应补丁。"
sources = ["nvd", "msrc"]

