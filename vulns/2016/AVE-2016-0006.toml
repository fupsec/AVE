[basic]
title = "LibTIFF Predictor 堆缓冲区溢出漏洞"
description = "libtiff 4.0.6 中的 tif_predict.h 和 tif_predict.c 存在断言问题，在处理特殊 tile 大小时（如带有子采样的 YCbCr），调试模式下可导致断言失败，发布模式下可导致缓冲区溢出。"
