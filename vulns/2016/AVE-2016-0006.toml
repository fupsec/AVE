[basic]
title = "LibTIFF 预测器堆缓冲区溢出漏洞"
description = "libtiff 4.0.6 的 tif_predict.h 和 tif_predict.c 中存在不安全的断言机制，在处理 YCbCr 子采样等特殊 Tile 大小时，调试模式下导致断言失败崩溃，发布模式下断言被编译移除，进而引发堆缓冲区溢出，可能被利用实现远程代码执行。由微软 MSRC（Axel Souchet、Vishal Chauhan）报告，编号 MSVR 35105。"
severity = "CRITICAL"
source = "msrc"
published = "2016-11-22"
updated = "2026-06-16"

