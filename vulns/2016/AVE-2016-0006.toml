[remediation]
fix = "升级 libtiff 到 4.0.7 及以上版本。各发行版修复版本：Debian 8 (libtiff 4.0.3-12.3+deb8u3), RHEL 7 (libtiff 4.0.3-27.el7_3), Debian 7 (tiff 4.0.2-6+deb7u9)。参考官方安全公告。"
workaround = "如无法升级，避免处理来自不可信来源的特制 TIFF 文件。"
steps = ["步骤1: 确认 libtiff 版本（libtiff -a 或 dpkg -l libtiff5）", "步骤2: 更新到修复版本（libtiff >= 4.0.7）", "步骤3: 重启依赖 libtiff 的服务"]

