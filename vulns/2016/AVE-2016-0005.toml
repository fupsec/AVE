[basic]
description = """
Linux kernel 4.8 之前版本中，drivers/usb/core/config.c 的 usb_parse_endpoint 函数未验证端点描述符的 wMaxPacketSize 字段，可触发越界读取（Out-of-bounds Read），导致敏感信息泄露或系统崩溃。
本地攻击者可通过插入恶意 USB 设备触发此漏洞提升权限。
该漏洞仅影响厂商不再支持的产品。
"""
