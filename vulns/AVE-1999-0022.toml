[basic]
title = "ICMP时间戳和网络掩码信息泄露漏洞"
description = "ICMP信息泄露漏洞，允许任意主机获取目标系统的(1)网络掩码和(2)时间戳信息。攻击者可通过发送ICMP地址掩码请求和ICMP时间戳请求获取敏感网络信息，包括系统运行时间和子网掩码配置。"
severity = "LOW"
source = "cve"
published = "1997-08-01"
updated = "2026-06-16"

