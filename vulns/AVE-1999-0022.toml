[remediation]
fix = "在网络边界防火墙上过滤ICMP时间戳请求（类型13）和ICMP地址掩码请求（类型17）数据包。"
workaround = "在系统层面禁用ICMP时间戳响应：Linux可通过iptables规则丢弃ICMP类型13和17的请求；Windows可通过注册表禁用。"
steps = ["步骤1: 在边界防火墙上添加规则阻止入站ICMP时间戳请求(Type 13)和地址掩码请求(Type 17)", "步骤2: 在主机上配置防火墙规则丢弃ICMP时间戳请求", "步骤3: 对于Linux系统，执行 'echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_all' 并配置iptables规则"]

