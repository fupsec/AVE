title = "Microsoft Windows POSIX 子系统权限提升漏洞"
description = "Microsoft Windows NT 4.0 和 Windows 2000 的 POSIX 组件存在缓冲区溢出漏洞，本地攻击者可通过向 POSIX 子系统传递特定参数（如修改消息长度值）触发缓冲区溢出，从而以系统权限执行任意代码，完全控制受影响的系统。"
