[basic]
title = "Cisco IOS Telnet拒绝服务漏洞"
description = "Cisco IOS 12.2(15)及更早版本中存在一个拒绝服务漏洞。远程攻击者可通过向Telnet或反向Telnet端口发送特制的TCP连接请求，导致设备拒绝后续的VTY（虚拟终端）连接，从而影响Telnet、反向Telnet、RSH、SSH和HTTP等远程管理服务的正常访问。该漏洞已由CISA列入已知被利用漏洞目录（KEV）。"
severity = "MEDIUM"
score = 5.9
cvss_v3 = "AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H"
cvss_v2 = "AV:N/AC:L/Au:N/C:N/I:N/A:P"
published = "2004-12-31"
remediation = "升级Cisco IOS至12.2(15)之后的安全修复版本，或应用Cisco官方安全公告cisco-sa-20040827-telnet中提供的补丁程序。"
