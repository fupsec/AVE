[basic]
title = "Cisco IOS Telnet端口拒绝服务漏洞"
description = "Cisco IOS 12.2(15)及之前版本中存在拒绝服务漏洞。远程攻击者可通过向Telnet或反向Telnet端口发送特制TCP连接，导致设备上的所有虚拟终端(VTY)连接被拒绝，阻断后续telnet、反向telnet、RSH、SSH及HTTP管理访问。该漏洞无需认证即可远程利用，已被CISA列入已知被利用漏洞目录(KEV)，确认存在在野利用。"
severity = "MEDIUM"
score = 5.9
sources = ["kev", "nvd"]
published = "2004-12-31"
updated = "2026-06-16"
remediation = "升级Cisco IOS至12.2(15)之后的安全版本，或参考Cisco安全公告cisco-sa-20040827-telnet应用补丁。无法立即升级时可通过ACL限制Telnet端口(23/TCP)访问来源以缓解风险。"

