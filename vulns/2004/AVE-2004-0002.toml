[basic]
title = "Cisco IOS 拒绝服务漏洞"
description = "Cisco IOS 12.2(15)及更早版本中存在一个未指定的漏洞，远程攻击者可通过向Telnet或反向Telnet端口发送特制的TCP连接，导致设备拒绝服务，阻止进一步的Telnet、反向Telnet、RSH、SSH以及某些情况下的HTTP访问。"
severity = "MEDIUM"
source = "nvd"
