[remediation]
fix = "升级到Cisco IOS 12.2(15)之后的安全版本。参考Cisco安全公告cisco-sa-20040827-telnet。"
workaround = "限制Telnet端口的访问，使用ACL控制允许访问VTY线路的源IP地址。"
steps = [
  "1. 确认当前运行的Cisco IOS版本",
  "2. 升级到修复版本（12.2(15)之后）",
  "3. 配置VTY访问控制列表，限制可信源IP地址访问Telnet端口",
  "4. 启用SSH并禁用Telnet服务（推荐）"
]

