[basic]
title = "Ascend路由器远程管理端口拒绝服务漏洞"
description = "Ascend路由器通过端口150（远程管理）存在拒绝服务漏洞，远程攻击者可向该端口发送恶意数据包，导致设备拒绝服务，无法正常响应。"
