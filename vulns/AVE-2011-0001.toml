[basic]
title = "IRAI AUTOMGEN <= 8.0.0.7 Use-After-Free 远程拒绝服务漏洞"
description = """
IRAI AUTOMGEN 是一款工业自动化项目创建工具（PLC、SCADA、3D 仿真等）。
版本 8.0.0.7（含）及之前版本（也称 8.022）在处理特制的项目文件时存在释放后使用（Use-After-Free）漏洞。
当解析某些格式错误字段（如内嵌 ZIP 存档大小或计数器）时，程序会释放一个对象并在之后使用已过期的悬空指针，
攻击者可通过控制的内存影响间接函数调用，导致拒绝服务。在某些条件下可能实现远程代码执行。
"""
