[remediation]
fix = "升级 Adobe Flash Player 至 10.1.53.64 或 9.0.277.0 及更高版本；升级 Adobe Reader 和 Acrobat 至 9.3.3 或 8.2.3 及更高版本；升级 Adobe AIR 至 2.0.2.12610 及更高版本。注意：Adobe Flash Player 已于 2020 年 12 月 31 日终止支持（EOL），应立即断网并卸载。"
steps = [
    "步骤1: 确认当前 Adobe Flash Player / Reader / Acrobat / AIR 版本",
    "步骤2: 下载并安装对应产品的安全更新补丁",
    "步骤3: 由于 Flash Player 已 EOL，建议彻底卸载并替换为其他方案",
    "步骤4: 验证更新后版本不再受漏洞影响",
]
workaround = "如无法立即升级：1) 在浏览器中禁用 Flash Player 插件；2) 配置 Adobe Reader 的受保护模式和沙箱；3) 避免打开来源不明的 PDF 文件；4) 使用 Windows DEP 和 ASLR 增强防护。"

