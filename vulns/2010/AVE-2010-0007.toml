notes = "该漏洞于2010年6月在野外被积极利用，是针对台湾政府组织的 Taidoor 攻击活动的一部分。CISA KEV 目录于2022-06-08收录。Adobe Flash Player 已于2020年12月31日终止支持（EOL）。"
poc_confidence = "high"

[basic]
description = "Adobe Flash Player 9.0.277.0之前版本和10.x 10.1.53.64之前版本；Adobe AIR 2.0.2.12610之前版本；以及Windows和Mac OS X上的Adobe Reader和Acrobat 9.x至9.3.3之前版本和8.x至8.2.3之前版本，允许远程攻击者通过精心构造的SWF内容执行任意代码或造成拒绝服务（内存破坏），与authplay.dll和ActionScript虚拟机2（AVM2）newfunction指令相关，于2010年6月在野外被积极利用。"
published = "2010-06-08"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "Adobe Flash Player 内存破坏漏洞（newfunction 无效指针使用）"
