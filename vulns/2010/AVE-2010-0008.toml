[remediation]
fix = "升级 JBoss EAP 至 4.2.0.CP09 或 4.3.0.CP08 及以上版本。参考 Red Hat 安全公告 RHSA-2010:0376、RHSA-2010:0377、RHSA-2010:0378、RHSA-2010:0379。"
workaround = "如无法立即升级，可采取以下缓解措施：1) 在反向代理或 WAF 层面限制对 /web-console 的访问，仅允许可信 IP；2) 在应用服务器前端配置 HTTP 方法过滤，拦截除 GET/POST 外的所有方法；3) 禁用不必要的 Web Console 功能。"
steps = ["步骤1: 确认当前 JBoss EAP 版本", "步骤2: 根据 Red Hat 安全公告 RHSA-2010:0376~0379 获取对应补丁", "步骤3: 升级 JBoss EAP 至 4.2.0.CP09 或 4.3.0.CP08 及以上版本", "步骤4: 验证升级后 /web-console 对所有 HTTP 方法均进行访问控制"]

