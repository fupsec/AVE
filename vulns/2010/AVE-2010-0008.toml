[basic]
title = "Red Hat JBoss 企业应用平台 Web 控制台认证绕过漏洞（信息泄露）"
description = "Red Hat JBoss 企业应用平台（JBoss EAP/JBEAP）4.2 至 4.2.0.CP08 版本及 4.3 至 4.3.0.CP07 版本的 Web 控制台（/web-console）仅对 GET 和 POST 方法执行访问控制，未对其他 HTTP 方法（如 HEAD、OPTIONS 等）进行鉴权。远程攻击者可利用此缺陷绕过认证，发送非 GET/POST 的 HTTP 请求获取敏感信息。此漏洞已在野被积极利用，并被 CISA KEV 收录，已知被用于勒索软件活动。"
severity = "HIGH"
source = "nvd"
published = "2010-04-28"
updated = "2026-06-16"

