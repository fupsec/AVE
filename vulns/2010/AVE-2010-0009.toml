[remediation]
fix = "升级 JBoss Seam 2 至 2.2.1.CR2 及以上版本，或安装 Red Hat RHSA-2010:0564 安全更新。相关修复已提交至 JBoss Seam SVN。"
steps = [
    "步骤1: 确认 JBoss Seam 版本（查看 jboss-seam2 版本号）",
    "步骤2: 根据 Red Hat 安全公告 RHSA-2010:0564 获取并安装更新包",
    "步骤3: 重启 JBoss 服务器使更新生效",
    "步骤4: 确保 Java Security Manager 正确配置",
]
workaround = "如无法立即升级，可采取以下缓解措施：1) 正确配置 Java Security Manager 可阻止利用；2) 在反向代理或 WAF 层面过滤 actionOutcome 参数中的 EL 表达式特征（如 #{ 等关键字）；3) 限制对 JBoss Seam 应用（如 /seam-booking/、/admin-console/）的网络访问。"

