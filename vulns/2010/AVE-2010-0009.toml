[affected]
product = "JBoss Enterprise Application Platform 4.3.0 / JBoss Seam 2"
vendor = "Red Hat"

[authenticity]
cve_confidence = "high"
notes = "CISA KEV 于 2021-12-10 收录，要求 2022-06-10 前修复。EPSS 评分约 0.935，处于极高百分位。有活跃的 Metasploit 模块和多个公开 PoC/EXP。原始漏洞发现者为 Meder Kydyraliev（Google Security Team）。"
poc_confidence = "high"

[basic]
description = "JBoss Seam 2 (jboss-seam2) 未正确过滤 JBoss 表达式语言（EL）表达式输入。远程攻击者可通过向基于 JBoss Seam 框架的应用程序发送包含特制 EL 表达式的 URL，利用 actionOutcome 参数注入任意 JBoss EL 表达式，通过 Java 反射机制调用 Runtime.exec() 执行任意命令。此漏洞仅在 Java Security Manager 未正确配置时存在。已在野被广泛利用，CISA KEV 已于 2021-12-10 收录。"
published = "2010-07-19"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "Red Hat JBoss Seam 2 表达式语言注入远程代码执行漏洞"
updated = "2026-06-16"

