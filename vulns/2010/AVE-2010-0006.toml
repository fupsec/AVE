[remediation]
fix = "升级 Oracle Java SE 至 6 Update 19、5.0 Update 24 或 1.4.2_26 及更高版本。各 Linux 发行版也已发布相应安全更新（如 RHSA-2010:0337、RHSA-2010:0338、USN-923-1 等）。"
steps = [
    "步骤1: 检查当前安装的 Java 版本（java -version）",
    "步骤2: 升级至 Oracle Java SE 6 Update 19 或更高版本",
    "步骤3: 对于 Linux 系统，应用发行版提供的安全补丁（如 yum update java-1.6.0-sun）",
    "步骤4: 验证升级后版本不再受漏洞影响",
]
workaround = "如无法立即升级，可通过浏览器设置禁用 Java 插件，或配置 Java 安全策略限制不受信任的 Applet 执行。"

