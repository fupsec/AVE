notes = "该漏洞已被 CISA 纳入已知被利用漏洞目录（KEV，2022-05-25），在野被积极利用。Metasploit 模块（EDB-16297）可用，Microsoft Defender 将其检测为 Exploit:Java/CVE-2010-0840。"
poc_confidence = "high"

[basic]
description = "Oracle Java SE 及 Java for Business 的 Java Runtime Environment（JRE）组件中存在未指定漏洞，影响 Java SE 6 Update 18、5.0 Update 23 及 1.4.2_25 及更早版本。攻击者可通过未知向量远程利用该漏洞，影响机密性、完整性和可用性。该漏洞被称为 Trusted Methods Chaining Remote Code Execution Vulnerability，与 JRE 在执行特权方法时的检查缺陷有关，攻击者可通过 (1) 继承可信类但未修改特定方法的不可信对象，或 (2) 利用接口的类似信任问题来执行任意代码。"
published = "2010-04-01"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
