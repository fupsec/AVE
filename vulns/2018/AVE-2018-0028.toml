[basic]
title = "blockmason 信用协议 UCAC CreditProtocol.sol executeUcacTx 拒绝服务漏洞"
description = "blockmason credit-protocol 是一款基于以太坊的信用协议智能合约。其 UCAC Handler 组件中的 CreditProtocol.sol 文件的 executeUcacTx 函数存在拒绝服务漏洞。攻击者可通过构造特定的交易调用，导致资源未正确释放（CWE-404），进而使合约功能异常或停止响应。该漏洞无需身份认证即可远程触发，CVSS评分7.5，影响严重。注意该项目已不再受维护者支持。"
severity = "HIGH"
score = 7.5
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
remediation = "应用补丁 082e01f18707ef995e80ebe97fcedb229a55efc5 修复该漏洞。由于该项目已不再受支持，建议用户迁移至其他受维护的信用协议解决方案。"
sources = ["nvd", "avd", "vuldb"]
published = "2024-02-04"
updated = "2026-06-16"

