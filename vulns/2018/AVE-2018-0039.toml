[basic]
title = "Marked.js 正则表达式拒绝服务漏洞（ReDoS）"
description = "Marked.js 是一个流行的 Markdown 解析库，在 0.3.17 版本之前存在正则表达式拒绝服务（ReDoS）漏洞。攻击者可通过提交深层嵌套或重复结构的 Markdown 内容，触发 HTML 标签和 Markdown 链接解析正则表达式的灾难性回溯，导致解析器挂起，造成拒绝服务。攻击无需认证，远程即可触发。"
severity = "HIGH"
score = 7.5
remediation = "将 marked.js 升级至 0.3.17 或更高版本。对于不可信来源的 Markdown 输入，建议在解析前对内容长度和嵌套深度进行限制，或使用更安全的替代解析器。"
published = "2025-05-23"
updated = "2026-06-16"
sources = ["nvd", "avd"]

