[basic]
title = "Kotchasan 在线会计系统 image.php 路径遍历漏洞"
description = "Kotchasan 开发的在线会计系统（Online Accounting System）1.4.0及之前版本中，ckeditor/filemanager/browser/default/image.php 文件存在路径遍历漏洞（CWE-22）。攻击者可通过 fid 参数传入 ../../../etc/passwd 等路径穿越序列，未经身份验证即可读取服务器上任意文件，包括包含数据库凭据的 PHP 配置文件，导致敏感信息泄露。NVD 评分为 7.5（HIGH），攻击复杂度低且无需认证。"
severity = "HIGH"
score = 7.5
published = "2023-12-03"
updated = "2026-06-16"
remediation = "升级至 Online Accounting System 2.0.0 或更高版本。该版本已对 image.php 的 fid 参数添加路径穿越检查，禁止包含 '..' 的路径请求，并验证用户登录状态。"
sources = ["avd", "nvd"]

