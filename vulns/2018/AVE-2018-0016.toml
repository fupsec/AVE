notes = "暂无公开 PoC。漏洞由 VulDB 收录（VDB-230235），存在明确的修复提交和版本发布，真实性确认。PoC 需要管理员或编辑器权限，通过创建包含<script>标签的文章后访问模板预览页面触发。"
poc_confidence = "none"

[basic]
description = "FanPress CM 3.6.3 及之前版本中存在跨站脚本（XSS）漏洞，位于 inc/controller/action/system/templatepreview.php 文件的 getArticlesPreview 函数中。攻击者可利用模板预览功能注入恶意脚本，当管理员或其他用户访问模板预览页面时，恶意脚本将在浏览器中执行，导致信息泄露或权限劫持。升级到 3.6.4 版本可修复此漏洞。"
published = "2023-06-01"
remediation = "Refer to vendor advisory and upgrade to fixed version."
