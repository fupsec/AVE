[remediation]
fix = "升级到 FanPress CM 3.6.4 或更高版本。官方已在 v3.6.4 中修复此漏洞，通过对模板预览输出中的 <script> 标签进行 HTML 转义处理。"
workaround = "如无法升级，可限制模板预览功能的访问权限，仅允许受信任的管理员访问。同时在 Web 应用防火墙（WAF）层面添加针对 <script> 标签的过滤规则。"
steps = ["确认当前 FanPress CM 版本", "下载 FanPress CM 3.6.4 或最新版本", "备份现有数据和配置文件", "执行升级操作", "验证修复是否生效"]

