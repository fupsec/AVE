[basic]
title = "Nintendo Animal Crossing Letter Trigram内存损坏漏洞"
description = "Nintendo GameCube平台上的Animal Crossing（动物森友会）、Doubutsu no Mori+和Doubutsu no Mori e+ 1.00/1.01版本中存在一个内存损坏漏洞。该漏洞位于Letter Trigram Handler组件中，攻击者通过物理接触设备并操纵三字母组（Trigram）数据，可触发缓冲区越界操作（CWE-119），导致内存损坏。由于攻击需要物理访问且复杂度较高，实际利用难度较大，但已公开的exploit代码增加了被武器化的风险。"
severity = "MEDIUM"
score = 6.4
published = "2025-03-23"
updated = "2026-06-17"
remediation = "由于该漏洞存在于GameCube物理游戏卡带及游戏软件中，目前无官方补丁。建议限制对GameCube设备的物理访问，防止未授权人员操作游戏信件系统。对于已部署的受影响版本（1.00/1.01），可通过升级至更高版本或使用官方修复的游戏版本来降低风险。"
sources = ["nvd", "avd", "vuldb"]

