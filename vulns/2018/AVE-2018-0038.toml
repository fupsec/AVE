[basic]
title = "Nintendo Animal Crossing GameCube 三字母组合处理器内存损坏漏洞"
description = "任天堂GameCube平台的Animal Crossing游戏（含Doubutsu no Mori+和Doubutsu no Mori e+版本1.00/1.01）存在内存损坏漏洞。该漏洞位于Letter Trigram Handler组件中，由于三字母组合（trigram）查找表未正确终止（使用0x00而非0x7F作为停止字符），导致游戏读取超出数组边界。攻击者可通过精心构造的内存卡文件（包含恶意NES ROM加载器和PAT标签）利用该漏洞实现任意代码执行，无需网络连接，仅需物理接触设备和特制存储卡。漏洞利用复杂度较高但已公开披露，可能被用于加载自制程序或作弊代码。"
severity = "MEDIUM"
score = 6.4
cvss_v3 = "CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
published = "2025-03-23"
updated = "2025-03-23"
sources = ["nvd", "vuldb", "tenable", "opencve"]
remediation = "任天堂官方未发布针对GameCube平台Animal Crossing的补丁。由于GameCube已停产且该漏洞需要物理访问设备，建议限制对游戏主机和内存卡的物理接触。对于安全研究人员，建议使用模拟器进行测试，并关注任天堂官方公告。社区已发布缓解措施文档，可参考相关技术博客了解漏洞细节。"

