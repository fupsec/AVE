[basic]
title = "Nintendo Animal Crossing GameCube Letter Trigram Handler 内存损坏漏洞"
description = "任天堂GameCube平台的Animal Crossing游戏（含Doubutsu no Mori+和Doubutsu no Mori e+，版本1.00/1.01）存在内存损坏漏洞（CWE-119）。该漏洞位于Letter Trigram Handler组件中，三字母组合（trigram）查找表未正确终止（使用0x00而非0x7F作为停止字符），导致游戏读取超出数组边界，造成内存损坏。攻击者可通过构造包含恶意NES ROM加载器和PAT标签的特制内存卡文件，利用PAT标签处理中的任意地址写入能力，将代码注入游戏内存空间（0x80000000-0x807FFFFF范围），实现任意代码执行。漏洞利用需要物理接触设备和特制存储卡，攻击复杂度较高但已有公开PoC，可能导致设备完全被控制。"
severity = "MEDIUM"
score = 6.4
cvss_v3 = "CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
cvss_v2 = "AV:L/AC:H/Au:N/C:C/I:C/A:C"
cvss_v2_score = 6.2
cvss_v4 = "CVSS:4.0/AV:P/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
cvss_v4_score = 5.4
published = "2025-03-23"
updated = "2025-03-23"
sources = ["nvd", "vuldb", "tenable", "opencve"]
remediation = "任天堂官方未发布针对GameCube平台Animal Crossing的补丁，因为GameCube已停产。由于该漏洞需要物理接触设备和特制存储卡，建议限制对游戏主机及内存卡的物理接触。安全研究人员应在隔离环境中使用模拟器进行测试。社区已发布技术分析文档和PoC代码，可参考jamchamb.net和FIX94/ac-exploit-gc仓库了解漏洞利用细节和缓解措施。"

