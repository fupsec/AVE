[basic]
title = "任天堂动物森友会GameCube版信件Trigram处理程序内存破坏漏洞"
description = "任天堂GameCube平台的动物森友会及动物森林e+ 1.00/1.01版本中，信件Trigram处理程序存在内存破坏漏洞（CWE-119）。攻击者可通过物理接触游戏主机的方式投递特制信件，触发缓冲区溢出，导致任意代码执行。该漏洞利用复杂度较高，已有公开PoC代码。"
severity = "MEDIUM"
score = 6.4
remediation = "升级游戏至官方修复版本或安装社区补丁。避免使用来路不明的存档文件，游玩时勿加载可疑信件数据。"
published = "2025-03-23"
updated = "2026-06-16"
