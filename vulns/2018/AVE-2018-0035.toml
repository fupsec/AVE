description = "NebulaX WordPress 主题 5.0 及之前版本的 libs/Legacy/Legacy.php 中 nebula_send_to_hubspot 函数存在 SQL 注入漏洞。该函数将用户可控的 nebula_id 参数直接拼接进 SQL 查询语句，攻击者可在低权限认证状态下远程注入恶意 SQL 语句，导致数据库信息泄露、数据篡改等安全危害，攻击复杂度低且无需用户交互。"
published = "2024-12-23"
remediation = "升级 NebulaX 主题至 5.0 以上版本，或应用 GitHub 提交 41230a81db0f671c570c2644bc2f80565ca83c5a 补丁。该修复使用 wpdb->prepare 参数化查询替代原始字符串拼接，从根本上消除 SQL 注入风险。"
score = 6.3
severity = "MEDIUM"
