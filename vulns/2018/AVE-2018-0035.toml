[basic]
title = "webuidesigning NebulaX 主题 Legacy.php SQL注入漏洞"
description = "webuidesigning公司开发的NebulaX WordPress主题5.0及之前版本中，libs/Legacy/Legacy.php文件的nebula_send_to_hubspot函数存在SQL注入漏洞。攻击者可在低权限条件下通过远程发送特制请求，对后端数据库执行恶意SQL语句，导致敏感信息泄露或数据被篡改。该漏洞由VulDB收录，官方已提供修复补丁。"
severity = "MEDIUM"
score = 6.3
cvss_v2 = 6.5
cvss_v3 = 6.3
cvss_v4 = 5.3
remediation = "升级webuidesigning NebulaX主题至最新安全版本，或应用GitHub上提供的补丁commit 41230a81db0f671c570c2644bc2f80565ca83c5a。如无法立即更新，可临时禁用libs/Legacy/Legacy.php中nebula_send_to_hubspot函数的功能以防止利用。"
published = "2024-12-23"
updated = "2026-06-16"
