[basic]
title = "Acumos Design Studio 跨站脚本漏洞"
description = "Acumos Design Studio 至 2.0.7 版本存在跨站脚本(XSS)漏洞。该漏洞源于程序未对用户输入进行充分过滤和转义，攻击者可构造恶意载荷注入页面，当其他用户访问受影响页面时脚本在浏览器中执行，可能导致敏感信息泄露或会话劫持。攻击者可通过远程方式利用该漏洞，无需身份认证。升级至2.0.8版本可修复此问题。"
severity = "MEDIUM"
score = 6.1
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
remediation = "升级 Acumos Design Studio 至 2.0.8 或更高版本。管理员应从 GitHub 获取最新版本(v2.0.8)并执行升级，该版本通过正确过滤和转义用户输入修复了跨站脚本漏洞。"
