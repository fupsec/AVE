]

[remediation]
fix = "升级 Dicoogle PACS Web Server 到最新版本，移除或限制对 /exportFile 端点的访问，对 UID 参数输入进行路径遍历校验。"
workaround = "如无法升级，可通过反向代理规则限制对 /exportFile 端点的外部访问，或在 Web 服务器层面过滤包含 ../ 及 %5c 等路径遍历特征的请求。"
steps = ["步骤1: 确认 Dicoogle PACS Web Server 版本是否为 2.5.0 或更早", "步骤2: 升级到修复版本或应用安全补丁", "步骤3: 限制对 /exportFile 端点的网络访问", "步骤4: 实施输入验证，过滤 ../ 及 %5c 等路径遍历字符"]

