[basic]
title = "Dicoogle PACS Web Server 2.5.0 未经身份验证的路径遍历漏洞"
description = "Dicoogle PACS Web Server 2.5.0 及之前版本存在未授权路径遍历漏洞，远程攻击者可通过向 /exportFile 端点发送精心构造的请求，利用 UID 参数读取系统上的任意文件，导致敏感信息泄露。"
severity = "HIGH"
source = "nvd"
published = "2018-07-11"
updated = "2026-06-16"

