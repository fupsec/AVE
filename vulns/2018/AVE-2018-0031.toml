[basic]
title = "l2c2technologies Koha opac-MARCdetail.pl 反射型跨站脚本漏洞"
description = "l2c2technologies Koha 是一款开源图书馆管理系统，其 opac-MARCdetail.pl 文件中的 biblionumber 参数存在反射型跨站脚本漏洞。攻击者可构造包含恶意脚本的 URL（如 /cgi-bin/koha/opac-MARCdetail.pl?biblionumber=2\"><TEST>）诱使用户访问，导致恶意脚本在用户浏览器中执行，可能造成会话信息泄露或钓鱼攻击。该漏洞影响 Koha 20180108 及之前版本。"
severity = "LOW"
score = 3.5
published = "2024-04-21"
updated = "2024-04-22"
sources = ["avd", "nvd"]
remediation = "建议升级 Koha 系统至最新版本，或应用 GitHub 上的补丁提交 950fc8e，该补丁对 biblionumber 参数进行了正确的输出转义处理，将模板变量从 biblionumber 替换为 biblio.biblionumber 以防范 XSS 攻击。"

