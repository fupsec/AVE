[basic]
title = "osCommerce 2.3.4.1安装程序未经验证的配置文件注入PHP代码执行（CVE-2018-25114）"
description = "osCommerce Online Merchant 2.3.4.1版本存在远程代码执行漏洞，该漏洞源于默认配置不安全且安装程序工作流中缺少身份验证。默认情况下，/install/目录在安装完成后仍可访问。未经验证的攻击者可调用install_4.php，提交经过构造的POST数据，将任意PHP代码注入configure.php文件。当应用程序后续包含该文件时，注入的有效载荷将被执行，导致服务器端完全沦陷。"
severity = "CRITICAL"
source = "avd"
published = "2018-03-27"
updated = "2026-04-07"

