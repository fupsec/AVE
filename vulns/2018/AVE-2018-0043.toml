notes = "CVE编号由多个权威来源确认（NVD、AVD、GitHub Advisory、VulnCheck），CVSS v4评分9.3（严重）。存在Metasploit模块、Nuclei模板及多个Exploit-Db PoC。已在VulnCheck KEV中被收录，确认存在野外利用。原始CVE公开时间为2025年7月，但漏洞本身自2018年已被公开利用。"
poc_confidence = "high"

[basic]
description = "osCommerce Online Merchant 2.3.4.1版本存在远程代码执行漏洞，该漏洞源于默认配置不安全且安装程序工作流中缺少身份验证。默认情况下，/install/目录在安装完成后仍可访问。未经验证的攻击者可调用install_4.php，提交经过构造的POST数据，将任意PHP代码注入configure.php文件。当应用程序后续包含该文件时，注入的有效载荷将被执行，导致服务器端完全沦陷。"
published = "2018-03-27"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nvd"
sources = ["unknown"]
title = "osCommerce 2.3.4.1安装程序未经验证的配置文件注入PHP代码执行"
updated = "2026-06-16"

