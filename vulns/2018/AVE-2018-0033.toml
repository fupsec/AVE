[authenticity]
cve_confidence = "high"
notes = "CVE-2018-25104 由 VulDB 于 2024-10-17 收录。漏洞影响 CoinGate PrestaShop Plugin ≤ 1.2.7。修复版本 v1.2.8 中通过增加 cart_id 与 order_id 的校验修复了该逻辑缺陷。截至 2026 年 7 月，未发现公开 PoC/EXP 或 Nuclei 模板，但可根据补丁差异编写 PoC 脚本进行验证。"
poc_confidence = "medium"

[basic]
description = "CoinGate PrestaShop 支付插件 1.2.7 及之前版本中存在业务逻辑漏洞，位于 modules/coingate/controllers/front/callback.php 文件的 postProcess 函数中。支付回调处理过程中未验证订单 ID（order_id）与购物车 ID（cart_id）的一致性，攻击者可构造特制的回调请求，在未实际完成支付的情况下将订单状态标记为已支付，造成商户经济损失。"
published = "2024-10-17"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 5.5
