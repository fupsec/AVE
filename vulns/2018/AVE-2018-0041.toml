nuclei_templates = []

[remediation]
fix = "将设备部署在封闭网络或使用防火墙进行保护。参考 Phoenix Contact 官方安全公告。"
workaround = "如无法升级或打补丁，建议将 ILC 1x1 设备置于封闭网络中运行，或使用适当的防火墙限制网络流量。"
steps = ["步骤1: 确认设备型号是否为 ILC 131 / ILC 151 / ILC 171 / ILC 191 ETH", "步骤2: 将设备部署在封闭网络或配置防火墙规则限制非必要的网络流量", "步骤3: 参考 Phoenix Contact 应用说明 www.phoenixcontact.com/assets/downloads 获取详细防护措施"]

