title = "Phoenix Contact ILC 1x1 拒绝服务漏洞"
description = "Phoenix Contact ILC 1x1 系列工业控制器存在未受控资源消耗漏洞。未经身份验证的远程攻击者可通过在 IEC 61131 程序中创建大量网络流量，导致设备资源耗尽，造成拒绝服务。该漏洞影响所有固件版本的 ILC 131、ILC 151、ILC 171 和 ILC 191 ETH 控制器。"
