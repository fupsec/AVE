[basic]
title = "Phoenix Contact ILC 1x1 ETH 拒绝服务漏洞"
description = "未经身份验证的远程攻击者可通过向 ILC 设备发送大量网络流量，导致 IEC 61131 程序处理过程中出现不受控制的资源消耗，造成设备拒绝服务。一旦网络负载消失，ILC 将恢复正常状态。"
severity = "HIGH"
source = "cert-vde"
published = "2018-08-13"
updated = "2026-06-16"

