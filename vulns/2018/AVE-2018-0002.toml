notes = "CVE-2018-11816 由 Qualcomm 于 2018 年 5 月安全公告中披露，2024 年 11 月由 NVD 正式收录。漏洞为 Qualcomm Snapdragon MediaServer 中 Binder 请求处理导致的堆释放后使用（Heap UAF），需本地访问权限触发。CVE 状态标记为已修补（patched）。截至 2026 年 7 月，未发现公开 PoC/EXP 或 Nuclei 模板。NVD 评分 CVSS v3.1 7.8（HIGH），CNA 为 Qualcomm, Inc.。CISA ADP 评估利用可能性为 none，自动化程度为 no。"
poc_confidence = "none"

[basic]
description = "Qualcomm Snapdragon 多款芯片组中的 MediaServer 组件存在释放后使用（Use After Free）漏洞。攻击者通过构造特制的 Binder 请求触发堆释放后使用（Heap UAF），导致本地权限提升，可造成信息泄露、系统崩溃或任意代码执行。受影响芯片组包括 SD660、SD670、SD820、SD821、SD835、APQ8016、APQ8017、APQ8039、APQ8052、APQ8056、APQ8076、AQT1000、AR6003、9206 LTE Modem 等多款 Snapdragon 平台。"
