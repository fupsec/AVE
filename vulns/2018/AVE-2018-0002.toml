[basic]
title = "Qualcomm Snapdragon MediaServer 释放后使用漏洞"
description = "Qualcomm Snapdragon 多款芯片组中的 MediaServer 组件存在释放后使用（Use After Free）漏洞。攻击者通过构造特制的 Binder 请求触发堆释放后使用，导致本地权限提升，可造成信息泄露、系统崩溃或任意代码执行。受影响芯片组包括 SD660、SD670、SD820、SD821、SD835 等多款 Snapdragon 平台。"
severity = "HIGH"
source = "avd"
published = "2018-05-07"
updated = "2024-11-26"

