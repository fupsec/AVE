[basic]
title = "Django-Helpdesk 允许敏感数据暴露（CVE-2018-25111）"
description = "django-helpdesk 1.0.0 之前的版本因 models.py 中使用 os.umask(0) 而存在敏感数据泄露漏洞。该函数调用将文件创建掩码设置为 0，禁用了默认权限限制，导致应用程序创建的文件可能继承过度宽松的访问控制，从而使工单附件、用户详情或系统日志等敏感数据暴露给未授权用户。攻击者可利用此不安全的权限设置读取或修改敏感信息。"
severity = "MEDIUM"
source = "nvd"
published = "2025-05-31"
updated = "2025-06-17"

