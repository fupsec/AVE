[remediation]
fix = "上述D-Link DIR系列路由器型号已停止支持，厂商不再提供安全更新。建议立即更换为受支持的最新路由器设备，并确保固件保持最新。"
steps = [
    "1. 确认设备型号是否为受影响型号（DIR-110/DIR-412/DIR-600/DIR-610/DIR-615/DIR-645/DIR-815）",
    "2. 检查固件版本是否为1.03或更早版本",
    "3. 在防火墙层面限制对路由器管理端口（通常为80/443）的访问",
    "4. 考虑更换为仍在支持周期内的新型号路由器",
]
workaround = "如无法立即更换设备，可在路由器管理界面禁用远程管理功能，限制对Web管理端口的网络访问（仅允许受信任的内部IP访问），并监控异常流量。"

