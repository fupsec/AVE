[affected]
product = "DIR系列路由器（DIR-110, DIR-412, DIR-600, DIR-610, DIR-615, DIR-645, DIR-815）"
vendor = "D-Link"

[authenticity]
cve_confidence = "high"
notes = "CVE-2018-25115于2025年8月由VulnCheck分配。漏洞在2018年已被公开（Exploit-DB 43496发布于2018-01-10），但由于从未被分配CVE编号，直到2025年Shadowserver Foundation观测到野外利用后才被VulnCheck追溯分配。所有受影响路由器型号已停止支持（End of Life）。CWE-78命令注入，远程未授权RCE。CVSS v4.0评分10.0（严重）。"
poc_confidence = "high"

[basic]
description = "多款D-Link DIR系列路由器（包括DIR-110、DIR-412、DIR-600、DIR-610、DIR-615、DIR-645、DIR-815）固件版本1.03中存在漏洞，位于service.cgi端点。该漏洞源于EVENT=CHECKFW参数在未经过滤的情况下直接传递给系统shell，远程攻击者无需认证即可通过特制的HTTP POST请求注入任意系统命令，以root权限执行，导致设备完全沦陷。上述路由器型号已停止支持。"
published = "2025-08-27"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nvd"
sources = ["unknown"]
title = "D-Link DIR系列路由器 service.cgi OS命令注入漏洞"
updated = "2026-06-16"

