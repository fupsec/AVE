]
exp = []
nuclei_templates = []

[remediation]
fix = "ABUS 已针对受影响设备推出更换计划（replacement program）。由于相关设备已停产且固件不再更新，建议用户立即停用受影响摄像机，或将其隔离在独立 VLAN/网络中，并实施严格的防火墙规则。"
workaround = "如无法立即更换设备，可将摄像机隔离在独立网络 VLAN 中，限制其互联网访问，禁用 UPnP 功能，并更改默认管理员密码。"
steps = ["确认设备型号是否在受影响列表中（TVIP10000/TVIP20000/TVIP31000 等数十款）", "将摄像机隔离在独立网络 VLAN 中，禁止直接暴露在公网", "禁用 UPnP 功能（若设备支持）", "联系 ABUS 客服申请更换计划", "考虑更换为有安全更新的替代设备"]

