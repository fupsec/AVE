[basic]
title = "ABUS TVIP 系列摄像机操作系统命令注入漏洞"
description = "ABUS TVIP 系列摄像机中的 CGI 脚本未对用户输入进行充分过滤，直接将参数传递给 system() 函数处理。攻击者可通过在参数中注入 shell 元字符（如 $(command)）以 root 权限执行任意命令，从而完全控制设备。受影响机型包括 TVIP10000、TVIP10001、TVIP10005、TVIP20000、TVIP31000 等数十款紧凑型、球型、半球型及枪型摄像机。"
severity = "CRITICAL"
source = "nvd"
published = "2018-12-31"
updated = "2026-06-16"

[score]
cvss_v3 = 9.8
cvss_v3_vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"

[affected]
vendor = "ABUS"
product = "TVIP 系列摄像机（TVIP10000/TVIP20000/TVIP31000 等）"

