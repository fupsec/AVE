[basic]
title = "Linux Kernel USB 端点描述符未经验证漏洞(CVE-2016-20022)"
description = """
Linux kernel 4.8 之前版本中，drivers/usb/core/config.c 的 usb_parse_endpoint 函数未验证端点描述符的 wMaxPacketSize 字段，可触发越界读取（CWE-125），导致信息泄露或系统崩溃。
本地攻击者可通过插入恶意 USB 设备触发此漏洞提升权限。
该漏洞仅影响厂商不再支持的产品。
"""
severity = "HIGH"
score = 8.4
sources = ["nvd", "avd"]
published = "2024-06-27"
updated = "2026-06-16"
remediation = "升级至 Linux kernel 4.8 及以上版本"

