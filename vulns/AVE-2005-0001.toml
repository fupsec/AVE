[basic]
title = "HP OpenView Network Node Manager 远程命令执行漏洞"
description = "HP OpenView Network Node Manager 6.2至7.50版本中存在命令注入漏洞，远程攻击者可通过向connectedNodes.ovpl、cdpView.ovpl、freeIPaddrs.ovpl和ecscmg.ovpl脚本的node参数传递shell元字符来执行任意命令。该漏洞已列入CISA已知被利用漏洞目录（KEV），确认在野活跃利用。"
