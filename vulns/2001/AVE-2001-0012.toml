[basic]
description = "SimpleServer:WWW 1.13及更早版本存在目录遍历漏洞（CWE-22）。远程攻击者可通过向cgi-bin目录发送包含编码后的../序列（%2E%2E%2F）的HTTP请求，绕过路径访问限制，执行任意程序。该漏洞与CVE-2000-0664不同，攻击者利用此漏洞可在未授权情况下实现远程代码执行，完全控制受影响服务器。"
published = "2010-02-12"
remediation = "建议升级SimpleServer:WWW至最新版本（1.13以上），或限制cgi-bin目录的访问权限，对用户输入进行严格的路径规范化处理，阻止编码后的目录遍历序列。"
score = 10.0
severity = "CRITICAL"
sources = ["nvd"]
title = "SimpleServer:WWW 1.13及更早版本目录遍历漏洞"
updated = "2010-02-13"

