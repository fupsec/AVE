[basic]
description = "SimpleServer:WWW 1.13及更早版本中存在目录遍历漏洞（CWE-22）。远程攻击者可通过向cgi-bin/目录发送经过编码的../序列（%2E%2E%2F%）来绕过路径限制，进而读取或执行服务器上的任意文件与程序。该漏洞利用复杂度低，无需身份认证即可远程触发，可导致服务器完全受控。"
published = "2001-07-01"
remediation = "建议升级至SimpleServer:WWW 1.14或更高版本。若无法升级，应限制对cgi-bin/目录的访问权限，并在Web服务器层面对URL中的编码字符进行过滤。同时移除不必要的CGI脚本以防止被利用。"
score = 10.0
severity = "CRITICAL"
sources = ["NVD"]
title = "SimpleServer:WWW 1.13及更早版本目录遍历漏洞"
updated = "2026-06-16"

