[basic]
description = "CVE-2001-0810 是由 MITRE 于 2001 年为 Silicon Graphics（SGI）分配的候选漏洞编号，但申请方 SGI 最终未将任何真实存在的安全缺陷与此编号关联。因此该候选编号于 2017 年被 CVE 官方标记为已撤销（REJECTED）状态，并于 2023 年由 SGI 更新确认。该编号不代表任何真实安全漏洞，不应被纳入漏洞追踪或风险评估体系。"
published = "2017-05-12"
remediation = "该编号已被 CVE 官方撤销，申请方 Silicon Graphics（SGI）未关联任何实际安全漏洞，无需执行修复操作。"
