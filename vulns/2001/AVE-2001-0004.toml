[basic]
  title = "ncompress comprexx 函数栈缓冲区溢出漏洞"
  description = "ncompress 4.2.4 及更早版本中的 comprexx 函数存在栈缓冲区溢出漏洞。当该函数在跨越安全边界的环境（如 FTP 服务器）中使用时，远程攻击者可通过提供超长文件名参数执行任意代码。"
