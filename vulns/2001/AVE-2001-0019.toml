[basic]
description = "a2ps 4.14及之前版本的lib/routines.h文件中tempname_ensure函数存在不安全文件创建漏洞（CWE-59）。该函数被spy_user函数及其他函数调用时，未能正确验证临时文件路径的安全性，允许本地攻击者通过符号链接攻击利用该漏洞修改任意文件，导致系统文件完整性受损。"
published = "2014-04-05"
remediation = "建议升级a2ps至已修复版本，或应用Fedora提供的a2ps-4.13-security.patch补丁。Debian系统用户可参考DSA-2892安全公告更新a2ps软件包以修复临时文件处理漏洞。"
score = 2.1
severity = "LOW"
sources = [
    "nvd",
    "debian",
    "redhat",
]
title = "a2ps 4.14 及更早版本 tempname_ensure 函数符号链接攻击漏洞"
updated = "2014-04-06"

