[basic]
description = "Apache JServ 1.1.2版本中jserv.conf文件的jserv-status处理器默认配置包含'allow from 127.0.0.1'规则，允许本地用户通过直接请求jserv/ URI来发现JDBC密码或其他敏感配置信息，属于不安全的默认配置引发的信息泄露问题。"
published = "2011-10-04"
remediation = "修改Apache JServ的jserv.conf配置文件，删除或注释jserv-status处理器中的allow规则，限制本地用户对jserv/路径的直接访问，或升级到已修复版本。"
score = 2.1
severity = "LOW"
sources = ["nvd"]
title = "Apache JServ jserv-status处理器配置错误导致敏感信息泄露漏洞"
updated = "2011-10-05"

