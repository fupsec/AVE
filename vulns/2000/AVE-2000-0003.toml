[basic]
description = "Apache JServ 1.1.2版本的jserv.conf中jserv-status处理器的默认配置包含allow from 127.0.0.1行，允许本地用户通过直接请求jserv/URI路径发现JDBC数据库密码或其他敏感配置信息，属于配置不当导致的信息泄露漏洞（CWE-16）。"
published = "2011-10-04"
remediation = "修改Apache JServ的jserv.conf配置文件，移除jserv-status处理器的allow from 127.0.0.1配置项，或限制仅授权管理员可访问，或升级至不受影响的更高版本。"
score = 2.1
severity = "LOW"
sources = [
    "nvd",
    "avd",
]
title = "Apache JServ jserv-status处理器默认配置信息泄露漏洞"
updated = "2011-10-05"

