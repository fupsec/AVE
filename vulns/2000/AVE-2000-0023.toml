[remediation]
fix = "升级 Red Hat Linux 至修复版本或迁移到受支持的 Linux 发行版。Red Hat 已发布安全公告 RHSA-1999:014。"
workaround = "如无法立即升级，可手动重新挂载 /dev/pts 并设置安全权限模式（如 mode=620），限制写入权限仅限授权用户。同时限制本地用户访问，启用 SELinux 或 AppArmor 进行强制访问控制。"
steps = ["步骤1: 确认系统版本是否为 Red Hat Linux 6.0", "步骤2: 升级到修复版本或迁移到受支持的 Linux 发行版", "步骤3: 若暂时无法升级，手动 remount /dev/pts 并设置 mode=620"]

