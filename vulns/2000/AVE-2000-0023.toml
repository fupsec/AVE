[basic]
title = "Red Hat Linux 6.0 /dev/pts 文件系统权限配置不当漏洞"
description = "Red Hat Linux 6.0 安装 /dev/pts 文件系统时使用了不安全的权限模式，本地用户可写入其他 tty 设备，导致终端会话被干扰或劫持。"
