[basic]
title = "drm/amd/pm: 修复 gpu_metrics_table 潜在的内存泄漏"
description = "在 Linux 内核的 drm/amd/pm 驱动中，内存在 renoir_init_smc_tables() 函数中为 gpu_metrics_table 分配，但在 smu_v12_0_fini_smc_tables() 函数中未被释放，导致潜在的内存泄漏。"
severity = "MEDIUM"
source = "msrc"
