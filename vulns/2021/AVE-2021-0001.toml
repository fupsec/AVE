[remediation]
fix = "升级 Linux 内核到 5.17 或更高版本，或应用补丁 https://git.kernel.org/stable/c/583637d66a70fc7090e12fb0ebbacc33d39e2214。"
workaround = "限制本地用户访问 GPU 设备文件（/dev/dri/*），降低被利用风险。"
steps = ["步骤1: 使用 uname -r 确认当前内核版本", "步骤2: 若版本低于 5.17，升级内核到 5.17 或更高版本", "步骤3: 重启系统使新内核生效"]

