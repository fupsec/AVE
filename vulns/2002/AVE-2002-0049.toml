[id]
ave_id = "AVE-2002-0049"
cve_id = "CVE-2002-1175"
aliases = ["CVE-2002-1175", "EUVD-2002-1159"]

[basic]
title = "Fetchmail getmxrecord函数DNS响应边界检查漏洞导致拒绝服务"
description = "Fetchmail 6.0.0及更早版本中的getmxrecord函数在处理来自恶意DNS服务器的畸形DNS数据包时，未能正确检查数据边界。当Fetchmail尝试读取超出预期边界的数据时，远程攻击者可利用此漏洞导致程序崩溃，造成拒绝服务。该漏洞仅在Fetchmail使用multidrop模式（启用multiple-local-recipients功能）时可被利用。"
severity = "MEDIUM"
score = 5.0
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L"
published = "2002-09-30"
updated = "2002-10-07"
remediation = "升级Fetchmail至6.1.0或更高版本。Red Hat用户可升级至RHSA-2002:215-09 errata软件包。Debian用户可通过DSA-171安全公告获取修复版本。若暂无法升级，建议避免在multidrop模式下使用Fetchmail，或限制对不可信DNS服务器的访问。"
sources = ["osv", "redhat", "debian", "nvd"]

[affected]
vendor = "Fetchmail Project"
product = "Fetchmail"
versions = ["6.0.0", "6.0.0及更早版本"]

