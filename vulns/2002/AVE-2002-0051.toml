[affected]
product = "heartbeat"
vendor = "linux-ha"

[basic]
description = "heartbeat 0.4.9及更早版本中存在多个格式化字符串漏洞。远程攻击者可通过向UDP 694端口发送特制数据包，利用程序对用户输入数据未正确进行格式化字符串处理，触发格式化字符串缺陷，导致任意代码执行，获得服务器的完全控制权。该漏洞严重影响Linux高可用性集群环境的稳定性与安全性。"
published = "2002-09-01"
remediation = "升级 heartbeat 至 0.4.9 之后的安全版本，或安装 Debian 等厂商提供的安全补丁（DSA-174）。同时在防火墙上限制 UDP 694 端口的访问，仅允许受信任的集群节点之间通信，以降低远程攻击风险。"
score = 10.0
severity = "CRITICAL"
sources = [
    "osv",
    "nvd",
]
title = "Linux-HA heartbeat 格式化字符串远程代码执行漏洞"
updated = "2024-11-20"

