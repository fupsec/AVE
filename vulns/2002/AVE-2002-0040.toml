[basic]
title = "Purity 多重缓冲区溢出漏洞"
description = "Purity 1-16版本存在多个缓冲区溢出漏洞。该软件在处理游戏数据时未正确检查输入长度，导致本地攻击者可通过精心构造的输入触发缓冲区溢出，进而获取系统权限并修改高分榜数据。攻击者需要本地访问权限，无需用户交互即可利用。"
severity = "HIGH"
score = 7.2
remediation = "升级 purity 至已修复版本，或参考 Debian 安全公告 DSA-166 应用相关补丁。建议限制本地用户对 purity 游戏的执行权限以降低风险。"
published = "2002-09-24"
updated = "2002-09-24"
sources = ["nvd", "osv"]

