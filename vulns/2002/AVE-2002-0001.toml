[basic]
title = "Microsoft Windows 权限提升漏洞 (DebPloit)"
description = "Windows NT 和 Windows 2000 的 smss.exe 调试子系统未能正确认证连接到其他程序的程序，允许本地用户通过复制特权进程的句柄来获取管理员或 SYSTEM 权限，该漏洞被称为 DebPloit。"
severity = "HIGH"
source = "kev"
published = "2002-06-25"
updated = "2026-06-16"

