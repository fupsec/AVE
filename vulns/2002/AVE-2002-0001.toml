[basic]
title = "Microsoft Windows NT/2000 smss.exe 调试子系统权限提升漏洞"
description = "Windows NT 和 Windows 2000 的 smss.exe 调试子系统未能正确验证连接到其他程序的程序，允许本地用户通过复制特权进程的句柄来获取管理员或 SYSTEM 权限。该漏洞被 DebPloit 工具演示利用，属于权限管理不当漏洞（CWE-269），影响 Microsoft Windows NT 4.0 和 Windows 2000 系统，已纳入 CISA KEV 目录。"
severity = "HIGH"
score = 7.8
sources = ["kev", "nvd"]
published = "2002-06-25"
updated = "2026-06-16"
remediation = "安装 Microsoft 安全公告 MS02-024 提供的更新补丁，升级至 Windows 2000 Service Pack 3 或更高版本。对于 Windows NT 4.0，安装最新的安全更新汇总。"

