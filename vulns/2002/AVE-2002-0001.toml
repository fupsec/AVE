[remediation]
fix = "安装 Microsoft 安全公告 MS02-024 (KB Q320206) 提供的更新补丁，升级到 Windows 2000 Service Pack 3 或更高版本。"
workaround = "限制本地用户交互式登录权限，限制不受信任用户对系统的物理或终端访问。"
steps = [
  "确认操作系统版本：Windows NT 4.0 / Windows 2000",
  "从 Microsoft 下载并安装 MS02-024 (KB Q320206) 补丁",
  "如无法安装补丁，升级到 Windows 2000 Service Pack 3 或更高版本",
  "限制不必要的用户账户的本地登录权限"
]

