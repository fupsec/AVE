[basic]
title = "GNU tar 1.13.19及之前版本符号链接攻击漏洞"
description = "GNU tar 1.13.19及其他1.13.25之前的版本存在安全漏洞，由于安全机制检查被禁用，远程攻击者可通过符号链接攻击覆盖目标系统上的任意文件，导致任意文件写入或系统受损。攻击者可以利用恶意的tar压缩包，在解压过程中通过符号链接将文件写入任意路径。"
severity = "MEDIUM"
score = 5.0
sources = ["osv"]
published = "2002-10-28"
updated = "2026-06-16"
remediation = "升级至GNU tar 1.13.25或更高版本，避免解压来自不可信来源的tar包"

