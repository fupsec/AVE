[basic]
title = "Squid msntauth 认证模块格式字符串漏洞"
description = "Squid 2.4.STABLE6及更早版本中Stellar-X msntauth认证模块的allowuser代码存在格式字符串漏洞。远程攻击者可通过向Squid服务发送包含特制格式字符串的用户名，在syslog调用中触发该漏洞，导致任意代码执行、信息泄露或服务拒绝。该漏洞影响Squid代理服务器的身份认证功能，攻击者无需认证即可利用。"
severity = "HIGH"
score = 7.5
published = "2002-10-04"
updated = "2026-06-16"
sources = ["osv", "nvd"]
remediation = "升级Squid至2.4.STABLE7或更高版本，该版本修复了msntauth认证模块allowuser代码中格式字符串未正确处理的漏洞。如无法升级，可禁用msntauth认证模块或限制对Squid服务的网络访问。"

