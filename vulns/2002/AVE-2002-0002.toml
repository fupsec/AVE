[remediation]
fix = "升级到 Sendmail 8.12.5 或更高版本。参考官方安全公告 https://web.archive.org/web/20021017031109/http://www.sendmail.org/8.12.5.html"
workaround = "如无法升级，可采取以下缓解措施：1) 禁用 DNS map TXT 记录查询功能；2) 使用防火墙限制对内部 DNS 服务器的访问；3) 部署入侵检测系统监控异常 DNS 响应。"
steps = ["步骤1: 确认 Sendmail 版本", "步骤2: 下载 Sendmail 8.12.5", "步骤3: 编译并安装新版本", "步骤4: 重启 Sendmail 服务"]

