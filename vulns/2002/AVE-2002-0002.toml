[basic]
description = "OpenSSH 2.9.9至3.3版本中的sshd存在整数溢出漏洞。在启用SKEY或BSD_AUTH认证时，远程攻击者可通过挑战响应认证（ChallengeResponseAuthentication）过程中的特制认证请求触发整数溢出，导致任意代码执行，完全控制目标系统。"
published = "2002-06-27"
remediation = "升级OpenSSH至3.4或更高版本，禁用SKEY和BSD_AUTH认证，或参考CERT/CC CA-2002-18及各大厂商安全公告安装对应补丁。"
score = 9.8
