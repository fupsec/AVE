[basic]
title = "Heimdal kadmind 和 kdc 服务器多缓冲区溢出漏洞"
description = "Heimdal Kerberos 5 实现 0.5 版本之前存在多个缓冲区溢出漏洞，影响 kadmin（kadmind）和 kdc 服务器。远程攻击者可利用精心构造的请求触发缓冲区溢出，导致拒绝服务或以 root 权限执行任意代码。成功利用此漏洞可完全控制目标系统。"
severity = "CRITICAL"
score = 10.0
sources = ["osv"]
published = "2002-10-28"
updated = "2026-06-16"
remediation = "升级 Heimdal 至 0.5 或更高版本，或应用厂商发布的安全补丁。Debian 系统可通过 apt-get 升级 heimdal 软件包。"

