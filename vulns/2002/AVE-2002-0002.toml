[basic]
title = "Sendmail DNS TXT记录查询缓冲区溢出漏洞"
description = "Sendmail 8.12.5之前版本中，当配置使用自定义DNS映射（custom DNS map）查询TXT记录时存在缓冲区溢出漏洞。远程攻击者可通过控制恶意DNS服务器，向目标Sendmail服务器发送特制的DNS响应，触发栈缓冲区溢出，导致邮件服务拒绝服务并以邮件服务器权限执行任意代码。该漏洞影响广泛部署的Sendmail邮件传输代理，攻击条件要求Sendmail启用自定义DNS map功能。"
severity = "HIGH"
score = 7.5
published = "2002-10-04"
updated = "2026-06-16"
remediation = "升级Sendmail至8.12.5或更高版本，禁用不信任的DNS服务器查询，限制邮件服务器对外的DNS请求范围。"
sources = ["osv", "tenable", "nvd"]

