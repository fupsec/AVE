[basic]
description = "Canna 3.5b2 及更早版本中的 irw_through 函数存在缓冲区溢出漏洞。本地攻击者可向 irw_through 函数发送特制输入触发栈缓冲区溢出，从而以 bin 用户身份执行任意代码，导致本地权限提升。"
published = "2002-12-18"
remediation = "升级 Canna 至 3.6p1-1 或更高版本。各 Linux 发行版请参考相应安全公告：Debian 升级至 3.5b2-46.2（woody）或 3.6p1-1（sid），Red Hat 参考 RHSA-2002:246/RHSA-2002:261/RHSA-2003:115。"
score = 7.2
severity = "HIGH"
sources = ["osv", "nvd"]
title = "Canna irw_through 函数缓冲区溢出漏洞"
updated = "2026-06-16"

