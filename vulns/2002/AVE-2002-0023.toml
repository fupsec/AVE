[basic]
  title = "SLRN slrnpull 缓冲区溢出本地权限提升漏洞"
  description = "SLRN 软件包中的 slrnpull 程序存在缓冲区溢出漏洞。当 slrnpull 以 setuid 或 setgid 权限安装时，本地用户可通过向 -d (SPOOLDIR) 参数传入超长字符串触发缓冲区溢出，从而获取提升的权限。"
  severity = "HIGH"
  source = "nvd"
