[remediation]
fix = "升级 Apache HTTP Server 到 2.0.43 或 1.3.27 及以上版本。参考官方安全公告：http://httpd.apache.org/security/vulnerabilities_20.html 和 http://httpd.apache.org/security/vulnerabilities_13.html。"
workaround = "在无法升级的情况下，设置 UseCanonicalName On 以禁用 Host 头反射到错误页面。"
steps = ["步骤1: 确认 Apache HTTP Server 版本", "步骤2: 升级到 2.0.43（2.x 系列）或 1.3.27（1.3.x 系列）以上版本", "步骤3: 如无法升级，在配置中设置 UseCanonicalName On 并重启服务"]

