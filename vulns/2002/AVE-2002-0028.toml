[basic]
  title = "Apache HTTP Server 默认错误页面跨站脚本（XSS）漏洞"
  description = "Apache 2.0（2.0.43 之前版本）和 1.3.x（1.3.27 之前版本）中，当 UseCanonicalName 配置为 Off 且服务器支持通配符 DNS 解析时，默认错误页面存在跨站脚本（XSS）漏洞。远程攻击者可通过构造恶意的 Host: 头部，在错误页面中注入并执行任意脚本，从而窃取其他访问者的 Cookie 或会话信息。此漏洞不同于 CAN-2002-1157。"
  severity = "MEDIUM"
  source = "nvd"
  published = "2002-10-11"
  updated = "2024-11-20"

