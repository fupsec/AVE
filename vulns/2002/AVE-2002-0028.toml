notes = "漏洞信息来源于 NVD 和多个安全公告。XSS 通过 Host 头部注入，在 UseCanonicalName Off 且 wildcard DNS 环境下可触发。经搜索 GitHub、Exploit-DB、Packet Storm、Sploitus 未找到公开 PoC/EXP 仓库，但漏洞原理明确，可生成 HTTP PoC 脚本。"

