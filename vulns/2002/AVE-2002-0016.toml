[basic]
description = "GoAhead WebServer 2.1.1之前版本的安全处理程序存在安全绕过漏洞。远程攻击者可通过在URL中添加额外的斜杠字符，绕过身份验证机制，获取受保护Web内容的未授权访问权限。此漏洞与CVE-2002-1603不同。"
published = "2009-02-06"
remediation = "升级GoAhead WebServer至2.1.1或更高版本，该版本修复了URL中添加额外斜杠可绕过安全特性的问题。"
