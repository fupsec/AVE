[affected]
product = "xinetd 2.3.4"
vendor = "xinetd"

[authenticity]
cve_confidence = "high"
notes = "CVE 由 NVD 官方收录。CVSS v2 评分 2.1 (LOW)。该漏洞为 xinetd 2.3.4 中的文件描述符泄露（FD leak）漏洞，属于本地拒绝服务（DoS）问题。由于是本地非 HTTP 漏洞，且影响 xinetd 的内部进程间通信机制，无法生成 HTTP PoC 检测脚本。经搜索 GitHub、Exploit-DB、PacketStorm、Sploitus 等平台，未检索到公开 PoC/EXP 脚本。漏洞原理为 xinetd 在 fork 启动子服务时未关闭信号管道的写端文件描述符，导致子进程可通过该管道向 xinetd 发送 SIGHUP 等信号造成 DoS。"
poc_confidence = "low"

[basic]
description = "xinetd 2.3.4 在启动服务时泄漏信号管道的文件描述符，被启动的服务可利用该管道文件描述符发送信号，导致 xinetd 拒绝服务。"
published = "2002-09-05"
remediation = "Refer to vendor advisory and upgrade to fixed version."
