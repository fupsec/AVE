[basic]
title = "Net-SNMP snmpd handle_var_requests 空指针解引用拒绝服务漏洞"
description = "Net-SNMP（前身为 ucd-snmp）5.0.1 至 5.0.5 版本中的 SNMP 守护进程 snmp_agent.c 文件存在空指针解引用漏洞。攻击者在已知 SNMP 社区字符串（如默认的 public 只读字符串）的前提下，可向目标 snmpd 服务发送特制的 SNMP 数据包，使 handle_var_requests 函数在遍历 treecache 数组时因 asp->treecache_num 为 NULL 而绕过循环条件检查，随后解引用 NULL 指针导致进程崩溃（SIGSEGV），造成拒绝服务。该漏洞影响任何未修改默认社区字符串的 Net-SNMP 安装实例。"
published = "2002-10-11"
updated = "2002-10-11"
severity = "MEDIUM"
score = 5.0
cvss_v2 = "AV:N/AC:L/Au:N/C:N/I:N/A:P"
sources = ["nvd", "osv", "redhat"]
remediation = "将 Net-SNMP 升级至 5.0.6 或更高版本。如使用 Red Hat Linux 8.0，可通过 Red Hat Network 应用 RHSA-2002:228-11 安全公告中的更新包进行修复。升级前应修改所有默认的 SNMP 社区字符串（特别是 public），限制 SNMP 访问来源，并通过防火墙限制 161/UDP 端口的访问。"

