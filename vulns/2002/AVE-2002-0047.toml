[basic]
title = "Net-SNMP SNMP代理handle_var_requests函数NULL指针解引用拒绝服务漏洞"
description = "Net-SNMP（前身为ucd-snmp）5.0.1至5.0.5版本中SNMP守护进程的snmp_agent.c文件内handle_var_requests函数存在空指针解引用漏洞。远程攻击者可通过向目标系统发送特制的SNMP请求，触发该函数中的NULL指针解引用，导致SNMP守护进程崩溃（拒绝服务）。攻击者无需认证即可利用此漏洞，仅需网络访问SNMP服务端口（默认UDP/161）。该漏洞影响网络设备的管理和监控能力，可能导致管理员无法通过SNMP协议获取设备状态信息。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = "AV:N/AC:L/Au:N/C:N/I:N/A:P"
remediation = "升级Net-SNMP至5.0.6或更高版本。Red Hat Enterprise Linux用户应应用RHSA-2002:228安全公告中的补丁。临时缓解措施包括：使用防火墙规则限制SNMP服务仅允许受信任的IP地址访问；考虑禁用SNMP服务或将其限制在内部网络中；建议迁移至SNMPv3协议以增强认证和加密保护。"
published = "2002-10-11"
updated = "2024-08-08"
sources = ["nvd", "osv", "ghsa", "redhat"]

