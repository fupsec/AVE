[basic]
title = "Net-SNMP snmpd 空指针解引用拒绝服务漏洞"
description = "Net-SNMP（前身为 ucd-snmp）5.0.1 至 5.0.5 版本的 SNMP 守护进程（snmpd）中的 handle_var_requests 函数存在空指针解引用漏洞。远程攻击者可以通过发送特制的 SNMP 数据包，在未建立会话的情况下触发 asp->treecache_num 为 NULL 时进入 for 循环，导致 snmpd 尝试解引用空指针并触发 SIGSEGV 崩溃，造成拒绝服务。利用该漏洞需要知道有效的 SNMP 社区字符串（如默认的 public）。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = 5.0
published = "2002-10-11"
updated = "2016-10-17"
remediation = "升级 Net-SNMP 至 5.0.6 或更高版本；修改默认 SNMP 社区字符串（public/private），限制 SNMP 访问来源 IP；在不需要 SNMP 的环境中禁用 snmpd 服务。"
sources = ["nvd", "osv", "bugtraq", "jvn"]

