notes = "CVE 由 NVD 官方收录，SecurityFocus BID 4746 确认。该漏洞为 Swatch 日志监控工具的节流（throttle）机制设计缺陷，非 HTTP 协议漏洞，无法生成 HTTP PoC 脚本。未在 GitHub、Exploit-DB、PacketStorm 等平台发现公开可用的 PoC/EXP 脚本或 Nuclei 模板。"
poc_confidence = "low"

[basic]
description = "Swatch（Simple WATCHer）日志监控工具的节流（throttle）功能存在设计缺陷，当 (1) 同一类型事件在节流周期结束后再次发生，或 (2) 多个匹配同一 watchfor 表达式的事件未在节流周期内发生时，可能无法正确报告安全事件，导致攻击者可绕过检测。"
published = "2002-10-04"
remediation = "升级 Swatch 到 3.0.4-1 或更高版本（Debian unstable），或应用相关发行版提供的补丁。"
