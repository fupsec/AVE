[basic]
title = "Swatch 节流（Throttle）功能绕过漏洞"
description = "Swatch 的节流（throttle）功能在以下两种情况下可能无法报告特定事件：(1) 同一类型事件在节流周期后再次发生；(2) 匹配同一 \"watchfor\" 表达式的多个事件未在节流周期内发生。攻击者可利用此漏洞绕过检测机制，隐藏恶意行为。"
