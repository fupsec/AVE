[basic]
title = "Diffie-Hellman密钥交换协议D(HE)ater拒绝服务漏洞"
description = "Diffie-Hellman密钥交换协议存在拒绝服务漏洞（D(HE)ater攻击），远程攻击者作为客户端可发送非公钥的任意数值，触发服务器端昂贵的DHE模幂计算，导致CPU资源耗尽。攻击者仅需极少的客户端CPU资源和网络带宽即可实施攻击，可强制服务器选择最大密钥长度进行DHE计算，在TLS握手过程中造成服务不可用。"
severity = "HIGH"
score = 7.5
cvss_v3 = "AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
remediation = "建议升级至修复版本或配置TLS禁用DHE密码套件，仅使用ECDHE替代。对于受影响的F5、Siemens、Aruba、StormShield、SUSE等产品，请参考各厂商安全公告进行修复。服务器应限制DHE密钥大小并优先配置TLS 1.3以降低风险。"
published = "2021-11-11"
updated = "2026-06-16"
sources = ["tenable", "nvd"]

[affected]
vendor = "多种厂商"
product = "TLS/SSL实现"

