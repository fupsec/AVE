[basic]
title = "Sendmail DNS响应处理缓冲区溢出漏洞"
description = "Sendmail 8.12.5之前版本中，当配置使用自定义DNS映射查询TXT记录时，存在缓冲区溢出漏洞。远程攻击者可通过恶意DNS服务器利用该漏洞造成拒绝服务，甚至可能执行任意代码。攻击者无需身份认证即可远程触发，危害严重。"
severity = "HIGH"
score = 7.5
sources = ["tenable"]
published = "2002-10-04"
updated = "2026-06-16"
remediation = "升级Sendmail至8.12.5或更高版本，避免使用自定义DNS映射查询TXT记录配置。"

