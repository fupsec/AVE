notes = "CVE 由 NVD 官方收录。CVSS v2 评分 2.1 (LOW)。该漏洞为 FAM（File Alteration Monitor）中的文件名称信息泄露漏洞，属于本地信息泄露问题。FAM 通过 famd 守护进程监听本地端口（默认 TCP 900 端口），但漏洞不涉及 HTTP 协议，属于本地非 HTTP 漏洞。经搜索 GitHub、Exploit-DB、PacketStorm、Sploitus 等平台，未检索到公开 PoC/EXP 脚本。无法生成 HTTP PoC 检测脚本。"
poc_confidence = "low"

