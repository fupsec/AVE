[remediation]
fix = "升级 nss_ldap 到 nss_ldap-198 或更高版本。请参考 PADL 官方安全公告。"
workaround = "如无法升级，可在 LDAP 配置中禁用 DNS SRV 记录解析功能（如有此选项），或限制 LDAP 服务器的 DNS 查询来源。"
steps = ["步骤1: 确认当前 nss_ldap 版本（ldapsearch -V）", "步骤2: 从 PADL 下载并安装 nss_ldap-198 或更高版本", "步骤3: 重启使用 nss_ldap 的服务"]

