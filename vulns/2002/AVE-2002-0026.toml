[authenticity]
cve_confidence = "high"
notes = "CVE 由 NVD 官方收录，CVSS 2.0 评分 7.5。nss_ldap 为系统级库，漏洞位于 DNS SRV 解析代码中，属于非 HTTP 协议漏洞，无法生成 HTTP PoC 脚本。原始 PADL 安全公告链接已失效，仅可通过 Wayback Machine 存档或 NVD 获取信息。目前未在 GitHub、Exploit-DB 等平台找到公开 PoC 或 EXP。"
poc_confidence = "low"

[basic]
description = "nss_ldap（Name Service Switch LDAP 模块）在 nss_ldap-198 之前版本的 DNS SRV 代码中存在缓冲区溢出漏洞，允许远程攻击者通过特制的 DNS 响应导致拒绝服务，并可能执行任意代码。"
published = "2002-08-12"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
