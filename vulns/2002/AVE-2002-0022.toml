steps = [
    "步骤1: 确认当前 MHonArc 版本（版本 <= 2.5.2 受影响）",
    "步骤2: 从 https://www.mhonarc.org/ 下载 MHonArc 2.5.3 或更高版本",
    "步骤3: 备份现有配置后升级",
    "步骤4: 验证归档邮件中的 JavaScript 已被正确过滤",
]
workaround = "如无法立即升级，可在 MHonArc 配置中禁用 HTML 邮件处理，将所有邮件作为纯文本归档，以阻止 JavaScript 注入攻击。"

