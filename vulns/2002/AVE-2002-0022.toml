[authenticity]
cve_confidence = "high"
notes = "该漏洞为2002年的历史漏洞，公开可用的PoC代码极为稀少。NVD、ISS、Debian DSA-163及SecurityFocus BID-4546均确认该漏洞存在。漏洞利用方式已在CVE描述中明确说明（SCRIPT标签拆分、IMG SRC注入、&={script}语法），但未找到公开的可执行PoC脚本。"
poc_confidence = "low"

[basic]
description = 'MHonArc 2.5.2 及更早版本未能正确过滤归档电子邮件中的 JavaScript 代码，远程攻击者可通过以下方式在 Web 客户端中执行脚本：(1) 将 SCRIPT 标签拆分为多个小片段；(2) 在 IMG 标签的 SRC 参数中包含脚本；(3) 使用 "&={script}" 语法绕过过滤。'
published = "2002-08-12"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "MHonArc 邮件归档 JavaScript 过滤绕过漏洞"
