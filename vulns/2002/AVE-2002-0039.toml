[basic]
title = "libESMTP read_smtp_response 缓冲区溢出漏洞"
description = "libESMTP 是一个 SMTP 客户端库，用于通过预配置的邮件传输代理提交电子邮件。在 0.8.11 之前版本的 protocol.c 文件中 read_smtp_response 函数存在缓冲区溢出漏洞。远程 SMTP 服务器可以通过发送特制的超长响应数据触发缓冲区溢出，成功利用可导致任意代码执行或拒绝服务。攻击者需要控制 SMTP 服务器并诱使受害客户端连接以触发该漏洞。"
severity = "HIGH"
score = 7.5
cvss_v2 = 7.5
remediation = "升级 libESMTP 至 0.8.11 或更高版本，以修复 read_smtp_response 函数中存在的缓冲区边界检查不足漏洞。"
published = "2002-10-04"
updated = "2002-10-04"
sources = ["osv", "nvd"]

