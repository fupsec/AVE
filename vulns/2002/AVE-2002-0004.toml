[basic]
description = "Heartbeat 0.4.9 及更早版本中存在多个格式化字符串漏洞（部分来源将其描述为缓冲区溢出）。远程攻击者可以通过向 UDP 端口 694 发送特制的数据包，利用该漏洞在目标系统上执行任意代码，从而完全控制服务器。"
published = "2002-01-01T00:00:00Z"
remediation = "请立即升级 Heartbeat 到 0.5.0 或更高版本，或根据发行版（如 Debian DSA-174）的安全更新补丁进行修复。"
score = 9.8
severity = "CRITICAL"
sources = ["osv"]
title = "Heartbeat 0.4.9 及更早版本格式化字符串漏洞"
