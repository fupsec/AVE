[basic]
title = "Linux PAM 0.76 禁用密码空值处理权限提升漏洞"
description = "Linux PAM（可插拔认证模块）0.76 版本在处理已禁用密码的账户时存在安全缺陷，将禁用密码错误地视为空（null）密码进行认证。攻击者可以利用此漏洞，以被禁用账户的身份进行本地或远程登录，从而绕过账户禁用限制获取系统访问权限。该漏洞影响广泛使用 PAM 0.76 的各类 Linux 发行版系统。"
severity = "HIGH"
score = 7.5
sources = ["osv", "nvd"]
published = "2002-10-28"
updated = "2026-06-16"
remediation = "升级PAM至0.77或更高版本。各Linux发行版用户应参照厂商安全公告（如Debian DSA-177）安装对应补丁包，重启系统后生效。"

