[basic]
title = "Squid代理认证凭据泄露漏洞"
description = "Squid 2.4.STABLE6之前版本存在代理认证凭据泄露漏洞，远程恶意网站可能获取用户的代理登录名和密码。该漏洞与代理认证凭据处理相关，当用户通过Squid代理访问恶意网站时，网站可以通过特定方式获取代理认证信息。"
