description = "HylaFAX 4.1.3 之前版本中的 faxgetty 组件存在缓冲区溢出漏洞。远程攻击者可通过向传真服务发送特制的长图像数据行，触发栈缓冲区溢出，导致 faxgetty 进程崩溃从而造成拒绝服务，在特定条件下可能实现任意代码执行。"
