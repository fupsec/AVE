description = "Fetchmail 6.0.0 及之前版本中存在缓冲区溢出漏洞。远程攻击者可通过向邮件服务器发送特制的长邮件头或长 Received 头，触发 readheaders 函数或 parse_received 函数中的缓冲区溢出，导致服务拒绝（崩溃）或执行任意代码。攻击无需身份认证，风险等级高。"
published = "2002-10-11"
remediation = "升级 Fetchmail 至 6.1.0 或更高版本，修复 readheaders 和 parse_received 函数中的缓冲区溢出问题。如无法升级，应在网络边界限制对邮件服务器的访问。"
score = 7.5
