[basic]
title = "HylaFAX faxgetty 格式化字符串漏洞"
description = "HylaFAX 4.1.3之前版本中的faxgetty组件存在格式化字符串漏洞。远程攻击者可通过向传真服务器发送特制的TSI数据元素，利用该漏洞触发格式化字符串处理错误，导致faxgetty进程崩溃，造成拒绝服务。该漏洞允许未认证的远程攻击者利用传真协议中的TSI字段执行格式化字符串操作，影响系统可用性。"
severity = "MEDIUM"
score = 5.0
cvss_v2 = 5.0
published = "2002-10-04"
updated = "2002-10-04"
remediation = "升级HylaFAX至4.1.3或更高版本以修复此格式化字符串漏洞。可从Debian等发行版获取更新包或从HylaFAX官网下载最新版本进行安装。同时建议限制对传真服务的网络访问。"
sources = ["nvd", "osv"]

