[basic]
description = "BIND 4和BIND 8.2.x存根解析器库(stub resolver libraries)以及glibc 2.2.5及更早版本、libc、libresolv等其他库在处理DNS响应时使用最大缓冲区大小而非实际大小，导致存根解析器读取超出实际边界(读取缓冲区溢出)，远程攻击者可利用特制DNS响应包造成拒绝服务(崩溃)。"
published = "2002-10-11"
remediation = "升级BIND至4.9.8或8.2.5及以上版本；升级glibc至2.3.x及以上版本；对于使用libresolv的系统安装相应操作系统厂商提供的安全补丁。"
score = 5.0
severity = "MEDIUM"
sources = ["nvd", "osv"]
title = "ISC BIND及glibc DNS解析器存根库读取缓冲区溢出漏洞"
updated = "2026-06-16"

