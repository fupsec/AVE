[remediation]
fix = "升级 LibTIFF 到 4.0.7 或更高版本。修复提交: https://github.com/vadz/libtiff/commit/3ca657a8793dd011bf869695d72ad31c779c3cc1"
workaround = "避免处理来自不可信来源的 TIFF 文件，或使用沙箱环境运行 TIFF 处理程序。"
steps = ["确认当前 LibTIFF 版本: dpkg -l libtiff5 或 rpm -qa libtiff", "升级 LibTIFF: apt-get update && apt-get upgrade libtiff5 或对应发行版的包管理器命令", "验证已应用修复提交 3ca657a"]

