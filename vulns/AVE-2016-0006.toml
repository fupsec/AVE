[basic]
title = "LibTIFF Predictor 堆缓冲区溢出漏洞"
description = "LibTIFF 4.0.6 的 tif_predict.h 和 tif_predict.c 中存在堆缓冲区溢出漏洞。当处理 YCbCr 子采样等异常 tile 大小时，调试模式下会触发断言失败，发布模式下则导致堆缓冲区溢出。此漏洞由 Microsoft 安全响应中心（MSRC）的 Axel Souchet 和 Vishal Chauhan 报告，编号为 MSVR 35105。攻击者可利用特制 TIFF 文件实现远程代码执行。"
severity = "CRITICAL"
source = "nvd"
published = "2016-11-22"
updated = "2026-06-16"

