[basic]
title = "CodeAstro Human Resource Management System SQL注入漏洞"
description = "CodeAstro Human Resource Management System是面向企业的人力资源管理系统，本次漏洞发生在更新Earn Leave功能的接口中。受影响版本中，Employee_model.php文件中emselectByCode()函数处理emid参数时，直接将该参数拼接入SQL查询语句而未进行任何过滤或参数化处理。攻击者通过在emid参数中注入SQLpayload，可绕过认证或提取数据库中的员工信息，严重时可导致数据库完全失陷。"
severity = "MEDIUM"
source = "avd"
published = "2026-06-28"
updated = "2026-06-29"

