[remediation]
fix = "升级 uutils coreutils 至 0.7.0 或更高版本（推荐 0.8.0），该版本合入了修复提交。"
workaround = "避免在管道中使用 cut -z -d '' -s 的组合；如需过滤未分隔数据，可改用其他方式处理。"
steps = ["确认当前 uutils coreutils 版本", "使用 cargo 更新：cargo install coreutils 或升级系统包管理器中对应的包", "验证 fix: 执行 printf 'abc' | cut -z -d '' -s -f 1 | od -An -tx1 应无输出"]

