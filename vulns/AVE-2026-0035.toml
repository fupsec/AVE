[basic]
title = "uutils coreutils cut: -s 在 -z -d '' 空分隔符模式下被忽略导致数据泄露"
description = "uutils coreutils 的 cut 工具中存在逻辑错误，当组合使用 -z（空终止符）和 -d ''（空分隔符）选项时，代码会进入一条特殊的换行分隔符处理路径，该路径忽略了 -s（仅限分隔）标志。与 GNU coreutils 行为不同，uutils cut 会输出完整记录及 NUL 字节而非将其抑制。依赖 cut -s 过滤未分隔数据的自动化管道可能因此处理了本应被过滤的数据，造成数据完整性风险。"
severity = "LOW"
source = "nvd"
published = "2026-04-22"
updated = "2026-06-17"

