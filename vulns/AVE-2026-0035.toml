[basic]
title = "泛微 e-cology <=9.0 BeanShell 远程代码执行漏洞"
description = "泛微e-cology OA系统9.0及之前版本中存在BeanShell组件远程代码执行漏洞（CNVD-2019-32204）。远程攻击者可通过未经授权访问BeanShell组件接口（/bsh.servlet.BshServlet），向bsh.script参数注入恶意Java代码，从而在目标服务器上执行任意命令。该漏洞影响范围广泛，已有公开的PoC/EXP。官方已发布安全补丁，建议用户尽快升级。"
severity = "CRITICAL"
source = "nuclei"
published = "2019-01-01"
updated = "2019-12-31"

