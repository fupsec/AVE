[remediation]
fix = "升级泛微 e-cology OA 系统至 9.0 以上安全版本。官方已发布安全补丁，请访问泛微官方网站获取最新版本。"
workaround = "如无法升级，可在 Web 服务器层面限制对 /bsh.servlet.BshServlet 路径的访问，仅允许可信 IP 访问，或直接删除 BeanShell 组件相关文件。"
