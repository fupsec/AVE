[basic]
title = "Hitachi Storage Navigator信息泄露漏洞(CVE-2025-7386)"
description = """
Hitachi Storage Navigator是日立推出的企业级存储系统管理界面，用于配置和监控Virtual Storage Platform系列存储设备。
受影响版本中，当启用外部认证功能时，系统存在信息泄露缺陷。攻击者可通过构造特定请求获取认证相关的敏感信息，可能导致未授权访问风险。
修复版本中通过升级微程序版本至DKCMAIN Ver. 90-09-24-00/00、SVP Ver. 90-09-24/00及相应版本，消除了认证信息暴露路径。
解决建议
将组件 hitachi:storage-navigator 升级至 90-09-24-00/00 及以上版本
将组件 hitachi:storage-navigator 升级至 90-08-86-00/00 及以上版本
将组件 hitachi:storage-navigator 升级至 80-06-96-00/00 及以上版本"""
