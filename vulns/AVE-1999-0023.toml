workaround = "如无法升级，可在受影响设备上禁用HTTP服务（no ip http server），或通过访问控制列表（ACL）限制对HTTP端口的访问。"
steps = ["步骤1: 确认设备运行的Cisco IOS版本", "步骤2: 升级到包含漏洞修复的最新IOS版本", "步骤3: 如无法升级，执行 'no ip http server' 禁用HTTP服务", "步骤4: 配置ACL限制对HTTP服务的访问"]

