[basic]
title = "Cisco IOS Web服务器超长URL拒绝服务漏洞"
description = "Cisco IOS路由器Web服务器存在拒绝服务漏洞，攻击者可通过发送超长URL（超过8192字节）触发缓冲区错误，导致路由器崩溃并重新启动。该漏洞影响所有启用了HTTP服务的Cisco IOS设备。"
