title = "SGI IRIX 'ordist' 命令缓冲区溢出本地权限提升漏洞"
description = "SGI IRIX 5.x/6.x 系统中的 ordist 命令存在缓冲区溢出漏洞，本地攻击者可通过对 '-d' 选项传递超长参数（包含精心构造的机器可执行代码），触发缓冲区溢出，从而获取 root 权限。"
