[basic]
title = "IRAI AUTOMGEN <= 8.0.0.7 Use-After-Free 远程拒绝服务"
description = "AUTOMGEN 8.0.0.7及之前版本（也称为8.022）在处理项目文件时存在释放后使用漏洞，当处理某些畸形字段时会释放对象随后解引用悬空指针。攻击者可通过操控内存中的间接调用，导致拒绝服务。在一定条件下可能实现远程代码执行。"
