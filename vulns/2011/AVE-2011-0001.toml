[affected]
product = "AUTOMGEN"
vendor = "IRAI"

[authenticity]
cve_confidence = "high"
notes = "漏洞由 Luigi Auriemma 于 2011 年 10 月发现并公开，Exploit-DB 17964 包含完整的 PoC 畸形项目文件。VulnCheck 于 2025 年 11 月分配 CVE 编号。CISA SSVC 评估: exploitation=poc, automatable=no, technicalImpact=partial。NVD CVSS v4.0: 6.9 MEDIUM (CNA: VulnCheck)。PoC 为桌面应用文件解析漏洞，非 HTTP 协议，无法生成标准 HTTP PoC 脚本。"
poc_confidence = "high"

[basic]
description = "AUTOMGEN 8.0.0.7及之前版本（也称为8.022）在处理项目文件时存在释放后使用漏洞，当处理某些畸形字段时会释放对象随后解引用悬空指针。攻击者可通过向受害者发送特制的项目文件（.gep/.gepj），在目标系统上触发崩溃，导致拒绝服务。在一定条件下，通过操控内存中的间接调用可能实现远程代码执行。"
published = "2025-11-12"
remediation = "厂商未提供官方补丁，建议升级 AUTOMGEN 至 8.0.0.7 之后的安全版本。若无法升级，应避免打开不可信来源的项目文件，并在隔离环境中运行该软件。"
score = 6.9
severity = "MEDIUM"
sources = ["avd", "msrc", "nvd"]
title = "IRAI AUTOMGEN 8.0.0.7 及更早版本释放后使用漏洞"
updated = "2026-06-16"

