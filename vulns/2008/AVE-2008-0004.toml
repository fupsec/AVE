[basic]
title = "Sun xVM VirtualBox VBoxDrv.sys 驱动 IOCTL 本地权限提升漏洞"
description = """Sun xVM VirtualBox 1.6.4 之前版本的 VBoxDrv.sys 驱动程序中 VBoxDrvNtDeviceControl 函数存在输入验证漏洞。
该驱动在处理 IOCTL 请求时使用 METHOD_NEITHER 通信方式，且未正确验证与 Irp 对象关联的缓冲区。
本地用户可通过打开 \\\\.\\VBoxDrv 设备并调用 DeviceIoControl 发送精心构造的内核地址来利用此漏洞，
从而在内核态执行任意代码，实现从普通用户到 SYSTEM 权限的本地提权。该漏洞已被 CISA 纳入
已知被利用漏洞（KEV）目录，且存在公开的 PoC 利用代码。"""
severity = "HIGH"
score = 8.8
cvss_v3 = "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
cvss_v2 = "AV:L/AC:L/Au:N/C:C/I:C/A:C"
published = "2008-08-05"
updated = "2025-10-22"
remediation = "立即升级 Sun xVM VirtualBox 至 1.6.4 或更高版本。若无法立即升级，应限制对 VBoxDrv 设备（\\\\.\\VBoxDrv）的访问权限，仅允许授权用户和进程访问，并考虑卸载不需要的 VirtualBox 组件。"
sources = ["nvd", "kev", "ghsa", "exploit-db", "cvedetails"]

