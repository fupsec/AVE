[basic]
title = "Oracle VirtualBox VBoxDrv.sys 驱动输入验证漏洞"
description = 'Sun xVM VirtualBox 1.6.4之前版本中的VBoxDrv.sys驱动VBoxDrvNtDeviceControl函数使用METHOD_NEITHER通信方法处理IOCTL，未能正确验证与Irp对象关联的缓冲区，导致本地攻击者可通过打开\\.\VBoxDrv设备并调用DeviceIoControl发送特制内核地址，从而提升至系统权限。此漏洞已在野被积极利用，已纳入CISA KEV目录。'
severity = "HIGH"
score = 8.8
published = "2008-08-05"
updated = "2026-06-16"
remediation = "升级至 Oracle VirtualBox 1.6.4 或更高版本，并及时应用厂商安全补丁。限制本地用户对 \\.VBoxDrv 设备的访问权限。"
sources = ["kev", "nvd"]

[affected]
vendor = "Oracle"
product = "VirtualBox"

