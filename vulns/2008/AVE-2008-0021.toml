[remediation]
fix = "升级 libpng 至修复版本：libpng 1.0.x 系列升级至 1.0.42 及以上版本，libpng 1.2.x 系列升级至 1.2.34 及以上版本。"
workaround = "避免使用不受信任的 PNG 文件中包含的 keyword 字段进行写入操作。如无法升级，可考虑在应用层对 PNG keyword 长度进行校验。"
steps = ["步骤1: 确认当前 libpng 版本（1.0.x < 1.0.42 或 1.2.x < 1.2.34 则受影响）", "步骤2: 通过包管理器升级至修复版本或从源码编译 libpng 1.0.42+ / 1.2.34+"]

