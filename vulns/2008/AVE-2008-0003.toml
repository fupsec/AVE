description = "Adobe Acrobat 和 Reader 8.1.2 及更早版本中存在基于栈的缓冲区溢出漏洞。远程攻击者可通过构造特制的 PDF 文件，调用 util.printf JavaScript 函数并传入精心设计的格式字符串参数，在目标系统上执行任意代码。该漏洞与 CVE-2008-1104 相关，成功利用可导致完全控制受影响系统。"
published = "2008-11-04"
remediation = "升级 Adobe Acrobat/Reader 至 8.1.3 或更高版本，按照 APSB08-19 安全公告应用补丁。禁用 PDF 文档中的 JavaScript 执行可作为临时缓解措施。"
