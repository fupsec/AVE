[basic]
description = "libpng 的 pngrutil.c 中 png_handle_tEXt 函数存在内存泄漏，攻击者可通过构造恶意 PNG 文件触发内存耗尽，导致拒绝服务（应用崩溃）。受影响版本：libpng 1.2.33 rc02 之前及 1.4.0 beta36 之前的所有版本。"
published = "2009-02-20"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "libpng png_handle_tEXt 函数内存泄漏漏洞"
