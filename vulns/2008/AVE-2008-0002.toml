[basic]
title = "Adobe Acrobat 和 Reader 未指定远程代码执行漏洞"
description = "Adobe Reader 和 Acrobat 8.1.2 之前版本存在多个未指定安全漏洞。攻击者可通过诱导用户打开特制的 PDF 文件，利用设计缺陷实现任意代码执行或敏感信息泄露。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），表明已在实际攻击中被利用。漏洞影响范围广泛，涉及 Windows、macOS 和 Linux 等多个平台。"
severity = "HIGH"
score = 8.8
cvss_v2 = 9.3
cvss_v3 = "AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H"
remediation = "建议升级至 Adobe Reader 和 Acrobat 8.1.2 或更高版本，及时应用厂商安全更新。可从 Adobe 官方网站下载最新版本，或通过自动更新功能进行升级。"
published = "2008-02-08"
updated = "2022-06-08"
