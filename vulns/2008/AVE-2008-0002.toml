[basic]
title = "Adobe Acrobat 和 Reader 设计缺陷漏洞"
description = "Adobe Acrobat 和 Reader 8.1.2 之前版本存在一个未指定的设计缺陷漏洞。攻击者可利用特制的 PDF 文件通过静默打印功能任意次数输出文档，导致敏感信息泄露。该漏洞影响范围广泛，已被 CISA 列入已知被利用漏洞目录（KEV），确认存在在野利用。CVSS v3.1 评分 8.8，属于高危漏洞。"
severity = "HIGH"
score = 8.8
remediation = "升级 Adobe Acrobat/Reader 至 8.1.2 或更高版本。从 Adobe 官方网站下载安全更新，参考安全公告 APSB08-13。如无法升级，建议禁用浏览器 PDF 插件并使用受保护模式阅读器。"
sources = ["kev", "nvd"]
published = "2008-02-08"
updated = "2026-06-16"

