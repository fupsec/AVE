[basic]
title = "Microsoft Windows Video ActiveX 控件远程代码执行漏洞"
description = "Microsoft Windows 的 DirectShow 组件中 msvidctl.dll 所实现的 MPEG2TuneRequest ActiveX 控件存在栈缓冲区溢出漏洞。该漏洞源于 Active Template Library (ATL) 中 CComVariant::ReadFromStream 函数在处理畸形数据时未能正确检查缓冲区边界。攻击者可通过构造特制网页诱使用户访问，成功利用此漏洞可获得与登录用户相同的权限，实现远程代码执行。该漏洞曾在 2009 年 7 月被野外利用。"
severity = "HIGH"
score = 8.8
remediation = "建议用户安装微软安全公告 MS09-032 和 MS09-037 提供的安全更新，升级受影响的 Windows 系统至已修复版本。对于无法立即更新的系统，可通过设置 kill-bit 禁用相关 ActiveX 控件来缓解风险。"
published = "2009-07-14"
updated = "2026-02-17"
sources = ["kev", "nvd"]

