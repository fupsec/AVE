[basic]
title = "ppp RADIUS 插件 rc_mksid 函数缓冲区溢出漏洞"
description = "Paul's PPP Package (ppp) 2.4.6 及之前版本中 plugins/radius/util.c 文件的 rc_mksid 函数存在缓冲区溢出漏洞。当 pppd 的 PID 大于 65535 时，远程攻击者可通过向 RADIUS 服务器发送特制的 start accounting 消息导致拒绝服务（崩溃）。"
severity = "MEDIUM"
source = "nvd"
published = "2015-04-24"
updated = "2026-06-16"

