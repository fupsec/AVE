[remediation]
fix = "升级 ppp 到 2.4.7 或更高版本。各发行版已发布安全更新：Ubuntu (USN-2595-1)、Debian (DSA-3228)、Gentoo (GLSA 201701-50)、Mageia (MGASA-2015-0173)。"
workaround = "如无法升级，可在 RADIUS 服务器配置中限制可发送 accounting 消息的可信源地址范围，或禁用 RADIUS accounting 功能。"
steps = ["确认 ppp 版本：pppd --version", "升级 ppp 软件包：sudo apt-get update && sudo apt-get install --only-upgrade ppp", "重启 pppd 服务以使更新生效"]

