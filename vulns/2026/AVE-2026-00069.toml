[remediation]
fix = "目前厂商已发布安全补丁，建议升级至T+ 13.000.001.0404及以上补丁包。"
workaround = "如无法立即升级，建议使用WAF对/tplus/ajaxpro/路径下的请求进行过滤，阻止包含.NET反序列化payload的请求。避免将畅捷通T+系统直接暴露在互联网上。"
steps = ["步骤1: 确认当前畅捷通T+版本", "步骤2: 下载并安装官方安全补丁（T+ 13.000.001.0404及以上）", "步骤3: 验证补丁安装后系统正常运行", "步骤4: 如暂时无法升级，配置WAF规则拦截恶意请求"]

