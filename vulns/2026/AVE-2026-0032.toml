[remediation]
fix = "升级到致远官方提供的修复版本（V7.0 SP3及以上），或联系厂商获取安全补丁。官方已在后续版本中修复了htmlofficeservlet的未授权文件写入问题。"
workaround = "如无法升级，可采取以下缓解措施：1）限制对/seeyon/htmlofficeservlet的网络访问，仅允许可信IP；2）部署WAF规则拦截带有DBSTEP V3.0特征的POST请求；3）排查服务器web目录下是否存在恶意JSP文件（如test123456.jsp、test123.jsp等）；4）删除或重命名htmlofficeservlet相关组件。"
steps = [
  "步骤1: 确认是否使用致远A8 OA系统（查看/seeyon目录是否存在）",
  "步骤2: 检查/seeyon/htmlofficeservlet是否存在",
  "步骤3: 检查web目录下是否存在异常JSP文件",
  "步骤4: 升级到官方修复版本或部署WAF缓解措施",
]

