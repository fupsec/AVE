[basic]
title = "致远A8 OA htmlofficeservlet 远程命令执行漏洞"
description = "致远A8 OA系统/seeyon/htmlofficeservlet存在任意文件写入漏洞，未经身份验证的远程攻击者可通过发送特制POST请求（包含DBSTEP V3.0协议数据）向服务器写入包含JSP webshell的恶意文件，进而通过访问webshell执行任意系统命令，完全控制服务器。该漏洞影响致远A8 V7.0、V7.1等多版本。"
severity = "CRITICAL"
source = "nuclei"
published = "2019-06-26"
updated = "2019-06-26"

