[basic]
title = "泛微e-Mobile OGNL表达式注入漏洞"
description = "泛微e-Mobile移动办公系统存在OGNL表达式注入漏洞，该漏洞位于login.do及login/login.do接口的message参数中。攻击者无需认证即可向message参数注入恶意OGNL表达式，利用OGNL上下文执行任意Java方法，最终实现远程命令执行，获取服务器控制权限。攻击者可进一步窃取数据库敏感信息、篡改系统数据或进行未授权管理操作。"
severity = "HIGH"
score = 8.8
sources = ["nuclei"]
published = "2017-03-01"
updated = "2017-03-01"
remediation = "建议升级泛微e-Mobile至官方最新版本，及时安装厂商发布的安全补丁。若无法立即升级，应限制login.do及login/login.do等接口的互联网访问，配置Web应用防火墙(WAF)拦截OGNL注入攻击载荷，并将系统部署于内网环境避免直接暴露于公网。"

