[basic]
title = "Android PackageInstallerService 更新所有权绕过致权限提升漏洞"
description = "在 Android PackageInstallerService.java 的 createSessionInternal 方法中，由于未正确清除 INSTALL_FROM_MANAGED_USER_OR_PROFILE 标志位，导致普通安装器应用能够操纵安装会话的内部状态。攻击者可在无需用户交互且无需额外权限的情况下，绕过 Android 的更新所有权安全警告机制，使系统仅显示通用更新对话框而非所有权验证提示。该漏洞影响 Android 14、15、16 及 16-qpr2 版本，可导致本地权限提升，削弱企业环境中基于更新所有权的信任链保护机制。"
severity = "HIGH"
score = 7.8
sources = ["nvd", "github", "android"]
published = "2026-03-02"
updated = "2026-06-17"
remediation = "建议用户将 Android 设备更新至 2026-03-01 安全补丁级别或更高版本。Google 已通过 AOSP 提交 09055276288a68cf35b0f84ba32e28822f74ecf9 修复该漏洞，修复方式为在检查托管用户状态前显式清除 INSTALL_FROM_MANAGED_USER_OR_PROFILE 标志位，确保该标志仅由系统根据实际托管状态设置。"

