[basic]
description = """
Cherry Studio 是开源的 AI 助手客户端，集成了 MCP 协议支持 MCP 服务接入。该组件的 MCP OAuth 本地回调服务器在处理授权回调时，未对 OAuth state 参数进行验证，且对回调路径采用前缀匹配而非精确匹配。攻击者可以在本地回调窗口期内抢先发送携带恶意授权码的请求，绕过授权校验并导致受害者交换攻击者的授权码完成认证。
受影响版本中，Cherry Studio 的 MCP OAuth 本地回调服务器（src/main/services/mcp/oauth/callback.ts）接受任意 code 参数的回调请求而不验证 state 参数，并且接受路径前缀匹配（如 /oauth/callback.extra），形成第一码攻击（first-code race）条件，可使攻击者在合法回调到达前抢先完成 OAuth 流程从而冒充受害者身份。
修复版本中通过在回调服务器初始化时增加 expectedState 参数，并在接收到回调时强制比对 state 参数与预期值，同时将路径判断从 startsWith 改为精确相等（pathname === path），从而确保只有携带正确 state 的精确路径回调才能完成授权流程，攻击者无法通过抢先发送恶意授权码完成认证。
解决建议
建议您更新当前系统或软件至最新版，完成漏洞的修复。"""
published = "2026-06-29"
remediation = "建议您更新当前系统或软件至最新版，完成漏洞的修复。"
