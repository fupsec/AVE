[basic]
title = "Mint HTTP/1 CRLF注入与请求走私漏洞"
description = "Mint HTTP客户端库的HTTP/1请求编码器在encode_request_line/2函数中，将调用者提供的method和target参数直接拼接到请求行，未对CRLF等控制字符进行校验。攻击者通过控制method参数可注入回车换行序列，提前终止请求行并注入任意HTTP头字段，甚至可在同一TCP连接上走私完整的伪造HTTP请求，绕过访问控制或实施缓存投毒攻击。影响mint 0.1.0至1.9.0之前的所有版本。"
severity = "LOW"
score = 2.1
cvss_v4 = "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:L/VA:N/SC:N/SI:L/SA:N"
published = "2026-06-02"
updated = "2026-06-17"
remediation = "将Mint升级至v1.9.0或更高版本，该版本已在method参数中添加CRLF字符校验。如无法立即升级，应确保应用程序不将用户可控的输入直接作为HTTP method参数传递给Mint.HTTP.request/5函数。"
sources = [
    "ghsa",
    "nvd",
]

