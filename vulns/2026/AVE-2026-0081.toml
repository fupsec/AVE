[affected]
product = "Diagnostics / Vantage HardwareScanAddin"
vendor = "Lenovo"

[basic]
description = "Lenovo Diagnostics 和 Vantage 中的 HardwareScanAddin 组件存在不安全链接跟随漏洞（CWE-59）。LdeApi.Server.exe 进程在安装或硬件扫描期间尝试向 C:\\ProgramData\\Lenovo\\LDE\\SYSTEM 目录写入 MP27AM7W_estimation.json 文件时未正确模拟用户权限。由于 C:\\ProgramData\\ 默认允许标准用户创建子目录，低权限攻击者可预先创建该目录结构并转换为 NTFS 接合点指向任意目标路径，服务进程将以 SYSTEM 权限跟随接合点将文件写入攻击者指定的任意位置，成功利用可实现本地权限提升。"
published = "2026-04-15"
remediation = "升级 Lenovo Diagnostics 至 5.26.0 或更高版本，升级 Lenovo Vantage HardwareScanAddin 至 4.7.1.4 或更高版本，以修复文件写入时未正确模拟用户权限的安全缺陷。"
score = 7.1
severity = "HIGH"
sources = ["github", "nvd"]
title = "联想 Diagnostics 与 Vantage 硬件扫描组件任意文件写入权限提升漏洞"
updated = "2026-06-17"

