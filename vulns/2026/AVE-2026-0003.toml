[basic]
title = "Google Android 16 QPR2 Beta ActivityManagerService 权限缺失导致UI位图泄露漏洞"
description = "Android 16 QPR2 Beta (Baklava) 中的 ActivityManagerService.dumpBitmapsProto() 方法缺少权限检查，导致未授权应用可以通过 Binder 事务直接调用该方法，窃取所有正在运行应用的界面位图。攻击者无需任何权限即可利用该漏洞获取其他进程的屏幕内容，造成敏感信息泄露，并可能导致本地权限提升。"
severity = "HIGH"
score = 8.4
sources = ["github", "nvd"]
published = "2026-03-02"
updated = "2026-06-17"
remediation = "升级至 Android 安全公告 2026-03-01 及之后的安全补丁级别，Google 已在 dumpBitmapsProto() 方法首行添加 enforceCallingOrSelfPermission(DUMP) 权限检查以修复此漏洞。"

