[basic]
title = "CatfishCMS 4.8.54 远程命令执行漏洞"
description = "CatfishCMS 4.8.54 版本中存在远程命令执行漏洞。攻击者可通过 ThinkPHP 参数绑定机制，在 HTTP 请求中构造 _method=__construct 和 filter[]=system 参数，将 PHP system 函数注册为回调过滤器，从而通过 method 参数传递任意系统命令并执行。该漏洞无需身份认证，攻击者可远程获取服务器控制权。"
severity = "CRITICAL"
source = "nuclei"
published = "2019-01-31"
updated = "2019-01-31"

