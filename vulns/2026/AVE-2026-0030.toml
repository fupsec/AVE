[basic]
title = "CatfishCMS 远程命令执行漏洞"
description = "CatfishCMS 4.8.54 版本中存在远程命令执行漏洞。该漏洞位于 method 参数中，攻击者可利用 __construct 方法结合 filter 参数调用 system 函数，在未经身份验证的情况下通过构造特制 HTTP GET 请求远程执行任意命令，获取服务器完全控制权，危害严重。"
severity = "CRITICAL"
score = 10.0
remediation = "升级 CatfishCMS 至 4.8.55 或更高版本，对 method 和 filter 参数进行严格的输入过滤和权限校验，避免直接将用户输入传入危险函数。"
published = "2019-01-01"
updated = "2019-01-01"
