[authenticity]
cve_confidence = "low"
notes = "此漏洞为 CNVD 收录编号 CNVD-2019-06255，目前未发现对应 CVE 编号。漏洞原理为 CatfishCMS 依赖的 ThinkPHP 框架的 _method=__construct 参数注入缺陷，通过 filter[]=system 实现任意命令执行。Nuclei 模板及 GitHub Issue 均已验证漏洞存在。"
poc_confidence = "high"

[basic]
description = "CatfishCMS（鲶鱼CMS）4.8.54 版本存在远程命令执行漏洞。该漏洞源于 CatfishCMS 使用的 ThinkPHP 框架中 _method=__construct 参数处理缺陷，攻击者可通过构造特制的 HTTP 请求，利用 filter[]=system 参数实现任意系统命令执行。漏洞利用无需身份认证，攻击者可远程获取服务器控制权。"
published = "2019-01-31"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nuclei"
sources = ["unknown"]
title = "CatfishCMS（鲶鱼CMS）4.8.54 远程命令执行漏洞"
