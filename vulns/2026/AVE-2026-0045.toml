[remediation]
fix = "升级到包含修复提交 ba7491046b2d430732be490913e4cbf1f1e899c2 的版本（>= 0.5.0b3.dev101）。修复版本新增 is_embedded_ipv4 函数，可识别并解包 6to4（2002::/16）、NAT64（64:ff9b::/96 和 64:ff9b:1::/48）以及 IPv4-mapped 地址中的嵌入 IPv4，然后对解包后的 IPv4 重新执行全局可路由判断和回环判断，同时添加了针对 Teredo(2001::/32) 前缀的拦截。"
steps = [
    "步骤1: 确认 pyload-ng 版本（检查 setup.cfg 或运行 pip show pyload-ng）",
    "步骤2: 升级到 0.5.0b3.dev101 或更高版本（pip install --upgrade pyload-ng）",
    "步骤3: 如无法立即升级，手动应用提交 ba74910 中的补丁到 src/pyload/core/utils/web/check.py",
    "步骤4: 在网络层防火墙阻止 6to4（2002::/16）和 NAT64（64:ff9b::/96）流量到达内部端点",
]
workaround = "如无法升级，可在网络层防火墙阻止 6to4（2002::/16）和 NAT64（64:ff9b::/96）流量到达内网目标；或严格限制具有 Perms.ADD 权限的用户账户，仅允许可信用户操作。"

