[affected]
product = "pyLoad-ng (pyload-ng)"
vendor = "pyLoad"

[authenticity]
cve_confidence = "high"
notes = "GHSA 官方安全公告提供了完整的漏洞原理、复现步骤和修复方案。PoC 脚本存放于 pyload 主仓库的 research_wave5/poc/ 目录中。实际利用需要攻击者具备 Perms.ADD 权限、主机网络支持 6to4/NAT64 路由，且目标运行于 Python 3.9-3.11（6to4 路径）或存在 NAT64 网关（所有版本）。修复提交 (ba74910) 已验证通过 CI 测试。"
poc_confidence = "high"

[basic]
description = """
pyLoad-ng 的 is_global_address 函数在 src/pyload/core/utils/web/check.py 中使用 Python ipaddress.ip_address(value).is_global 判断 IP 是否为全局可路由地址，作为 SSRF 防护的核心检查。但 Python 的 IPv6Address.is_global 将 NAT64 知名前缀 (64:ff9b::/96) 以及 Python 3.9-3.11 上的 6to4 前缀 (2002::/16) 中嵌入了内网 IPv4 地址（如 127.0.0.1、10.0.0.1、169.254.169.254）的地址均归类为"全局可路由"，导致 SSRF 防护被绕过。攻击者可利用此漏洞，通过构造包含 IPv6 过渡编码地址的下载 URL，绕过 is_global_address/is_global_host 检查，使 pycurl PREREQFUNC 允许连接到内部网络端点，实现服务端请求伪造。影响所有声明 python_requires >= 3.9 的 pyLoad-ng 部署。与 pydantic-ai 的 GHSA-cqp8-fcvh-x7r3 属于同类 SSRF 防护覆盖不完整问题。
"""
published = "2026-07-10"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 4.7
