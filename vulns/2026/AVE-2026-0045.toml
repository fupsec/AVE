[basic]
title = "pyLoad SSRF防护绕过漏洞（IPv6 6to4/NAT64转换封装内部IP）"
description = "pyLoad的is_global_address函数通过Python ipaddress.ip_address(value).is_global判断IP是否全局可达，用于防御SSRF攻击。然而Python的IPv6Address.is_global将6to4(2002::/16)和NAT64(64:ff9b::/96)前缀视为全局可路由，攻击者可利用这些IPv6转换封装形式将内部IP地址（如127.0.0.1、10.0.0.1、169.254.169.254等）编码为IPv6地址，绕过SSRF检查。pycurl的PREREQFUNC在TCP连接前调用了同一检查函数，导致连接被允许。Python 3.9-3.11中6to4和NAT64均受影响，3.12+中NAT64仍可绕过。成功利用可在内网进行探测、获取云元数据等。"
published = "2026-07-08"
remediation = "升级至pyload-ng >= 0.5.0b3.dev101或应用补丁：在is_global_address函数中解包IPv6转换封装地址，对2002::/16和64:ff9b::/96前缀提取嵌入式IPv4地址并重新执行全局检查。"
score = 4.7
severity = "MEDIUM"
sources = ["ghsa"]
updated = "2026-07-08"

