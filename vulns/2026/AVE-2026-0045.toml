[remediation]
fix = "升级到 pyload-ng >= 0.5.0b3.dev101（包含修复提交 ba7491046b2d430732be490913e4cbf1f1e899c2）。修复版本在 is_global_address 和 is_loopback_address 中添加了 is_embedded_ipv4 检测函数，可识别并解包 6to4（2002::/16）、NAT64（64:ff9b::/96 和 64:ff9b:1::/48）以及 IPv4-mapped 地址中的嵌入 IPv4，重新执行全局可路由判断。"
workaround = "如无法升级，可在网络层防火墙阻止 6to4（2002::/16）和 NAT64（64:ff9b::/96）流量到达内网目标；或严格限制具有 Perms.ADD 权限的用户账户，仅允许可信用户操作。"
steps = [
  "步骤1: 确认 pyload-ng 版本（检查 setup.cfg 或运行 pip show pyload-ng）",
  "步骤2: 升级到 0.5.0b3.dev101 或更高版本（pip install --upgrade pyload-ng）",
  "步骤3: 或手动应用补丁：在 is_global_address 中添加 is_embedded_ipv4 解包逻辑",
  "步骤4: 部署网络层访问控制阻止 IPv6 过渡封装流量到达内部端点",
]

