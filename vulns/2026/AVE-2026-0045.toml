[basic]
title = "pyLoad SSRF 防护绕过漏洞 — IPv6 6to4/NAT64 过渡机制封装内网 IP"
description = """
pyLoad-ng 的 is_global_address 函数在 src/pyload/core/utils/web/check.py 中使用 Python ipaddress.ip_address(value).is_global 判断 IP 是否为全局可路由地址，作为 SSRF 防护的核心检查。但 Python 的 IPv6Address.is_global 将 NAT64 知名前缀 (64:ff9b::/96) 以及 Python 3.9-3.11 上的 6to4 前缀 (2002::/16) 中嵌入了内网 IPv4 地址（如 127.0.0.1、10.0.0.1、169.254.169.254）的地址均归类为"全局可路由"，导致 SSRF 防护被绕过。攻击者可利用此漏洞，通过构造包含 IPv6 过渡编码地址的下载 URL，绕过 is_global_address/is_global_host 检查，使 pycurl PREREQFUNC 允许连接到内部网络端点，实现服务端请求伪造。影响所有声明 python_requires >= 3.9 的 pyLoad-ng 部署。
"""
severity = "MEDIUM"
source = "ghsa"
published = "2026-05-22"
updated = "2026-07-10"

