    "如无法立即升级，手动应用补丁：添加 is_embedded_ipv4 函数解包 IPv6 过渡地址中的嵌入式 IPv4，并在 is_global_address 中对 IPv6 地址先解包再判断",
]
workaround = "如无法升级，可在 is_global_address 函数中添加 IPv6 过渡编码形式的嵌入式 IPv4 解包检查，并加入知名嵌入前缀的黑名单（64:ff9b::/96, 64:ff9b:1::/48）进行深度防御。"

