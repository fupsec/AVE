[affected]
product = "tesla"
vendor = "elixir-tesla"

[authenticity]
cve_confidence = "high"
notes = "CVE 已由 EEF CNA 分配，GHSA 官方安全公告确认。CVSS v4.0 评分 2.1（低危）。漏洞为 Tesla Multipart 模块的内容分隔符注入，需要攻击者可以控制传递给 add_field/add_file/add_file_content 的文件名或表单字段名参数。公开渠道暂未发现独立 PoC 仓库。"
poc_confidence = "low"

[basic]
description = "Tesla 是一个 Elixir 语言的 HTTP 客户端库。其 Multipart 模块的 part_headers_for_disposition/1 函数在处理 Content-Disposition 参数时将用户输入直接拼接到 #{k}=\"#{v}\" 格式的字符串中，未对 CR、LF 或双引号进行转义或过滤。攻击者可通过控制文件名或表单字段名中的特殊字符注入额外的 part 头部，甚至通过双 CRLF 序列在 part 体前预置字节，实现 multipart smuggling 攻击。该漏洞影响 tesla 0.8.0 至 1.18.2 版本，已在 1.18.3 中修复。"
published = "2026-06-02"
remediation = "升级 Tesla 至 1.18.3 及以上版本。无法升级时，在传递给 add_field/4、add_file/3 或 add_file_content/4 之前校验 disposition 参数值，拒绝包含 CR(\r)、LF(\n) 或双引号(\")的输入。"
score = 2.1
severity = "LOW"
source = "ghsa"
sources = ["ghsa"]
title = "Tesla (Elixir) multipart 头部注入漏洞"
updated = "2026-06-17"

