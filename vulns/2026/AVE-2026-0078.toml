[basic]
title = "Langflow exec_globals 远程代码执行漏洞"
description = "Langflow 的 validate 端点中 exec_globals 参数存在远程代码执行漏洞。该漏洞允许未经身份验证的远程攻击者在受影响的 Langflow 实例上执行任意代码。漏洞源于 validate_code() 函数使用 exec() 执行用户提供的 Python 代码时未进行沙箱隔离，攻击者可通过构造恶意的函数默认参数实现任意命令执行。"
severity = "CRITICAL"
source = "zdi"
published = "2026-01-22"
updated = "2026-06-17"

