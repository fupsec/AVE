[remediation]
fix = "升级 Tesla 至 1.18.3 及以上版本。"
steps = [
    "步骤1: 确认当前项目依赖的 Tesla 版本（mix.exs 或 mix.lock）",
    "步骤2: 更新 mix.exs 中 Tesla 依赖到 \"~> 1.18.3\" 或更高",
    "步骤3: 运行 mix deps.get 和 mix deps.compile 更新依赖",
    "步骤4: 重新编译并测试 multipart 上传功能",
]
workaround = "若无法立即升级，在传递给 add_field/4、add_file/3 或 add_file_content/4 之前校验 disposition 参数值，拒绝包含 \\r、\\n 或 \" 的输入。"

