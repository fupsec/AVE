[basic]
description = """
GPAC 是开源多媒体框架，常用于 MP4/MPEG-4 容器解析与处理。
受影响版本中，ISOBMFF 解析器在解压压缩盒（如 !six、!csix、!mof 等）时调用 gf_gz_decompress_payload_ex 函数，该函数对 zlib inflate 输出的解压大小缺乏校验。攻击者可构造超压缩数据（解压膨胀比超过 32 倍），导致进程分配远超预期的堆内存，造成内存耗尽和拒绝服务。
修复版本中通过在 inflate 循环中添加输出大小检查来解决该问题：当 d_stream.total_out 超过输入数据大小的 32 倍时，函数返回 GF_NON_COMPLIANT_BITSTREAM 错误并停止解压，从而阻断超压缩数据的扩展攻击。
解决建议
建议您更新当前系统或软件至最新版，完成漏洞的修复。"""
published = "2026-06-29"
remediation = "建议您更新当前系统或软件至最新版，完成漏洞的修复。"
