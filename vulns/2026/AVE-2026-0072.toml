[basic]
title = "Google Android PackageInstallerService 更新拥有权验证绕过漏洞"
description = "Android PackageInstallerService 的 createSessionInternal 方法中存在权限检查缺失漏洞。在管理安装会话时，内部 INSTALL_FROM_MANAGED_USER_OR_PROFILE 标志未在检查前被清除，导致普通应用可操纵该标志以绕过 Android 的更新拥有权验证机制。攻击者可利用此漏洞在没有额外执行权限的情况下实现本地权限提升，覆盖应用更新来源，使用户无法收到更新源变更警告。"
severity = "HIGH"
score = 7.8
cvss_v3 = "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
remediation = "升级至 Android 安全补丁级别 2026-03-01 或更高版本。Google 已在 AOSP 提交补丁 09055276288a68cf35b0f84ba32e28822f74ecf9，通过在 checked 前显式清除 INSTALL_FROM_MANAGED_USER_OR_PROFILE 标志来修复此漏洞。受影响版本包括 Android 14、15、16 及 16-qpr2。"
published = "2026-03-02"
updated = "2026-06-17"
sources = ["github", "nvd", "android"]

