[basic]
description = """
Google Android 的 PackageInstallerService.java 中的 createSessionInternal 函数存在权限检查缺失漏洞。应用程序可在未经许可的情况下更新其所有权，导致本地权限提升。攻击者无需额外执行权限，无需用户交互即可利用此漏洞。
受影响版本：Android 14、15、16、16-qpr2。
"""
