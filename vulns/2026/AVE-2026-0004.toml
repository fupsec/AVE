[basic]
title = "Metinfo CMS 本地文件包含漏洞"
description = "Metinfo CMS（米拓企业建站系统）存在本地文件包含漏洞。攻击者可通过向 /include/thumb.php 发送精心构造的请求，利用 dir 参数中的目录遍历序列（如 http\\..\\admin\\login\\login_check.php）读取服务器上的任意文件，导致敏感信息泄露。该漏洞无需身份验证即可远程利用，影响 Metinfo 6.x 系列版本，危害较大。"
severity = "HIGH"
score = 8.6
sources = ["nuclei", "CNVD"]
published = "2018-07-01"
updated = "2018-07-01"
remediation = "升级 Metinfo CMS 到官方发布的最新版本；对 /include/thumb.php 中 dir 参数进行严格的输入验证和过滤，禁止包含路径穿越字符（如 ..）和反斜杠。"

