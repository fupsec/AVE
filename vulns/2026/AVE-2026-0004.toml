[basic]
title = "Tesla HTTP 客户端 Mint 适配器存在原子表耗尽致拒绝服务漏洞"
description = "Tesla 是一款基于 Elixir 语言的 HTTP 客户端库。其 Mint 适配器中的 open_conn/2 函数在构建请求时将 URL 协议 scheme 直接通过 String.to_atom/1 转换为 BEAM 原子，未进行任何白名单校验。由于 BEAM 虚拟机中的原子一旦创建即永久存在且不会被垃圾回收，默认原子表上限约为 1,048,576 个条目。攻击者可通过向应用发送大量包含不同 URL scheme 的请求（或利用 FollowRedirects 中间件跟随恶意服务器返回的 Location 头），逐步耗尽原子表空间，最终导致 BEAM 虚拟机崩溃，造成拒绝服务。该漏洞影响 tesla 1.3.0 至 1.18.2 版本。"
severity = "HIGH"
score = 8.2
sources = ["ghsa", "nvd"]
published = "2026-06-02"
updated = "2026-06-17"
remediation = "升级 Tesla 至 1.18.3 或更高版本，并在 Mint 适配器中对 URL scheme 进行白名单校验以防止原子表被恶意填充。"

