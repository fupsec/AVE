[remediation]
fix = "升级 Open WebUI 到 v0.6.44 或更高版本。官方已发布安全更新，修复了 ResponseMessage.svelte 中 iFrame Sandbox 属性硬编码的问题。"
workaround = "如无法立即升级，可禁用聊天共享功能，或通过反向代理/WAF 规则拦截包含 embeds 属性的请求。同时建议监控对聊天历史修改接口的异常请求。"
steps = ["确认当前 Open WebUI 版本", "备份配置和聊天数据", "升级到 v0.6.44 或更高版本", "验证升级后 iFrame Sandbox 设置是否正确"]

