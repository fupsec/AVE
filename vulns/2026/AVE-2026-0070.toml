poc_confidence = "high"

[basic]
description = "Open WebUI 是一个自托管的人工智能平台，设计为完全离线运行。在 0.6.44 版本之前，手动修改聊天历史可以设置响应消息上的 `embeds` 属性，其内容被加载到设置了 `allow-scripts` 和 `allow-same-origin` 的 iFrame 中，忽略了 iframe Sandbox Allow Same Origin 配置。这导致存储型跨站脚本攻击。当聊天以共享格式查看时也会触发该问题。结果是包含恶意 payload 的可共享链接可分发给实例上的其他用户。"
published = "2026-02-19"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "ghsa"
sources = ["unknown"]
title = "Open WebUI 响应消息 iFrame 嵌入存储型 XSS 漏洞"
updated = "2026-06-17"

