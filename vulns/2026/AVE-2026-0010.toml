[basic]
description = """
CodeAstro Human Resource Management System是一款面向企业人力资源管理场景的商业PHP应用,提供员工信息管理、档案管理等功能。
受影响版本中,View接口的I参数经Base64解码后直接作为$id传入Employee_model.php的GetFileInfo函数,该函数将$id直接拼接入SQL查询语句而未使用参数化查询,导致攻击者可通过构造恶意SQL payload绕过认证并执行任意SQL指令,实现数据库数据窃取、篡改或删除。
修复版本中通过采用CodeIgniter框架的ORM查询构造器或预处理语句对用户输入进行参数绑定,切断用户可控数据与SQL语句的直接连接,避免注入攻击。"""
