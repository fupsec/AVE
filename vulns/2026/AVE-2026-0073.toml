title = "Android ActivityManagerService.dumpBitmapsProto 权限检查缺失漏洞"
description = "Android ActivityManagerService 的 dumpBitmapsProto 方法存在权限检查缺失漏洞，应用程序无需任何权限即可窃取其他正在运行应用的 UI 位图信息。该漏洞可导致本地权限提升（LPE），攻击者无需额外执行权限，无需用户交互。"
