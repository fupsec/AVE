[basic]
title = "Google Android 16 QPR2 Beta ActivityManagerService 位图信息泄露漏洞"
description = "Android 16 QPR2 Beta (Baklava) 的 ActivityManagerService.dumpBitmapsProto() 方法缺少 enforceCallingOrSelfPermission(DUMP) 权限检查（CWE-280），导致零权限应用可通过 Binder 事务码 #117 绕过隐藏 API 限制直接调用该方法，通过 ParcelFileDescriptor 管道读取所有正在运行应用的 UI 位图数据。攻击者无需任何权限或用户交互即可窃取其他应用的敏感界面截图，构成严重的信息泄露与本地权限提升威胁。Mobile Hacking Lab 已发布完整 PoC 代码，包含可直接安装的 APK 和一键利用脚本。"
severity = "HIGH"
score = 8.4
cvss_v3 = "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
remediation = "升级至 Android 安全公告 2026-03-01 修复版本，Google 已在 dumpBitmapsProto() 首行添加 enforceCallingOrSelfPermission(DUMP) 权限检查，未授权调用将抛出 SecurityException。用户应进入设置 > 系统 > 系统更新安装安全补丁，确保安全补丁级别 ≥ 2026-03-01。"
published = "2026-03-02"
updated = "2026-06-17"
sources = ["github", "nvd"]
vendor = "Google"
product = "Android 16 QPR2 Beta (Baklava)"

