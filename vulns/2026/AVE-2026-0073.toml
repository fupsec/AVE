[affected]
product = "Android 16 QPR2 Beta (Baklava)"
vendor = "Google"

[authenticity]
cve_confidence = "high"
notes = "CVE 已由 Google 官方确认并修复，CISA-ADP 已分配 CVSS 3.1 评分 8.4（HIGH），GitHub 仓库 mobilehackinglab/CVE-2026-0047-poc（13 stars）提供完整可验证的 PoC 代码、APK 和利用脚本。已搜索 Exploit-DB、PacketStorm、Sploitus 等渠道，未发现任何公开条目。由于该漏洞为 Android Binder 协议层漏洞（非 HTTP 协议），不存在也不适用 Nuclei HTTP 模板。未发现其他编号关联此漏洞（无 AVD、CNVD 等）。Mobile Hacking Lab 发表了漏洞分析博客（链接见 references）。"
poc_confidence = "high"

[basic]
description = "Android ActivityManagerService 的 dumpBitmapsProto 方法存在权限检查缺失漏洞（CWE-280），应用程序无需任何权限即可通过 Binder 事务码 #117 触发该方法，窃取其他正在运行应用的 UI 位图信息。该漏洞可导致本地权限提升（LPE），攻击者无需额外执行权限，无需用户交互。"
published = "2026-03-02"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "Android ActivityManagerService.dumpBitmapsProto 权限检查缺失漏洞"
updated = "2026-06-17"

