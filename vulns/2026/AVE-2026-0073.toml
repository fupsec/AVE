[remediation]
fix = "升级到 tesla 1.18.3 及以上版本。"
workaround = "如无法升级，在使用 Tesla.Multipart.add_content_type_param/2 之前验证参数字符串，拒绝任何包含 \\r 或 \\n 的输入值。"
steps = [
  "1. 确认项目中使用的 tesla 版本是否在 0.8.0 至 1.18.3 之间",
  "2. 升级到 tesla 1.18.3 或更高版本",
  "3. 如无法升级，对所有传入 add_content_type_param/2 的参数进行 CR/LF 字符校验"
]

