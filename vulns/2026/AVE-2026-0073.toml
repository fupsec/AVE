fix = "升级到 Android 安全公告 2026-03-01 中指定的修复版本。Google 已添加 enforceCallingOrSelfPermission(DUMP) 权限检查。参考 https://source.android.com/docs/security/bulletin/2026/2026-03-01"
workaround = "如无法升级，建议避免在未打补丁的 Android 16 QPR2 Beta 设备上处理敏感信息，并限制安装未知来源应用。"
steps = ["步骤1: 进入 设置 > 系统 > 系统更新 检查安全补丁级别", "步骤2: 安装 2026-03-01 或更新的安全补丁", "步骤3: 重启设备并验证安全补丁级别是否 ≥ 2026-03-01"]

