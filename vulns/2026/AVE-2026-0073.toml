[basic]
title = "Tesla CRLF注入漏洞 (CVE-2026-48596)"
description = "Tesla.Multipart.add_content_type_param/2 函数在将调用者提供的字符串追加到 multipart Content-Type 头时未进行任何验证。包含 \\r\\n 的参数值会分割头部行，允许攻击者向出站 HTTP 请求中注入任意头部。任何将不受信任的输入（如用户提供的 charset 或参数字符串）传入 add_content_type_param/2 的应用程序均受影响。此漏洞影响 tesla 0.8.0 至 1.18.3 版本。"
severity = "LOW"
source = "ghsa"
published = "2026-06-02"
updated = "2026-06-17"

