[basic]
description = "pyLoad 的 EventManager 模块维护一个 Client 实例列表用于事件订阅。get_events API 每次收到唯一 uuid 都会创建新的 Client 实例并追加到 clients 列表中。虽然 EventManager 提供了 clean() 方法用于移除无响应的 Client 实例，但该方法在核心代码中从未被调用。攻击者可发送大量携带不同 uuid 的请求，导致 clients 列表无限增长、内存耗尽，最终造成拒绝服务。"
published = "2026-07-08"
remediation = "升级 pyLoad 至 0.5.0b3.dev101 或更高版本。官方修复在 get_events 方法开头调用 self.clean() 以清除无效客户端，同时建议在 getEvents 端点实施速率限制以防止单一客户端发送大量请求。"
score = 6.5
severity = "MEDIUM"
sources = ["ghsa"]
title = "pyLoad EventManager 未清理无效客户端连接导致内存耗尽拒绝服务漏洞"
updated = "2026-07-10"

