[remediation]
fix = "将 Tesla 升级到 1.18.3 或更高版本。参考 GitHub 安全公告：https://github.com/elixir-tesla/tesla/security/advisories/GHSA-h74c-q9j7-mpcm"
steps = [
    "步骤1: 确认项目使用的 Tesla 版本（在 mix.exs 中检查 tesla 依赖版本）",
    "步骤2: 如果版本 >= 1.3.0 且 < 1.18.3，则存在此漏洞",
    "步骤3: 在 mix.exs 中将 tesla 依赖更新为 '~> 1.18.3' 或更高版本",
    "步骤4: 运行 mix deps.update tesla 更新依赖",
    "步骤5: 检查代码中是否使用了 Tesla.Adapter.Mint，考虑替换为其他适配器",
    "步骤6: 如果使用了 Tesla.Middleware.FollowRedirects，评估是否需要额外的 scheme 校验",
]
workaround = "如无法升级，可采取以下缓解措施：1. 避免使用 Tesla.Adapter.Mint 适配器，改用 Tesla.Adapter.Httpc 或 Tesla.Adapter.Finch 等其他适配器；2. 如果必须使用 Mint 适配器，在将 URL 传递给 Tesla 之前对 URL scheme 进行白名单验证（仅允许 http/https）；3. 从中间件栈中移除 Tesla.Middleware.FollowRedirects，或使用自定义重定向处理逻辑进行 scheme 校验；4. 通过 Elixir 的 System.monotonic_time 监控原子表使用率。"

