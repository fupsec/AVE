]

[remediation]
fix = "升级 Ninja Forms File Uploads 插件到 3.3.27 或更高版本。参考官方安全公告。"
workaround = "如无法升级，可采取以下缓解措施：1. 临时禁用 Ninja Forms File Uploads 插件；2. 通过 Web 应用防火墙（WAF）规则阻止对 /wp-admin/admin-ajax.php 的异常上传请求，特别是 action=nf_fu_upload 的请求。"
steps = ["步骤1: 检查 Ninja Forms File Uploads 插件版本是否 <= 3.3.26", "步骤2: 从 WordPress 插件管理后台更新到 3.3.27 或更高版本", "步骤3: 检查 /wp-content/uploads/ninja-forms/tmp/ 目录下是否存在可疑 PHP 文件", "步骤4: 审查服务器日志中是否有针对 admin-ajax.php 的异常 POST 请求"]

