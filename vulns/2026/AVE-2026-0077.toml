[authenticity]
cve_confidence = "high"
notes = "CVE 由 EEF (Erlang Ecosystem Foundation) 分配并已验证。GHSA 安全公告由维护者发布并提供补丁提交。漏洞详情清晰，影响版本明确。暂无公开可用的自动化 PoC 脚本，但漏洞原理简单明确（String.to_atom/1 滥用），技术上可复现。EPSS 评分为 0.301%（第 22 百分位）。"
poc_confidence = "low"

[basic]
description = "Elixir Tesla HTTP 客户端库的 Mint 适配器中，Tesla.Adapter.Mint.open_conn/2 函数将每个出站请求的 URL scheme 通过 String.to_atom/1 转换为 BEAM 原子，且没有白名单验证。BEAM 原子不会被垃圾回收，原子表有上限（默认约 1,048,576 个）。攻击者可以通过变化 URL scheme 字符串（如在 webhook 代理、链接预览、SSRF 代理等场景中），或利用 Tesla.Middleware.FollowRedirects 中间件在重定向上设置恶意的 Location 头，每次请求创建一个新原子，最终耗尽原子表导致 BEAM VM 崩溃，造成拒绝服务。"
published = "2026-06-02"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "ghsa"
sources = ["unknown"]
title = "Tesla HTTP 客户端存在通过未受信 URL Scheme 导致的原子表耗尽漏洞"
updated = "2026-06-17"

