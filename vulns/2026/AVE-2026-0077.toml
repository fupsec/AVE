[basic]
title = "Ninja Forms File Uploads WordPress 插件 <= 3.3.26 未授权任意文件上传漏洞"
description = "Ninja Forms File Uploads WordPress 插件 3.3.26及之前版本中存在任意文件上传漏洞，由 NF_FU_AJAX_Controllers_Uploads::handle_upload 函数缺少文件类型验证和权限检查导致。未认证攻击者可通过先获取 nonce、然后上传伪装扩展名的文件并服务端重命名为 PHP 文件的方式，上传任意文件到 web 可访问目录 /wp-content/uploads/ninja-forms/tmp/，从而实现远程代码执行。该漏洞在 3.3.25 版本中部分修复，在 3.3.27 版本中完全修复。"
severity = "CRITICAL"
source = "nvd"
published = "2026-04-07"
updated = "2026-06-17"

