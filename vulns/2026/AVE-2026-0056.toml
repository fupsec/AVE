[basic]
description = "HL7 FHIR Core 的 FHIRPathEngine 实现中存在正则表达式拒绝服务漏洞。matches()、matchesFull() 和 replaceMatches() 函数将用户可控的正则表达式传递给 Java 的 Pattern.compile()，但超时机制未能正确中断正在执行的线程。攻击者可构造 (a+)+$ 等恶意模式导致指数级回溯，耗尽 CPU 资源，造成服务不可用。"
published = "2026-06-01"
remediation = "升级至 ca.uhn.hapi.fhir 6.9.4.2 或 6.9.9 及以上版本，或参考厂商安全公告应用补丁。"
score = 7.5
severity = "HIGH"
sources = ["ghsa", "github"]
title = "HL7 FHIR Core FHIRPathEngine 正则表达式拒绝服务漏洞"
updated = "2026-07-09"

