[basic]
title = "Android ADB 无线调试认证绕过漏洞"
description = "Android adbd (ADB daemon) 的 auth.cpp 文件中 adbd_tls_verify_cert 函数存在逻辑错误，导致无线 ADB 相互认证可被绕过。攻击者通过 TLS 类型混淆（EVP_PKEY_cmp）可绕过证书验证，在无需用户交互的情况下以 shell 用户身份在邻近网络远程执行代码，无需额外执行权限。影响 Android 14/15/16/16 QPR2 版本。"
severity = "HIGH"
source = "nvd"
published = "2026-05-04"
updated = "2026-06-17"

