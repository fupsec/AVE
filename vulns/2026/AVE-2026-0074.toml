[basic]
title = "Tesla 存在 URL scheme 未授权原子耗尽漏洞"
description = "Tesla.Adapter.Mint.open_conn/2 将每次出站请求的 URL scheme 通过 String.to_atom/1 转换为 BEAM 原子，未进行白名单验证。BEAM 原子永不回收，原子表默认约 1,048,576 条目。攻击者如果能影响 Tesla 请求的 URL（通过应用层 URL 转发功能如 webhook、代理、导入器，或通过 Tesla.Middleware.FollowRedirects 中间件跟随 Location 响应头），即可通过不断变化 scheme 字符串注入新的永久原子。原子表被填满后 BEAM VM 崩溃，导致应用程序不可用。"
severity = "HIGH"
source = "ghsa"
published = "2026-06-02"
updated = "2026-06-17"

