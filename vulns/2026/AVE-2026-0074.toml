[remediation]
fix = "升级到 Android 安全公告 2026-05-01 中对应修复版本。"
workaround = "禁用无线 ADB 调试功能。进入「设置 > 开发者选项 > 无线调试」并关闭。如必须使用，请确保仅在受信任的封闭网络环境中启用。"
steps = [
  "步骤1: 检查 Android 系统版本（受影响版本：Android 14、15、16 及 16 QPR2 Beta）",
  "步骤2: 进入「设置 > 开发者选项」关闭「无线调试」开关",
  "步骤3: 升级到 Android 安全公告 2026-05-01 提供的修复版本"
]

