[basic]
title = "Android ADB 无线调试 TLS 证书验证认证绕过漏洞"
description = "adbd（Android Debug Bridge Daemon）的 adbd_tls_verify_cert 函数中存在认证绕过漏洞。由于 EVP_PKEY_cmp 类型混淆（type confusion）逻辑错误，攻击者可绕过无线 ADB 双向认证机制，在无需用户交互的情况下，以 shell 用户身份在相邻网络中远程执行代码。"
severity = "HIGH"
source = "android"
published = "2026-05-04"
updated = "2026-06-17"

