[remediation]
fix = "升级到 tesla 1.18.3 或更高版本。参考官方安全公告 https://github.com/elixir-tesla/tesla/security/advisories/GHSA-h74c-q9j7-mpcm"
workaround = "如无法升级，可采取以下缓解措施：1. 避免在应用层将用户控制的 URL 传递给 Tesla.Adapter.Mint；2. 移除 Tesla.Middleware.FollowRedirects 中间件；3. 在 URL 传递给 Tesla 之前进行 scheme 白名单验证。"
steps = ["步骤1: 检查项目是否使用 Tesla.Adapter.Mint", "步骤2: 确认项目中 tesla 版本是否在 1.3.0 到 1.18.2 之间", "步骤3: 在 mix.exs 中将 tesla 更新至 1.18.3 或更高版本", "步骤4: 运行 mix deps.update tesla 更新依赖"]

