[basic]
title = "Metinfo（米拓建站系统）include/thumb.php 本地文件包含漏洞"
description = "Metinfo（米拓建站系统）的 /include/thumb.php 文件中存在本地文件包含漏洞。攻击者可通过构造特制的 dir 参数（如 http\\..\\admin\\login\\login_check.php），利用路径遍历读取服务器上的任意 PHP 文件源码，从而获取敏感信息，包括数据库配置、管理员凭据等。此漏洞源于对 dir 参数过滤不严，允许攻击者绕过路径限制读取受限文件。"
severity = "HIGH"
source = "nuclei"
published = "2018-07-11"
updated = "2018-07-11"

