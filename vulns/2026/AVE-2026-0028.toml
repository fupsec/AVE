notes = "此漏洞为 CNVD 收录编号 CNVD-2018-13393，目前未发现对应 CVE 编号或阿里云 AVD 编号。Nuclei 模板已验证可利用。Seebug 文章（paper.seebug.org/676）详细描述了 Metinfo 多个漏洞，包括此 LFI。漏洞影响 Metinfo 米拓建站系统，属于中文 CMS。经过搜索 NVD、GitHub、Exploit-DB、PacketStorm、Sploitus 等渠道，未发现额外的公开 PoC/EXP 资源。"
poc_confidence = "high"

[basic]
description = 'Metinfo（米拓建站系统）的 /include/thumb.php 文件中存在本地文件包含漏洞。攻击者可通过构造特制的 dir 参数（如 http\..\admin\login\login_check.php），利用路径遍历读取服务器上的任意 PHP 文件源码，从而获取敏感信息，包括数据库配置、管理员凭据等。此漏洞源于对 dir 参数过滤不严，允许攻击者绕过路径限制读取受限文件。'
published = "2018-07-11"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nuclei"
