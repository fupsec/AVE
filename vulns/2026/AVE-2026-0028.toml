[basic]
title = "Metinfo（米拓建站系统）include/thumb.php 本地文件包含漏洞"
description = "Metinfo（米拓建站系统）的 /include/thumb.php 文件中存在本地文件包含漏洞。攻击者可通过构造特制的 dir 参数（如 http\\..\\admin\\login\\login_check.php），利用路径遍历读取服务器上任意 PHP 文件源码，从而获取敏感信息，包括数据库配置与管理凭据等。此漏洞源于对 dir 参数过滤不严，允许攻击者绕过路径限制读取受限文件，属于 CWE-22 路径遍历类漏洞。"
severity = "HIGH"
score = 8.6
remediation = "升级到 Metinfo 最新版本，厂商已在后续版本中修复了 thumb.php 的路径过滤问题。如无法升级，可在 Web 服务器添加访问控制规则，限制对 /include/thumb.php 的异常 dir 参数请求。"
published = "2018-07-11"
updated = "2018-07-11"
sources = ["nuclei", "CNVD"]

