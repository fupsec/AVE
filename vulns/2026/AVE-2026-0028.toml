[remediation]
fix = "升级到 Metinfo 最新版本，厂商已在后续版本中修复了 thumb.php 的路径过滤问题。"
workaround = "如无法升级，可在 Web 服务器层面（如 Nginx/Apache）配置规则，拦截对 /include/thumb.php 的异常 dir 参数请求。"
steps = [
  "1. 确认 Metinfo 版本是否受影响",
  "2. 升级到 Metinfo 官方最新版本",
  "3. 如无法升级，在 Web 服务器添加访问控制规则，限制对 /include/thumb.php 的访问"
]

