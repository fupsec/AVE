poc_confidence = "high"

[basic]
description = "GoBGP 在处理 BGP UPDATE 解码时接受零长度 AS_PATH，随后在验证联合 eBGP 对等体的该属性时触发 panic。远程未认证的对等体（配置为联合 eBGP 邻居）可建立 BGP 会话并发送单个包含语法有效但零值长度的 AS_PATH 属性的恶意 UPDATE 消息，导致接收 goroutine 崩溃、对等会话中断，若 panic 未被运行时路径恢复可能导致进程终止。"
published = "2026-06-30"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 5.5
severity = "MEDIUM"
source = "ghsa"
sources = ["unknown"]
title = "GoBGP 空 AS_PATH 属性导致联合 eBGP 对等体验证崩溃"
updated = "2026-07-09"

