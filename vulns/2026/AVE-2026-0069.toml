[remediation]
fix = "升级到 GoBGP v4.7.0 或更高版本。该版本添加了对空 AS_PATH 属性的检查：在 confederation eBGP 分支中增加 len(p.Value) == 0 的判断，返回格式错误消息而非触发 panic。"
steps = [
    "确认 GoBGP 版本是否 ≤ 4.6.0",
    "使用 go get github.com/osrg/gobgp/v4@v4.7.0 升级到修复版本",
    "重启 GoBGP 服务使变更生效",
]
workaround = "如无法升级，可在 BGP 会话管理中增加额外的输入验证，在消息到达 GoBGP 解码器之前拒绝包含零长度 AS_PATH 属性的 UPDATE 消息。"

