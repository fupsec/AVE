[remediation]
fix = "升级到 tesla 1.18.3 及以上版本。参考官方安全公告 GHSA-9m9w-gxf7-rh8m。"
workaround = "如无法升级，将所有请求头键名归一化为小写后再传入 Tesla。使用 \"authorization\" (全小写) 替代 \"Authorization\" 设置请求头，或在应用层对请求头键名进行大小写归一化处理。"
steps = ["确认当前使用的 tesla 版本（mix deps | grep tesla）", "升级到 tesla 1.18.3 及以上版本", "检查应用中是否使用了 Tesla.Middleware.FollowRedirects 中间件", "如无法升级，在设置请求头时使用全小写 \"authorization\" 替代规范大小写 \"Authorization\"", "验证修复：检查所有调用 put_header/3 或 Tesla.Middleware.Headers 的地方是否已归一化请求头键名"]

