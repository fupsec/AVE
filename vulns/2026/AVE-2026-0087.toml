[basic]
title = "NL Portal GraphQL API 越权访问漏洞（缺少用户级授权检查）"
description = "NL Portal Backend Libraries（nl-portal-backend-libraries）存在 GraphQL API 缺少逐用户授权检查的安全漏洞。在3.0.0及以下版本中，DocumentContentQuery 和 BesluitenQuery 两个 GraphQL 解析器的方法签名中均未声明 CommonGroundAuthentication 参数，导致框架无法将已认证用户绑定到调用路径中，解析器无法执行用户级授权校验。攻击者以任意已登录用户身份即可通过 documenten-api 的 getDocumentContent 操作按 ID 下载任意文档原始内容（该项目自2022年首次提交以来所有版本均受影响），同时可通过 besluiten 模块的 getBesluiten、getBesluit 等六个操作跨用户枚举和读取决策记录及其审计轨迹和附件文档。决策数据通常包含敏感个人信息（如福利、许可、异议等），两个端点可形成链式利用：先通过决策枚举获取文档 ID，再通过文档接口窃取内容，造成高机密性影响。"
severity = "MEDIUM"
published = "2026-07-08"
updated = "2026-07-08"
score = 6.5
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
sources = ["ghsa", "nvd", "gitlab"]

remediation = "升级 nl-portal-backend-libraries 至3.0.1或更高版本。documenten-api 模块在修复提交32e0ebdf中为 DocumentContentQuery 的 getDocumentContent 方法添加了 CommonGroundAuthentication 参数，使 Spring 框架自动绑定已认证用户并拒绝未认证调用；besluiten 模块在修复提交f592af1b中被整体移除，依赖该功能的应用需在升级前自行实现带有逐用户授权的替代解析器。无法立即升级的部署可在 API 网关层屏蔽 getDocumentContent、getBesluiten、getBesluit、getBesluitAuditTrails、getBesluitAuditTrail、getBesluitDocumenten、getBesluitDocument 等 GraphQL 操作，或屏蔽 besluiten 模块的全部 GraphQL 类型。"

[affected]
vendor = "NL Portal"
product = "nl-portal-backend-libraries"
affected_packages = [
    { name = "nl.nl-portal:documenten-api", ecosystem = "Maven", versions = "<= 3.0.0" },
    { name = "nl.nl-portal:besluiten", ecosystem = "Maven", versions = ">= 1.5.0, <= 3.0.0" },
]
fixed_version = "3.0.1"

