[affected]
product = "WPvivid Backup & Migration"
vendor = "wpvividplugins"

[basic]
description = "WPvivid Backup & Migration WordPress插件0.9.123及之前版本中存在未授权任意文件上传远程代码执行漏洞。RSA解密过程中错误处理不当，openssl_private_decrypt()失败后返回false值，phpseclib库将其视为空字节AES密钥，攻击者可利用可预测的空字节密钥加密恶意载荷。同时插件未对上传文件名进行清理，导致目录遍历可逃逸备份目录，未经身份验证的攻击者可通过wpvivid_action=send_to_site参数上传任意PHP文件至可公开访问的目录，实现远程代码执行。CVSS评分9.8，危害严重。"
published = "2026-02-11"
remediation = "升级WPvivid Backup & Migration插件至0.9.124或更高版本；限制/wp-content/uploads/目录的PHP执行权限；部署WAF规则拦截异常文件上传请求。"
score = 9.8
severity = "CRITICAL"
sources = [
    "github",
    "nvd",
    "wordfence",
]
title = "`WPvivid Backup & Migration WordPress插件远程代码执行漏洞`"
updated = "2026-06-17"

