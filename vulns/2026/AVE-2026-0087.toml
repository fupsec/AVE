[basic]
title = "NL Portal GraphQL接口缺少逐用户鉴权导致信息泄露"
description = "NL Portal 后端库（nl-portal-backend-libraries）中的 GraphQL API 在文档内容查询和决策（besluiten）查询两个接口上缺少逐用户鉴权检查。攻击者作为已认证用户，可通过 documenten-api 模块的 getDocumentContent 查询下载任意文档原始内容，也可通过 besluiten 模块枚举、搜索和读取其他用户的决策记录及其审计日志和附件。根本原因是 GraphQL Resolver 方法签名未声明认证参数，导致框架无法绑定已认证主体，Resolver 因此无法执行用户级别的授权检查。攻击者可利用两个端点形成完整攻击链：先通过决策接口枚举文档 ID，再通过文档接口窃取内容，威胁包含个人敏感数据的政府门户系统数据机密性。"
severity = "MEDIUM"
score = 6.5
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
published = "2026-06-03"
updated = "2026-07-08"
remediation = "升级 nl-portal-backend-libraries 至 3.0.1 或更高版本。documenten-api 模块已在 Resolver 签名中添加认证参数，besluiten 模块已在 3.0.1 中整体移除。如无法立即升级，应在 API 网关层屏蔽 getDocumentContent、getBesluiten、getBesluit、getBesluitAuditTrails、getBesluitAuditTrail、getBesluitDocumenten、getBesluitDocument 等 GraphQL 操作，或直接屏蔽 besluiten 模块的 GraphQL 类型及文档内容查询。"
sources = ["ghsa"]

