[basic]
title = "Palo Alto Networks PAN-OS User-ID™ 认证门户缓冲区溢出漏洞"
description = "Palo Alto Networks PAN-OS 软件的 User-ID™ 认证门户（又称 Captive Portal）服务中存在缓冲区溢出漏洞（CWE-787）。未经身份验证的攻击者可通过发送特制数据包触发基于栈/堆的缓冲区溢出，覆盖指令指针（EIP/RIP），从而在 PA 系列和 VM 系列防火墙上以 root 权限执行任意代码。Prisma Access、Cloud NGFW 和 Panorama 设备不受影响。该漏洞已在野被积极利用，纳入 CISA KEV 目录。"
severity = "CRITICAL"
source = "nvd"
published = "2026-05-05"
updated = "2026-06-17"

[score]
