notes = "CVE 已由 Palo Alto Networks 官方分配并发布安全公告。CISA 已将该漏洞加入 Known Exploited Vulnerabilities 目录（2026-05-06），确认存在在野利用。GitHub 上存在公开 PoC 仓库（20 stars，12 forks），提供了完整的利用逻辑说明。官方已发布多个版本的修复补丁。受影响产品还扩展到 Siemens RUGGEDCOM APE1808。漏洞在 2026 年 5 月被 Palo Alto 深度产品安全研究团队发现。"

