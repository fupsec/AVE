[remediation]
fix = "升级 PAN-OS 到修复版本：10.2.18-h6 / 10.2.16-h7 / 10.2.13-h21 / 10.2.10-h36 / 10.2.7-h34 / 11.1.15 / 11.1.13-h5 / 11.1.10-h25 / 11.1.7-h6 / 11.1.6-h32 / 11.1.4-h33 / 11.2.12 / 11.2.10-h6 / 11.2.7-h13 / 11.2.4-h17 / 12.1.7 / 12.1.4-h5 或更高版本。Cloud NGFW 和 Prisma Access 无需操作。参考官方安全公告 https://security.paloaltonetworks.com/CVE-2026-0300"
workaround = "如无法升级，可采取以下缓解措施：1) 将 User-ID™ 认证门户访问限制为仅受信任的内部 IP 地址，禁止暴露到公网；2) 在面向不受信任网络的 L3 接口管理配置文件中禁用 Response Pages；3) 如非必需，直接禁用 User-ID™ 认证门户。具有 Threat Prevention 订阅的客户可启用威胁 ID 510019（需 Applications and Threats 内容版本 9097-10022，且 PAN-OS 11.1 及以上版本）。"
steps = ["步骤1: 确认 PAN-OS 版本（System > Software）", "步骤2: 检查 User-ID™ 认证门户配置（Device > User Identification > Authentication Portal Settings）", "步骤3: 如版本在受影响范围内，升级到修复版本", "步骤4: 如无法升级，实施缓解措施（限制访问 IP、禁用 Response Pages 或关闭认证门户）", "步骤5: 检查是否有异常日志或可疑活动迹象"]

