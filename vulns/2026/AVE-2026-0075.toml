[remediation]
fix = "升级 PAN-OS 到以下修复版本：10.2.18-h6 及以上、11.1.15 及以上、11.2.12 及以上、12.1.7 及以上。或应用对应 hotfix（10.2.7-h34、10.2.10-h36、10.2.13-h21、10.2.16-h7、11.1.4-h33、11.1.6-h32、11.1.7-h6、11.1.10-h25、11.1.13-h5、11.2.4-h17、11.2.7-h13、11.2.10-h6、12.1.4-h5）。参考 Palo Alto Networks 安全公告。"
steps = [
    "步骤1: 确认 PAN-OS 版本",
    "步骤2: 限制 User-ID Authentication Portal 访问（Network > Interfaces > Advanced > Management Profile）",
    "步骤3: 如无法立即升级，禁用响应页面或禁用 Authentication Portal",
    "步骤4: 升级到修复版本",
]
workaround = "1. 将 User-ID Authentication Portal 访问限制为仅可信内部 IP 地址；2. 禁用未使用的 User-ID Authentication Portal；3. 具有 Threat Prevention 订阅的客户可启用 Threat ID 510019 阻止攻击。"

