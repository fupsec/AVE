[basic]
description = """
GotoHTTP 是一款商业远程控制平台，通过浏览器实现对远程计算机的控制，支持多操作系统。
受影响版本中，/reg.12x 端点在处理 sn 参数时未进行输入 sanitization，将用户提交的原始参数值未经 HTML 编码直接回显到错误响应页面。攻击者可通过构造含恶意 JavaScript 代码的 URL 诱骗用户点击，从而在受害者浏览器中执行任意脚本。
修复版本中通过移除源代码中不必要的参数回显逻辑消除了该 XSS 风险，但当前尚无明确修复版本号，厂商计划在下一版本中一并部署。"""
