[basic]
description = "Lenovo Diagnostics 及 Lenovo Vantage 中使用的 HardwareScanAddin 在安装或执行硬件扫描期间，存在一个因未正确模拟用户权限而导致的任意文件写入漏洞。本地认证用户可通过创建 NTFS  junction 将目标文件写入任意路径，从而以 SYSTEM 权限执行任意文件写入操作。"
