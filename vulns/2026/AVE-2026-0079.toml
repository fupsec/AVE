[basic]
title = "泛微e-cology <=9.0 BeanShell远程命令执行漏洞"
description = "泛微e-cology OA系统9.0及之前版本中的BeanShell组件存在未授权访问漏洞(CNVD-2019-32204)。攻击者无需身份认证即可通过向/bsh.servlet.BshServlet接口发送特制POST请求，利用bsh.script参数执行任意系统命令。BeanShell组件默认暴露在公网环境中，攻击者可借此完全控制目标服务器，获取敏感数据或进行横向移动。该漏洞影响范围广泛，危害极大。"
severity = "CRITICAL"
score = 10.0
remediation = "立即升级泛微e-cology系统至最新安全版本；临时措施包括删除或禁用BeanShell组件(bsh.servlet.BshServlet)的访问权限，通过Web应用防火墙(WAF)拦截包含bsh.script参数的POST请求，或在反向代理层限制对该路径的访问。"
published = "2019-08-01"
updated = "2026-07-10"
sources = ["nuclei", "cnvd"]

