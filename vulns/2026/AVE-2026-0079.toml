steps = [
    "步骤 1: 确认当前安装的 Lenovo Diagnostics / Vantage 版本",
    "步骤 2: 访问 Lenovo 支持网站下载并安装最新版本",
    "步骤 3: 重启系统确保更新生效",
]
workaround = '限制低权限用户对 C:\ProgramData\Lenovo\LDE 目录的写入权限，或禁用硬件扫描功能。'

