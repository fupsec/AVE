[affected]
product = "tesla"
vendor = "elixir-tesla"

[authenticity]
cve_confidence = "high"
notes = "CVE 已由 EEF 确认并在 NVD 发布。PoC 仅在 GHSA 公告中以文字描述存在，暂无公开可执行 PoC 脚本。此漏洞为库级漏洞，需要在 Elixir 环境中通过 API 调用触发，无法通过外部 HTTP 请求直接探测。"
poc_confidence = "low"

[basic]
description = 'Tesla.Multipart.add_content_type_param/2 在追加调用者提供的字符串到 multipart Content-Type 头部时未进行 CR (\r) 或 LF (\n) 字符过滤。Tesla.Multipart.headers/1 随后将这些参数原样用 "; " 拼接构造出站 Content-Type 头部值。包含 \r\n 的参数会分裂头部行，从而允许在出站 HTTP 请求中注入任意头部。任何将不可信输入传递给 add_content_type_param/2 的应用（如接收用户提供的 charset 或参数值）均受影响。'
published = "2026-06-02"
remediation = "升级 Tesla 至 1.18.3 或更高版本。如无法立即升级，应对传递给 add_content_type_param/2 的参数进行校验，拒绝包含 \\r 或 \\n 等控制字符的输入。"
score = 2.1
severity = "LOW"
source = "ghsa"
sources = ["ghsa"]
title = "Tesla Multipart Content-Type 头部 CRLF 注入漏洞"
updated = "2026-07-10"

