[basic]
title = "Android libopenapv 堆缓冲区溢出远程代码执行漏洞"
description = "Android 16 的 libopenapv (APV 编解码器) 存在堆缓冲区溢出漏洞，攻击者可利用特制数据包触发越界读写，导致远程代码执行。无需用户交互或额外权限即可利用，CVSS评分9.8，危害严重。"
severity = "CRITICAL"
score = 9.8
sources = ["github", "nvd"]
published = "2026-03-02"
updated = "2026-06-17"
remediation = "及时升级 Android 安全更新至 2026-03-01 安全公告对应版本，包含修复此漏洞的补丁。"

