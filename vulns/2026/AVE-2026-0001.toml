[basic]
title = "Universal 1337 Stealer 恶意软件检测规则"
description = "Universal 1337 Stealer 是一款针对 Windows 平台的信息窃取类恶意软件（InfoStealer），能够窃取 FTP 客户端凭据、浏览器保存的密码、加密货币钱包以及系统敏感信息。该恶意软件通过二进制特征码匹配进行检测，使用 YARA 规则识别文件中包含的特定恶意代码片段。被感染系统可能面临数据泄露、凭据被盗和进一步横向移动的风险，攻击者通常通过钓鱼邮件或捆绑下载传播该恶意软件。"
severity = "INFO"
score = 2.5
sources = ["nuclei"]
published = "2023-08-01"
updated = "2025-10-31"
remediation = "建议部署端点检测与响应(EDR)解决方案，及时更新防病毒软件病毒库，对可疑文件进行沙箱分析，避免执行未知来源的可执行文件。同时启用系统文件完整性监控，定期扫描主机中的恶意软件特征。"

