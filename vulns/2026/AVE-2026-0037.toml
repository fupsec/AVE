[basic]
description = "ShowDoc 是一款非常适合IT团队的在线API文档、技术文档工具。ShowDoc 2.8.6以下版本存在文件上传漏洞，由于 PageController.class.php 中 allowExts 属性配置错误导致文件后缀过滤失效，且 uploadImg 接口未进行登录验证，攻击者可在未授权情况下通过构造特制 multipart 数据包上传恶意文件，获取服务器权限。"
published = "2020-08-12"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nuclei"
sources = ["unknown"]
title = "ShowDoc 2.8.6 以下版本文件上传漏洞"
updated = "2021-01-15"

