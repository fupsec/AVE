[basic]
title = "ShowDoc 未授权文件上传远程代码执行漏洞"
description = "ShowDoc 2.8.7之前版本存在未授权任意文件上传漏洞（CNVD-2020-26585/CVE-2025-0520）。攻击者无需认证，通过向 /index.php?s=/home/page/uploadImg 端点发送精心构造的 multipart POST 请求，利用文件名中插入特殊字符（如 <>）绕过扩展名校验，上传包含PHP Webshell的恶意文件到服务器。服务器未对上传文件的MIME类型和扩展名进行有效验证，导致攻击者可直接访问上传的PHP文件并执行任意命令，实现远程代码执行。该漏洞CVSS v4评分为9.4（CRITICAL），已发现在野利用，全球超过2000个ShowDoc实例面临风险，多数位于中国。"
published = "2025-04-29"
updated = "2026-04-14"
severity = "CRITICAL"
score = 9.4
cvss_v4 = "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L"
remediation = "立即将ShowDoc升级至2.8.7或更高版本（当前最新版为3.8.1）。升级前应检查是否已被入侵，删除可疑上传文件。若暂时无法升级，应在Web服务器层面限制 /index.php?s=/home/page/uploadImg 端点的访问权限，或通过WAF规则拦截包含异常扩展名的文件上传请求。同时监控服务器日志中针对该端点的异常POST请求。"
sources = ["nuclei", "nvd", "vulhub", "vulncheck", "cnvd"]

