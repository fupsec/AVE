[basic]
title = "ShowDoc 未授权文件上传导致远程代码执行漏洞"
description = "ShowDoc（一款适用于IT团队的在线API文档与技术文档分享工具）存在未授权任意文件上传漏洞（CNVD-2020-26585 / CVE-2025-0520）。由于/接口/home/page/uploadImg对上传文件后缀校验不严格，攻击者无需认证即可通过构造特殊请求（filename使用test.<>php绕过过滤）上传PHP Webshell，从而在服务器上执行任意代码，获取服务器完全控制权限。该漏洞CVSS v4.0评分9.4（CRITICAL），CVSS v3.1评分9.8（CRITICAL），已被CISA KEV收录并在野活跃利用。"
severity = "CRITICAL"
score = 9.4
score_cvss_v4 = "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L"
published = "2025-04-29"
updated = "2026-06-17"
remediation = "立即将ShowDoc升级至2.8.7或更高版本，该版本已修复文件后缀校验逻辑并增加了上传接口的认证机制。若暂时无法升级，应在Web服务器层面（Nginx/Apache）禁止upload目录下PHP文件执行，对上传目录设置755权限且文件权限设为644，并对上传文件实施白名单后缀校验（仅允许jpg/png/gif等图片格式）。"
sources = ["nvd", "cnvd", "ghsa", "vulhub", "tenable", "vulncheck"]

