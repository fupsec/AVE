[basic]
title = "ShowDoc 2.8.6 以下版本文件上传漏洞"
description = "ShowDoc 是一个适用于IT团队的在线API文档和在线文档管理工具。其 2.8.6 以下版本存在文件上传漏洞（CWE-434），攻击者可在无需认证的情况下通过 /index.php?s=/home/page/uploadImg 接口上传恶意文件，进而获取服务器权限。该漏洞危害严重，CVSS 评分 9.9。"
severity = "CRITICAL"
score = 9.9
remediation = "升级 ShowDoc 至 2.8.6 或以上版本，并对文件上传接口实施严格的类型校验和访问控制策略。"
