[affected]
product = "ShowDoc"
vendor = "star7th"

[basic]
description = "ShowDoc是一款适用于IT团队的在线API文档与技术文档工具，使用Markdown语法书写文档。2.8.6以下版本存在任意文件上传漏洞，攻击者可通过/index.php?s=/home/page/uploadImg接口构造特制multipart数据包，上传包含恶意PHP代码的文件。成功利用后可实现远程代码执行，获取服务器完全控制权限。该漏洞无需身份认证即可触发，攻击成本低且危害严重。"
published = "2020-10-23"
remediation = "厂商已发布修复版本，建议升级ShowDoc至2.8.6或更高版本；如无法升级，应在Web应用防火墙上配置规则拦截/index.php?s=/home/page/uploadImg接口的可执行文件上传请求，并限制上传目录的执行权限。"
score = 9.9
severity = "CRITICAL"
sources = [
    "nuclei",
    "cnvd",
]
title = "ShowDoc 任意文件上传漏洞"
updated = "2026-07-10T12:39:17Z"

