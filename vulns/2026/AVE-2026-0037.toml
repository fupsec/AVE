    "升级到 ShowDoc 2.8.6 或更高版本",
    "如无法升级，在反向代理或 WAF 中拦截 /index.php?s=/home/page/uploadImg 的上传请求",
]
workaround = "如无法升级，可在 Web 应用防火墙（WAF）中增加规则，拦截对 /index.php?s=/home/page/uploadImg 的 POST 请求，或限制上传文件后缀。"

