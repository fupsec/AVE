[basic]
title = "ShowDoc 未授权任意文件上传远程代码执行漏洞"
description = "ShowDoc 是一款适用于IT团队的在线API文档和知识库工具，广泛用于团队协作编写API文档、数据字典和技术文档。该产品在 2.8.7 以下版本中存在未授权任意文件上传漏洞，攻击者无需登录即可通过 POST /index.php?s=/home/page/uploadImg 接口上传恶意文件。漏洞根源在于 uploadImg 方法对文件扩展名的校验存在缺陷，攻击者通过在文件名中插入特殊字符（如 test.<>php）可绕过后缀过滤，将 PHP webshell 上传至服务器。上传成功后，攻击者可直接访问上传的 PHP 文件执行任意命令，实现远程代码执行（RCE），完全控制目标服务器。该漏洞已被多个漏洞利用平台收录，并在野被积极利用。"
severity = "CRITICAL"
score = 9.4
cvss_v4 = "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L"
published = "2025-04-29"
updated = "2026-04-14"
remediation = "立即升级 ShowDoc 至 2.8.7 或更高版本，该版本修复了文件扩展名校验缺陷并增加了身份认证检查。若暂时无法升级，应在 Web 服务器（Nginx/Apache）层面禁止上传目录执行 PHP 文件，将上传目录权限设为只读（chmod 644），并部署 WAF 规则拦截包含特殊字符的文件上传请求。"
sources = ["nvd", "cnvd", "ghsa", "nuclei", "vulhub"]

