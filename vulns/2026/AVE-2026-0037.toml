[basic]
title = "New API 邮箱和微信绑定接口 CSRF 漏洞"
description = "New API（LLM 网关及 AI 资产管理平台）在 v0.12.0-alpha.1 之前，邮箱和微信账号绑定端点 GET /api/oauth/email/bind 和 GET /api/oauth/wechat/bind 使用 GET 请求执行状态变更操作，允许攻击者在会话 Cookie 可跨站发送的部署环境中，诱使已登录用户的浏览器将攻击者控制的邮箱或 OAuth 身份绑定到用户账户。"
severity = "MEDIUM"
source = "ghsa"
published = "2026-07-07"
updated = "2026-07-09"

[score]
cvss_v3 = 5.3
cvss_v3_vector = "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:H/A:N"

[affected]
vendor = "QuantumNous"
product = "new-api"

[exploit]
poc = []
exp = []
nuclei_templates = []

[remediation]
fix = "升级到 v0.12.0-alpha.1 及以上版本。该版本将邮箱和微信绑定路由从 GET 改为 POST，并从查询参数改为从 JSON 请求体读取参数。"
workaround = "如无法立即升级，请在反向代理层阻止对 /api/oauth/email/bind 和 /api/oauth/wechat/bind 的 GET 请求，并将会话 Cookie 配置为 SameSite=Strict。"
steps = ["确认 New API 版本是否低于 v0.12.0-alpha.1", "升级到 v0.12.0-alpha.1 或更高版本", "如无法升级，在反向代理层添加规则阻止 GET 请求访问绑定端点"]

