[basic]
description = """
SourceCodester Class and Exam Timetabling System 1.0是一款用于课程表和考试时间管理的PHP Web应用，代码开源供学习研究使用。
受影响版本中，/preview4.php文件未对course_year_section参数进行任何过滤或预处理即直接拼接入SQL查询语句。攻击者可通过该参数注入恶意SQL代码，操纵数据库查询逻辑，从而获取未授权的数据库访问权限。
修复版本中通过采用预处理语句（Prepared Statements）和参数绑定机制，将用户输入数据与SQL语句结构严格分离，确保输入仅作为数据而非可执行代码被处理。
解决建议
建议您更新当前系统或软件至最新版，完成漏洞的修复。"""
