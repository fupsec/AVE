[basic]
description = """
ruoyi-vue-pro 是开源 Java 企业级开发框架，其 AppFileController 提供移动端文件上传接口。
受影响版本中，FileServiceImpl.generateUploadPath() 方法在拼接 directory 和 name 参数生成文件存储路径时未校验 ../ 等路径穿越字符，攻击者可构造 directory=../../../test 或在文件名中携带 ../ 越过 basePath 限制向服务器任意目录写入文件。
修复版本中通过新增 FilePathUtils 路径校验工具类并在 generateUploadPath() 中对 name 和 directory 调用 validateFileName/validatePath/validateDirectory 方法，以及在 LocalFileClient.getFilePath() 中校验最终路径必须位于 basePath 内，切断了路径穿越利用链。
解决建议
建议您更新当前系统或软件至最新版，完成漏洞的修复。"""
published = "2026-06-29"
remediation = "建议您更新当前系统或软件至最新版，完成漏洞的修复。"
