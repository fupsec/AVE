[basic]
  title = "itsourcecode Hospital Management System SQL注入漏洞(CVE-2026-13530)"
  description = "itsourcecode Hospital Management System是基于PHP开发的商业医院管理系统，用于管理医院业务流程和患者数据。\n受影响版本中，/appointmentdetail.php文件中的Appointment Handler组件对editid参数未进行充分过滤即直接拼接入SQL查询语句，攻击者可通过该参数注入任意SQL代码并执行。成功利用可导致未授权数据库访问、数据泄露或数据篡改等严重后果。\n修复版本中通过，修复版本中该漏洞尚无官方修复版本，由于该产品为闭源商业软件且未公开源代码仓库，建议通过使用参数化查询、输入过滤、最小化数据库权限和安全审计等缓解措施降低风险。\n解决建议\n建议您更新当前系统或软件至最新版，完成漏洞的修复。"
  severity = "HIGH"
  score = 8.6
  sources = ["avd"]
  published = "2026-06-29"
  updated = ""
  remediation = "建议您更新当前系统或软件至最新版，完成漏洞的修复。"

