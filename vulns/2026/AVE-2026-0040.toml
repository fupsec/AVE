[remediation]
fix = "升级到 tesla 1.18.3 及以上版本。参考官方安全公告 GHSA-mc85-72gr-vm9f。"
workaround = "如无法升级，可在应用层限制 HTTP 响应 content-encoding 头的数量（仅允许单个 gzip/deflate 层），或检查响应体大小并在超过阈值时拒绝解压缩。"
steps = ["确认当前使用的 tesla 版本（mix deps | grep tesla）", "升级到 tesla 1.18.3 及以上版本", "检查应用中是否使用了 Tesla.Middleware.DecompressResponse 或 Tesla.Middleware.Compression 中间件", "如无法升级，在中间件链中添加大小检查逻辑，限制解压缩后的响应体大小"]

