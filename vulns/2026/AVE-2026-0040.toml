[remediation]
fix = "将 Tesla 升级至 1.18.3 及以上版本。补丁提交 340f75b5 修复了此问题，在 decompress_body/2 中添加了最大解压大小限制（max_decompress_size）。参考官方安全公告 https://github.com/elixir-tesla/tesla/security/advisories/GHSA-mc85-72gr-vm9f。"
workaround = "如无法立即升级，可在 middleware 管道中移除或禁用 Tesla.Middleware.DecompressResponse 和 Tesla.Middleware.Compression，避免对不可信服务器的响应体进行解压缩。"
steps = [
  "步骤1: 检查 mix.exs 中 tesla 的版本依赖，确认是否 >= 0.6.0 且 < 1.18.3",
  "步骤2: 升级 Tesla 至 1.18.3 或更高版本：`{:tesla, \"~> 1.18.3\"}`",
  "步骤3: 运行 `mix deps.update tesla` 更新依赖",
  "步骤4: 如无法升级，确保 middleware 管道中不包含 DecompressResponse 或 Compression"
]

