[basic]
title = "Tesla 响应体解压缩炸弹漏洞"
description = "elixir-tesla/tesla 项目中的 Tesla.Middleware.DecompressResponse 和 Tesla.Middleware.Compression 中间件在处理 HTTP 响应体时，未对解压缩后的数据大小进行限制。攻击者通过控制恶意服务器（或利用重定向），可返回一个经过多层 gzip 压缩的小型 payload（如 284 字节），该 payload 经递归解压后膨胀至数 GB 的 BEAM 堆内存，导致调用进程崩溃或冻结。漏洞影响 tesla 0.6.0 至 1.18.2 版本，已在 1.18.3 中修复。"
severity = "HIGH"
source = "ghsa"
published = "2026-06-02"
updated = "2026-06-17"

