[basic]
  title = "Tesla HTTP 客户端解压缩炸弹漏洞 (CVE-2026-48594)"
  description = "Tesla (Elixir HTTP 客户端库) 的 DecompressResponse 和 Compression 中间件在处理 HTTP 响应时，对响应体进行无大小限制的解压缩。decompress_body/2 函数将完整响应体传递给 :zlib.gunzip/1 或 :zlib.unzip/1，未对输出大小设置上限。此外，compression_algorithms/1 将 content-encoding 头部按逗号分割，decompress_body/2 对每个 token 递归调用一次解压缩。攻击者控制的服务器返回 content-encoding: gzip, gzip, gzip, gzip 的响应时，触发四次递归解压缩，产生指数级放大：每个 gzip 层可将输入放大约 1000 倍，数百字节的载荷可膨胀至数 GB 的 BEAM 堆内存，耗尽内存导致调用进程崩溃或冻结。影响 tesla 0.6.0 至 1.18.2 版本。\n"
  severity = "HIGH"
  source = "ghsa"
  published = "2026-06-02"
  updated = "2026-06-17"

