[remediation]
fix = "升级 tesla 至 1.18.3 或更高版本，该版本在解压缩过程中添加了输出大小限制检查。参考官方安全公告 GHSA-mc85-72gr-vm9f。"
steps = [
    "确认当前使用的 tesla 版本（mix deps | grep tesla）",
    "升级到 tesla 1.18.3 及以上版本（mix deps.update tesla）",
    "检查应用中是否使用了 Tesla.Middleware.DecompressResponse 或 Tesla.Middleware.Compression 中间件",
    "如无法升级，在中间件管道中添加响应体大小检查逻辑，限制解压缩后的最大数据量",
]
workaround = "如无法升级，可在应用层限制 HTTP 响应 content-encoding 头的数量（仅允许单个 gzip/deflate 层），或在中间件链中添加自定义检查，在解压缩前拒绝超过阈值大小的响应体。"

