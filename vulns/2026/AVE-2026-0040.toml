[basic]
title = "Tesla HTTP 客户端解压缩炸弹漏洞"
description = """
Tesla HTTP 客户端库中的 Tesla.Middleware.DecompressResponse 和 Tesla.Middleware.Compression 中间件在解压缩 HTTP 响应体时存在无大小限制的解压缩炸弹漏洞。decompress_body/2 函数将完整响应体直接传递给 :zlib.gunzip/1 或 :zlib.unzip/1，未对输出大小做任何限制。此外，compression_algorithms/1 按逗号拆分 content-encoding 头，decompress_body/2 对每个 token 递归执行一次解压缩。攻击者通过控制服务器返回 content-encoding: gzip, gzip, gzip, gzip 的响应，触发四层递归解压缩，每层 gzip 可膨胀约 1000 倍，数百字节负载可膨胀至数 GB BEAM 堆内存，导致进程崩溃或节点冻结。
"""
severity = "HIGH"
source = "ghsa"
published = "2026-06-02"
updated = "2026-06-17"

