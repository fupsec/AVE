[remediation]
fix = "将 tesla 升级到 1.18.3 或以上版本。该版本要求必须设置 :max_body_size 选项，并通过流式解压缩和上限检查防止解压缩炸弹攻击。"
workaround = "如无法升级，可在 Tesla 客户端中间件管道中移除 Tesla.Middleware.DecompressResponse 和 Tesla.Middleware.Compression。"
steps = ["步骤1: 确认项目依赖中 tesla 版本为 0.6.0 至 1.18.2", "步骤2: 更新 mix.exs 中 tesla 依赖到 '~> 1.18.3'", "步骤3: 在 Compression 中间件配置中设置 max_body_size 选项，如 {Tesla.Middleware.Compression, format: 'gzip', max_body_size: 32 * 1024 * 1024}", "步骤4: 重新编译并部署"]

