[basic]
title = "Snow Monkey Forms WordPress 插件路径遍历导致任意文件删除"
description = "Snow Monkey Forms WordPress 插件 12.0.3 及以下版本中存在路径遍历漏洞，位于 generate_user_dirpath 函数中。由于对 form_id 参数缺乏充分的路径验证，未认证的攻击者可通过 REST API 接口 /wp-json/snow-monkey-form/v1/view 发送特制请求，利用 ../ 目录遍历字符串删除服务器上的任意文件。当删除 wp-config.php 等关键配置文件后，可导致远程代码执行。攻击者通过设置 method 参数为 input 即可绕过 CSRF 检查。"
severity = "CRITICAL"
score = 9.8
remediation = "升级 Snow Monkey Forms 插件至 12.0.3 以上版本。官方已在 changeset 3448278 中修复此漏洞，建议同时审查服务器文件权限配置以限制 Web 应用可操作的目录范围。"
published = "2026-01-28"
updated = "2026-06-17"
sources = ["github", "nvd"]

