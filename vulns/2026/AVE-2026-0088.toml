[id]
ave_id = "AVE-2026-0088"
cve_id = "CVE-2026-1731"
aliases = ["CVE-2026-1731", "GHSA-p5wr-5p37-2WM6", "BT26-02"]

[basic]
title = "BeyondTrust远程支持和特权远程访问预认证操作系统命令注入漏洞"
description = "BeyondTrust Remote Support（RS）和Privileged Remote Access（PRA）存在严重的预认证远程代码执行漏洞。攻击者通过向WebSocket端点/nw发送精心构造的请求，可在未认证的情况下以站点用户身份执行任意操作系统命令。漏洞根因是thin-scc-wrapper脚本对攻击者可控的版本号输入进行了Bash算术求值，导致如a[$(cmd)]0格式的载荷可触发命令注入。该漏洞与CVE-2024-12356位于同一端点，属于变体漏洞。"
severity = "CRITICAL"
score = 9.9
published = "2026-02-06"
updated = "2026-06-16"
sources = ["nvd", "github", "beyondtrust", "rapid7", "tenable", "cisa", "greynoise"]
remediation = "立即升级BeyondTrust Remote Support至25.3.2或更高版本，Privileged Remote Access升级至25.1或更高版本。若无法立即升级，应用补丁BT26-02-RS（适用于RS v21.3-25.3.1）或BT26-02-PRA（适用于PRA v22.1-24.X）。同时通过防火墙限制管理接口访问，将暴露在互联网的实例暂时下线。"

[affected]
vendor = "BeyondTrust"
product = "Remote Support (RS) / Privileged Remote Access (PRA)"
versions = ["Remote Support <= 25.3.1", "Privileged Remote Access <= 24.3.4"]

