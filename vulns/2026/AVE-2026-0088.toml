[basic]
title = "深信服EDR终端检测响应平台远程命令执行漏洞（CNVD-2020-46552）"
description = "深信服终端检测响应平台（EDR）存在远程命令执行漏洞，攻击者无需身份认证，通过向目标服务器的 /tool/log/c.php 接口发送恶意构造的HTTP请求，利用extract()函数变量覆盖及匿名函数回调机制，可将strip_slashes参数覆盖为system等危险函数，配合host参数注入系统命令，从而实现远程代码执行，获取目标服务器完全控制权限。受影响版本包括EDR v3.2.16、v3.2.17和v3.2.19，漏洞评分8.7分，危害等级高危。"
severity = "HIGH"
score = 8.7
published = "2020-08-18"
updated = "2020-08-18"
remediation = "升级深信服EDR至v3.2.21版本并更新安全补丁包，或直接升级至EDR v3.2.32及之后版本。无法在线升级的用户可通过EDR管理平台「系统管理 - 升级管理 - 平台和终端升级」界面导入升级安装包完成修复。建议立即对受影响资产进行自查，确认版本后尽快完成升级。"
sources = ["nuclei", "cnvd", "nosec", "sangfor", "nsfocus", "360cert"]

[affected]
vendor = "深信服"
product = "终端检测响应平台（EDR）"

