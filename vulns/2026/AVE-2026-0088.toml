[id]
ave_id = "AVE-2026-0088"
cve_id = "CVE-2026-1731"
aliases = ["CVE-2026-1731"]

[basic]
title = "BeyondTrust Remote Support/Privileged Remote Access 预认证命令注入远程代码执行漏洞"
description = "CVE-2026-1731 是 BeyondTrust Remote Support (RS) 和 Privileged Remote Access (PRA) 产品中的一个预认证远程代码执行漏洞。攻击者通过向 WebSocket 端点 /nw 发送精心构造的请求，在 thin-scc-wrapper 脚本中利用 Bash 算术求值特性实现命令注入。由于 remoteVersion 变量未经充分校验，攻击者可在版本号字段中注入恶意 payload（如 a[$(command)]），导致任意 OS 命令以 site user 权限执行。该漏洞与 CVE-2024-12356 存在于同一端点，技术原理相似，已被 VShell 和 SparkRAT 等恶意软件武器化利用。"
severity = "CRITICAL"
score = 9.9
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
remediation = "立即升级 BeyondTrust Remote Support 至 25.3.2 或更高版本，升级 Privileged Remote Access 至 24.3.5 或更高版本。如暂无法升级，部署厂商提供的补丁 BT26-02-RS 和 BT26-02-PRA，并对 WebSocket 端点访问实施网络层访问控制，限制仅允许可信来源连接。"
published = "2026-02-06"
updated = "2026-06-16"
sources = ["nvd", "beyondtrust", "github", "rapid7", "tenable", "unit42"]

