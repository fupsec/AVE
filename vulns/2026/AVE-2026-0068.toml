[remediation]
fix = "升级泛微e-cology至10.56及以上版本。官方已发布安全补丁修复该漏洞，请受影响用户尽快升级。"
workaround = "如暂时无法升级，可通过WAF对/mobile/plugin/browser.jsp路径的keyword参数进行过滤拦截，或限制该路径的外部访问。"
steps = ["步骤1: 确认当前泛微e-cology版本是否低于10.56", "步骤2: 下载官方安全补丁（https://www.weaver.com.cn/cs/securityDownload.asp#）", "步骤3: 备份数据库和应用后执行升级操作", "步骤4: 升级后验证漏洞是否已修复"]

