[remediation]
fix = "升级 GoBGP 至 4.6.0 或更高版本。补丁提交 f02ca397821f6ca182ef4eb492c3cbc459552d7c 修复了所有受影响的 Capability 解码器，改为从 DefaultParameterCapability.CapValue（已由基类按 CapLen 裁剪的切片）读取，并校验 CapLen 必须匹配所需大小。"
steps = [
    "步骤1: 确认 GoBGP 版本，受影响版本为 <= 4.5.0",
    "步骤2: 升级至 GoBGP >= 4.6.0（github.com/osrg/gobgp/v4）",
    "步骤3: 若为 Debian/Ubuntu 系统发行版包管理安装，等待或手动编译新版本",
    "步骤4: 限制 BGP TCP 179 端口的网络访问，仅允许受信任 peer",
]
workaround = "如无法立即升级，可通过防火墙限制 BGP 端口（TCP 179）仅允许受信任的 peer 连接，或使用 BGP TCP MD5/AO 认证机制限制会话建立来源。"

