[affected]
product = "GoBGP"
vendor = "osrg"

[authenticity]
cve_confidence = "high"
notes = "NVD 尚未收录此 CVE（显示 CVE ID Not Found），但 GHSA 安全公告及修复提交均已确认漏洞存在。PoC 为解析器级别验证（无需完整 BGP 会话），由安全公告作者提供。无已知的野外利用或 exploit-db/sploitus 公开利用脚本。"
poc_confidence = "medium"

[basic]
description = "GoBGP 的 BGP OPEN 消息 Capability 解析器存在边界校验缺陷。多个具体 Capability 解码器（CapFourOctetASNumber、CapMultiProtocol、CapGracefulRestart、CapFQDN、CapSoftwareVersion）在调用 DefaultParameterCapability.DecodeFromBytes 后直接使用 data[2:] 全量缓冲区进行解析，而非限制在声明的 CapLen 边界内。攻击者可构造 CapLen=0 的畸形 Capability，使解析器将后续 Capability 的字节误读为当前 Capability 的值。最严重的场景是 4-octet AS Number Capability（Code 65）：CapLen=0 时，紧跟其后的 4 字节会被解析为 AS 号并流入 ValidateOpenMsg 进行 peer AS 验证，从而影响 BGP 会话建立时的 AS 验证逻辑。"
published = "2026-06-02"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 5.5
severity = "MEDIUM"
source = "ghsa"
sources = ["unknown"]
title = "GoBGP BGP OPEN Capability 解析器越界读取漏洞"
updated = "2026-06-02"

