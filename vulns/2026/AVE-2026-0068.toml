[basic]
title = "泛微E-Cology9 browser.jsp SQL注入漏洞"
description = "由于泛微e-cology9中对用户前台输入的数据未做校验，未经身份验证的攻击者通过构造恶意数据包（POST /mobile/plugin/browser.jsp），可以在keyword参数中注入SQL语句，最终获取数据库中的敏感信息（如数据库版本、表数据等）。该漏洞为回显型SQL注入，非盲注。影响版本为泛微e-cology V9 < 10.56。"
severity = "HIGH"
source = "nuclei"
published = "2023-03-01"
updated = "2023-03-17"

