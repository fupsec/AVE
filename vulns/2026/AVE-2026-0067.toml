poc_confidence = "high"

[basic]
description = "psd-tools（v1.17.0及之前所有暴露SmartObject API的版本）存在路径遍历漏洞。SmartObject.save()直接使用PSD文件中未经验证的嵌入式智能对象文件名作为写入路径，攻击者可通过构造包含../或绝对路径的恶意PSD文件，将任意字节写入任意目录。SmartObject.open()对外部类型智能对象同样存在任意文件读取漏洞，攻击者可读取系统任意文件并将其内容写入受控输出目录。该漏洞无需认证或特殊配置即可利用，可导致完整性破坏，在特定场景下可升级为远程代码执行。"
published = "2026-07-09"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "ghsa"
sources = ["unknown"]
title = "psd-tools SmartObject路径遍历导致任意文件写入/读取漏洞"
updated = "2026-07-09"

