[basic]
title = "宏景eHR/宏景HCM 人力资源信息管理系统SQL注入漏洞（CNVD-2023-08743）"
description = "北京宏景世纪软件股份有限公司宏景eHR/宏景HCM人力资源信息管理系统存在SQL注入漏洞（CNVD-2023-08743）。由于系统未对/servlet/codesettree接口的categories参数进行合理处理，未经过身份认证的远程攻击者可利用该漏洞执行任意SQL指令，从而窃取数据库敏感信息，甚至登录后台获取系统控制权限。"
severity = "CRITICAL"
source = "cnvd"
published = "2023-05-11"
updated = "2023-05-12"

[score]
