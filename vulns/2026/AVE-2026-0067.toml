]

[remediation]
fix = "升级宏景eHR/宏景HCM至8.2或更高版本。请联系厂商获取安全补丁。"
workaround = "如暂时无法升级，建议对/servlet/codesettree接口实施访问控制，限制外网直接访问，并在WAF中添加针对categories参数的SQL注入防护规则。"
steps = ["确认当前宏景eHR/HCM系统版本", "联系厂商获取安全补丁或升级至8.2及以上版本", "升级后验证/servlet/codesettree接口不再响应恶意SQL注入请求", "在WAF或网络层限制对该接口的未授权访问"]

