[remediation]
fix = "升级 psd-tools 至 v1.17.1 或更高版本。修复包括：save() 方法通过 os.path.basename() 去除目录组件，写入限定在调用者指定的 directory 内，并通过 os.path.realpath() + os.path.commonpath() 验证路径不越界；open() 方法在提供 external_dir 时忽略超出目录的 fullPath 解析结果，对 relPath 逃逸目录则抛出 ValueError。"
steps = [
    "步骤1: 确认当前使用的 psd-tools 版本是否 <= 1.17.0",
    "步骤2: 升级到 psd-tools >= 1.17.1（pip install psd-tools>=1.17.1）",
    "步骤3: 对已处理的不可信 PSD 文件输出目录进行安全审计",
]
workaround = "如无法立即升级，可在调用 SmartObject.save() 前自行校验 smart_object.filename，拒绝包含 ../ 或绝对路径的文件名。对从不可信来源接收的 PSD 文件，在沙箱环境中处理。"

