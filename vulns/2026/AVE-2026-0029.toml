[basic]
title = "Xiuno BBS 系统重装漏洞（安装目录保护缺失）"
description = "Xiuno BBS（修罗论坛）系统存在安装目录保护缺失漏洞。系统安装完成后未对 /install/ 目录进行有效防护或过滤，攻击者可直接通过访问安装页面重新安装系统，覆盖数据库配置并获取管理员权限。此漏洞源于系统未在安装后正确创建或检测安装锁文件（install.lock），导致安装页面可被反复访问。"
severity = "HIGH"
source = "nuclei"
published = "2019-01-31"
updated = "2019-01-31"

