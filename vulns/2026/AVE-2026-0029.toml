]

[remediation]
fix = "升级到 Xiuno BBS 最新版本，或在系统安装完成后手动删除或保护 /install/ 目录。"
workaround = "在 Web 服务器层面（如 Nginx/Apache）添加访问控制规则，拒绝外部对 /install/ 目录的访问，或手动创建 install.lock 文件阻止重装。"
steps = [
  "1. 确认 Xiuno BBS 版本",
  "2. 升级到 Xiuno BBS 最新安全版本",
  "3. 如无法升级，在 Web 服务器配置中禁止对 /install/ 目录的访问",
  "4. 手动在安装目录创建 install.lock 文件阻止重装"
]

