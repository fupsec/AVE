[basic]
description = '''
Cockpit CMS 是一款开源的 API 优先内容管理系统（agentejo/cockpit，5.4k GitHub stars），用于为任意网站提供内容管理功能。
受影响版本中，.htaccess 配置文件中 &lt;Files ~ "\.(yaml|yml)$"&gt; 指令仅对网站根目录下的 YAML 文件起保护作用，其作用域为目录级别而非递归，因此 /config/config.yaml 文件不受该指令保护；此外 nginx 服务器不支持 .htaccess，根本不存在任何配置保护。攻击者可直接通过 HTTP GET 请求 /config/config.yaml 获取包含 SMTP 凭证、API 密钥、数据库配置、用户组权限等敏感信息的配置文件。
修复版本中通过将配置存储改为 config.php 格式（PHP 文件会被服务器执行而非直接返回内容）并使用递归 RewriteRule 保护配置目录，彻底切断了通过直接 HTTP 请求获取敏感配置的路径。
'''
