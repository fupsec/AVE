[remediation]
fix = "升级泛微e-mobile到最新版本。联系厂商获取安全补丁。"
workaround = "如无法升级，可通过WAF规则拦截对/login.do和/login/login.do页面的message参数中包含OGNL表达式特征的请求。"
steps = [
  "步骤1: 确认使用版本是否为受影响版本（所有使用Apache WebServer的e-mobile版本）",
  "步骤2: 联系泛微官方获取安全补丁或升级到修复版本",
  "步骤3: 如无法立即升级，部署WAF规则拦截OGNL注入攻击"
]

