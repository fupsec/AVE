[basic]
description = "泛微 e-Mobile 登录接口存在 OGNL 表达式注入漏洞（CNVD-2017-03561）。未授权攻击者可通过 login.do 或 login/login.do 页面的 message 参数注入恶意 OGNL 表达式，绕过表达式过滤直接调用 Java 方法，实现远程命令执行、获取数据库敏感信息及执行未授权管理操作。该漏洞影响使用 Apache 和 Resin 中间件的泛微 OA e-Mobile 模块，攻击者无需认证即可利用，危害严重。"
published = "2017-06-30"
remediation = "升级泛微 e-Mobile 至最新版本，或联系厂商获取安全补丁。同时在 WAF 中添加针对 OGNL 表达式注入的过滤规则，对 message 参数进行严格的输入校验，禁止传入 OGNL 特殊字符及 Java 方法调用语法。"
score = 9.8
severity = "CRITICAL"
sources = ["nuclei", "cnvd"]
title = "泛微 e-Mobile OGNL 表达式注入漏洞"
updated = "2017-06-30"

