[remediation]
fix = "升级泛微e-mobile到最新版本。联系厂商获取安全补丁。"
steps = [
    "步骤1: 确认泛微e-mobile是否使用Apache版本",
    "步骤2: 联系泛微官方获取修复补丁",
    "步骤3: 部署WAF规则拦截OGNL注入攻击特征",
    "步骤4: 如非必要，限制/login.do和/login/login.do的互联网暴露",
]
workaround = "如无法升级，可配置WAF规则拦截message参数中的OGNL表达式负载，如`@org.apache.commons`、`ognl`、`#_memberAccess`等关键字。限制/login.do和/login/login.do的对外访问。"

