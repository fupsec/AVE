[basic]
title = "泛微e-mobile OGNL注入漏洞"
description = "泛微e-mobile的login.do和login/login.do页面的message参数存在OGNL表达式注入漏洞。攻击者可在未经身份验证的情况下，通过构造恶意的OGNL表达式作为message参数值，实现远程命令执行，获取服务器控制权。该漏洞影响泛微e-mobile所有使用Apache WebServer的版本。"
severity = "HIGH"
source = "nuclei"
published = "2017-01-01"
updated = "2017-12-31"

