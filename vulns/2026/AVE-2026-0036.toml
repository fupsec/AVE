[basic]
description = "衡水迅驰互联网信息服务有限公司迅优cms（又名Xxunchi CMS）存在任意文件读取漏洞。攻击者可通过/backup/auto.php页面的path参数进行目录遍历，读取服务器上任意文件，获取敏感信息。"
published = "2020-04-25"
remediation = "限制/backup/auto.php的访问权限，移除该文件或使用WAF拦截目录遍历攻击。厂商暂未发布补丁，需联系厂商获取修复方案。"
score = 7.5
