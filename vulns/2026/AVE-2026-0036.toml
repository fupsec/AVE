[basic]
title = "Xxunchi CMS 本地文件包含漏洞"
description = "Xxunchi CMS（寻驰CMS）存在本地文件包含漏洞，位于 backup/auto.php 文件。攻击者可利用 password 和 path 参数，通过目录遍历（../）读取服务器任意文件，导致敏感信息泄露。该漏洞源于未对 path 参数进行有效过滤和校验，攻击者无需认证即可远程利用，CVSS 评分 7.5，影响系统机密性。"
severity = "HIGH"
score = 7.5
remediation = "升级 Xxunchi CMS 至最新安全版本；对 backup/auto.php 中 path 参数实施严格的输入验证，禁止包含 ../ 等目录遍历序列，或限制只能访问特定白名单目录下的文件。"
published = "2020-01-01"
updated = "2020-01-01"
sources = ["nuclei", "cnvd"]

