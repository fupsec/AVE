[basic]
title = "EduSoho 教培系统 classroom-course-statistics 任意文件读取漏洞"
description = "EduSoho 教培系统 v22.4.7 以下版本存在未授权任意文件读取漏洞。攻击者可通过构造带有路径遍历序列的 fileNames[] 参数，未经认证读取服务器上的任意文件，包括 config/parameters.yml 等配置文件，获取数据库账号密码、应用密钥等敏感信息。获取 secret 值后，可结合 Symfony _fragment routing 实现远程代码执行。"
severity = "HIGH"
source = "nvd"
published = "2023-12-15"
updated = "2026-01-22"

