workaround = "无临时缓解措施，除依赖受信任的日志外。"
steps = ["步骤1: 确认当前项目依赖的 sigstore-go 版本", "步骤2: 升级 go.mod 中 github.com/sigstore/sigstore-go 到 v1.2.0 或更高", "步骤3: 运行 go mod tidy 和 go mod verify 确保依赖正确", "步骤4: 重新编译并测试验证逻辑"]

