[remediation]
fix = "升级到 EduSoho v22.4.7 及以上版本。官方发布地址：https://github.com/edusoho/edusoho/releases/tag/v22.4.7"
workaround = "如无法升级，可在 Web 服务器层面限制对 /export/classroom-course-statistics 路径的访问，或对 fileNames[] 参数进行严格的路径校验，拒绝包含 '../' 等路径遍历序列的请求。"
steps = ["步骤1: 确认当前 EduSoho 版本", "步骤2: 备份系统和数据", "步骤3: 升级到 v22.4.7 或更高版本", "步骤4: 验证升级后导出功能正常且漏洞已修复"]

