[basic]
title = "sigstore-go 多日志阈值绕过漏洞"
description = "sigstore-go 是一个用于 Sigstore 签名和验证的 Go 语言库。当验证器配置 WithTransparencyLog(N>1) 或 WithSignedCertificateTimestamps(N>1) 时，预期对单一日志实例被攻破提供纵深防御。然而，阈值计数逻辑按每条目或每个验证路径而非按每个日志授权来计数已验证的见证者。因此，单个被攻破的透明日志可以伪造具有不同索引的多个条目，单个被攻破的 CT 日志可以多次验证（跨多个证书链或通过多个嵌入的 SCT），完全满足多日志阈值要求并绕过多日志策略。注意此漏洞不影响 Cosign，因为 Cosign 的阈值设置为 1。"
severity = "MEDIUM"
source = "ghsa"
published = "2026-06-04"
updated = "2026-06-04"

