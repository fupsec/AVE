[basic]
title = "EGroupware 恶意 eTemplate 上传致远程命令执行漏洞"
description = "EGroupware 的 Widget::expand_name() 方法在处理模板 widget 属性值时，仅对双引号进行转义后传入 PHP eval() 调用，未对反引号字符进行转义。PHP 中反引号在双引号 eval() 字符串内会执行 shell 命令，允许认证管理员通过上传恶意 eTemplate XML 文件（.xet）到 VFS /etemplates 挂载点，实现 OS 级远程命令执行。"
severity = "HIGH"
source = "ghsa"
published = "2026-07-06"
updated = "2026-07-07"

