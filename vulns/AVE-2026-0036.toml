]
exp = []
nuclei_templates = []

[remediation]
fix = "升级 EGroupware 至 26.4.20260413 或 23.1.20260601 及以上版本。参考官方安全公告 GHSA-8737-2x9g-xjj7。"
workaround = "在 php.ini 中设置 disable_functions = exec,passthru,shell_exec,system,proc_open,popen 以阻止反引号执行。避免将管理员凭据暴露给不可信用户。"
steps = ["确认当前 EGroupware 版本", "升级到修复版本 26.4.20260413（26.x 分支）或 23.1.20260601（23.x 分支）", "如无法升级，在 php.ini 中添加 disable_functions 限制并重启 Web 服务器"]

