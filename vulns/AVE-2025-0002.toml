[basic]
title = "Hitachi Virtual Storage Platform 维护工具授权缺陷漏洞(CVE-2025-2902)"
description = """
Hitachi Virtual Storage Platform 是 Hitachi 公司的企业级存储阵列系统，其管理界面（维护工具）存在授权缺陷漏洞。攻击者可在未授权情况下通过维护工具执行敏感操作。
受影响版本中，维护工具对维护功能的访问控制验证不完整，低权限用户可通过构造特定请求绕过授权检查，获取未经授权的管理操作权限，可能导致数据泄露或配置篡改。
修复版本中通过升级微码（固件）到指定版本来解决该授权缺陷，官方建议受影响用户尽快执行永久修复措施，即更换为已修复的微码版本。
解决建议
将组件 Hitachi:Virtual Storage Platform E390/E590/E790/E990/E1090/E390H/E590H/E790H/E1090H 升级至 93-07-26-xx/00 及以上版本
将组件 Hitachi:Virtual Storage Platform 5100/5500/5100H/5500H/5200/5600/5200H/5600H 升级至 90-09-27-00/00 及以上版本
将组件 Hitachi:Virtual Storage Platform G130/G150/G350/G370/G700/G900/F350/F370/F700/F900 升级至 88-08-16-xx/00 及以上版本"""
