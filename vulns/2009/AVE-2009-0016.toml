[basic]
description = "libpng（PNG参考库）1.0.43之前版本和1.2.x 1.2.35之前版本存在漏洞，该漏洞被pngcrush及其他应用所使用。攻击者可借助特制的PNG文件利用该漏洞造成拒绝服务（应用程序崩溃）或执行任意代码，原因是（1）png_read_png函数、（2）pCAL块处理或（3）16位gamma表设置中触发了对未初始化指针的释放操作。"
published = "2009-02-22"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
