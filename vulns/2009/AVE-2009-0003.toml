[basic]
description = """
Microsoft Office Excel 中存在对象记录损坏漏洞。攻击者可通过特制的 Excel 文件（包含畸形的记录对象）触发该漏洞，成功利用后可远程执行任意代码，完全控制受影响的系统。
受影响的版本包括：Office 2000 SP3、Office XP SP3、Office 2003 SP3、Office 2004/2008 for Mac、2007 Microsoft Office System SP1/SP2、Open XML File Format Converter for Mac、Excel Viewer 2003 SP3、Excel Viewer 以及 Office 兼容包等。
该漏洞已遭在野利用，被列入 CISA KEV 目录。"""
published = "2009-06-10"
remediation = "建议用户安装 Microsoft 安全公告 MS09-021 提供的更新，将 Office Excel 升级至不受影响的版本。对于无法立即更新的系统，禁用 Excel 中的 ActiveX 控件并启用 Office 文件验证功能以降低风险。"
