[basic]
title = "Microsoft Office Excel 远程代码执行漏洞"
description = "Microsoft Office Excel 2000 SP3、2002 SP3、2003 SP3 和 2007 SP1，以及 Excel Viewer 2003 Gold 和 SP3、Excel Viewer、Word/Excel/PowerPoint 2007 兼容包 SP1，以及 Mac 版 Office 2004 和 2008 中的 Excel 存在远程代码执行漏洞。攻击者可通过构造恶意 Excel 文档触发对无效对象的访问尝试，从而执行任意代码。该漏洞于 2009 年 2 月被 Trojan.Mdropper.AC 在野外利用。"
severity = "HIGH"
score = 8.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H"
cvss_v2 = "CVSS2#AV:N/AC:M/Au:N/C:C/I:C/A:C"
published = "2009-02-25"
updated = "2026-07-11"
remediation = "立即安装 Microsoft 安全公告 MS09-009 中提供的补丁程序。对于无法立即打补丁的系统，避免打开来源不明的 Excel 文件，并考虑部署电子邮件和 Web 网关过滤器阻止恶意 Office 文档。"
sources = ["nvd", "kev", "msrc", "tenable", "github"]

