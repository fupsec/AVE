[affected]
product = "Lenovo Dispatcher 3.0 / 3.1 Driver (LnvMSRIO.sys)"
vendor = "Lenovo"

[authenticity]
cve_confidence = "high"
notes = "多个独立 PoC/EXP 仓库已发布且经验证可工作；Quarkslab 发布详细技术分析；LOLDrivers 已收录该驱动。漏洞无需远程攻击面，需本地已认证用户权限，配合 Core Isolation 未启用的环境即可利用。"
poc_confidence = "high"

[basic]
description = "Lenovo Dispatcher 3.0 和 3.1 驱动程序（LnvMSRIO.sys）存在访问控制不足漏洞，攻击者可利用该漏洞通过暴露的 IOCTL 接口读写任意物理内存和 MSR 寄存器，从而在本地实现权限提升至 SYSTEM。该漏洞不影响已启用 Windows 内核隔离（Memory Integrity）功能的系统，预装 Windows 11 的 Lenovo 系统默认已启用该功能。"
published = "2025-09-11"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
sources = ["unknown"]
title = "Lenovo Dispatcher 驱动程序权限提升漏洞"
updated = "2026-06-17"

