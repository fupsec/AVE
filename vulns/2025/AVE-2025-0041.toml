[remediation]
fix = "升级 Lenovo Dispatcher 驱动至 3.1.0.41 或更高版本（3.2 分支），或启用 Windows 内核隔离（Core Isolation / Memory Integrity）功能。"
steps = [
    "步骤1: 确认当前 Lenovo Dispatcher 驱动版本，检查 LnvMSRIO.sys 文件版本号",
    "步骤2: 升级至 Dispatcher 3.2 或 LnvMSRIO.sys 3.1.0.41 及以上版本",
    "步骤3: 确认 Windows 内核隔离 Memory Integrity 功能已启用",
]
workaround = "启用 Windows 内核隔离 Memory Integrity 功能可有效缓解该漏洞的利用，但无法阻止攻击者通过该驱动读取内核数据。"

