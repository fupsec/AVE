[basic]
title = "Safetica STProcessMonitor 驱动程序权限管理不当漏洞（BYOVD）"
description = "Safetica STProcessMonitor 驱动程序（版本 11.11.4.0）存在权限管理不当漏洞（CWE-269）。由于驱动程序 IOCTL 处理程序对调用者身份验证不足，拥有管理员权限的攻击者可通过发送特制的 IOCTL 请求（0xB822200C）终止受第三方保护的安全进程，导致拒绝服务。该漏洞属于 BYOVD（Bring Your Own Vulnerable Driver）类型，攻击者可将存在漏洞的驱动程序加载到目标系统后利用。漏洞原始披露于卡饭论坛，由 KOSEC LLC 通过 CERT/CC 报告。同一驱动程序中还存在 CVE-2026-0828（未授权进程终止，CVSS 7.5 HIGH），旧版本驱动（v11.11.4.0）无需任何权限即可通过 IOCTL 终止进程。"
severity = "MEDIUM"
