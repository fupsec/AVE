[remediation]
fix = "升级 Safetica STProcessMonitor 驱动到 11.26.18 或更高版本。新版本驱动（v11.26.18）已增加调用者身份验证，仅允许 NT AUTHORITY\\SYSTEM 发送 IOCTL 请求。用户应从官方渠道获取 Safetica 应用套件更新。"
workaround = "如无法升级驱动程序，可采取以下缓解措施：1) 启用驱动程序签名强制（Driver Signature Enforcement），阻止加载未签名驱动；2) 使用 Windows Defender Application Control (WDAC) 或 AppLocker 策略阻止加载 STProcessMonitor.sys；3) 监控 IOCTL 0xB822200C 的异常调用；4) 在 Windows 安全中心启用内核隔离（Core Isolation）和内存完整性（Memory Integrity）功能。"
steps = ["步骤1: 确认当前 STProcessMonitor 驱动版本（检查 %SystemRoot%\\System32\\drivers\\STProcessMonitor.sys 文件属性）", "步骤2: 如版本为 11.11.4.0 或更早，存在漏洞", "步骤3: 从 Safetica 官方渠道获取最新版本应用更新", "步骤4: 更新后确认驱动版本已升级至 11.26.18 或更高", "步骤5: 部署 WDAC/AppLocker 策略，禁止未经签名的内核驱动加载"]

