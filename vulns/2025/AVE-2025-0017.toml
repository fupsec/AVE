[remediation]
fix = "升级 Apache Tomcat 至安全版本：11.0.3、10.1.35 或 9.0.99。"
steps = [
    "步骤1: 确认 Apache Tomcat 版本",
    "步骤2: 升级到修复版本 11.0.3 / 10.1.35 / 9.0.99",
    "步骤3: 如无法升级，禁用 Default Servlet 写入（设置 readonly=true）",
    "步骤4: 禁用部分 PUT 功能（设置 partialPut=false）",
    "步骤5: 将会话持久化文件存储在 web 应用不可访问的位置",
]
workaround = "如无法升级，可采取以下缓解措施：1）禁用 Default Servlet 的写入功能（readonly=true）；2）禁用部分 PUT（partialPut=false）；3）将会话持久化存储位置移出 web 应用可访问目录。"

