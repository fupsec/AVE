[basic]
description = "Apache Tomcat 中存在路径等价漏洞（CWE-44：'file.Name' 内部点号），当满足特定条件时，攻击者可以通过部分 PUT 请求实现远程代码执行和/或信息泄露和/或向上传文件中添加恶意内容。利用条件包括：Default Servlet 启用了写入（默认禁用）、支持部分 PUT（默认启用）、应用程序使用 Tomcat 基于文件的会话持久化且使用默认存储位置、应用程序包含可用于反序列化攻击的库。影响版本：Apache Tomcat 11.0.0-M1 至 11.0.2、10.1.0-M1 至 10.1.34、9.0.0.M1 至 9.0.98，以及已停止维护的 8.5.0 至 8.5.100。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV）。"
published = "2025-03-10"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 9.8
severity = "CRITICAL"
source = "nvd"
sources = ["unknown"]
title = "Apache Tomcat 路径等价漏洞（内部点号）导致远程代码执行和信息泄露"
