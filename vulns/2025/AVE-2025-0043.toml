[basic]
  title = "Docker Desktop 容器逃逸漏洞（Docker Engine API 未授权访问）"
  description = "Docker Desktop存在一个安全漏洞，本地运行的Linux容器可通过配置的Docker子网（默认192.168.65.7:2375）访问Docker Engine API。该漏洞在启用或未启用增强容器隔离（ECI）以及在tcp://localhost:2375上暴露守护进程（不使用TLS）选项的情况下均存在。攻击者可利用该漏洞执行大量特权Engine API命令，包括控制其他容器、创建新容器、管理镜像等。在某些情况下（如Windows平台使用WSL后端的Docker Desktop），还可挂载与运行Docker Desktop用户相同权限的主机驱动器，实现容器逃逸。"
  severity = "CRITICAL"
  source = "nvd"
  published = "2025-08-20"
  updated = "2026-06-17"

