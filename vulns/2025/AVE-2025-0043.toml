[remediation]
fix = "升级Docker Desktop到4.44.3或更高版本。Docker Desktop不会自动更新，需手动下载安装。Linux原生安装不受影响（使用Unix socket而非TCP）。"
workaround = "如无法立即升级：1) 限制容器网络访问，禁止容器访问192.168.65.7:2375；2) 使用防火墙规则阻止容器对Docker Engine API端口的访问；3) 启用Docker Desktop的Secure Mode。注意：启用增强容器隔离（ECI）不能缓解此漏洞。"
steps = ["步骤1: 确认当前Docker Desktop版本（右键Docker图标 -> About Docker Desktop）", "步骤2: 如版本在4.25至4.44.3之间，存在漏洞", "步骤3: 下载Docker Desktop 4.44.3或更高版本（https://docs.docker.com/desktop/release-notes/）", "步骤4: 安装新版本并重启Docker Desktop", "步骤5: 验证版本已更新至安全版本"]

