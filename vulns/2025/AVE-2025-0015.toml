[basic]
  title = "Apple AirPlay mDNS Use-After-Free 漏洞"
  description = "Apple 多个操作系统的 AirPlay 服务中存在 use-after-free 漏洞，攻击者可利用特制的 mDNS 数据包或 AirPlay 请求触发堆缓冲区溢出，导致进程内存损坏。在本地网络环境中，未经身份验证的攻击者可实现远程代码执行或拒绝服务。\n受影响的版本包括：\n- iOS 18.4 之前版本\n- iPadOS 18.4 / 17.7.6 之前版本\n- macOS Sequoia 15.4 / Sonoma 14.7.5 / Ventura 13.7.5 之前版本\n- tvOS 18.4 之前版本\n- visionOS 2.4 之前版本"
  severity = "CRITICAL"
  score = 9.8
  sources = ["github", "nvd"]
  published = "2025-04-28"
  updated = "2026-06-17"
  remediation = "升级到以下修复版本：iOS 18.4 / iPadOS 18.4 / iPadOS 17.7.6 / macOS Sequoia 15.4 / macOS Sonoma 14.7.5 / macOS Ventura 13.7.5 / tvOS 18.4 / visionOS 2.4。参考 Apple 官方安全公告。"

