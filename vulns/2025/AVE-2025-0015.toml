[basic]
description = """
Apple 多个操作系统的 AirPlay 服务中存在 use-after-free 漏洞，攻击者可利用特制的 mDNS 数据包或 AirPlay 请求触发堆缓冲区溢出，导致进程内存损坏。在本地网络环境中，未经身份验证的攻击者可实现远程代码执行或拒绝服务。
受影响的版本包括：
- iOS 18.4 之前版本
- iPadOS 18.4 / 17.7.6 之前版本
- macOS Sequoia 15.4 / Sonoma 14.7.5 / Ventura 13.7.5 之前版本
- tvOS 18.4 之前版本
- visionOS 2.4 之前版本"""
published = "2025-04-28"
remediation = "升级到以下修复版本：iOS 18.4 / iPadOS 18.4 / iPadOS 17.7.6 / macOS Sequoia 15.4 / macOS Sonoma 14.7.5 / macOS Ventura 13.7.5 / tvOS 18.4 / visionOS 2.4。参考 Apple 官方安全公告。"
