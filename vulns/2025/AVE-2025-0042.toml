[basic]
description = "WinRAR Windows版本存在路径遍历漏洞，攻击者可通过构造恶意RAR压缩包，利用NTFS备用数据流（ADS）语法绕过文件名和路径验证，在解压缩时将恶意文件写入任意位置（如Windows启动目录），从而实现远程代码执行。该漏洞由ESET研究人员于2025年7月18日在RomCom组织的零日攻击活动中发现，影响WinRAR 7.12及更早版本。"
published = "2025-08-08"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
source = "nvd"
