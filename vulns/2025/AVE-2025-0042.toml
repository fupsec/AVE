[remediation]
fix = "升级WinRAR到7.13或更高版本。WinRAR不会自动更新，用户需手动下载安装补丁。依赖UnRAR.dll或便携版UnRAR源码的软件也需更新至7.13版本。"
steps = [
    "步骤1: 确认当前WinRAR版本（帮助->关于WinRAR）",
    "步骤2: 下载WinRAR 7.13或更高版本（https://www.win-rar.com/download.html）",
    "步骤3: 安装新版本并重启系统",
    "步骤4: 检查依赖UnRAR.dll的第三方软件是否已更新",
    "步骤5: 审查近期解压的RAR文件，检查启动目录是否存在异常文件",
]
workaround = "如无法立即升级，可通过WinRAR.ini设置SaveStreams=0禁用ADS提取，或使用GPO以只读方式部署配置。对无法升级的旧版本（5.x及更早），建议迁移至7.13。同时对来自不可信来源的RAR压缩包保持高度警惕。"

