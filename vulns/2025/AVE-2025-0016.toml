description = "Cacti 是一个开源性能和故障管理框架。经过认证的 Cacti 用户可以利用图形创建和图形模板功能，通过向 rrdtool 的 --right-axis-label 参数注入换行符绕过转义逻辑，在 Web 根目录中创建任意 PHP 脚本，导致远程代码执行。该漏洞在 1.2.29 版本中修复。"
