description = "Samba的smbd服务中NDR解析存在多个基于堆的缓冲区溢出漏洞，远程攻击者可通过发送特制的MS-RPC请求（涉及DFSEnum、LsarLookupSids等LSARPC接口）触发堆溢出，导致任意代码执行。该漏洞影响Samba 3.0.0至3.0.25rc3版本，攻击者无需身份认证即可远程利用，CVSS评分10.0，危害严重。"
published = "2007-05-14"
remediation = "升级Samba至3.0.25或更高版本，从官方渠道获取并应用安全补丁，限制SMB服务对不可信网络的暴露。"
