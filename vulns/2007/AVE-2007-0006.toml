[basic]
cvss_v2 = "AV:N/AC:L/Au:N/C:C/I:C/A:C"
description = "Samba 3.0.0至3.0.25rc3版本的smbd守护进程中的NDR解析存在多个基于堆的缓冲区溢出漏洞。远程攻击者可通过发送特制的MS-RPC请求（涉及DFSEnum、RFNPCNEX、LsarAddPrivilegesToAccount、NetSetFileSecurity、LsarLookupSids/LsarLookupSids2等函数），触发堆溢出覆盖堆空间数据，最终实现任意代码执行。该漏洞无需身份验证即可远程利用，攻击复杂度低，影响所有主流Linux发行版中的Samba服务。"
published = "2007-05-14"
remediation = "升级Samba至3.0.25或更高版本。无法立即升级时，在防火墙上限制SMB端口（139/TCP、445/TCP）的访问，仅允许受信任网络段访问Samba服务。"
score = 10.0
severity = "CRITICAL"
sources = [
