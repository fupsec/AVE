notes = "该漏洞为 libpng 库中的拒绝服务漏洞，需通过构造特制 PNG 图像触发，非 HTTP 协议漏洞，未发现公开 PoC/EXP。"
poc_confidence = "none"

[basic]
description = "libpng 1.0.25 之前版本和 1.2.x 系列 1.2.17 之前版本中的 png_handle_tRNS 函数（pngrutil.c）允许远程攻击者通过带有恶意 tRNS 块 CRC 值的灰度 PNG 图像导致拒绝服务（应用程序崩溃）。"
published = "2007-05-16"
remediation = "升级 libpng 到 1.0.25 / 1.2.17 或更高版本，参考各发行版安全公告进行更新。"
score = 5.0
severity = "MEDIUM"
source = "nvd"
