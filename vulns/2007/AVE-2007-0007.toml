[basic]
description = "Samba 3.0.0至3.0.25rc3版本中的smbd组件MS-RPC功能存在远程命令注入漏洞。当smb.conf中启用了username map script选项时，未授权的远程攻击者可通过向SamrChangePassword函数传递包含shell元字符的恶意用户名参数，触发/bin/sh执行任意命令。成功利用此漏洞可导致服务器被完全控制，包括执行恶意代码、窃取敏感数据或发起后续攻击。此漏洞无需身份验证即可利用。"
published = "2007-05-14"
remediation = "升级Samba至3.0.25或更高版本；如无法立即升级，在smb.conf中移除username map script等外部脚本调用配置项。"
score = 7.5
severity = "HIGH"
sources = ["tenable"]
title = "Samba smbd username map script 远程命令注入漏洞"
updated = "2007-05-14"

