[basic]
title = "Adobe Acrobat 和 Reader 缓冲区溢出漏洞"
description = "Adobe Acrobat 和 Reader 8.1.1 及更早版本中存在多处缓冲区溢出漏洞。远程攻击者可以通过构造特制的PDF文件，向未指定的JavaScript方法传递超长参数，触发缓冲区溢出，进而导致任意代码执行。该漏洞已被CISA列入已知被利用漏洞目录(KEV)，曾在真实攻击中被积极利用。"
severity = "HIGH"
score = 7.8
cvss_v3 = "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H"
cvss_v2 = "(AV:N/AC:M/Au:N/C:C/I:C/A:C)"
remediation = "升级 Adobe Acrobat/Reader 至 8.1.2 或更高版本，按照供应商安全公告 APSB08-13 的说明安装补丁，禁用 PDF 中的 JavaScript 执行作为缓解措施。"
published = "2008-02-12"
updated = "2026-06-16"
sources = ["kev", "nvd"]

