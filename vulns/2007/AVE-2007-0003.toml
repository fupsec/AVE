[basic]
title = "Adobe Acrobat and Reader 缓冲区溢出漏洞"
description = "Adobe Acrobat and Reader 8.1.1 及之前版本存在多个缓冲区溢出漏洞，远程攻击者可通过特制 PDF 文件利用未指定 JavaScript 方法的长参数执行任意代码。此漏洞已被 CISA 列入已知被利用漏洞目录（KEV），并可能与 CVE-2008-0655 存在关联。"
severity = "HIGH"
source = "kev"
published = "2007-10-24"
updated = "2024-06-28"

