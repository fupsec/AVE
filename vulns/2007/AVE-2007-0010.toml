[affected]
product = "OpenOffice"
vendor = "Apache"

[basic]
cvss_v2 = 9.3
description = "OpenOffice 使用的 ICU (International Components for Unicode) 库 3.8.1 及之前版本中存在堆缓冲区溢出漏洞，该漏洞位于 regexcmp.cpp 文件的 doInterval 函数中。当处理带有无界上限间隔的正则表达式时，RegexMatcher::StateSave 回溯过程中内存加倍机制未能正确处理，导致堆溢出。攻击者可通过构造特制的 ODF 文本文档（包含 XForms），诱导用户打开后利用此漏洞在目标系统上执行任意代码或造成拒绝服务。"
published = "2008-01-28"
remediation = "升级 Apache OpenOffice 至 2.4 或更高版本，或升级 ICU 库至 3.8-5 及以上修复版本。Red Hat 发行版可参考 RHSA-2008:0090 进行更新。避免打开来源不明的 ODF 文档。"
score = 9.3
severity = "HIGH"
sources = [
    "tenable",
    "nvd",
    "openoffice",
    "redhat",
]
title = "OpenOffice ICU 库正则表达式堆缓冲区溢出漏洞"
updated = "2008-01-28"

