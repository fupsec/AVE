    "步骤2: 安装 MS07-015 安全更新（https://learn.microsoft.com/en-us/security-updates/securitybulletins/2007/ms07-015）",
    "步骤3: 重启系统并验证更新生效",
]
workaround = "如无法升级，建议不要打开来自不可信来源的 Excel 文件，使用 Microsoft Office 文件隔离功能（Microsoft Office Isolated Conversion Environment - MOICE）处理可疑文件。"

