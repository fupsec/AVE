[basic]
title = "Microsoft Office Excel 远程代码执行漏洞"
description = "Microsoft Office Excel 2000、XP、2003 以及 Mac 版 2004 中存在未指定的远程代码执行漏洞。攻击者可以通过诱导用户打开特制的 Excel 文件来利用此漏洞，该恶意文件可通过电子邮件附件或在恶意网站上托管的方式进行传播。成功利用后，攻击者可在受影响系统上执行任意代码。"
severity = "CRITICAL"
source = "kev"
published = "2007-02-06"
updated = "2025-08-12"

