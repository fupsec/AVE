[remediation]
fix = "安装微软 MS07-015 安全更新。Office 2000 安装 KB929062，Office XP 安装 KB929063，Office 2003 安装 KB929064，Office 2004 for Mac 安装 KB932185。"
workaround = "不要打开来源不明的 Excel 文件；使用 Microsoft Office 文件阻断策略阻止来自互联网的 Office 文件；配置 Outlook 在阅读邮件前以纯文本形式阅读所有电子邮件。"
steps = ["确认受影响的 Office 版本", "访问 Microsoft Update 或 Windows Update 安装 MS07-015 安全更新", "或者手动下载并安装对应的更新包"]

