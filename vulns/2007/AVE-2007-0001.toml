[basic]
title = "Microsoft Office Excel 远程代码执行漏洞"
description = "Microsoft Office Excel 2000、XP、2003 以及 2004 for Mac 存在一个远程代码执行漏洞。当用户打开包含畸形记录的特制 Excel 文件时，Excel 在解析占位符数据时会访问预期之外的内存区域，从而允许攻击者执行任意代码。恶意文件可通过电子邮件附件或托管在恶意网站上进行传递。攻击者利用此漏洞可以安装程序、查看/更改/删除数据或创建具有完全用户权限的新帐户。"
severity = "HIGH"
source = "kev"
published = "2007-02-02"
updated = "2026-06-16"

