[basic]
description = "Microsoft Office Excel 2000、XP、2003 以及 Mac 版 2004 中存在未指定的远程代码执行漏洞。攻击者可利用特制的 Excel 文件，通过电子邮件附件或恶意网站托管的方式诱导用户打开，从而在受影响的系统上执行任意代码。此漏洞已被广泛利用，已纳入 CISA KEV（已知被利用漏洞）目录。该漏洞作为零日漏洞在针对性攻击中使用，原始利用代码名为 Exploit-MSExcel.h。"
published = "2007-02-02"
remediation = "Refer to vendor advisory and upgrade to fixed version."
