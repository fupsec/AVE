[basic]
title = "Alcatel OmniPCX Enterprise 远程命令执行漏洞"
description = "Alcatel OmniPCX Enterprise Communication Server R7.1及之前版本的Unified Maintenance Tool中masterCGI脚本存在远程命令执行漏洞。未授权的攻击者可通过向/cgi-bin/masterCGI发送带有shell元字符的user参数（ping操作），在服务器上执行任意命令。"
severity = "CRITICAL"
source = "kev"
published = "2007-09-18"
updated = "2026-06-16"

