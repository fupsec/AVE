[basic]
title = "Alcatel OmniPCX Enterprise 统一维护工具 masterCGI 远程命令执行漏洞"
description = "Alcatel OmniPCX Enterprise 通信服务器的统一维护工具中 masterCGI 脚本在处理 ping 操作时，未对 user 参数中的 shell 元字符进行有效过滤，导致远程攻击者可以通过注入 shell 命令实现任意命令执行。攻击者无需认证即可利用该漏洞，完全控制服务器，造成机密信息泄露、系统破坏等严重后果。该漏洞已被 CISA 列入已知被利用漏洞目录（KEV），目前已存在公开的利用方法。"
severity = "CRITICAL"
score = 9.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
cvss_v2 = "AV:N/AC:L/Au:N/C:C/I:C/A:C"
remediation = "厂商 Alcatel-Lucent 已在受支持版本中实施了正确的 shell 元字符过滤和更严格的访问控制。建议用户升级到修复版本，或通过防火墙限制 Web 界面的访问来源，仅允许维护人员的 IP 地址访问。"
published = "2007-09-17"
updated = "2022-04-15"
sources = ["kev", "nvd", "advisory"]

