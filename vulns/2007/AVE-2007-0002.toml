]

[remediation]
fix = "根据厂商安全公告（引用编号2007002）升级到修复版本。所有受支持版本均已实现了shell元字符过滤和更严格的访问控制。"
workaround = "关闭Web服务器（不影响电话业务功能）；在网络层面设置防火墙，仅允许维护人员IP地址访问OXE的Web管理界面。"
steps = ["确认OmniPCX Enterprise版本（<= R7.1受影响）", "访问Alcatel-Lucent PSIRT安全公告页面获取更新", "升级到修复版本或应用供应商提供的补丁", "配置网络防火墙限制对Web管理界面的访问"]

