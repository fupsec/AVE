[basic]
  title = "Samba smbd SID/Name 转换逻辑错误导致本地权限提升"
  description = "Samba 3.0.23d 至 3.0.25pre2 版本中，smbd 守护进程的 SID/名称转换功能存在逻辑错误，本地用户可利用此漏洞通过未指定向量使守护进程转换到 root 用户，从而临时获取特权并执行 SMB/CIFS 协议操作，可能导致攻击者获得服务器的 root 访问权限。"
  severity = "HIGH"
  source = "nvd"
  published = "2007-05-14"
  updated = "2007-06-20"

