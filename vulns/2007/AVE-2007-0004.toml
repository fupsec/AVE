workaround = "此缺陷没有不修改 smbd 守护进程服务器代码的即时解决方案。建议管理员限制本地用户对 Samba 服务器的访问权限，并监控 smbd 进程的异常行为。"
steps = ["步骤1: 确认 Samba 版本", "步骤2: 升级到 Samba 3.0.25 或更高版本", "步骤3: 重启 Samba 服务"]

