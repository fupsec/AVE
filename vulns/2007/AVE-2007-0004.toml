[basic]
title = "Samba smbd SID/Name 转换逻辑错误导致本地权限提升漏洞"
description = "Samba 3.0.23d 至 3.0.25pre2 版本中的 smbd 组件在处理 SID/Name 本地转换时存在逻辑错误，导致 smbd 守护进程内部安全栈错误地将用户身份切换为 root。非特权用户可利用此漏洞临时以 root 权限执行 SMB/CIFS 协议操作，进而获取服务器完全控制权。"
severity = "HIGH"
score = 7.2
cvss_v2 = 7.2
cvss_v2_vector = "AV:L/AC:L/Au:N/C:C/I:C/A:C"
remediation = "升级 Samba 至 3.0.25 或更高版本。如无法立即升级，应限制本地用户对 Samba 服务器的交互登录权限，并监控 smbd 进程异常行为。"
published = "2007-05-14"
updated = "2007-05-14"
sources = ["tenable"]

