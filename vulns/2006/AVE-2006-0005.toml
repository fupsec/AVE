[basic]
title = "Apache HTTP Server If: 请求头越界内存读写漏洞"
description = "Apache HTTP Server 2.4.54及之前版本中存在越界内存读写漏洞（CWE-787）。攻击者可以通过发送精心构造的 If: 请求头，触发堆内存越界读取或写入单个零字节，导致进程崩溃。该漏洞无需认证即可远程利用，CVSS评分7.5，影响所有2.4.54及更早版本。"
severity = "HIGH"
score = 7.5
remediation = "升级 Apache HTTP Server 至 2.4.55 或更高版本。无法立即升级时，可通过配置反向代理或 WAF 规则过滤恶意的 If: 请求头进行临时缓解。"
published = "2023-01-17"
updated = "2026-06-16"
sources = ["tenable", "nvd"]

