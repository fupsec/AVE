notes = "CVE-2006-20001由MITRE官方发布，NVD已分析并分配CVSS v3.1 7.5 HIGH评分。CWE-787(越界写入)分类。该漏洞最早在2006年公开出版的《The Art of Software Security Assessment》一书中被描述，2022年向Apache安全团队报告，2023年1月17日随Apache HTTP Server 2.4.55发布修复。未在GitHub或Exploit-DB等渠道找到公开的PoC/EXP代码，也未发现Nuclei检测模板。CISA评估为无已知在野利用。攻击者向启用了mod_dav的Apache服务器发送包含精心构造If:头部的HTTP请求即可触发。"

