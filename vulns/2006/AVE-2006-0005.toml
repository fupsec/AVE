[basic]
title = "Apache HTTP Server mod_dav 越界读写漏洞"
description = "Apache HTTP Server 2.4.0至2.4.54版本中的mod_dav模块存在安全漏洞。远程攻击者通过发送特制的If:请求头，可导致堆内存越界读取或写入单个零字节，造成进程崩溃，导致拒绝服务。该漏洞最早由Mark Dowd等在2006年出版的《The Art of Software Security Assessment》一书中描述。"
severity = "HIGH"
source = "nvd"
published = "2023-01-17"
updated = "2023-09-08"

