[basic]
title = "Apache Struts 1 ActionForm 拒绝服务漏洞"
description = "Apache Struts 1.2.9之前版本中的ActionForm（与BeanUtils 1.7配合使用）存在安全漏洞，远程攻击者可通过提交一个multipart/form-data编码的表单，其参数名引用public getMultipartRequestHandler方法，从而访问CommonsMultipartRequestHandler实现和BeanUtils中的元素，导致拒绝服务（DoS）。该漏洞已被CISA列入已知被利用漏洞目录（KEV），确认存在在野利用。"
severity = "HIGH"
source = "nvd"
published = "2006-03-30"
