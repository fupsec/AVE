[basic]
description = "Apache Software Foundation (ASF) Struts 1.2.9 之前版本中的 ActionForm 组件在配合 BeanUtils 1.7 使用时，远程攻击者可通过 multipart/form-data 编码的表单，构造一个引用 public getMultipartRequestHandler 方法的参数名，从而访问 CommonsMultipartRequestHandler 实现及 BeanUtils 中的内部元素，导致服务器拒绝服务（DoS）。该漏洞已被 CISA 列入已知利用漏洞目录（KEV），确认存在野外利用。"
published = "2006-03-29"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
severity = "HIGH"
