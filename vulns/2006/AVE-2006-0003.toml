[remediation]
fix = "升级到 Apache Struts 1.2.9 或更高版本。参考官方安全公告和发版说明。"
workaround = "如无法升级，可禁用 multipart/form-data 请求处理功能，或在 Web 服务器层面限制对 ActionForm 的访问。"
steps = ["步骤1: 确认 Apache Struts 版本是否低于 1.2.9", "步骤2: 检查是否使用了 BeanUtils 1.7", "步骤3: 升级到 Apache Struts 1.2.9 或更高版本", "步骤4: 重启应用服务器使更新生效"]

