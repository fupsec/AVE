[basic]
title = "Microsoft Word 畸形对象指针远程代码执行漏洞"
description = "Microsoft Word (Office 2000 SP3、Office XP SP3、Office 2003 SP1/SP2 及 Microsoft Works Suites 至 2006 版本) 中存在缓冲区溢出漏洞，攻击者可通过畸形对象指针诱使用户打开特制 Word 文档，从而执行任意代码。该漏洞已被 CISA 列入已知利用漏洞目录 (KEV)，确认存在野外利用。"
