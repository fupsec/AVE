[basic]
title = "XML::Parser 至 2.45 版本 parse_stream 函数存在堆缓冲区溢出漏洞"
description = "XML::Parser 2.45 及更早版本在 parse_stream() 函数（Expat.xs）中，当使用 :utf8 PerlIO 层时，由于 Perl 的 read() 返回解码后的字符，而 SvPV() 返回的多字节 UTF-8 字节数可能超过预分配的缓冲区大小，导致堆缓冲区溢出（double free 或 corruption），造成程序崩溃。"
severity = "HIGH"
source = "nvd"
published = "2026-03-19"
updated = "2026-06-16"

[score]
cvss_v3 = 7.5
cvss_v3_vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"

[affected]
vendor = "TODDR"
product = "XML::Parser"

[exploit]
poc = [
  { url = "https://github.com/cpan-authors/XML-Parser/issues/64", description = "漏洞详情及触发用例，含 UTF-8 XML 解析崩溃复现步骤", source = "github" },
  { url = "https://github.com/cpan-authors/XML-Parser/commit/56b0509dfc6b559cd7555ea81ee62e3622069255.patch", description = "修复补丁：在 Expat.xs 中修正缓冲区大小计算", source = "github" }
]
exp = []
nuclei_templates = []

[remediation]
fix = "升级到 XML::Parser 2.46 或更高版本（推荐 2.48，包含额外修复）。"
workaround = "如无法升级，可在输入流上设置字节模式 binmode(STDIN, ':bytes')，或避免使用 :utf8 PerlIO 层进行 XML 解析。"
steps = ["步骤1: 确认 XML::Parser 版本号：perl -MXML::Parser -e 'print $XML::Parser::VERSION'", "步骤2: 若版本低于 2.46，升级至 2.46 或更新版本", "步骤3: 重启使用 XML::Parser 的服务"]

