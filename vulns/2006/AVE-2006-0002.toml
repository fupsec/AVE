[basic]
title = "XML::Parser Perl 模块堆缓冲区溢出漏洞"
description = "XML::Parser 版本 2.45 及之前版本存在堆缓冲区溢出漏洞。在 Perl 中使用 :utf8 PerlIO 层时，parse_stream() 函数在 Expat.xs 中可能导致 XML 输入缓冲区溢出，因为 Perl 的 read() 返回解码后的字符，而 SvPV() 返回可能超过预分配缓冲区大小的多字节 UTF-8 字节。这可能导致堆损坏（double free 或 corruption）和程序崩溃。"
severity = "HIGH"
source = "nvd"
published = "2026-03-19"
updated = "2026-06-16"

