[basic]
title = "Perl XML::Parser 模块 st_serial_stack 堆缓冲区越界写入漏洞"
description = "XML::Parser for Perl 2.47及之前版本中存在越界堆缓冲区溢出漏洞（Off-by-one Heap Buffer Overflow）。该漏洞位于st_serial_stack函数中，当stackptr等于stacksize-1时，栈不会被扩展，随后新值会被写入++stackptr位置，该位置等于stacksize，恰好落在已分配缓冲区之外。攻击者可以通过解析包含深度嵌套元素的特制XML文件触发此漏洞，可能导致应用程序崩溃或远程代码执行。"
severity = "CRITICAL"
score = 9.8
cvss_v3 = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
published = "2026-03-19"
updated = "2026-06-29"
remediation = "升级XML::Parser（XML-Parser）至2.48或更高版本。各Linux发行版用户可通过包管理器更新perl-XML-Parser软件包，Red Hat用户可参考RHSA-2026系列公告安装相应更新。"
sources = ["nvd", "avd", "msrc"]

