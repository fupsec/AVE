[basic]
title = "XML::Parser 至 2.47 版本存在 st_serial_stack 越界堆缓冲区溢出漏洞"
description = "XML::Parser versions through 2.47 for Perl has an off-by-one heap buffer overflow in st_serial_stack. 当 stackptr 等于 stacksize - 1 时，栈不会被扩展，新值将被写入 ++stackptr 位置，即恰好超出已分配缓冲区边界。该 Bug 可通过解析具有极深元素嵌套的 XML 文件触发。"
severity = "CRITICAL"
source = "nvd"
published = "2026-03-19"
updated = "2026-06-29"

