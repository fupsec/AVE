[basic]
description = "Perl 的 XML::Parser 模块在 2.47 及之前版本中存在缓冲区溢出漏洞。当处理恶意构造的 XML 输入时，程序可能会超出预分配的缓冲区大小，导致堆损坏（如双重释放或内存损坏），最终导致应用程序崩溃或可能被攻击者利用实现远程代码执行。"
published = "2006-01-01T00:00:00Z"
remediation = "建议将 Perl XML::Parser 模块升级到 2.48 或更高版本，以修复该缓冲区溢出漏洞。"
score = 5.0
severity = "MEDIUM"
