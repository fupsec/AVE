[basic]
title = "Perl XML::Parser 模块堆越界写入漏洞"
description = "XML::Parser 是 Perl 语言中广泛使用的 XML 解析模块，其 2.47 及之前版本的 Expat.xs 文件中存在 off-by-one 堆缓冲区溢出漏洞。当元素嵌套深度达到栈大小上限（stackptr == stacksize - 1）时，栈未能正确扩展，导致新值被写入已分配缓冲区边界之外。攻击者可向受影响应用提交特制的深层嵌套 XML 文档触发越界写入，造成堆内存损坏，可能导致信息泄露、拒绝服务或远程代码执行。"
severity = "CRITICAL"
score = 9.8
sources = ["msrc", "nvd"]
published = "2026-03-19"
updated = "2026-06-29"
remediation = "将 XML::Parser 升级至 2.48 或更高版本，或安装操作系统厂商（如 Red Hat、Debian）提供的安全更新补丁。"

