[basic]
title = "禅道15.0 Demo版本路径遍历致敏感信息泄漏漏洞"
description = "禅道（ZenTao）是一款开源项目管理软件。其15.0版本演示环境中存在路径遍历漏洞（CWE-22），未经身份认证的远程攻击者可通过构造特制请求，利用mode=getconfig接口读取服务器任意文件，导致敏感信息泄露。攻击复杂度低，无需用户交互，严重影响系统机密性。"
severity = "HIGH"
score = 7.5
sources = ["nvd", "hwpoc", "ghsa"]
published = "2022-09-19"
updated = "2026-07-08"
remediation = "建议升级至禅道最新稳定版本，对mode=getconfig接口实施访问控制或删除演示环境中的未授权接口。如使用官方演示站点，应限制公网访问并配置Web应用防火墙规则拦截路径遍历攻击。"

