[affected]
product = "libsndfile"
vendor = "libsndfile_project"

[authenticity]
cve_confidence = "high"
notes = "MSRC 确认该漏洞存在于 libsndfile 1.2.2 IMA ADPCM 编解码器 WAV 路径。NVD 补充了 au.c 和 mat4.c 的溢出问题。GitHub Issue #789 和 #833 包含 PoC 附件。"
poc_confidence = "high"

[basic]
description = "libsndfile 1.2.2 中 IMA ADPCM 编解码器处理 WAV 文件时存在整数溢出漏洞。当 samplesperblock (int) 与 blocks (int) 的乘积超过 INT_MAX 时，32 位乘法运算在赋值给 sf.frames (sf_count_t/int64) 前发生溢出，导致帧计数错误，进而引发堆缓冲区溢出或拒绝服务。同时 src/au.c 的 au_read_header 函数和 src/mat4.c 的 mat4_open/mat4_read_header 函数也存在有符号整数溢出问题。攻击者可通过构造恶意音频文件触发漏洞，实现任意代码执行或造成服务崩溃。"
published = "2023-07-18"
remediation = "升级 libsndfile 到修复版本。Debian/Ubuntu 参考 USN-6471-1 提供的修复版本。也可从 GitHub 源码仓库拉取最新提交自行编译。"
score = 7.8
severity = "HIGH"
source = "msrc"
sources = [
    "msrc",
    "nvd",
]
title = "libsndfile 存在多个整数溢出漏洞"
updated = "2026-06-17"

