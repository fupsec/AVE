[remediation]
fix = "升级 libsndfile 到修复版本。Debian: 1.0.31-2+deb11u2 (bullseye), 1.2.0-1+deb12u1 (bookworm); Ubuntu: 1.2.2-1ubuntu0.23.10.1 (mantic), 1.2.0-1ubuntu0.1 (lunar), 1.0.31-2ubuntu0.1 (jammy), 1.0.28-7ubuntu0.2 (focal)。从源码编译需拉取最新提交。"
steps = [
    "确认当前 libsndfile 版本：dpkg -l libsndfile1",
    "升级到修复版本（Debian/Ubuntu 对应上述版本），apt update && apt upgrade",
    "重启使用 libsndfile 的服务或应用程序",
]
workaround = "避免打开来源不可信的音频文件。如无法升级，可限制使用 libsndfile 处理不受信任的 WAV/AIFF/AU/Mat4 文件。"

