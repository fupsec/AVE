[basic]
description = "libsndfile 1.2.2 中 IMA ADPCM 编解码器在处理 WAV 和 AIFF 文件时存在整数溢出漏洞。samplesperblock（int）与 blocks（int）的乘积超过 INT_MAX 时，32 位乘法在赋值给 sf.frames（int64）前发生溢出，导致帧计数计算错误，进而引发堆缓冲区溢出或拒绝服务。同时 src/au.c 的 au_read_header 函数和 src/mat4.c 的 mat4_open/mat4_read_header 函数也存在有符号整数溢出问题。攻击者可通过构造恶意的 WAV/AIFF/AU/Mat4 音频文件触发该漏洞，导致任意代码执行或服务崩溃。"
published = "2023-07-18"
remediation = "升级 libsndfile 到修复版本。Debian/Ubuntu 参考 USN-6471-1 提供的修复版本。也可从 GitHub 源码仓库拉取最新提交自行编译。"
score = 7.8
severity = "HIGH"
sources = ["msrc", "nvd"]
title = "libsndfile 存在多个整数溢出漏洞"
updated = "2026-06-17"

