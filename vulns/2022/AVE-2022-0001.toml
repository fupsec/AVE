[basic]
description = "libsndfile 的 src/au.c 中 au_read_header 函数以及 src/mat4.c 中 mat4_open 和 mat4_read_header 函数存在多个有符号整数溢出漏洞。此外，IMA ADPCM 编解码器中 WAV 路径（line 235）和 close 路径（line 167）也存在整数溢出问题，samplesperblock (int) * blocks (int) 的乘法结果可能超过 INT_MAX 导致溢出，进而引发堆缓冲区溢出或拒绝服务。这两个值均来自 WAV 文件头且由攻击者控制。攻击者可通过构造恶意音频文件触发该漏洞。"
published = "2023-07-18"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 7.5
