[basic]
title = "SDL2 GLES_CreateTexture 内存泄漏拒绝服务漏洞"
description = "SDL2（Simple DirectMedia Layer 2）在 SDL_render_gles.c 文件的 GLES_CreateTexture() 函数中存在内存泄漏漏洞。攻击者可利用该漏洞远程触发持续内存泄漏，最终导致目标系统拒绝服务。漏洞影响 SDL2 v2.0.4 及以上版本，SDL-1.x 不受影响。攻击者无需身份认证即可远程利用，CVSS 评分 7.5。"
severity = "HIGH"
score = 7.5
remediation = "升级 SDL2 至 2.26.0 或更高版本；相关发行版可通过包管理器更新至修复版本；也可参考 Red Hat 安全公告 RH bug 2156290 应用补丁。"
published = "2023-01-12"
updated = "2026-06-17"
sources = ["nvd", "msrc", "redhat"]

[affected]
vendor = "libsdl"
product = "Simple DirectMedia Layer"

