[basic]
title = "SDL2 GLES_CreateTexture内存泄漏拒绝服务漏洞"
description = "SDL2的GLES_CreateTexture()函数（位于SDL_render_gles.c）中存在潜在的内存泄漏问题。攻击者可通过触发该漏洞导致内存消耗过度，进而引发拒绝服务（DoS）攻击，造成系统不稳定或崩溃。该漏洞影响SDL2 v2.0.4及以上版本，SDL-1.x不受影响。"
published = "2023-01-12"
updated = "2025-11-25"
remediation = "将SDL2升级至2.26.0或更高版本。若暂时无法升级，建议限制不可信来源对SDL渲染功能的调用，避免处理恶意纹理数据。"
severity = "MEDIUM"
score = 5.4
sources = ["nvd", "redhat", "snyk", "github", "debian"]

