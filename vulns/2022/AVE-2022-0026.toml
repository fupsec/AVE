[basic]
title = "Linux kernel f2fs 刷新节点页面无限循环漏洞"
description = "Linux 内核的 F2FS（Flash-Friendly File System）文件系统中存在一个无限循环漏洞。在执行 xfstests/generic/475 测试时，持续的 EIO 错误会导致刷新节点页面（flush node pages）时陷入无限循环，造成系统无响应（DoS）。攻击者通过本地低权限即可触发该漏洞，导致系统挂起。受影响文件包括 fs/f2fs/checkpoint.c、fs/f2fs/f2fs.h 和 fs/f2fs/node.c。"
severity = "MEDIUM"
source = "nvd"
published = "2025-02-26"
