[remediation]
fix = "升级 Linux 内核至 5.18.4 或更高版本。补丁已合入 5.19-rc1（commit a7b8618aa2f0f926ce85f2486ac835a85c753ca7）和 5.18.4 稳定版（commit bd47ea5d776d8b524fb6f60de3240f95603901dd）。"
workaround = "如无法立即升级内核，可考虑限制本地用户访问 F2FS 文件系统，或禁用 F2FS 文件系统的使用。"
steps = ["步骤1: 确认当前内核版本是否在受影响范围内（>= 3.8 且 < 5.18.4）", "步骤2: 升级到 Linux 内核 5.18.4 或更高稳定版本", "步骤3: 应用官方补丁 commit a7b8618aa2f0f926ce85f2486ac835a85c753ca7", "步骤4: 重启系统以使更新生效"]

