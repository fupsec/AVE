[remediation]
fix = "升级Linux内核至5.19-rc1或更高稳定版本。补丁移除了dwc3主机驱动中不必要的ACPI companion设置，改用sysdev指针来分配xHCI端口和USB设备的ACPI companion。"
workaround = "如无法立即升级，可在内核编译配置中禁用USB_DWC3 ACPI相关功能，或限制对受影响系统的本地访问。"
steps = ["步骤1: 确认当前内核版本（uname -r）", "步骤2: 检查是否使用dwc3 USB控制器（lsmod | grep dwc3）", "步骤3: 升级至Linux内核5.19或更高版本", "步骤4: 应用补丁（commit 7fd069d65da2e20b1caec3b7bcf9dfbe28c04bb2）", "步骤5: 重启系统并验证ACPI companion处理正常"]

