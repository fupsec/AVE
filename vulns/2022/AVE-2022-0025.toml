[basic]
title = "Linux内核dwc3 USB主机驱动ACPI companion设置错误导致资源泄露漏洞"
description = "Linux内核dwc3 USB主机驱动中存在ACPI companion处理缺陷。在dwc3主机模式下，驱动错误地设置了ACPI companion，导致fwnode->secondary指针被替换（因为primary fwnode即ACPI companion被共享）。这会引发潜在的副作用，包括资源泄露（resource leaks）。该漏洞影响使用ACPI的dwc3 USB3控制器平台（如Qualcomm、Rockchip、Intel KeemBay等SoC）。"
severity = "MEDIUM"
source = "nvd"
published = "2025-02-26"
updated = "2026-06-17"

