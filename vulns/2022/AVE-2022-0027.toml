[basic]
title = "Linux内核mlx5 E-Switch驱动锁不当漏洞"
description = "Linux内核的mlx5 E-Switch驱动中存在锁不当问题。OFFLOADS配对使用devcom时仅支持LAG的设备才能配对，修复了mlx5_get_next_phys_dev()在未持有接口锁时被调用的问题。本地攻击者可通过该漏洞触发拒绝服务（DoS）。"
