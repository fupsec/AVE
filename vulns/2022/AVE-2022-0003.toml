[basic]
title = "Linux内核WCD938x音频编解码器驱动程序端口ID错误使用漏洞"
description = "Linux内核ASoC WCD938x编解码器驱动程序中存在端口ID错误使用漏洞。Mixer控件在mixer->reg中存储通道ID，但代码错误地将其作为端口ID使用，而端口ID应从chan_info数组派生。攻击者可能通过音频子系统触发越界访问port_map数组，导致struct wcd938x_sdw_priv内存损坏。该漏洞影响内核5.14至5.15.21、5.16.7、5.16.17版本。"
severity = "MEDIUM"
score = 5.5
published = "2024-06-20"
updated = "2024-06-20"
sources = ["nvd", "osv", "redhat", "ubuntu", "debian"]
remediation = "升级Linux内核至5.15.22、5.16.8或5.17及以上版本。如无法升级内核，请应用补丁commit c5c1546a654f、aa7152f9f117或9167f2712dc8。Debian用户可通过apt upgrade linux-image更新至修复版本。"

