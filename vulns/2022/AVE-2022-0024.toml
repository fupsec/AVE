[remediation]
fix = "升级Linux内核至5.18.4或更高版本。补丁将del_timer_sync()从spin_lock_bh()保护中提取，并将spin_lock_bh()改为spin_lock_irq()以防止死锁。"
steps = [
    "步骤1: 确认当前内核版本",
    "步骤2: 升级至Linux内核5.18.4或更高版本",
    "步骤3: 应用内核补丁（提取del_timer_sync并改用spin_lock_irq）",
    "步骤4: 重启系统验证修复",
]
workaround = "如无法立即升级，限制本地用户访问运行rtl8192eu驱动的系统，并密切监控系统状态。"

