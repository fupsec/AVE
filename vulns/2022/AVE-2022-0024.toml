[basic]
description = "Linux内核rtl8192eu驱动中存在死锁漏洞，位于rtw_joinbss_event_prehandle()函数。该漏洞由两个线程之间的不当锁机制引起：一个线程持有锁并等待定时器停止，而定时器处理程序无法获取必要的锁，导致系统挂起或无响应。受影响文件为drivers/staging/r8188eu/core/rtw_mlme.c。"
published = "2025-02-26"
remediation = "Refer to vendor advisory and upgrade to fixed version."
score = 5.5
severity = "MEDIUM"
source = "nvd"
sources = ["unknown"]
title = "Linux内核rtl8192eu驱动rtw_joinbss_event_prehandle函数死锁漏洞"
updated = "2025-02-26"

