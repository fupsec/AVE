[remediation]
fix = "安装微软安全公告MS06-027(KB917336)提供的更新补丁，升级Word到修复版本。该漏洞已被CISA KEV收录，应优先修复。"
workaround = "不要打开来自不可信来源的Microsoft Word文档(.doc)；在邮件服务器层面拦截可疑的Word文档附件。"
steps = ["步骤1: 确认Microsoft Word/Office版本", "步骤2: 访问Microsoft Update目录安装MS06-027更新", "步骤3: 重启系统使更新生效", "步骤4: 对用户进行安全意识培训，防范钓鱼文档攻击"]

