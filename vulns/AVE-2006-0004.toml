[basic]
title = "Microsoft Word 格式错误对象指针远程代码执行漏洞"
description = "Microsoft Word及Microsoft Works Suites中存在缓冲区溢出漏洞，攻击者可利用特制Word文档中的格式错误对象指针触发漏洞，导致远程代码执行。该漏洞已被CISA KEV收录，确认在野活跃利用，并在2006年5月以零日攻击方式被广泛利用。"
